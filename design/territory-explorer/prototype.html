<title>Territory Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,600&display=swap">
<style>

/* ---------- territory worlds: each territory brings its own palette and type (--t-*) ---------- */
.mix-line{border-color:color-mix(in srgb,var(--t-ink) 18%,transparent)}
.world{background:var(--t-bg);color:var(--t-ink);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;transition:background .35s,color .35s}
.whead{padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid color-mix(in srgb,var(--t-ink) 18%,transparent)}
.wtitle{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.wtitle h1{margin:4px 0 8px;font-family:var(--t-font);font-weight:var(--t-fw);font-style:var(--t-fs);font-size:clamp(38px,5.4vw,70px);line-height:.96;letter-spacing:-.015em}
.wtitle p{margin:0;font-size:17px;max-width:52ch;opacity:.88}
.weyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.wmeta{font-size:12px;opacity:.72}
.wbtn{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.wbtn:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.wbtn.on,.wbtn[aria-pressed="true"]{background:var(--t-ink);color:var(--t-bg);border-color:var(--t-ink)}
.wbtn.sm{padding:4px 10px;font-size:12px}
.wbtn.ghosty{border-color:transparent;opacity:.75}
.wbtn:disabled{opacity:.35;cursor:not-allowed}
.wgrid{display:grid;grid-template-columns:300px minmax(0,1fr)}
@media (max-width:980px){.wgrid{grid-template-columns:minmax(0,1fr)}}
.dials{padding:18px 20px 24px;display:flex;flex-direction:column;gap:22px;border-right:1px solid color-mix(in srgb,var(--t-ink) 18%,transparent);background:color-mix(in srgb,var(--t-ink) 6%,var(--t-bg))}
.dials section{display:flex;flex-direction:column;gap:9px}
.dials p{margin:0;font-size:13px;line-height:1.45}
.dial{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center;font-size:11.5px}
.dial span:last-child{text-align:right}
.dial input{width:100%;accent-color:var(--t-ink)}
.lab{display:flex;flex-direction:column;gap:5px}
.lline{display:flex;gap:2px;align-items:stretch}
.lpick{flex:1;text-align:left;border:1px solid color-mix(in srgb,var(--t-ink) 24%,transparent);background:transparent;color:inherit;border-radius:8px;padding:7px 10px;font-family:var(--t-font);font-weight:var(--t-fw);font-style:var(--t-fs);font-size:14.5px;line-height:1.22}
.lpick:hover{border-color:var(--t-ink)}
.lline.on .lpick{background:var(--t-ink);color:var(--t-bg)}
.lstar{border:none;background:transparent;color:inherit;opacity:.28;font-size:16px;padding:0 6px}
.lstar.on{opacity:1}
.sw{width:34px;height:34px;border-radius:8px;border:1px solid color-mix(in srgb,var(--t-ink) 28%,transparent)}
.spec{display:flex;align-items:baseline;gap:10px;font-size:12.5px}
.spec .aa{font-family:var(--t-font);font-weight:var(--t-fw);font-style:var(--t-fs);font-size:46px;line-height:1}
.wref{font-family:var(--font-mono);font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.wrisk{border-left:3px solid currentColor;padding-left:8px;opacity:.88}
.wmain{padding:18px 20px 30px;display:flex;flex-direction:column;gap:18px;min-width:0}
.wseg{display:inline-flex;border:1.5px solid var(--t-ink);border-radius:999px;padding:2px}
.wseg button{border:none;background:transparent;color:inherit;padding:4px 12px;border-radius:999px;font-size:12.5px}
.wseg button[aria-pressed="true"]{background:var(--t-ink);color:var(--t-bg)}
.journey{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:30px}
.jstep{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.jstep{grid-template-columns:minmax(0,1fr)}}
.jwhen{display:flex;flex-direction:column;gap:3px;border-top:2px solid var(--t-ink);padding-top:7px;font-size:12.5px;line-height:1.35}
.jwhen b{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.j-story .phone{max-width:250px}.j-seat .tp{max-width:280px}.j-email .tp{max-width:540px}.j-poster .tp{max-width:780px}.j-radio .tp{max-width:620px}
.wall{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.wcell{display:flex;flex-direction:column;gap:7px;min-width:0}
.w-poster{grid-column:span 4}.w-story{grid-column:span 2;grid-row:span 2}.w-seat{grid-column:span 2}.w-email{grid-column:span 2}.w-radio{grid-column:span 2}.w-tv{grid-column:span 4}
@media (max-width:900px){.wall{grid-template-columns:minmax(0,1fr)}.wall>*{grid-column:auto!important;grid-row:auto!important}}

/* touchpoints */
.tp{container-type:inline-size;position:relative;overflow:hidden;background:var(--t-bg);color:var(--t-ink);border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 14px 30px -18px rgba(0,0,0,.5)}
.tp .scn{position:absolute;inset:0}
.tp svg,.fr svg,.aframe svg,.seatscn svg{display:block;width:100%;height:100%}
.hl{font-family:var(--t-font);font-weight:var(--t-fw);font-style:var(--t-fs);line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
.poster{aspect-ratio:2/1}
.poster .ptxt{position:absolute;display:flex;align-items:flex-end}
.lay-quiet .ptxt{left:4%;bottom:8%;max-width:54%;background:var(--t-bg);padding:2.2cqi 2.6cqi;border-radius:2px}
.lay-quiet .hl{font-size:4.3cqi}
.lay-mid .scn{right:auto;width:55%}
.lay-mid .ptxt{left:55%;right:0;top:0;bottom:0;padding:5cqi 4cqi 9cqi;align-items:center;background:var(--t-bg)}
.lay-mid .hl{font-size:5.2cqi}
.lay-loud{background:var(--t-ink)}
.lay-loud .scn{top:auto;height:32%}
.lay-loud .ptxt{left:4%;right:4%;top:5%;bottom:34%;align-items:center}
.lay-loud .hl{font-size:7.4cqi;color:var(--t-bg)}
.bm{position:absolute;right:3%;bottom:6%;display:flex;align-items:center;gap:.4em;color:var(--t-ink);font-family:var(--font-ui);font-weight:700;letter-spacing:-.03em;line-height:1}
.bm svg{width:2em!important;height:.95em!important}
.bm em{font-style:normal;font-weight:500;letter-spacing:0;font-size:.7em;margin-left:auto}
.bm-sm{font-size:2.1cqi}.bm-md{font-size:3.1cqi}
.bm-lg{left:0;right:0;bottom:0;padding:1.3cqi 3cqi;background:var(--t-ink);color:var(--t-bg);font-size:3cqi}
.lay-loud .bm{color:var(--t-bg)}.lay-loud .bm-lg{background:var(--t-bg);color:var(--t-ink)}
.phone{display:flex;flex-direction:column;gap:8px;min-width:0}
.story{aspect-ratio:9/16;border-radius:22px;border:7px solid #111}
.sbar{position:absolute;top:3cqi;left:5cqi;right:5cqi;display:flex;gap:2cqi}
.sbar i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.6)}.sbar i:first-child{background:#fff}
.shl{position:absolute;left:6cqi;right:6cqi;top:10cqi;background:var(--t-bg);padding:4cqi 5cqi;border-radius:3cqi}
.shl .hl{font-size:8.2cqi}
.sticker{position:absolute;left:50%;bottom:8cqi;transform:translateX(-50%) rotate(-3deg);background:var(--t-ink);color:var(--t-bg);font-weight:600;font-size:5cqi;padding:2.4cqi 4cqi;border-radius:3cqi;white-space:nowrap}
.cap{margin:0;font-size:12.5px;line-height:1.4}
.seat{aspect-ratio:3/4;display:flex;flex-direction:column;padding:9cqi;gap:7cqi}
.seatscn{width:44cqi;height:44cqi;border-radius:50%;overflow:hidden;border:2cqi solid var(--t-ink);flex:none}
.seat .hl{font-size:10cqi}
.seat .bm{right:9cqi;bottom:7cqi}.seat .bm-sm{font-size:5cqi}.seat .bm-md{font-size:7cqi}.seat .bm-lg{font-size:5.4cqi;right:0;padding:3cqi 9cqi}
.tp.email{background:var(--card);color:var(--ink);display:flex;flex-direction:column}
.inbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
.inbox .subj{font-weight:600}.inbox .prev{grid-column:2;color:var(--muted);font-size:12px}
.ehero{position:relative;aspect-ratio:2/1;container-type:inline-size}
.ehero .ptxt{position:absolute;left:5%;bottom:8%;max-width:64%;background:var(--t-bg);color:var(--t-ink);padding:2.4cqi 3cqi}
.ehero .hl{font-size:4.8cqi}
.email .bm{position:static;font-size:15px;padding:10px 14px;color:var(--ink)}.email .bm-lg{background:var(--t-ink);color:var(--t-bg)}
.tp.radio{padding:16px 18px;display:flex;flex-direction:column;gap:9px;border:1.5px solid var(--t-ink);box-shadow:none}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.rl{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;font-size:14px;line-height:1.4}
.rl b{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;padding-top:3px}
.rl .sfx{font-style:italic;opacity:.75}
.rmusic{font-size:12px;opacity:.78;border-top:1px dashed currentColor;padding-top:8px}
.tp.tv{background:transparent;box-shadow:none;overflow:visible;border-radius:0;color:inherit;display:flex;flex-direction:column;gap:10px}
.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.frames{grid-template-columns:repeat(2,minmax(0,1fr))}}
.frames figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.fr{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:4px;container-type:inline-size;background:var(--t-bg);color:var(--t-ink)}
.frames.cine .fr{aspect-ratio:2.39/1}
.fr>svg{position:absolute;inset:0}
.frames figcaption{font-size:11.5px;line-height:1.35}
.frames figcaption b{font-family:var(--font-mono);margin-right:4px}
.super{position:absolute;inset:0;background:color-mix(in srgb,var(--t-bg) 84%,transparent);color:var(--t-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqi;padding:6cqi;text-align:center}
.super .hl{font-size:8cqi}
.bm.inframe{position:static;font-size:6cqi}.bm.inframe.bm-lg{background:transparent;color:var(--t-ink);padding:0}.bm.inframe em{display:none}
.anim{position:fixed;inset:0;z-index:28;background:#0b0b0b;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.aframe{position:relative;width:min(100%,1100px);margin:0 auto;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:var(--t-bg);color:var(--t-ink)}
.aframe.cine{aspect-ratio:2.39/1}
.aframe>svg{position:absolute;inset:0;animation:kb 3s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.sub{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);background:rgba(0,0,0,.74);color:#fff;padding:.6em 1em;font-size:2.1cqi;border-radius:4px;max-width:86%;text-align:center}
.super.big .hl{font-size:6.4cqi}.super.big .bm.inframe{font-size:3.4cqi}
.aprog{display:flex;gap:6px;width:min(100%,1100px);margin:0 auto}.aprog i{flex:1;height:3px;background:rgba(255,255,255,.25)}.aprog i.on{background:#fff}
.anim .wbtn{color:#fff}
.tissue{background:var(--t-bg,var(--paper));color:var(--t-ink,var(--ink));gap:16px}
.tissue h1{font-family:var(--t-font);font-weight:var(--t-fw);font-style:var(--t-fs)}
.tissue .tt{color:inherit;opacity:.88}
.tissue .tl{font-family:var(--t-font);font-style:var(--t-fs);border-left-color:currentColor}
.pgrid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:36px;align-items:center;max-width:1300px;margin:0 auto;width:100%}
@media (max-width:900px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.ptext{display:flex;flex-direction:column;gap:18px}
.pvis{display:flex;flex-direction:column;gap:14px;min-width:0}
.pmini{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;max-width:440px}
.pmini .cap{display:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gcard{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .15s,border-color .15s}
.gcard:hover{border-color:var(--ink-soft);transform:translateY(-2px)}
.gmeta{display:flex;flex-direction:column;gap:4px;padding:0 4px 4px}
.gopen{font-size:12.5px;color:var(--accent);font-weight:500}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.cmpgrid.one{grid-template-columns:minmax(0,1fr)}
.cmpcell{display:flex;flex-direction:column;gap:8px;min-width:0}
.cmpcell .phone{max-width:250px}
.cname{font-family:var(--font-serif);font-size:17px;font-weight:500}
.drift{animation:drift var(--spd,30s) linear infinite}.drift-slow{animation:drift calc(var(--spd,30s) * 1.8) linear infinite}.drift-fast{animation:drift calc(var(--spd,30s) * .6) linear infinite}
@keyframes drift{to{transform:translateX(-400px)}}
.rain{animation:rain .7s linear infinite}@keyframes rain{to{transform:translateY(30px)}}
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s .6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.drift,.drift-slow,.drift-fast,.rain,.bob,.bob2,.aframe>svg{animation:none!important}}
/* Layout: Napkin Studio shell (approved new-UI mock) · app head with flow steps · paper sheet + right panel · bottom dock */
:root{
  --ag-acc:#C8CBFF; --ag-acc-ink:#141413; --ag-act:#515BFF; --ag-act-ink:#FFFFFF;
  --desk:color-mix(in srgb,#515BFF 6%,#F6F1E7); --paper:color-mix(in srgb,#515BFF 2.5%,#FFFDF8); --paper-2:#F3ECDC; --card:#FFFFFF;
  --ink:#141413; --ink-soft:#2A2620; --muted:#6D655A; --faint:#9A9082;
  --line:color-mix(in srgb,#515BFF 10%,#E2D9C8); --line-strong:#2A2620; --chip-line:#D4CCCD;
  --accent:#515BFF; --accent-soft:#ECEDFF; --ok:#1D8A4E; --ok-soft:#E6F6EC; --warn:#B45309; --warn-soft:#FEF3DC; --alert:#C9462A; --alert-soft:#FFF1EE;
  --te:#14947F; --te-ink:#FFFFFF;
  --heat:109,101,90; --heat-a:.42;
  --b1:#515BFF; --b2:#C9462A; --b3:#2F6B3A; --b4:#B0477A; --b5:#1F7A8C; --b6:#9A6A12; --b7:#7A4FB8; --b8:#6D655A;
  --font-ui:"Geist",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --font-serif:"Newsreader",Georgia,"Iowan Old Style",serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow-paper:0 1px 0 rgba(255,255,255,.75) inset,0 8px 24px -8px rgba(50,38,18,.10),0 1px 3px rgba(50,38,18,.08);
  --shadow-card:0 1px 2px rgba(20,20,19,.06),0 4px 12px -4px rgba(20,20,19,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ag-acc:#C8CBFF; --ag-acc-ink:#141413; --ag-act:#8C93FF; --ag-act-ink:#141413;
  --desk:color-mix(in srgb,#515BFF 12%,#121110); --paper:color-mix(in srgb,#515BFF 9%,#1B1A18); --paper-2:#262320; --card:color-mix(in srgb,#515BFF 7%,#201E1B);
  --ink:#EFE9DE; --ink-soft:#D6CEC0; --muted:#A49B8D; --faint:#7B7367;
  --line:color-mix(in srgb,#515BFF 16%,#34302A); --line-strong:#CFC6B6; --chip-line:#4A443C;
  --accent:#8C93FF; --accent-soft:#25264A; --ok:#5DBB83; --ok-soft:#1C2E23; --warn:#E09A4B; --warn-soft:#3A2A18; --alert:#F08A70; --alert-soft:#33201B;
  --te:#3CC9AE; --te-ink:#0E1A17; --heat:239,233,222; --heat-a:.22;
  --b1:#8C93FF; --b2:#F08A70; --b3:#8CC79A; --b4:#E58AB5; --b5:#6CC3D3; --b6:#E3B45C; --b7:#B89BE6; --b8:#A49B8D; color-scheme:dark}}
:root[data-theme="dark"]{
  --ag-acc:#C8CBFF; --ag-acc-ink:#141413; --ag-act:#8C93FF; --ag-act-ink:#141413;
  --desk:color-mix(in srgb,#515BFF 12%,#121110); --paper:color-mix(in srgb,#515BFF 9%,#1B1A18); --paper-2:#262320; --card:color-mix(in srgb,#515BFF 7%,#201E1B);
  --ink:#EFE9DE; --ink-soft:#D6CEC0; --muted:#A49B8D; --faint:#7B7367;
  --line:color-mix(in srgb,#515BFF 16%,#34302A); --line-strong:#CFC6B6; --chip-line:#4A443C;
  --accent:#8C93FF; --accent-soft:#25264A; --ok:#5DBB83; --ok-soft:#1C2E23; --warn:#E09A4B; --warn-soft:#3A2A18; --alert:#F08A70; --alert-soft:#33201B;
  --te:#3CC9AE; --te-ink:#0E1A17; --heat:239,233,222; --heat-a:.22;
  --b1:#8C93FF; --b2:#F08A70; --b3:#8CC79A; --b4:#E58AB5; --b5:#6CC3D3; --b6:#E3B45C; --b7:#B89BE6; --b8:#A49B8D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font:15px/1.55 var(--font-ui);margin:0;-webkit-font-smoothing:antialiased;padding-bottom:48px}
body.has-dock{padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--desk)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted);font-size:12.5px}
.mono{font-family:var(--font-mono);font-size:12px}
.meta{font-size:12px;color:var(--muted)}

/* top bar */
.topbar-outer{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--desk) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tb{max-width:1240px;margin:0 auto;height:62px;display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock-connected{display:inline-flex;align-items:center;flex-shrink:0}
.medal{width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 22px -6px rgba(16,17,20,.2),0 2px 6px rgba(16,17,20,.08);display:grid;place-items:center;position:relative;top:8px;z-index:2}
.name-pill{height:38px;margin-left:-20px;padding:0 16px 0 28px;border-radius:999px;background:var(--ag-acc);color:var(--ag-acc-ink);border:1px solid rgba(16,17,20,.12);display:inline-flex;align-items:center;font-weight:800;font-size:14px;letter-spacing:-.025em;white-space:nowrap}
.tb-div{width:1px;height:24px;background:var(--line);flex:none}
.client-chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;flex:none}
.client-chip i{width:26px;height:26px;border-radius:50%;background:#2B3BD1;color:#fff;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:800}
.tba{display:flex;align-items:center;gap:8px;min-width:0}
.tba>svg{width:16px;height:16px;color:var(--te);flex:none}
.tba-name{font-family:var(--font-serif);font-size:16px;font-weight:600;display:block;line-height:1.1;white-space:nowrap}
.tba-saved{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--muted);display:block;white-space:nowrap}

/* app head */

/* sheet + panel */

.ctrl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font:600 10.5px var(--font-mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;min-width:74px}

.cov.filled{border-color:var(--ink);color:var(--ink)}.cov.filled::before{background:var(--ink);border-color:var(--ink)}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--chip-line);background:var(--card);color:var(--ink-soft);font-size:12.5px}
.cchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 3px;border-radius:99px;border:1px solid var(--chip-line);background:var(--card);font-size:12px;font-weight:600;white-space:nowrap}
.cchip i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 8.5px var(--font-ui);font-style:normal}
.cchip[aria-pressed="false"]{opacity:.4}
.mk{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--card);font:700 10.5px var(--font-mono)}.mk.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mapwrap{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;height:clamp(440px,62vh,640px)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#map text{font-family:var(--font-ui);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.maphint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--paper);padding:4px 8px;border-radius:6px;border:1px solid var(--line);max-width:calc(100% - 24px)}
.hit{cursor:pointer}

.panel{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 100px);overflow:auto;min-width:0}
@media (max-width:1080px){.panel{position:static;max-height:none}}
.ptabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--accent);border-radius:4px;overflow:hidden;flex:none}
.ptabs button{height:34px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600}
.ptabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.big{width:100%;min-height:44px;border-radius:4px;border:1px solid var(--ag-act);background:var(--ag-act);color:var(--ag-act-ink);font-size:14px;font-weight:600;padding:0 14px;flex:none}
.call{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.call-eyebrow{font:600 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
.call p{margin:0;font-size:13.5px;line-height:1.5}
.pbtn{height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--ink-soft);background:var(--card);font-size:12px;font-weight:600;white-space:nowrap}
.pbtn.primary{background:var(--ag-act);color:var(--ag-act-ink);border-color:var(--ag-act)}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sbox{border:1.5px solid var(--line-strong);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sbox-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sbox-head b{font-size:14.5px}
.mono-r{margin-left:auto;font:11px var(--font-mono);color:var(--muted)}
.mono-s{font:11px var(--font-mono);color:var(--muted)}
.st-chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font:600 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.st-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-chip.ok{background:var(--ok-soft);color:var(--ok)}.st-chip.acc{background:var(--accent-soft);color:var(--accent)}.st-chip.mut{background:var(--paper-2);color:var(--muted)}.st-chip.bad{background:var(--alert-soft);color:var(--alert)}
.sp-btn{min-height:32px;padding:0 11px;border-radius:6px;border:1px solid var(--chip-line);background:var(--paper);font-size:12px;font-weight:600}

.sp-btn:hover{border-color:var(--ink)}
.sp-btn:disabled{opacity:.4;cursor:not-allowed}
.psec{display:flex;flex-direction:column;gap:8px}
.psec-t{font:600 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.psec p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.pfoot{border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--muted)}
.pfoot b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.navrow{display:flex;align-items:center;gap:8px}
.wsrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);width:100%}
.wsrow.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wsrow b{font-size:14px;font-weight:600}.wsrow .num{font:600 13px var(--font-mono);text-align:right}
.needs{font:600 10.5px var(--font-mono);color:var(--warn);text-decoration:underline;text-underline-offset:2px}

.gauge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.g .psec-t{font-size:9.5px}
.g b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink-soft)}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.45}
.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:0}

.pill{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
.st-verified{background:var(--ok-soft);color:var(--ok)}.st-derived{background:var(--warn-soft);color:var(--warn)}
.quote{font-family:var(--font-serif);font-style:italic;font-size:17px;line-height:1.35}

/* buttons, groups, cards (deck storyboard style) */
.btn-rect{min-height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-rect:hover{border-color:var(--ink)}
.btn-rect.primary{background:var(--ag-act);color:var(--ag-act-ink);border-color:var(--ag-act)}

.dcard-top{display:flex;justify-content:space-between;gap:8px;font:600 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

  background-image:linear-gradient(90deg,transparent 27px,rgba(201,70,42,.28) 27px,rgba(201,70,42,.28) 28px,transparent 28px)}
.bm-tab{position:absolute;top:-21px;left:26px;height:21px;padding:0 12px;display:inline-flex;align-items:center;background:#E7D5AC;border:1px solid #C4AA75;border-bottom:0;border-radius:4px 4px 0 0;font:600 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:#5A4A2A}
.bp-in{padding:34px 52px 40px 64px;display:flex;flex-direction:column;gap:22px}
@media (max-width:640px){.bp-in{padding:24px 18px 28px 40px}}
.bp-head{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid #E2D9C8;color:#141413}
.bp-logo{width:36px;height:36px;border-radius:8px;background:#2B3BD1;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.bp-title{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid #E2D9C8}
.bp-title h2{margin:6px 0 0;font:600 36px/1.1 var(--font-serif);color:#141413;letter-spacing:-.02em}
.bm-stamp{position:absolute;right:0;top:-6px;transform:rotate(-6deg);border:2px solid #C9462A;color:#C9462A;border-radius:6px;padding:4px 10px;font:800 11px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.bp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-bottom:20px;border-bottom:1px solid #E2D9C8;font-size:14px;color:#141413}

.bp-l{display:block;font:600 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:#6D655A;margin-bottom:4px}
.bp-sec{display:flex;flex-direction:column;gap:8px}
.bp-sec p{margin:0;font-size:15px;line-height:1.6}
.bp-red{font:700 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:#C9462A}
.bp-smp{font:500 30px/1.2 var(--font-serif)!important;color:#141413;text-decoration:underline;text-decoration-color:#C9462A;text-decoration-thickness:2px;text-underline-offset:7px}
.bp-two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:760px){.bp-two{grid-template-columns:1fr}}
.brief-page blockquote{margin:0;border-left:3px solid #C9462A;padding:4px 0 4px 18px;font:italic 21px/1.45 var(--font-serif);color:#141413}
.brief-page .ref{color:#2B3BD1;background:#ECEDFF}
.res-band{background:#141413;color:#F6F1E7;padding:28px 32px 24px;border-bottom:6px solid #F6E36B}
.res-band h2{margin:10px 0 8px;font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15;max-width:24ch}
.res-band p{margin:0;font-size:13px;color:#C9C3B6}
.ask-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:14px}
.ask-grid>div{padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ask-grid .wide{grid-column:1/-1;background:color-mix(in srgb,#F6E36B 18%,var(--paper));border-right:0}
.res-head{margin:0;font-size:24px;font-weight:600;line-height:1.3;letter-spacing:-.02em}
.sphere-wrap{position:relative;padding:16px;margin-bottom:10px;line-height:0}
.sphere-wrap::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;border-bottom-color:transparent;animation:sp 1.6s linear infinite}
.nk-ag{display:inline-block;flex:none;line-height:0;border-radius:50%}

.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;align-items:start}

.crew-b{display:none;font-size:12.5px;color:var(--ink-soft);line-height:1.4}.crewc.sel .crew-b,.crew.ready .crew-b{display:block}
.crew-st{font:500 10.5px var(--font-mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:5px;min-height:2.5em;line-height:1.25}
.compass-wrap{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}.ckey{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 11.5px var(--font-ui);color:var(--muted);width:100%;padding:0 8px}.ckey span{display:inline-flex;align-items:center;gap:6px}.ckey i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted)}.ckey b{width:10px;height:10px;border-radius:50%}.ckey .sp{flex:1}
#compass{width:100%;max-width:820px;height:auto;overflow:visible}
#compass .cl{font:600 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;fill:var(--muted)}
#compass .cb{font:500 14px var(--font-serif);fill:var(--ink)}
#compass .hd{font:700 14.5px var(--font-ui);cursor:pointer}
#compass .tn{font:600 13.5px var(--font-ui);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}

#compass .trail:hover{stroke-width:5}
.booth .bc .tp.poster{margin:2px 0}

/* three steps */
.inslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ins{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.ins.on{border-color:var(--te);box-shadow:0 0 0 1px var(--te)}

.ins-b{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.ins .sbtext{font-size:17px}
.evd{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--card)}
.evd summary{cursor:pointer;font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gal-col{min-width:0}
.cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

.dlink:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dlink h4{margin:0;font-family:var(--font-serif);font-weight:500;font-size:22px;line-height:1.15}
.dlink p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.45}
.gcard2 .dcard-foot{margin:0 18px;padding:10px 0 14px}
.big:disabled{opacity:.35;cursor:not-allowed}
.gl{height:30px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ok);background:var(--card);color:var(--ok);font:600 12.5px var(--font-ui);white-space:nowrap}

.glrow .sw{width:18px;height:18px;border-radius:5px;border:1.5px solid}

<script>
/* The shared agent engine (app/templates/shared/agent-sphere, MPL-2.0): role spheres as still frames */
// finish.js: the ONE light and finish shared by the Deep O mark and the agent spheres (round 4, after review).
// BOTH shaders paste NapkinFinish.glsl() in and call nkBody / nkSheen, so a number changed here moves the mark
// and every agent together (lib/mark-r4.js shadeSolid, agents/lib/agent-view.js at level >= 1).
//
// Round 3 satin (Deep O):  body = base * (.80 + .24 * key * wrap), sheen = pow(N.H, 16) * .26 + pow(N.H, 5) * .05
// Round 4 "matte satin":   the mark track's numbers (the ones the owner looks at) are now the shared ones:
//                          wide wrap (.55), body .76 + .26 * key * wrap + .06 soft fill from the lower right,
//                          silhouette falloff to .88, sheen a broad, dim lift (no hotspot). Owner: "more flatter".
//                          On a dark page the shadow side drops by DARK_DROP so the orb does not read as a flat disc.
(function (root) {
  'use strict';
  const FINISH = {
    key: [-.45, .62, .64],   // key light, y up (the sphere engine uses the same light with y down)
    fillDir: [.6, -.35, .7], // soft fill from the lower right
    wrap: .55,               // wrap lighting: the shadow side never goes dark (anodised, not lacquer)
    lo: .76, hi: .26,        // body range: base x (lo + hi * key * wrap + fill * fillAmt)
    fill: .06,
    darkDrop: .06,           // dark page: the shadow-side floor falls .76 -> .70
    edge: .88, edgePow: 2.4, // falloff toward the silhouette
    s1: [10, .035],          // narrow-ish sheen, very dim (round 3: 16, .26)
    s2: [4, .03],            // broad lift (round 3: 5, .05)
    env: .05,                // grazing reflection of the studio (round 3: .16)
  };
  const f = x => Number(x).toFixed(4);
  const v = a => `vec3(${a.map(f).join(', ')})`;
  function glsl() {
    return `
// ── shared Napkin finish (finish.js) ──
const float NK_W = ${f(FINISH.wrap)}, NK_LO = ${f(FINISH.lo)}, NK_HI = ${f(FINISH.hi)}, NK_FILL = ${f(FINISH.fill)}, NK_DROP = ${f(FINISH.darkDrop)};
const float NK_EDGE = ${f(FINISH.edge)}, NK_EDGEP = ${f(FINISH.edgePow)};
const float NK_S1E = ${f(FINISH.s1[0])}, NK_S1A = ${f(FINISH.s1[1])}, NK_S2E = ${f(FINISH.s2[0])}, NK_S2A = ${f(FINISH.s2[1])}, NK_ENV = ${f(FINISH.env)};
float nkWrap(vec3 n, vec3 L){ return clamp((dot(n, L) + NK_W) / (1. + NK_W), 0., 1.); }
// light multiplier for a base colour. key = room light 0..1, sh = shadowing 0..1, dark = 1 on a dark page
float nkLift(vec3 n, vec3 v, vec3 L, vec3 F, float key, float sh, float dark){
  float nv = clamp(dot(n, v), 0., 1.);
  float fill = clamp(dot(n, normalize(F)), 0., 1.);
  float w = nkWrap(n, L) * sh;
  float lo = NK_LO - NK_DROP * dark * (1. - w);
  return (lo + NK_HI * key * w + NK_FILL * fill) * mix(1., NK_EDGE, pow(1. - nv, NK_EDGEP));
}
vec3 nkBody(vec3 base, vec3 n, vec3 v, vec3 L, vec3 F, float key, float sh, float dark){ return base * nkLift(n, v, L, F, key, sh, dark); }
float nkSheen(vec3 n, vec3 v, vec3 L){ float nh = max(dot(n, normalize(L + v)), 0.); return pow(nh, NK_S1E) * NK_S1A + pow(nh, NK_S2E) * NK_S2A; }
vec3 nkSheenCol(vec3 base){ return mix(vec3(1.), base, .5); }
const vec3 NK_FILLDIR = ${v(FINISH.fillDir)};
`;
  }
  root.NapkinFinish = { FINISH, glsl };
})(typeof window !== 'undefined' ? window : globalThis);

    Copy: 'paper', 'Art Director': 'onyx', Character: 'ceramic', Storyboard: 'paper', Image: 'chrome', Video: 'onyx', Motion: 'chrome', Voice: 'pearl', Music: 'graphite',
    Edit: 'stone', Adapt: 'pearl', Upscale: 'glass', Deck: 'paper', Compliance: 'stone', Review: 'pearl', Approval: 'paper', Asset: 'graphite', Knowledge: 'onyx',

   <div class="psec"><span class="psec-t">What people want here</span>${sel.needs.length?sel.needs.map(id=>{const n=NEEDS.find(x=>x.id===id);return`<div class="li">${refChip(n.ev)}<span class="grow">${esc(n.q)}</span><span class="pill st-${n.evs}">${n.evs}</span></div>`}).join(""):"<p>No need in the research points here.</p>"}</div>
   <div class="psec"><span class="psec-t">Who’s nearby</span>${nb.length?nb.slice(0,4).map(a=>`<p><b>${esc(BR[a.brand].name)}</b> “${esc(a.line)}” <span class="mono-s">${a.date}</span></p>`).join(""):"<p>Nobody within reach.</p>"}</div></div>`;
  h+=call(sel.confirmed?"Your call · made":"Your call · 1 open",`${sel.confirmed?"You confirmed":"Napkin proposes"} <b>${VERD[sel.verdict][0].toLowerCase()}</b>. ${esc(sel.risk)}`,
    Object.entries(VERD).map(([k,v])=>`<button class="pbtn ${!sel.confirmed&&k===sel.verdict?"primary":""}" data-verdict="${k}" aria-pressed="${sel.confirmed&&k===sel.verdict}">${v[0]}</button>`).join(""));
  h+=`<button class="big" data-ideatews="${sel.id}">${ts.length?`Ideate on this gap · ${ts.length} territor${ts.length>1?"ies":"y"} so far →`:"Ideate on this gap →"}</button>
   <div class="row">${sel.verdict==="unproven"?`<button class="sp-btn" id="askR">Ask the Research Tool</button>`:""}<button class="sp-btn" id="dismissWs">Dismiss with a reason</button></div>${pfoot()}`;return h}

/* ---------- 4 Territories ---------- */
function stageTerritories(){const L=TERR.filter(t=>t.status!=="killed");
  const bar=`<div class="grp-head"><span class="t">${L.length} territories · from ${new Set(L.map(t=>t.ws)).size} whitespaces</span><span class="spacer"></span>${tview==="gallery"?`<span class="flabel" style="min-width:0">Group by</span><button class="cov ${tgroup==="ws"?"filled":""}" data-tg="ws">Whitespace</button><button class="cov ${tgroup==="exp"?"filled":""}" data-tg="exp">Expedition</button>`:""}${[["gallery","Gallery"],["compare","Compare feel"]].map(([k,l])=>`<button class="btn-rect ${tview===k?"primary":""}" data-tv="${k}">${l}</button>`).join("")}<button class="btn-rect" id="rank">Re-rank blind</button></div>`;
  if(tview==="compare")return bar+`<div class="ctrl-row" style="margin-bottom:16px"><span class="flabel">Touchpoint</span>${Object.entries(TPN).map(([k,v])=>`<button class="cov ${k===ctp?"filled":""}" data-ctp="${k}">${v}</button>`).join("")}</div>
    <div class="cmpgrid ${ctp==="tv"||ctp==="radio"?"one":""}">${L.map(t=>`<div class="cmpcell"><div class="row" style="justify-content:space-between"><b class="cname">${esc(t.name)}</b><button class="sp-btn" data-world="${t.id}">Open world →</button></div>${touch(t,ctp)}</div>`).join("")}</div>`;
  if(tgroup==="exp")return bar.replace('class="grp-head"','class="grp-head" style="border:0;margin-bottom:4px"')+expGroups(L);
  const groups=WS.filter(w=>L.some(t=>t.ws===w.id)||gen===w.id);
  return bar.replace('class="grp-head"','class="grp-head" style="border:0;margin-bottom:4px"')+groups.map(w=>{const ts=L.filter(t=>t.ws===w.id);
    return`<section class="grp"><div class="grp-head"><span class="t">${esc(w.name)} · ${ts.length} territor${ts.length===1?"y":"ies"}</span>${chipS(VERD[w.verdict][0],VCHIP[w.verdict])}<span class="spacer"></span><button class="btn-rect" data-gen="${w.id}">${gen===w.id?'<span class="spin"></span> Writing…':"+ Another territory here"}</button></div>
    <div class="cards3">${ts.map(t=>{const d=t.ev.some(isDerived)&&!t.kept;return`<button class="dcard" data-world="${t.id}"><div class="dcard-top"><span>Territory ${String(TERR.indexOf(t)+1).padStart(2,"0")}</span><span>${t.status==="picked"?"Picked ✓":t.status==="parked"?"Parked":t.judge?"Judge #"+t.judge:"Not ranked"}</span></div>
      ${touch(t,"poster")}<h4>${esc(t.name)}</h4><p>${esc(t.thought)}</p>
      <div class="dcard-foot"><span>${t.ev.length?"Rests on "+t.ev.join(", "):"No evidence yet"} · ${d?'<span class="why">needs you</span>':"verified ✓"}</span><span class="open">Open the world →</span></div></button>`}).join("")}
    ${gen===w.id?`<div class="empty"><span class="spin"></span> Writing a territory into this whitespace…</div>`:""}</div></section>`}).join("");
}

/* ---------- the world ---------- */
function worldBody(t){

  return`<ol class="journey">${JOURNEY.map(j=>`<li class="jstep j-${j.k}"><div class="jwhen"><b>${j.day}</b><span>${j.where}</span></div>${touch(t,j.k)}</li>`).join("")}</ol>`}
function stageWorld(){const t=TERR.find(x=>x.id===selT),w=WS.find(x=>x.id===t.ws);
  return`<div class="split"><article class="sheet world" id="wsheet" style="${tvars(t)}">
   <header class="whead2"><div><span class="weyebrow">Territory ${String(TERR.indexOf(t)+1).padStart(2,"0")} · grown from ${esc(w.name)}</span><h2>${esc(t.name)}</h2><p>${esc(t.thought)}</p></div>
   <div class="wseg"><button aria-pressed="${wview==="journey"}" data-wv="journey">A weekend with it</button><button aria-pressed="${wview==="wall"}" data-wv="wall">All on one wall</button></div></header>

  ${boothOpen()}${panelWorld(t)}${boothClose()}</div>`}
function panelWorld(t){const L=TERR.filter(x=>x.status!=="killed"),i=L.indexOf(t),w=WS.find(x=>x.id===t.ws),der=t.ev.filter(isDerived);
  let h=`<div class="navrow"><button class="linkbtn" id="wback">← All territories</button><span class="spacer"></span><button class="sp-btn" id="wprev" aria-label="Previous territory">←</button><span class="mono-s">${i+1} of ${L.length}</span><button class="sp-btn" id="wnext" aria-label="Next territory">→</button></div>

  if(der.length&&!t.kept)h+=call("Your call · 1 open",`This territory rests on <b>${der.join(", ")}</b>, derived by the agent and not yet verified. Keep it as a working hypothesis?`,`<button class="pbtn primary" id="keepH">Keep</button><button class="pbtn" id="askR">Ask the research</button>`);
  h+=`<div class="sbox"><div class="sbox-head"><b>Territory</b>${chipS(t.status,t.status==="picked"?"ok":t.status==="parked"?"mut":"acc")}<span class="mono-r">${t.judge?"judge #"+t.judge:"not ranked"}</span></div>
   <div class="row"><button class="sp-btn" id="present">Present</button><button class="sp-btn" id="park">${t.status==="parked"?"Bring back":"Park"}</button><button class="sp-btn" id="kill">Kill…</button></div></div>`;
  h+=ptabs("world",[["feel","Feel"],["lines","Lines"],["why","Why"],["test","Test"]]);
  if(ptab.world==="test"){const ck=testChecks(t),bad=ck.filter(c=>!c.ok).length;h+=`<div class="psec"><span class="psec-t">Checked against the brief and the landscape · ${ck.length-bad} of ${ck.length} pass</span>${ck.map(c=>`<div class="chk ${c.ok?"":"warn"}"><b>${c.ok?"✓":"!"}</b><div class="grow"><div><b>${c.t}</b></div><div class="meta">${esc(c.d)}</div></div>${c.ref?refChip(c.ref):""}</div>`).join("")}<p class="meta">Checks rerun when you change the dials or the lines.</p></div>`}
  if(ptab.world==="feel")h+=`<div class="psec"><span class="psec-t">Shape the feel</span>${DIALS.map(([k,a,b])=>`<label class="pdial" for="d-${k}"><span>${a}</span><input type="range" id="d-${k}" min="0" max="100" value="${t.dial[k]}" data-dial="${k}"><span>${b}</span></label>`).join("")}<div><button class="sp-btn" id="dreset">Back to its natural feel</button></div></div>
   <div class="psec"><span class="psec-t">Look</span><div class="swrow">${Object.values(t.P).map(c=>`<span style="background:${c}"></span>`).join("")}</div><div class="spec2"><span class="aa" style="font-family:${t.font};font-weight:${t.fw};font-style:${t.fs}">Aa</span>${esc(t.fontName)}</div></div>
   <div class="psec"><span class="psec-t">Sound</span><p><b>Music.</b> ${esc(t.music)}</p><p><b>Sonic idea.</b> ${esc(t.sonic)}</p></div>
   <div class="psec"><span class="psec-t">References</span><p><b>Kinds of work.</b> ${t.refs.map(esc).join(" · ")}</p><p><b>Not this.</b> ${t.not.map(esc).join(" · ")}</p></div>`;
  if(ptab.world==="lines"){const lines=[...new Set([...Object.values(t.H),...t.extra])];
    h+=`<div class="psec"><span class="psec-t">Click a line to lead with it everywhere</span>${lines.map(l=>`<div class="lrow ${hl(t)===l?"on":""}"><button class="lp" data-hero="${esc(l)}">${esc(l)}</button><button class="ls ${t.stars.includes(l)?"on":""}" data-star="${esc(l)}" aria-label="Star this line">★</button></div>`).join("")}
    <div class="row"><button class="sp-btn go" id="more">Write more like the starred</button>${t.hero?`<button class="sp-btn" id="unhero">Let the dials choose</button>`:""}</div></div>`}
  if(ptab.world==="why")h+=`${t.recipe?`<div class="psec"><span class="psec-t">Recipe</span><p><b>Springboard.</b> ${esc(SB.find(x=>x.id===t.recipe.sb)?.text||"")}</p><p><b>Device.</b> ${esc(lensName(t.recipe.lens))}</p><button class="linkbtn" data-recipe="${t.id}">Open this recipe in Ideate →</button></div>`:""}<div class="psec"><span class="psec-t">Grown from</span><p><button class="linkbtn" data-gotows="${w.id}">${esc(w.name)}</button> ${chipS(VERD[w.verdict][0],VCHIP[w.verdict])}</p></div>
   <div class="psec"><span class="psec-t">Rests on</span>${t.ev.length?t.ev.map(e=>{const n=NEEDS.find(x=>x.ev===e);return`<div class="li">${refChip(e)}<span class="grow">${esc(n?n.q:"")}</span><span class="pill st-${n?n.evs:"derived"}">${n?n.evs:"derived"}</span></div>`}).join(""):"<p>No evidence yet.</p>"}</div>
   <div class="psec"><span class="psec-t">Scores · your marks override them</span><div class="gauge">${[["Fit","fit"],["Ownable","own"],["Risk","risk"]].map(([l,k])=>`<div class="g"><div class="psec-t">${l}</div><b>${t.sc[k]}</b><span class="meta">/5</span></div>`).join("")}</div></div>
   <div class="psec"><span class="psec-t">Risks</span>${t.risks.map(r=>`<div class="callout alert">${esc(r)}</div>`).join("")}</div>
   <div class="psec"><span class="psec-t">Push it</span><div class="row">${["Braver","Safer","More ownable","More proof"].map(p=>`<button class="sp-btn" data-push="${p}">${p}</button>`).join("")}</div></div>`;
  return h+pfoot()}
function refreshWorld(){const t=TERR.find(x=>x.id===selT),s=$("#wsheet");if(!s)return;s.setAttribute("style",tvars(t));$("#wbody").innerHTML=worldBody(t);wireWorldBody()}

/* ---------- 5 Outputs ---------- */
function stageOutputs(){const picked=TERR.find(t=>t.status==="picked");
  const O=[["01 · Export","HTML · PDF","Landscape report","The map, share of voice by theme, and every brand’s lines with their sources.","Export","37 lines · 8 brands"],
   ["02 · Export","PDF","Whitespace one-pager","Each gap with its need, its noise, your call and the evidence under it. For the strategy meeting.","Export",`${WS.filter(w=>w.confirmed).length} of ${WS.length} gaps confirmed`],
   ["03 · Export","Board · PDF","Territory board","Every live territory as a world: lines, look, sound and risks. Ready for the tissue session or the client.","Export",`${TERR.filter(t=>t.status!=="killed").length} territories`],

  <div class="grp-head" style="margin-top:32px"><span class="t">02 / Decisions on the record · ${HIST.length}</span></div><ol class="dlist">${HIST.map(x=>`<li><span class="who">${esc(x.who)}</span><span>${esc(x.what)}</span></li>`).join("")}</ol>`}

 compare:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>',

/* ---------- wiring ---------- */
function recodeDialog(id){const a=AD.find(x=>x.id===id);dialog(`<h3>Correct the coding</h3><p class="meta" style="margin:0">“${esc(a.line)}”, ${esc(BR[a.brand].name)}</p><div class="row">${Object.entries(TH).map(([k,v])=>`<button class="pbtn ${k===a.theme?"primary":""}" data-th="${k}">${esc(v.n)}</button>`).join("")}</div><div><button class="sp-btn" id="cancel">Cancel</button></div>`,
  d=>d.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{const old=TH[a.theme].n;a.theme=b.dataset.th;lowconf=lowconf.filter(x=>x!==id);log("Shrey",`Recoded “${a.line}” from ${old} to ${TH[a.theme].n}.`);close();render();toast("Recoded. The map and the gaps are updated.")}))}
const on=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.onclick=e=>fn(b,e));
function go(m){mode=m;probe=null;render();window.scrollTo(0,0)}
function wire(){
  const t=TERR.find(x=>x.id===selT);
  on("[data-step]",b=>go(b.dataset.step));
  on("[data-go]",b=>{if(b.dataset.go==="wscall"){const w=WS.find(x=>!x.confirmed);lens=w.lens;selWs=w.id;probe=null;render()}else{document.querySelector(".call")?.scrollIntoView({block:"center",behavior:"smooth"})}});
  on("[data-lens]",b=>{lens=b.dataset.lens;selWs=WS.find(w=>w.lens===lens).id;probe=null;render()});
  on("[data-p]",b=>{period=b.dataset.p;render()});
  on("[data-layer]",b=>{layers[b.dataset.layer]=!layers[b.dataset.layer];render()});
  on("[data-b]",b=>{const k=b.dataset.b;hidden.has(k)?hidden.delete(k):hidden.add(k);render()});
  on("[data-focus]",b=>{selBrand=selBrand===b.dataset.focus?null:b.dataset.focus;selAd=null;render()});
  on(".panel [data-ws]",b=>{selWs=b.dataset.ws;probe=null;render()});
  on("[data-ptab]",b=>{const[k,v]=b.dataset.ptab.split(":");ptab[k]=v;render()});
  on("[data-cov]",b=>b.classList.toggle("filled"));on("[data-mk]",b=>b.classList.toggle("on"));
  on("[data-lc-keep]",b=>{const a=AD.find(x=>x.id===b.dataset.lcKeep);lowconf=lowconf.filter(x=>x!==a.id);log("Shrey",`Kept the coding of “${a.line}” as ${TH[a.theme].n}.`);render()});
  on("[data-lc-recode]",b=>recodeDialog(b.dataset.lcRecode));
  on("[data-verdict]",b=>{const w=WS.find(x=>x.id===selWs);w.verdict=b.dataset.verdict;w.confirmed=true;log("Shrey",`Called ${w.name}: ${VERD[w.verdict][0].toLowerCase()}.`);render()});
  on("[data-gen]",b=>{const id=b.dataset.gen,has=TERR.some(x=>x.ws===id&&x.status!=="killed");if(mode==="whitespace"&&has){selWs=id;go("territories")}else generateFor(id)});
  on("[data-gotows]",b=>{const w=WS.find(x=>x.id===b.dataset.gotows);lens=w.lens;selWs=w.id;go("whitespace")});
  on("[data-world]",b=>{selT=b.dataset.world;wview="journey";go("world")});
  on("[data-tv]",b=>{tview=b.dataset.tv;render()});
  on("[data-tg]",b=>{tgroup=b.dataset.tg;render()});
  on("[data-go=expcall]",()=>document.querySelector(".booth .bc.ask")?.scrollIntoView({block:"center",behavior:"smooth"}));
  on("[data-ctp]",b=>{ctp=b.dataset.ctp;render()});
  on("[data-push]",b=>generateFor(t.ws,`Pushed ${t.name} ${b.dataset.push.toLowerCase()} in`));
  on("[data-out]",b=>{log("Shrey",`${b.dataset.out}.`);toast(`${b.dataset.out}: in the real tool this opens or downloads.`)});
  on("#back",()=>{selAd=null;render()});
  on("#rescan",()=>{log("Shrey","Started a rescan.");toast("Scanning again in the background. You’ll get a note when it’s done.")});
  on("#addRival",()=>dialog(`<h3>Add a brand to the set</h3><p class="meta" style="margin:0">It’s scanned like the others, from public material only.</p><textarea placeholder="Brand name, and its site if you know it"></textarea><div class="row"><button class="pbtn primary" id="cancel">Add and scan</button></div>`));
  on("#attachBrief",()=>toast("Attach a Brief Maker or Research Tool document. Its needs and mandatories join the scan."));
  on("#askR",()=>{log("Shrey","Asked the Research Tool for evidence.");toast("Research request recorded. Nothing runs until you confirm it in the Research Tool.")});
  on("#saveProbe",()=>dialog(`<h3>Name this whitespace</h3><textarea id="wn" placeholder="e.g. Weekends without a plan"></textarea><div class="row"><button class="pbtn primary" id="ok">Save</button><button class="pbtn" id="cancel">Cancel</button></div>`,
    d=>d.querySelector("#ok").onclick=()=>{const n=d.querySelector("#wn").value.trim();if(!n)return;const id="w"+(WS.length+1);WS.push({id,lens,name:n,at:probe,r:.09,verdict:"unproven",confirmed:false,why:"Marked by a person from the map.",risk:"Not judged yet. Ask for evidence before building on it.",needs:[]});RESERVE[id]=[];selWs=id;probe=null;log("Shrey",`Saved a whitespace: ${n}`);close();render()}));
  on("#dismissWs",()=>dialog(`<h3>Dismiss this whitespace?</h3><textarea id="r" placeholder="Why it’s not for us"></textarea><div class="row"><button class="pbtn primary" id="ok">Dismiss</button><button class="pbtn" id="cancel">Cancel</button></div>`,
    d=>d.querySelector("#ok").onclick=()=>{const r=d.querySelector("#r").value.trim();if(!r)return;const w=WS.find(x=>x.id===selWs);w.verdict="unattractive";w.confirmed=true;w.risk="Dismissed: "+r;log("Shrey",`Dismissed ${w.name}: ${r}`);close();render()}));
  on("#rank",()=>{const L=TERR.filter(x=>x.status!=="killed").sort((a,b)=>(b.sc.fit+b.sc.own-b.sc.risk)-(a.sc.fit+a.sc.own-a.sc.risk));L.forEach((x,i)=>x.judge=i+1);log("judge",`Re-ranked ${L.length} territories blind on a second model.`);render();toast("Re-ranked. The judge saw thoughts and risks, never names.")});
  on("[data-dock]",b=>{const k=b.dataset.dock,L=TERR.filter(x=>x.status==="live"||x.status==="picked");
    if(k==="present")present(mode==="world"?Math.max(0,L.indexOf(t)):0);if(k==="compare"){tview=tview==="compare"?"gallery":"compare";render()}
    if(k==="rank")$("#rank").click();if(k==="anim")animatic(t);if(k==="wall"){wview=wview==="wall"?"journey":"wall";render()}});

function panelGreen(){const G=TERR.filter(t=>t.green&&t.status!=="killed");let h="";
  h+=`<div class="psec"><span class="psec-t">Greenlit · ${G.length}</span>${G.length?G.map(t=>`<div class="glrow"><span class="sw" style="background:${t.P.bg};border-color:${t.P.ink}"></span><b>${esc(t.name)}</b><button class="linkbtn" data-green="${t.id}" style="font-size:12px;margin-left:auto">remove</button></div>`).join(""):'<p>None yet. Open a route to see it as a world, or greenlight straight from its card.</p>'}</div>`;
  G.filter(t=>!t.kept&&t.ev.some(isDerived)).forEach(t=>{const der=t.ev.filter(isDerived);h+=call("before production",`<b>${esc(t.name)}</b> rests on ${der.join(", ")}, which is derived, not verified. Verify it first, or send it flagged?`,`<button class="pbtn primary" data-verify="${t.id}">Verify it</button><button class="pbtn" data-flag="${t.id}">Send it flagged</button>`,"review")});
  h+=note("research","spend",`This exploration so far: ${EXPS.length} agents, 4 look-ups, about €0.52. There’s no budget cap yet: spend is logged with what you greenlight, so the team can set a budget from what produces the best routes.`,"");
  h+=note("review","checked",`Every route was tested against the brief, the mandatories and the rival lines. ${TERR.filter(t=>t.status!=="killed"&&t.judge).length} are ranked by the blind judge.`,"");
  h+=`<button class="big" id="sendProd" ${G.length&&!G.some(t=>!t.kept&&t.ev.some(isDerived))?"":"disabled"}>${sentTo?`Sent to ${sentTo} ✓`:`Send ${G.length||""} to production →`}</button>`;
  return h+pfoot()}
function sendDialog(){const G=TERR.filter(t=>t.green&&t.status!=="killed");
  dialog(`<h3>Send to production</h3><p class="meta" style="margin:0">${G.map(t=>esc(t.name)).join(" and ")} go with their worlds, lines, checks and sources. The other ${TERR.filter(t=>t.status!=="killed"&&!t.green).length} routes travel as routes not chosen.</p>
   <button class="wsrow" data-dest="Deck Studio" style="grid-template-columns:auto minmax(0,1fr)"><span style="width:12px;height:12px;border-radius:50%;background:var(--muted);margin-top:4px"></span><span><b>Deck Studio</b><br><span class="meta">Pitch it: the deck opens with the greenlit routes as the recommendation.</span></span></button>
   <button class="wsrow" data-dest="the production tool" style="grid-template-columns:auto minmax(0,1fr)"><span style="width:12px;height:12px;border-radius:50%;background:#FF6A55;margin-top:4px"></span><span><b>Production tool</b><br><span class="meta">Make it: scripts, boards and films start from each route’s world.</span></span></button>
   <div><button class="pbtn" id="cancel">Cancel</button></div>`,
   d=>d.querySelectorAll("[data-dest]").forEach(b=>b.onclick=()=>{sentTo=b.dataset.dest;log("Shrey",`Sent ${G.map(t=>t.name).join(" and ")} to ${sentTo}.`);close();render();toast(`Sent to ${sentTo}. Three steps, three decisions.`)}))}
function dockHTML(){
  if(["expeditions","landscape","whitespace","lateral","ideate"].includes(mode))return`<div class="dock"><form class="askbar" id="riff2"><span class="lbl">YOUR IDEA</span><input id="riff2In" placeholder="Optional: add an idea in your own words…" autocomplete="off" aria-label="Add an idea in your own words"><button class="btn-pill primary sm" type="submit">Add</button></form></div>`;
  if(mode!=="territories"&&mode!=="world")return"";
  const acts=mode==="world"?[["present","Present"],["anim","Animatic"],["wall","Wall",wview==="wall"]]:[["present","Present"],["compare","Compare",tview==="compare"],["rank","Re-rank"]];
  return`<div class="dock"><div class="dock-acts">${acts.map(([k,l,on])=>`<button class="dock-act" data-dock="${k}" aria-pressed="${!!on}"><span class="dock-ring">${IC[k]}</span><span class="dock-lbl">${l}</span></button>`).join("")}</div></div>`}
function wireThree(){
  on("[data-tick]",b=>{const s=SB.find(x=>x.id===b.dataset.tick);s.kept=b.checked;log("Shrey",`${s.kept?"Ticked":"Unticked"} “${s.text}”`);render()});
  on("#goExplore",()=>{log("Shrey",`Sent the crew out on ${SB.filter(s=>s.kept&&!s.cut).length} insights.`);go("expeditions");if(expState==="ready")setTimeout(launch,700)});
  on("[data-undo]",b=>undo(+b.dataset.undo));
  on("#budYes",()=>{budgetAsk=false;runQuery("Can families book table seats on weekend trains?",{by:"Research agent, approved by Shrey"})});
  on("#budNo",()=>{budgetAsk=false;log("Shrey","Skipped the over-budget look-up.");render()});
  const r=$("#riff2");if(r)r.onsubmit=e=>{e.preventDefault();const v=$("#riff2In").value.trim();if(!v){$("#riff2In").focus();return}riff(v)};
  on("[data-green]",(b,e)=>{e.stopPropagation();toggleGreen(TERR.find(t=>t.id===b.dataset.green))});
  on("[data-verify]",b=>{const t=TERR.find(x=>x.id===b.dataset.verify);runQuery(`Verify: ${t.ev.filter(isDerived).map(id=>SRC[id].text).join(" ")}`,{by:"Review agent, for "+t.name});t.kept=true});
  on("[data-flag]",b=>{const t=TERR.find(x=>x.id===b.dataset.flag);t.kept=true;log("Shrey",`Sending ${t.name} flagged: it rests on a derived finding.`);render()});
  on("#sendProd",()=>sendDialog());
  if(mode==="world"){const t=TERR.find(x=>x.id===selT),pk=$("#pick");if(pk&&t){pk.textContent=t.green?"✓ Greenlit · remove":"Greenlight this route";pk.onclick=()=>toggleGreen(t)}}
}
function render(){
  if(mode==="world"&&!TERR.find(t=>t.id===selT&&t.status!=="killed"))mode="territories";
  const S={brief:stageBrief,research:stageResearch,focus:stageFocus,inputs:stageFocus,springboards:stageFocus,scan:stageScan,landscape:stageLandscape,whitespace:stageWhitespace,lateral:stageLateral,ideate:stageIdeate,expeditions:stageExpeditions,territories:stageTerritories,world:stageWorld,outputs:stageTerritories};
  $("#main").innerHTML=heroFor()+(["expeditions","landscape","whitespace","lateral","ideate"].includes(mode)?exploreNav():"")+S[mode]();
  const d=dockHTML();$("#dock").innerHTML=d+boothEdge();document.body.classList.toggle("has-dock",!!d);topbar();
  $("#decN").textContent=openCalls();
  drawMap();wire();wireThree();
}
render();
</script>
