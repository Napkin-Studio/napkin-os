# Xiaolai SC (LXGW, derived from Nozomi Seto's Seto Font): OFL-1.1 upstream
# (lxgw/kose-font OFL.txt) and in the font's own name table (excalidraw
# fonts/Xiaolai/index.ts, v0.18.0). Open question 7 is answered: it is OFL-1.1.
[[family]]
name = "Xiaolai"
shipped_by = "@excalidraw/excalidraw@0.18.1"
files = ["Xiaolai-*"]
licence = "OFL-1.1"
source_url = "https://github.com/lxgw/kose-font/blob/master/OFL.txt"

