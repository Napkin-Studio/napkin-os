# Every font family we ship or link, one entry per family. The licence gate fails on a
# font file (woff2, woff, ttf, otf) in the production install of an npm client root, or
# tracked in the repo, with no entry here, and on a fonts.googleapis.com family= link
# in tracked .html/.ts/.tsx/.py code whose family is not listed.
#
# Fields: name, shipped_by ("package@version" for fonts inside an npm package,
# "fonts.googleapis.com" for linked fonts, "repo" for tracked files), files (filename
# globs, for shipped files), licence (confirmed at source_url), source_url.
# A version bump of the shipping package needs these entries re-read and updated.

# ---- @excalidraw/excalidraw 0.18.1 (production-tool/web) -------------------------
# dist/prod/fonts and dist/dev/fonts hold the same set; both are checked against these.
# Licences read from each family's upstream on 2026-10-13. The woff2 files carry no
# licence file; the cn-font-split headers in excalidraw's fonts/*/index.ts (v0.18.0)
# repeat the licence for Excalifont and Xiaolai.

[[family]]
name = "Assistant"
shipped_by = "@excalidraw/excalidraw@0.18.1"
files = ["Assistant-*"]
licence = "OFL-1.1"
source_url = "https://github.com/hafontia/Assistant/blob/master/OFL.txt"

[[family]]
name = "Cascadia Code"
shipped_by = "@excalidraw/excalidraw@0.18.1"
files = ["CascadiaCode-*"]
licence = "OFL-1.1"
source_url = "https://github.com/microsoft/cascadia-code/blob/main/LICENSE"

