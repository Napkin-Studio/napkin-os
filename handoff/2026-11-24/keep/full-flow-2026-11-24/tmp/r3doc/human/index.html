    statement: '<rect class="g" x="5" y="4.6" width="22" height="2.3" rx=".6"/><rect class="g" x="5" y="8.3" width="16" height="2.3" rx=".6"/><rect class="g" x="5" y="12.6" width="8" height="1.2" rx=".5" opacity=".6"/>',
    list: '<rect class="g" x="5" y="4.8" width="1.6" height="1.6" rx=".8"/><rect class="g" x="8" y="5" width="15" height="1.2" rx=".5"/><rect class="g" x="5" y="8.4" width="1.6" height="1.6" rx=".8"/><rect class="g" x="8" y="8.6" width="12" height="1.2" rx=".5"/><rect class="g" x="5" y="12" width="1.6" height="1.6" rx=".8"/><rect class="g" x="8" y="12.2" width="14" height="1.2" rx=".5"/>',
    compare: '<rect class="g" x="4" y="4" width="11" height="10" rx="1" opacity=".45"/><rect class="g" x="17" y="4" width="11" height="10" rx="1" opacity=".45"/><rect class="g" x="6" y="6" width="6" height="1.4" rx=".5"/><rect class="g" x="19" y="6" width="6" height="1.4" rx=".5"/>',
    data: '<rect class="g" x="7" y="10" width="3.2" height="4" rx=".4"/><rect class="g" x="12.5" y="7.5" width="3.2" height="6.5" rx=".4"/><rect class="g" x="18" y="4.5" width="3.2" height="9.5" rx=".4"/><rect class="g" x="5" y="14" width="20" height=".7" opacity=".6"/>',
    timeline: '<rect class="g" x="4" y="8.6" width="24" height=".8" opacity=".6"/><circle class="g" cx="8" cy="9" r="1.7"/><circle class="g" cx="16" cy="9" r="1.7"/><circle class="g" cx="24" cy="9" r="1.7"/>',
    image: '<rect class="g" x="3" y="3" width="26" height="12" rx="1" opacity=".3"/><circle class="g" cx="9" cy="7" r="1.6"/><path class="g" d="M5 14 L12 8 L17 12 L21 9 L27 14 Z" opacity=".7"/>',
    people: '<circle class="g" cx="10" cy="7.4" r="2.1"/><circle class="g" cx="16" cy="7.4" r="2.1"/><circle class="g" cx="22" cy="7.4" r="2.1"/><rect class="g" x="7.2" y="10.5" width="5.6" height="3" rx="1.5" opacity=".6"/><rect class="g" x="13.2" y="10.5" width="5.6" height="3" rx="1.5" opacity=".6"/><rect class="g" x="19.2" y="10.5" width="5.6" height="3" rx="1.5" opacity=".6"/>'
  };
  /**
   * A card's spine as a strip of mini slides (up to 12, six to a row, 16:9), one glyph each from the slide's layout purpose, drawn
   * from the generated card, so it is the real spine. Each mini slide names its section. 'more' adds a '+N' after the strip.
   */
  function spineThumb(card) {
    var sp = (Array.isArray(card.spine) ? card.spine : []).slice(0, 12), W = 32, H = 18, G = 4, PER = 6;
    var rows = Math.max(1, Math.ceil(sp.length / PER)), vw = PER * W + (PER - 1) * G, vh = rows * H + (rows - 1) * G;
    var minis = sp.map(function (x, i) {
      var name = String(x.section || x.type || '') + (x.purpose ? ' (' + x.purpose + ')' : '');
      var ax = x.section === 'Appendix' ? ' ax' : '';
      return '<g class="mini-s" data-purpose="' + esc(x.purpose) + '" transform="translate(' + ((i % PER) * (W + G)) + ' ' + (Math.floor(i / PER) * (H + G)) + ')"><title>' + esc(name) + '</title>' +
        '<rect class="ms' + ax + '" x=".5" y=".5" width="' + (W - 1) + '" height="' + (H - 1) + '" rx="2.2"/>' + (GLYPH[x.purpose] || GLYPH.statement) + '</g>';
    }).join('');
    return '<span class="dspine"><svg class="spine" viewBox="-1 -1 ' + (vw + 2) + ' ' + (vh + 2) + '" role="img" aria-label="' + esc(sp.length + ' slides: ' + sp.map(function (x) { return x.section; }).join(', ')) + '">' + minis + '</svg>' +
      (card.more > 0 ? '<span class="more mono" data-more>+' + esc(card.more) + '</span>' : '') + '</span>';
  }

  /** The type the picker shows as selected: the pick, the answer or the inference; null ('Not sure') when only the default applies. */
  function shownType(t) { return t.source === 'default' ? null : t.id; }

  /**
   * The type picker: five cards (the default first) and 'Not sure: decide from my brief', as a radio group with a roving tab stop.
   * An inferred type is preselected with its quoted evidence, not a pick until clicked. With a deck already built, a different type
   * shows the Change sheet first (view.typeAsk). Under the grid: what to bring, and the format switch.
   */
  function typePicker(s, format) {
    var t = L.deckTypeOf(s.raw), on = shownType(t), ask = view.typeAsk && L.cardOf(view.typeAsk) ? view.typeAsk : null;
    var tagOf = { picked: 'Your pick', answered: 'Your choice', inferred: 'Suggested' };
    var cards = L.offeredCards(s.raw).map(function (c) {
      var sel = on === c.id;
      return '<button type="button" class="dtc' + (ask === c.id ? ' asking' : '') + '" role="radio" aria-checked="' + sel + '" tabindex="' + (sel ? 0 : -1) + '" data-dpick="' + esc(c.id) + '">' +
        '<span class="dtc-h"><b>' + esc(c.label) + '</b>' + (sel ? '<span class="tag">' + tagOf[t.source] + '</span>' : '') + '</span>' +
        '<span class="dtc-l">' + esc(c.one_line) + '</span>' + spineThumb(c) +
        '<span class="dtc-c mono">' + esc(L.typeCaption(c, format, L.recipesOn(s.raw))) + '</span></button>';
    }).join('') +
      '<button type="button" class="dtc unsure" role="radio" aria-checked="' + !on + '" tabindex="' + (on ? -1 : 0) + '" data-dpick="none">' +
        '<span class="dtc-h"><b>Not sure</b></span><span class="dtc-l">Decide from my brief: your prompt and documents choose, and an agency pitch when nothing says otherwise.</span>' +
        '<span class="dspine"><span class="qbox" aria-hidden="true">?</span></span><span class="dtc-c mono">read from what you give</span></button>';
    var looks = (L.DECK_TYPES.filter(function (x) { return x.id === t.id; })[0] || {}).looks;
    var change = ' <button type="button" class="lnk" data-dfocus="1">Change</button>';
    var say = t.source === 'inferred' && t.quote ? esc('Looks like ' + looks + ': you wrote "' + t.quote + '"' + (/[.!?]$/.test(t.quote) ? '' : '.')) + change
      : t.source === 'inferred' ? esc('Looks like ' + looks + '.') + change
      : t.source === 'picked' ? esc('Building ' + looks + '. You can change this.')
      : t.source === 'answered' ? esc('Building ' + looks + '. You can change this.')
      : 'Defaults to agency pitch until you pick one, or your brief says otherwise.';
    var sheet = '';
    if (ask) {
      var cs = L.changeSheet(s.raw, ask), lab = L.cardOf(ask).label, was = L.cardOf(L.builtTypeOf(s.raw) || t.id);
      sheet = '<div class="sheet" data-change-sheet role="group" aria-label="Change the deck type"><div class="eyebrow">Change sheet</div>' +
        '<p class="sheet-l"><b>' + esc('Change to ' + lab + '?') + '</b> ' + esc(cs.line) + '</p>' +
        '<div class="row" style="margin-top:10px"><button type="button" class="btn sm dark" data-dconfirm="' + esc(ask) + '">' + esc((cs.free ? 'Change to ' : 'Yes, write it: change to ') + lab.toLowerCase()) + '</button>' +
        '<button type="button" class="btn sm" data-dcancel="1">' + esc('Keep ' + (was ? was.label.toLowerCase() : 'this type')) + '</button></div></div>';
    }
    var hints = L.typeHints(t.id);
    var sz = L.sizeOf(s.raw, L.cardOf(shownType(t)), format);
    var pillTone = t.source === 'picked' || t.source === 'answered' ? 'ok' : 'plain';
    var pillWord = t.source === 'picked' ? 'Picked' : t.source === 'answered' ? 'Chosen' : t.source === 'inferred' ? 'Suggested' : 'Not picked yet';
    return '<section class="card sec" id="deck-type" data-type-picker><div class="sec-h"><span class="mono eyebrow">01</span><b>What kind of deck?</b><div class="spacer"></div>' +
      '<span class="pill ' + pillTone + '">' + pillWord + '</span></div>' +
      '<p class="note" style="margin:-6px 0 12px">Pick first: the type decides which slides there are, their order and their layouts.</p>' +
      '<div class="dtypes" role="radiogroup" aria-label="What kind of deck?">' + cards + '</div>' +
      '<p class="note" style="margin-top:12px" data-type-say>' + say + '</p>' + sheet +
      '<div class="hint" data-type-hints>' + esc(hints.line) + '</div>' +
      '<div class="rule"></div>' +
      '<div class="eyebrow dark" style="margin-bottom:8px" id="dfmt-h">How will it be used?</div>' +
      '<div class="row" role="group" aria-labelledby="dfmt-h" data-format-switch>' +
        pick('format', 'pitch', format, 'Presented on a screen', 'Short slides you talk to, then a hidden appendix') +
        pick('format', 'full', format, 'Sent to be read', 'The leave-behind, read without you') + '</div>' +
      '<div class="eyebrow dark" style="margin:14px 0 8px" id="dsize-h">Slide size</div>' +
      '<div class="row" role="group" aria-labelledby="dsize-h" data-size-switch>' + L.SIZES.map(function (z) {
        return '<button class="pick" data-size="' + z.id + '" aria-pressed="' + (sz.canvas === z.id) + '"><b>' + esc(z.label) + '</b><span>' + esc(z.note) + (sz.dflt === z.id ? ' (default)' : '') + '</span></button>';
      }).join('') + '</div>' +
      (format === 'full' ? '<p class="note" style="margin-top:8px" data-format-note>Every slide in story order, more words per slide, pictures on the cover only. The pages default to A4 landscape; change it under Slide size above.</p>' : '') +
      '</section>';
  }

  /** The Check panel: the gap report, up to 5 questions, each skippable. Nothing here gates Build. */
  function checkPanel(s) {
    var g = L.gapView(s.intake);
    if (!g.hasGaps && !g.questions.length) return '';
    function gapList(title, rows) {
      return rows.length ? '<div style="margin-top:10px"><div class="eyebrow" style="margin-bottom:6px">' + esc(title) + '</div>' + rows.map(function (r) {
        return '<div class="li" style="margin-top:6px"><span class="dot"></span><span><b style="font-weight:600">' + esc(r.name) + '</b>' + (r.why ? ' <span class="note">' + esc(r.why) + '</span>' : '') + '</span></div>';
      }).join('') + '</div>' : '';
    }
    var qs = g.questions.map(function (q) {
      if (q.kind === 'supply') return supplyCard(q);
      var head = '<div class="qt">' + esc(q.text) + '</div>' + (q.address ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">' + esc(q.address) + '</div>' : '');
      if (q.state !== 'open') {
        var said = q.state === 'skipped' ? 'Skipped' : 'Answered: ' + esc(q.answer.text || ((q.options.filter(function (o) { return o.id === q.answer.option_id; })[0] || {}).label) || q.answer.option_id);
        return '<div class="q">' + head + '<div style="margin-top:8px"><span class="pill ' + (q.state === 'skipped' ? 'plain' : 'ok') + '">' + said + '</span></div></div>';
      }
      return '<div class="q">' + head + '<div class="opts">' + q.options.map(function (o) {
        return '<button class="btn sm" data-qopt="' + esc(o.id) + '" data-q="' + esc(q.id) + '">' + esc(o.label) + '</button>';
      }).join('') + '<button class="btn sm" data-qskip="' + esc(q.id) + '">Skip</button></div>' +
        (q.allow_text ? '<div class="free"><input class="inp" style="height:36px" id="qt_' + esc(q.id) + '" placeholder="Or say it in your own words" /><button class="btn sm" data-qtext="' + esc(q.id) + '">Save</button></div>' : '') + '</div>';
    }).join('');
    return '<section class="card sec" id="check"><div class="sec-h"><span class="mono eyebrow">05</span><b>Check</b><div class="spacer"></div>' +
      '<span class="pill ' + (g.hasGaps ? 'warn' : 'ok') + '">' + (g.hasGaps ? 'Gaps found' : 'No gaps') + '</span></div>' +
      '<p class="note">What the deck cannot fill from what you gave it. Answer what you can, skip the rest: Build never waits for these.</p>' +
      gapList('Brief fields nothing supports', g.brief_fields) + gapList('Slide types that would be thin', g.slide_types) +
      (qs ? '<div style="margin-top:12px">' + qs + '</div>' : '') + strengthen(s, g) + '</section>';
  }

  /** One supply card: the question, free text (one item per line) and Skip; once answered, the lines the person gave and a skip or answered pill. */
  function supplyCard(q) {
    var head = '<div class="qt">' + esc(q.text) + '</div><div class="hint-line">Only you know this. Whatever you write goes on the slide as you wrote it.</div>';
    if (q.state !== 'open') {
      var lines = L.supplyCards({ intake: { questions: [{ id: q.id, text: q.text, kind: 'supply', fills: q.fills }], answers: (function () { var a = {}; a[q.id] = q.answer; return a; })() } })[0].lines;
      return '<div class="q sup" data-supply="' + esc(q.id) + '">' + head + '<div style="margin-top:8px"><span class="pill ' + (q.state === 'skipped' ? 'plain' : 'ok') + '">' + (q.state === 'skipped' ? 'Skipped' : 'Supplied by you') + '</span></div>' +
        (lines.length ? '<ul class="note" style="margin:8px 0 0 18px">' + lines.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
    }
    return '<div class="q sup" data-supply="' + esc(q.id) + '">' + head + '<textarea class="inp ta" style="min-height:76px;margin-top:8px" id="qt_' + esc(q.id) + '" placeholder="One per line"></textarea>' +
      '<div class="opts"><button class="btn sm" data-qtext="' + esc(q.id) + '">Save</button><button class="btn sm" data-qskip="' + esc(q.id) + '">Skip</button></div></div>';
  }

  /** The supply cards on Review: what only you know, one card each, while any is open or answered. Empty when the engine asked none. */
  function supplyPanel(s) {
    var cards = L.gapView(s.intake).questions.filter(function (q) { return q.kind === 'supply'; });
    if (!cards.length) return '';
    var t = L.toSupply(s.raw);
    return '<div class="card" style="padding:16px" id="supply"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px;font-weight:600">To supply</b><div class="spacer"></div>' +
      '<span class="pill ' + (t.count ? 'warn' : 'ok') + '" data-to-supply>' + t.count + ' to supply</span></div>' +
      '<p class="note" style="margin-top:4px;font-size:12px">The deck never invents these. Give them here and the slide fills when the deck is built again.</p>' + cards.map(supplyCard).join('') + '</div>';
  }

  /** The Confirm list: every proposal, every figure only your own words support and every slide still needing a person, each with a Verify button. Empty when the deck has none. */
  function confirmPanel(s) {
    var c = L.confirmList(s.raw);
    if (!c.total) return '';
    var kinds = { proposal: 'Proposal', figure: 'Figure', slide: 'Needs you' };
    var rows = c.items.map(function (x) {
      return '<div class="conf' + (x.verified ? ' done' : '') + '" data-confirm="' + esc(x.ref) + '"><span class="pill ' + (x.verified ? 'ok' : x.kind === 'slide' ? 'warn' : 'plain') + '">' + (x.verified ? 'Verified' : kinds[x.kind]) + '</span>' +
        '<span class="what">' + esc(x.text) + '<small>' + esc(x.why) + '</small></span>' +
        (x.verified ? '' : '<button class="btn sm" data-verify="' + esc(x.ref) + '">Verify</button>') + '</div>';
    }).join('');
    return '<div class="card" style="padding:16px" id="confirm"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px;font-weight:600">Confirm list</b><div class="spacer"></div>' +
      '<span class="pill ' + (c.open ? 'warn' : 'ok') + '" data-confirm-count>' + c.verified + ' of ' + c.total + ' verified</span></div>' +
      '<p class="note" style="margin:4px 0 6px;font-size:12px">Only what you verify or supply counts as sourced. Verifying records your decision; it changes no slide.</p>' + rows + '</div>';
  }

  /** The Strengthen offer, shown when there are gaps. Pressing it records a request and launches nothing. */
  function strengthen(s, g) {
    if (!g.hasGaps) return '';
    var asked = s.asked && s.asked.status === 'asked';
    return '<div class="rule"></div><div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b style="font-size:14px;font-weight:600">Strengthen with research</b>' +
      '<p class="note" style="margin-top:4px">The Research Tool can look for facts to fill these gaps. It only runs when you say yes, and nothing from outside your own material reaches a slide without it. A research run takes minutes and counts against your quota.</p></div>' +
      '<button class="btn" id="strengthen"' + (asked ? ' aria-pressed="true"' : '') + '>' + (asked ? 'Asked' : 'Strengthen with research') + '</button></div>';
  }

  /**
   * The notice that a brief or research this deck was made from has changed since (GET /upstream, on Start and
   * Review). A deck is a frozen snapshot: it keeps the version it has and never takes the newer one by itself.
   */
  function changedNote() {
    if (!upChanged.length) return '';
    return '<div class="upnote" role="status" data-up-changed><b>' + esc(upChanged.map(function (c) { return c.title; }).join(', ')) + ' changed since this deck.</b> This deck keeps it as it was; it does not take the newer one on its own.</div>';
  }

  /** The Brief and Research cards: derived from data.upstream, never stored, Optional when absent. */
  function upstreamCards(s) {
    var u = L.upstreamSummary({ upstream: s.upstream });
    var attached = '<span class="pill ok">Brought in</span>', opt = '<span class="pill plain">Optional</span>';
    var r = u.research, b = u.brief, pr = u.production;
    var kitNote = kitChanged.map(function (n) {
      return '<div class="upnote" role="status" data-kit-notice="' + esc(n.kind) + '">' + esc(n.text) +
        (n.canUpdate ? ' <button class="btn sm" data-kit-update="' + esc(n.document_id) + '">Update</button>' : '') + '</div>';
    }).join('');
    var an = L.agencyLookNotice(s.raw);
    if (an) kitNote += '<div class="upnote" role="status" data-agency-look-notice>' + esc(an.text) +
      (an.canUpdate && !an.requested ? ' <button class="btn sm" data-agency-update>Update to current look</button>' : (an.requested ? ' <b>Asked: the next build takes it.</b>' : '')) + '</div>';
    return '<div class="eyebrow dark">Bring in a brief, research or a Production project (optional)</div>' + changedNote() + kitNote + '<div class="three">' +
      '<section class="card sec"><div class="sec-h"><span class="mono eyebrow">04</span><b>Research</b><div class="spacer"></div>' + (r ? attached : opt) + '</div>' +
        (r ? '<div class="doc"><span class="ico">.clan</span><div><div style="font-size:14px;font-weight:600">' + esc(r.name) + '</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + (r.findings == null ? 'report brought in' : esc(r.findings) + ' findings · ' + esc(r.rejected) + ' rejected') + '</div></div></div>' +
          '<p class="note" style="margin-top:10px">Rejected findings are never used on a slide.' + (r.findings == null ? ' Finding counts show once the Research Tool shares them.' : '') + '</p>' : '<p class="note">No research brought in. Start one from a Research Tool document with Spin off.</p>') + '</section>' +
      '<section class="card sec"><div class="sec-h"><span class="mono eyebrow">04</span><b>Brief</b><div class="spacer"></div>' + (b ? attached : opt) + '</div>' +
        (b ? '<div class="doc"><span class="ico">.clan</span><div><div style="font-size:14px;font-weight:600">' + esc(b.name) + '</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + esc(b.fields_filled) + ' of ' + esc(b.fields_total) + ' fields · ' + esc(b.mandatories) + ' mandatories</div></div></div>' +
          '<p class="note" style="margin-top:10px">Mandatories become requirements the deck must answer.' + (b.from === 'production' ? ' This one came with the Production project.' : '') + '</p>' : '<p class="note">No brief brought in. The deck builds from your prompt and documents.</p>') + '</section>' +
      '<section class="card sec" data-production-card><div class="sec-h"><span class="mono eyebrow">04</span><b>Production</b><div class="spacer"></div>' + (pr ? attached : opt) + '</div>' +
        (pr ? '<div class="doc"><span class="ico">.clan</span><div><div style="font-size:14px;font-weight:600">' + esc(pr.name) + '</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + esc(pr.finals) + (pr.finals === 1 ? ' final' : ' finals') + ' brought in' + (pr.to_supply ? ' · ' + esc(pr.to_supply) + ' rights to supply' : '') + '</div></div></div>' +
          '<p class="note" style="margin-top:10px">The pictures marked final go on the cover, the idea and the executions first. The pictures stay in Production and are fetched when you build.' + (pr.to_supply ? ' A picture whose rights are not stated waits as Rights to supply.' : '') + '</p>' : '<p class="note">No Production project brought in. Start one from a Production project with New deck from this project.</p>') + '</section></div>';
  }

  /** Start's "Look" card: the per-deck opt-out of the agency look, and (with the library on) the attached Style Pack and brand kit. */
  function lookSection(s) {
    var lp = L.lookPanel(s.raw), rows = '';
    if (!lp.agency.shown && !lp.kits.shown) return '';
    if (lp.agency.shown) rows += '<label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="agencyLook"' + (lp.agency.use ? ' checked' : '') + ' />' +
      '<span><b style="font-size:14px;font-weight:600">Use my agency\'s look</b><br><span class="note">If your agency has set up a look, every new deck wears it. Untick to use the standard look for this deck only.</span></span></label>';
    if (lp.kits.shown) {
      var line = function (k, noun) { return k ? '<div class="doc" style="margin-top:8px"><span class="ico">.clan</span><div><div style="font-size:14px;font-weight:600">' + esc(k.name) + '</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + noun + ' v' + esc(k.version) + '</div></div></div>' : ''; };
      rows += line(lp.kits.pack, 'Style Pack') + line(lp.kits.brand, 'Brand kit');
    }
    return '<section class="card sec" data-look-panel><div class="sec-h"><span class="mono eyebrow">Look</span><b>How it looks</b><div class="spacer"></div></div>' + rows +
      '<p class="note" style="margin-top:8px">A look never changes what a slide says.</p></section>';
  }

  function start(s) {
    var inp = s.inputs, p = inp.prompt || {};
    var dt = L.deckTypeOf(s.raw), typed = dt.source === 'picked' || dt.source === 'answered';
    var kind = typed ? L.kindOfType(dt.id) : (pending.kind || inp.kind), format = pending.format || inp.format;
    var docs = L.documentsOf(s.raw);
    var sum = L.summaryOf({ prompt: p, kind: kind, format: format, type: typed ? dt.id : null }, s.deck);
    var text = draft('text', p.text);
    var bf = L.builtFrom(inp, s.upstream, docs, typed ? dt.id : null);
    var sd = L.startDefaults(s.raw);   // a deck of a Production project starts with its client and project named
    function field(id, lab, val, ph) {
      return '<div><label class="lab" for="' + id + '">' + lab + '</label><input class="inp" id="' + id + '" value="' + esc(draft(id, val)) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + ' /></div>';
    }
    var hasText = !!String(text).trim();
    var docList = docs.length ? docs.map(function (x) {
      return '<div class="doc" style="margin-bottom:8px"><span class="ico">DOC</span><div><div style="font-size:14px;font-weight:600">' + esc(x.name) + '</div>' + (x.pages ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + esc(x.pages) + ' pages</div>' : '') + '</div></div>';
    }).join('') : '<p class="note">No documents attached. Attach a client brief, a deck or notes and every figure on a slide can point back to it.</p>';
    return '<main class="start"><div>' +
      '<div class="eyebrow">New deck</div>' +
      '<h1 style="margin:10px 0 6px">What are we pitching?</h1>' +
      '<p class="lede" style="margin-bottom:28px">Tell us in a line or paste everything you have, and attach any documents. A brief or research is optional. Nothing else is used, so every line on a slide traces back to what you gave.</p>' +
      '<div class="stack">' + typePicker(s, format) + lookSection(s) +
      '<section class="card sec"><div class="sec-h"><span class="mono eyebrow">02</span><b>Your prompt</b><div class="spacer"></div>' +
        '<span class="pill ' + (hasText ? 'ok' : 'plain') + '">' + (hasText ? 'Ready' : 'A line is enough') + '</span></div>' +
        '<div class="three">' + field('client', 'Client', p.client || sd.client) + field('project', 'Project', p.project || sd.project) + field('agency', 'Agency (optional)', p.agency, 'Shows as [Agency]') + '</div>' +
        '<div style="margin-top:14px"><label class="lab" for="ptext">What are we pitching? (a line is enough; paste everything you have)</label><textarea class="inp ta" id="ptext">' + esc(text) + '</textarea></div></section>' +
      '<section class="card sec"><div class="sec-h"><span class="mono eyebrow">03</span><b>Documents</b><div class="spacer"></div><span class="pill ' + (docs.length ? 'ok' : 'plain') + '">' + (docs.length ? docs.length + ' attached' : 'Optional') + '</span></div>' +
        docList + '<div style="margin-top:10px"><label class="btn sm" style="display:inline-flex;align-items:center" for="attach">Attach files</label><input type="file" id="attach" multiple style="position:absolute;left:-9999px" aria-label="Attach documents" />' +
        '<p class="note" style="margin-top:8px">Attaching needs the host. Files stay in this document.</p></div></section>' +
      upstreamCards(s) +
      checkPanel(s) + '</div></div>' +
      '<aside class="stack">' + prodSourceCard(s) +
      '<div class="frost summary"><div class="eyebrow">You will get</div><div class="t">' + esc(sum.title) + '</div><div class="note">' + esc(sum.note) + '</div><div class="rule"></div>' +
        builtLine(bf, hasText) + '<div class="rule"></div>' +
        '<div class="li"><span class="dot"></span><span><b style="font-weight:600">Web deck</b> to present in a browser, with a presenter view</span></div>' +
        '<div class="li"><span class="dot"></span><span><b style="font-weight:600">PowerPoint</b> with notes and the appendix hidden</span></div>' +
        '<div class="li"><span class="dot"></span><span><b style="font-weight:600">Animated deck</b> you can present from HyperFrames</span></div>' +
        '<div class="rule"></div><p class="note">You approve the storyline and pick a territory on the way. Then you review the finished deck.</p>' +
        '<button class="btn go big" id="build" style="width:100%;margin-top:18px;height:48px">Build deck</button>' +
        '<p class="mono" style="margin-top:10px;text-align:center;font-size:11px;color:var(--ink3)">' + (mwOn() ? 'Builds with the engine and stops at the first gate. Nothing past a gate runs until you approve it.' : s.run.stages.length ? 'Opens the recorded run. Live building needs the engine server.' : 'Live building needs the engine server.') + '</p></div>' +
      library(s) + '</aside></main>';
  }

  // The team-library shelf is off until ADR 0027 (the amendment to the deck input rule, ADR 0023) is approved.
  function library(s) {
    if (!s.inputs.library || !s.inputs.library.enabled) {
      return '<div class="lib off"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:14px;font-weight:600">From the team library</b><span class="pill plain">Off</span></div>' +
        '<p class="note" style="margin-top:8px">A brand kit and pictures from your team library would be optional inputs. That changes the rule that a deck takes only the prompt, the research and the brief, so it stays off until that rule change is approved.</p></div>';
    }
    return '<div class="lib"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:14px;font-weight:600">From the team library</b><span class="note">optional</span></div>' +
      '<p class="note" style="margin-top:10px">Pictures replace the "illustrative" placeholders. Font files are never taken from a PDF.</p></div>';
  }

  /**
   * Review's deck type: a chip with Change (back to Start's picker), and why when the type was read from the brief or is the default:
   * 'Read as a tender response because: "invitation to tender".'
   */
  function typeChip(s) {
    var t = L.deckTypeOf(s.raw), built = L.builtTypeOf(s.raw) || t.id, card = L.cardOf(built);
    var why = '';
    var looks = (L.DECK_TYPES.filter(function (x) { return x.id === t.id; })[0] || {}).looks;
    if (built === t.id && t.source === 'inferred') why = 'Read as ' + looks + (t.quote ? ' because: "' + t.quote + '"' + (/[.!?]$/.test(t.quote) ? '' : '.') : ' from what you gave.');
    else if (built === t.id && t.source === 'default') why = 'Nothing picked, so the default.';
    return '<span class="tchip" data-type-chip>Deck type <span class="chip">' + esc(card ? card.label : built) + '</span>' +
      '<button type="button" class="lnk" data-dchange="1">Change</button></span>' + (why ? '<span data-type-why>' + esc(why) + '</span>' : '');
  }

  /** The built_from the engine recorded on the deck, else what Start would compute from the document. */
  function builtOf(s) {
    var m = s.deck && s.deck.meta && s.deck.meta.built_from;
    return m && m.tier ? m : L.builtFrom(s.inputs, s.upstream, L.documentsOf(s.raw), L.deckTypeOf(s.raw).source !== 'default' ? L.deckTypeOf(s.raw).id : null);
  }

  // ── 2 · Build, with gates ─────────────────────────────────────────────
  // A gate is drawn from the registry (L.gateView): its head, the Deck agent's note, its body (the storyline's beats,
  // gate 2's territories, gate 3's idea) and its actions. An open gate is the agent asking: its sphere rises and the gate
  // card shows under it, on one screen (askStage).
  function gateHead(gv) {
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span class="pill warn">Needs you</span><span class="eyebrow">Gate ' + esc(gv.n) + ' of ' + esc(gv.of) + '</span></div>' +
      '<h1 class="sm" style="margin-bottom:6px">' + esc(gv.title) + '</h1>' +
      '<p class="note" style="font-size:15px;max-width:600px;margin-bottom:20px">' + esc(gv.lede) + '</p>';
  }

  /** The Deck agent's note at the top of the gate card, beside its sphere (it directs the run). Notes written for gates 2 and 3 are marked as proposed. */
  function dexRow(gv) {
    return '<div class="dex">' + L.circleSvg({ agent: 'deck', activity: 'waiting', size: 32, aria: 'hidden' }) + '<span class="mono" style="font-size:12px">Deck agent</span><span class="note">' + esc(gv.dex) + '</span>' +
      (gv.dex_proposed && gv.dex ? '<span class="pill plain dexp" title="The Deck agent\'s note here is our proposed wording, not yet agreed">Proposed</span>' : '') + '</div>';
  }

  var BASES = { brief: ['From brief', 'ok'], research: ['From research', 'ok'], proposal: ['Our proposal', 'warn'], placeholder: ['Placeholder', 'warn'] };

  function gateBody(gv, gate) {
    if (gv.body === 'beats') {
      return (Array.isArray(gate.beats) ? gate.beats : []).filter(L.isObj).map(function (b) {
        var c = L.own(BASES, b.basis) ? BASES[b.basis] : BASES.brief;
        return '<div class="beat"><span class="n">' + esc(b.n) + '</span><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;line-height:1.35">' + esc(b.title) + '</div><div class="mono eyebrow" style="margin-top:3px;text-transform:none;letter-spacing:0">' + esc(b.src) + '</div></div><span class="pill ' + c[1] + '">' + c[0] + '</span></div>';
      }).join('') +
        (gate.more_beats ? '<div style="padding:11px 20px;font-size:13px;color:var(--ink3)">+ ' + esc(gate.more_beats) + ' more beats, then the appendix</div>' : '');
    }
    if (gv.body === 'territories') {
      // Each territory is a button: pressing it picks it (view state only); Pick this territory writes the pick.
      return '<div role="group" aria-label="Territories">' + gv.territories.map(function (t) {
        var on = t.id === gv.picked;
        return '<button class="beat terr" data-territory="' + esc(t.id) + '" aria-pressed="' + on + '"><span class="n">' + esc(t.n) + '</span><span class="tb">' +
          '<span class="tn"><span>' + esc(t.name) + '</span>' + (t.id === gv.first_pick ? '<span class="pill ok">Blind judge’s first pick</span>' : '') + '</span>' +
          (t.thought ? '<span class="tt">' + esc(t.thought) + '</span>' : '') + (t.why ? '<span class="tw"><b>Why it fits:</b> ' + esc(t.why) + '</span>' : '') +
          '</span><span class="sel" aria-hidden="true"></span></button>';
      }).join('') + '</div>';
    }
    if (gv.body === 'idea' && gv.idea) {
      var x = gv.idea;
      return '<div class="beat iline"><div style="flex:1;min-width:0"><div class="eyebrow" style="margin-bottom:6px">The idea line</div><div class="il">' + esc(x.line) + '</div></div>' +
          (x.basis ? '<span class="pill ' + x.basis_tone + '">' + esc(x.basis) + '</span>' : '') + '</div>' +
        x.executions.map(function (e) {
          return '<div class="beat"><span class="n">' + esc(e.n) + '</span><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;line-height:1.35">' + esc(e.channel) + '</div>' +
            (e.summary ? '<div class="ex">' + esc(e.summary) + '</div>' : '') + '</div>' + (e.tag ? '<span class="pill ' + e.tone + '">' + esc(e.tag) + '</span>' : '') + '</div>';
        }).join('') +
        (x.rests_on.length ? '<div class="rests"><div class="eyebrow">What the idea rests on</div><div class="chips">' + x.rests_on.map(function (r) {
          return '<span class="chip ' + r.tone + '">' + esc(r.label) + '</span>';
        }).join('') + '</div></div>' : '');
    }
    return '<div class="crow pending"><span class="note">Nothing to show for this gate yet.</span></div>';
  }

  /** Approve (or Pick), Edit and Ask the Deck agent. Edit and Ask record a request; once one waits, the gate says so. */
  function gateActions(gv) {
    var none = gv.body === 'territories' && !gv.picked;
    var asked = gv.asked.length ? '<p class="note asked" role="status" data-asked>You asked ' + (gv.asked.indexOf('edit') >= 0 && gv.asked.indexOf('retry') >= 0 ? 'for an edit and a new try'
      : gv.asked.indexOf('edit') >= 0 ? 'for an edit' : 'the Deck agent to try again') + '. Queued: it applies the next time the deck is built. Nothing has changed yet.</p>' : '';
    return '<div class="gacts" style="margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><button class="btn go big" id="approve"' + (none ? ' disabled' : '') + '>' + esc(gv.approve) + '</button>' +
      '<button class="btn big" style="padding:0 20px;font-size:14px" data-edit="' + esc(gv.edit_key) + '">' + esc(gv.edit_label) + '</button><button class="btn big" style="padding:0 20px;font-size:14px" data-retry="' + esc(gv.id) + '">Ask the Deck agent to try again</button></div>' +
      (gv.body === 'beats' ? '' : '<p class="note" style="margin-top:12px;font-size:13px">' + (none ? 'Pick a territory first. ' : '') + 'Every approve, edit or retry is recorded with who did it.</p>') + asked;
  }

  function build(s) {
    var run = s.run, gate = run.gate, who = L.agentState(run); // the circle: who is working and what they are doing
    var stages = run.stages.map(function (st) {
      var glyph = st.status === 'done' ? '✓' : st.status === 'now' ? '•' : st.status === 'failed' ? '!' : '';
      return '<div class="stage ' + st.status + '"><span class="ring ' + st.status + '" aria-hidden="true">' + glyph + '</span><div><b>' + esc(st.name) + '</b><span class="s">' + esc(st.sub) + '</span></div></div>';
    }).join('');
    var main, gv = gate ? L.gateView(run, view.pick) : null; // the gate registry: words and body for the open gate
    // An open gate: the agent asks. Its sphere rises and shrinks, and the gate card shows under it.
    if (gate) main = askStage(who, true, gateHead(gv) + '<div class="card gcard" style="overflow:hidden">' + dexRow(gv) + '<div class="gbody">' + gateBody(gv, gate) + '</div></div>' + gateActions(gv));
    // With no gate open: running (a live feed), failed, done, or waiting for an engine that is not connected.
    var rv = gate ? null : L.runView(run, s.deck), live = rv && rv.kind !== 'waiting';
    if (rv && !live) {
      main = askStage(who, false, '<h1 class="sm" style="margin-bottom:6px">' + (rv.title ? esc(rv.title) : 'Waiting') + '</h1>' +
        '<p class="note" style="font-size:15px;max-width:600px">' + (rv.title ? 'Next in line. This step is waiting for the engine, which is not connected to this document yet.' : 'Nothing is running.') + '</p>' +
        waitingCard());
    } else if (live) main = runBody(rv);
    // A gate's own checks when it wrote them (even none), else what the run has checked.
    var gateChecks = !!gate && Array.isArray(gate.checks), list = gateChecks ? gate.checks : run.checks;
    var checks = Array.isArray(list) && (gateChecks || list.length) ? checkedCard(list) : '';
    return '<main class="build"><aside class="frost" style="padding:20px"><div class="eyebrow" style="margin-bottom:14px">How the deck gets built</div>' + stages + '</aside>' +
      '<section>' + main + '</section><aside class="stack">' + (live ? statusCard(who) :
      (gate ? '<div class="card" style="padding:20px"><div style="display:flex;align-items:center;gap:12px">' +
        '<div><div style="font-size:14px;font-weight:600">Waiting for you</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + esc(gv.hold) + '</div></div></div><div class="rule"></div>' +
        '<p class="note">' + esc(gv.next) + '</p></div>' : '')) +
      (live ? checks + builtLine(builtOf(s)) : builtLine(builtOf(s)) + checks) + '<div class="note" style="background:var(--soft);border-radius:18px;padding:16px 20px">Things you must supply, like the presenter or the budget split, show as labelled placeholders. They are never made up.</div></aside></main>';
  }

  /** Checked so far: what the run has checked (a gate's checks, or run.checks), each passed or to look at. */
  function checkedCard(list) {
    return '<div class="card" style="padding:20px"><div class="eyebrow" style="margin-bottom:12px">Checked so far</div><div class="stack" style="gap:10px">' +
      list.filter(function (c) { return c && typeof c === 'object'; }).map(function (c) { return '<div class="check"><span class="tick ' + (c.ok ? 'ok' : 'warn') + '" aria-hidden="true">' + (c.ok ? '✓' : '!') + '</span><span>' + esc(c.text) + '</span></div>'; }).join('') + '</div></div>';
  }

  var HINT = 'Press the circle to ask what is happening.';

  /**
   * The circle in a status card. At 60px it is just the circle (the card says the name and the word, so it is hidden from
   * screen readers). Enlarged (circleSizeFor) it is a real button that says the agent and the state once, and pressing it
   * (data-orb) shows a few honest lines under it.
   */
  function orbHtml(who, name) {
    var size = L.circleSizeFor(who), svg = L.circleSvg({ agent: who.agent, to: who.to, activity: who.activity, word: who.word, size: size, aria: 'hidden', progress: stepsDone(who) });
    if (size === 60) return '<span class="slot">' + svg + '</span>';
    return '<span class="slot big"><button type="button" class="orbb" data-orb aria-label="' + esc(name + ', ' + who.word + '. Press to ask what is happening.') + '">' + svg + '</button></span>';
  }
  function nameOf(who) {
    var A = L.AGENTS, a = A[who.agent], b = who.handoff ? A[who.to] : null;
    return { name: a ? a.name + (b ? ' → ' + b.name : '') : 'Agent', role: a ? a.role + (b ? ' → ' + b.role : '') : '' };
  }
  /** The steps finished, 0 to 1, when the feed says which step it is on; otherwise none (the sphere makes up nothing). */
  function stepsDone(who) { return who.step_index && who.step_total ? (who.step_index - 1) / who.step_total : undefined; }

  // ── the run's stage: the agent's sphere, centred, and under it what it asks (an open gate) or why it waits ──
  // The page is drawn again on every change, so the stage is drawn as it was at the last render and render() eases it
  // to what it is now (NapkinRoles.ask toggles nk-asking): the sphere rises and shrinks when a gate opens and comes back
  // down once it is approved. A render that changes nothing replays nothing.
  var askedLast = null, askWant = null; // nk-asking at the last render (null: no stage drawn) and now
  function askStage(who, asking, inner) {
    var n = nameOf(who), px = L.circleCentreSize(window.innerWidth, window.innerHeight);
    var on = askedLast === null ? asking : askedLast, change = askedLast !== null && askedLast !== asking;
    askWant = asking;
    return '<div class="dkstage' + (on ? ' nk-asking' : '') + '" data-nk-stage style="--dk-sph:' + px + 'px">' +
      '<div class="aglbox"><button type="button" class="orbb" data-orb aria-label="' + esc(n.name + ', ' + who.word + '. Press to ask what is happening.') + '">' +
      L.circleSvg({ agent: who.agent, to: who.to, activity: who.activity, word: who.word, size: 'fill', aria: 'hidden', progress: stepsDone(who) }) + '</button></div>' +
      '<p class="say" data-say aria-live="polite">' + HINT + '</p><div class="dkask' + (change ? ' enter' : '') + '">' + inner + '</div></div>';
  }
  function sayHtml(who) { return L.circleSizeFor(who) === 60 ? '' : '<p class="say" data-say aria-live="polite">' + HINT + '</p>'; }

  /** The status card while an agent works: the circle (60px, or enlarged in place while it works), who (a hand-off names both), their role, the state word, the step. */
  function statusCard(who) {
    var n = nameOf(who), name = n.name, role = n.role, big = L.circleSizeFor(who) !== 60;
    var tone = who.activity === 'complete' ? ' ok' : who.activity === 'error' ? ' err' : '';
    return '<div class="card status' + (big ? ' hero' : '') + '" style="padding:20px" data-status="' + esc(who.activity) + '"><div class="srow">' + orbHtml(who, name) +
      '<div class="stext"><div style="font-size:14px;font-weight:600">' + esc(name) + '</div>' + (role ? '<div class="note">' + esc(role) + '</div>' : '') +
      '<div class="sword' + tone + '">' + esc(who.word) + '</div>' +
      (who.step_index ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">Step ' + who.step_index + ' of ' + who.step_total + '</div>' : '') +
      '</div></div>' + sayHtml(who) + '</div>';
  }

  /** Under the stage's sphere while the engine is not connected: a short honest prompt, no time and no progress. */
  function waitingCard() {
    return '<div class="card wait" style="padding:20px;margin-top:16px"><div style="font-size:16px;font-weight:700">Waiting for the engine</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">Not connected to this document yet</div>' +
      '<div class="rule"></div><p class="note">Once the engine is connected it runs to the next gate and stops there.</p></div>';
  }

  /** One mark for a content-box row: done, now (a small turning arc), still to come, failed, or to supply. */
  function rowMark(st) {
    if (st === 'now') return '<span class="mk now" aria-hidden="true"><svg width="20" height="20" viewBox="-1.2 -1.2 2.4 2.4"><circle r="1" fill="none" class="mk-track"/><path d="' + L.arcPath(0, 0, 1, -Math.PI / 2, 2.2) + '" fill="none" class="mk-arc"/></svg></span>';
    return '<span class="mk ' + st + '" aria-hidden="true">' + (st === 'done' ? '✓' : st === 'failed' || st === 'supply' ? '!' : '') + '</span>';
  }
  var PILL_TONE = { done: 'ok', now: 'warn', pending: 'wait', failed: 'fail', supply: 'warn' };

  /** The running, failed and done views: title, the line under it, the content box of what is being done, then the action. */
  function runBody(v) {
    var rows = v.grid
      ? '<div class="cgrid">' + v.items.map(function (x) {
          return '<div class="cslide ' + x.status + '"><div style="display:flex;align-items:center;gap:8px"><span class="mono" style="font-size:12px;color:var(--ink3)">' + esc(x.n) + '</span><div class="spacer"></div>' +
            '<span class="pill ' + PILL_TONE[x.status] + '">' + esc(x.pill) + '</span></div><div class="t">' + esc(x.title) + '</div></div>';
        }).join('') + '</div>'
      : v.items.map(function (x) {
          return '<div class="crow ' + x.status + '">' + rowMark(x.status) + '<div style="flex:1;min-width:0"><div class="t">' + (x.n ? '<span class="mono n">' + esc(x.n) + '</span>' : '') + esc(x.title) + '</div>' +
            (x.sub ? '<div class="mono eyebrow" style="margin-top:3px;text-transform:none;letter-spacing:0">' + esc(x.sub) + '</div>' : '') + '</div><span class="pill ' + PILL_TONE[x.status] + '">' + esc(x.pill) + '</span></div>';
        }).join('');
    var tail = v.tail.map(function (t) { return '<div class="ctail">' + esc(t) + '</div>'; }).join('');
    var act = v.kind === 'done' ? '<div style="margin-top:18px"><button class="btn go big" data-go="review">Open the deck</button></div>'
      : v.kind === 'failed' ? '<div style="margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><button class="btn big' + (v.retryable ? '' : ' go') + '" style="padding:0 20px;font-size:14px" data-retry="' + esc(v.stage) + '">' + (v.retryable ? 'Try again now' : 'Try again') + '</button>' +
        '<span class="note">Nothing you approved is lost. The run starts again from this step.</span></div>' : '';
    return '<h1 class="sm" style="margin-bottom:6px">' + esc(v.title) + '</h1>' +
      '<p class="note" style="font-size:15px;max-width:600px;margin-bottom:20px">' + esc(v.lede) + '</p>' +
      '<div class="card cbox' + (v.kind === 'failed' ? ' failed' : '') + '" data-run="' + esc(v.kind) + '"><div class="cbox-h eyebrow">' + esc(v.head) + '</div>' + (rows || '<div class="crow pending"><span class="note">Nothing to show yet.</span></div>') + tail + '</div>' + act;
  }

  // ── the deck's own status, on Review and Present (phase 4): the Approval agent asks for sign-off ──
  /** The circle and its word, inline: in the Review head beside Approve the deck, and in the Export card's head. The word is beside it, so the circle says only the name. */
  function deckStat(ds) {
    var ok = ds.state === 'approved';
    return '<span class="dstat" data-deck="' + ds.state + '">' + L.circleSvg({ agent: ds.agent, activity: ds.activity, word: ds.word, size: 32, aria: 'name' }) +
      '<span class="dword' + (ok ? ' ok' : '') + '">' + esc(ds.word) + '</span></span>';
  }

  /** The status card: the 60px circle, Approval and its role, the word, then the step or who approved. The card says the name and word, so the circle is hidden from screen readers. */
  function deckCard(ds) {
    var ok = ds.state === 'approved';
    var foot = ok && ds.by ? 'Approved by ' + ds.by : ds.step_index ? 'Step ' + ds.step_index + ' of ' + ds.step_total : '';
    return '<div class="card status" style="padding:16px" data-status="' + ds.activity + '" data-deck="' + ds.state + '"><div style="display:flex;align-items:center;gap:14px">' +
      L.circleSvg({ agent: ds.agent, activity: ds.activity, word: ds.word, size: 60, aria: 'hidden' }) +
      '<div style="min-width:0"><div style="font-size:14px;font-weight:600">' + esc(ds.name) + '</div><div class="note">' + esc(ds.role) + '</div>' +
      '<div class="sword' + (ok ? ' ok' : '') + '">' + esc(ds.word) + '</div>' +
      (foot ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">' + esc(foot) + '</div>' : '') + '</div></div></div>';
  }

  /** The status card, then Checked so far when the run wrote it. */
  function deckSide(s, ds) {
    return deckCard(ds) + (Array.isArray(s.run.checks) && s.run.checks.length ? checkedCard(s.run.checks) : '');
  }

  /** What is still open when the deck is approved now. Approving is allowed; this says what stays marked. Empty when nothing is open. */
  function approveNote(ds) {
    if (ds.state !== 'open' || ds.clear) return '';
    var parts = [];
    if (ds.to_supply) parts.push(ds.to_supply + ' to supply');
    if (ds.open) parts.push((ds.total - ds.open) + ' of ' + ds.total + ' to confirm verified');
    return '<p class="note" data-approve-note style="margin:0 0 12px">Still open: ' + esc(parts.join(', ')) + '. You can approve the deck now; what is open stays marked on its slide.</p>';
  }

  // ── 3 · Review ────────────────────────────────────────────────────────
  function slideHtml(id, s, n, total, big) {
    var sl = s.deck.slides[id];
    var items = (sl.blocks || []).map(function (b) {
      if (L.isPlaceholder(b)) return '<li><span class="dot"></span><span class="ph"><i>To supply</i>' + esc(b.text) + '</span></li>';
      var refs = (b.refs || []).map(esc).join(', ');
      return '<li><span class="dot"></span><span>' + esc(b.text) + (refs ? '<sup>' + refs + '</sup>' : '') + '</span></li>';
    }).join('');

  }

  // ── the deck's pictures, read from the built deck.html (see DeckLogic.picturesFromHtml) ──
  var PICS = {}, PICS_KEY = null;
  function picsKey(s) {
    var a = s.raw && s.raw.deck && s.raw.deck.assets, p = s.raw && s.raw.production && s.raw.production.picks;
    return Object.keys(a || {}).sort().join(',') + '|' + (Array.isArray(p) ? p.map(function (x) { return x && x.key; }).join(',') : '') + '|' + ((s.run && s.run.state) || '');
  }
  /** Fetch the built deck.html once per built deck and keep its pictures; the preview and the picker draw them. Any failure leaves letters and text. */
  function loadPictures(s) {
    if (!mwOn() || !(window.clan && window.clan.apiProxy) || !L.presented(s.deck).length) return;
    var key = picsKey(s);
    if (key === PICS_KEY) return;
    PICS_KEY = key;
    try {
      fetchDeckFile('deck.html').then(function (f) {
        PICS = L.picturesFromHtml(new TextDecoder('utf-8').decode(f.bytes));
        if (Object.keys(PICS).length) render();
      }).catch(function () { /* the engine holds no deck.html yet: no pictures to draw */ });
    } catch (e) { /* no host */ }
  }
  function slidePics(id) {
    var m = PICS[id];
    return m ? Object.keys(m).map(function (k) { return '<img src="' + esc(m[k]) + '" alt="Picture on this slide" data-pic="' + esc(k) + '">'; }).join('') : '';
  }

  /** The changes asked for on a slide that wait for the next build, said plainly (UAT 2026-11-22: they were recorded and nothing showed). */
  function queuedChanges(s, slideId) {
    var q = (s.changes || []).filter(function (c) { return c && c.slide === slideId && c.status === 'waiting'; });
    if (!q.length) return '';
    return '<p class="note" role="status" data-queued style="margin-top:10px;font-size:13px;color:var(--warn-fg)">Queued for the next build: ' +
      q.map(function (c) { return esc(CHANGE_WORDS[c.change] || c.change); }).join(', ') + '.</p>';
  }

  function review(s) {
    var ids = L.presented(s.deck);
    if (!ids.length) return '<main class="review" style="display:block;max-width:640px"><h1 class="sm" style="margin-top:40px">No deck yet</h1><p class="lede" style="margin-top:8px">Build a deck first. Nothing to review until the engine has written one.</p>' + (LANDING_ERROR ? '<p class="lede" style="margin-top:8px"><strong>' + esc(LANDING_ERROR) + '</strong></p>' : '') + '</main>';
    // The appendix opens in the rail when the deck names its slides (appendix_ids, or slide.appendix); a count alone stays a count.

    if (!view.slide || (ids.indexOf(view.slide) < 0 && ax.ids.indexOf(view.slide) < 0)) view.slide = ids[Math.min(3, ids.length - 1)];
    var id = view.slide, sl = s.deck.slides[id], k = ax.ids.indexOf(id), inAx = k >= 0, n = inAx ? k + 1 : ids.indexOf(id) + 1;
    if (inAx) view.appendix = true;
    var st = L.STATUS[L.statusOf(sl)];
    var agency = L.agencyShown({ prompt: { agency: s.deck.meta && s.deck.meta.agency } });
    // A pitch slide goes by its section; every appendix slide shares the section Appendix, so it goes by its title.
    var thumb = function (sid, label, name) {
      var x = s.deck.slides[sid], t = L.STATUS[L.statusOf(x)];
      return '<button class="thumb" data-slide="' + sid + '"' + (sid === id ? ' aria-current="true"' : '') + '><span class="n">' + label + '</span>' +
        '<span><span class="t">' + esc(name) + '</span><span class="st ' + t.tone + '">' + t.label + '</span></span></button>';
    };

      (ax.selectable && view.appendix ? '<div class="eyebrow rail-div">Appendix</div>' + ax.ids.map(function (sid, i) {
        var x = s.deck.slides[sid];

      }).join('') : '');
    var axHead = ax.selectable
      ? '<button class="appx" data-appendix="' + (view.appendix ? 'hide' : 'show') + '" aria-expanded="' + !!view.appendix + '" aria-label="' + (view.appendix ? 'Hide' : 'Show') + ' the ' + ax.count + ' appendix slides">+ ' + ax.count + ' appendix</button>'
      : '<span class="mono eyebrow" style="text-transform:none;letter-spacing:0">+ ' + esc(ax.count) + ' appendix</span>';
    var nav = '<nav class="frost rail" aria-label="Slides"><div style="display:flex;align-items:center;margin-bottom:10px;padding:0 4px"><span class="eyebrow">' + esc(s.inputs.format === 'full' ? 'Full' : 'Pitch') + ' · ' + ids.length + '</span><div class="spacer"></div>' + axHead + '</div>' + rail + '</nav>';
    // Once the deck is finished, the Approval agent holds it: its circle in the head with Approve the deck, its card under the rail.
    var approve = ds ? deckStat(ds) + (ds.state === 'open' ? '<button class="btn go tall" id="approve-deck" data-approve="deck">Approve the deck</button>' : '') : '';

      panel = ev.length ? ev.map(function (e) { return '<div class="ev"><div class="id">' + esc(e.ref) + ' · ' + esc(e.kind) + '</div><div style="font-size:13px;line-height:1.45">' + esc(e.text) + '</div></div>'; }).join('')
        : '<p class="note">This slide cites nothing: its lines are labelled creative, opinion or proposal.</p>';
    } else if (view.tab === 'checks') {

        return '<div class="check" style="align-items:flex-start"><span class="tick ' + (c.ok ? 'ok' : 'warn') + '" aria-hidden="true">' + (c.ok ? '✓' : '!') + '</span><span style="font-size:13px;line-height:1.45">' + esc(c.text) + '</span></div>';
      }).join('') + '</div>';
    } else {
      var ap = s.run.approvals || {}, keys = Object.keys(ap);
      panel = '<p class="note" style="margin-bottom:10px">What a person did to this deck, from its record.</p>' +
        (keys.length ? keys.map(function (k) { return '<div class="check" style="margin-bottom:8px"><span class="tick ok" aria-hidden="true">✓</span><span style="font-size:13px">' + esc(ap[k].by) + ' approved the ' + esc(k) + '</span></div>'; }).join('') : '<p class="note">No gate has been approved in this document yet.</p>') +
        '<div class="mono eyebrow" style="margin-top:10px;text-transform:none;letter-spacing:0">Answers ' + (sl.requirements && sl.requirements.length ? esc(sl.requirements.join(', ')) : 'no requirement') + '</div>';
    }

    return '<main class="review">' + (ds ? '<div class="lcol">' + nav + deckSide(s, ds) + '</div>' : nav) +
      '<section><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><span class="mono" style="font-size:12px;color:var(--ink3)">' + (inAx ? 'Appendix ' : 'Slide ') + String(n).padStart(2, '0') + '</span><span class="pill ' + st.tone + '">' + st.label + '</span><div class="spacer"></div>' +
        (inAx ? '' : '<button class="btn sm" data-act="appendix">Move to appendix</button>') + '<button class="btn sm" data-tab="evidence">Why this slide</button>' + approve + '</div>' +
      (ds ? approveNote(ds) : '') + (upChanged.length ? '<div style="margin-bottom:12px">' + changedNote() + '</div>' : '') +
      '<div style="margin-bottom:12px">' + builtLine(builtOf(s), null, typeChip(s)) + '</div>' +
      '<div class="slide"><div class="kick">' + esc(sl.section) + '</div><h2>' + esc(sl.title) + '</h2><ul>' + s1.items + '</ul>' + (s1.pics ? '<div class="pimgs" data-pics>' + s1.pics + '</div>' : '') +
        '<div class="foot"><span>' + esc(agency) + ' · ' + esc(s.deck.meta && s.deck.meta.client) + '</span><div class="spacer"></div><span>' + (inAx ? 'A' + n : String(n).padStart(2, '0')) + '</span></div></div>' +
      '<div class="card" style="margin-top:14px;padding:14px 18px;border-radius:16px;box-shadow:none"><div class="eyebrow" style="margin-bottom:6px">Speaker notes</div><div style="font-size:14px;line-height:1.5;color:var(--ink2)">' + esc(sl.notes || 'No notes for this slide.') + '</div></div></section>' +
      '<aside class="side"><div class="frost" style="padding:16px"><div class="tabs" role="tablist">' + tabs + '</div>' + panel + '</div>' + supplyPanel(s) + confirmPanel(s) + prodPanel(s, id) +
      '<div class="card" style="padding:16px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">Ask for a change</div><div style="display:flex;gap:8px;flex-wrap:wrap">' +
        [['shorter', 'Shorter'], ['add_figure', 'Add the figure'], ['rephrase', 'Say it another way']].map(function (c) { return '<button class="btn sm" data-change="' + c[0] + '">' + c[1] + '</button>'; }).join('') +
      '</div>' + queuedChanges(s, id) + '<p class="note" style="margin-top:10px;font-size:12px;color:var(--ink3)">These apply the next time the deck is built, and only to the words on this slide. Its sources stay.</p></div></aside></main>';
  }

  // ── 4 · Present and export ────────────────────────────────────────────
  function presentScreen(s) {
    var ids = L.presented(s.deck);
    if (!ids.length) return '<main class="review" style="display:block;max-width:640px"><h1 class="sm" style="margin-top:40px">Nothing to present yet</h1></main>';
    var i = Math.max(0, Math.min(view.present, ids.length - 1)), sl = s.deck.slides[ids[i]], nx = s.deck.slides[ids[i + 1]];
    var agency = L.agencyShown({ prompt: { agency: s.deck.meta && s.deck.meta.agency } });
    var supply = L.toSupply(s.raw).ids.length, counts = L.sourcedCounts(s.raw);
    var refs = L.refsOf(sl).map(function (r) { return '<span class="mono" style="font-size:11px;color:var(--tool-ink);background:var(--tool-soft);border-radius:999px;padding:4px 10px">' + esc(r) + '</span>'; }).join('');
    var ds = L.deckApproval(s.raw), rep = L.reportLine(s.raw), ax = L.appendixOf(s.deck);
    var head = ds ? deckStat(ds) : '<span class="chip ' + ((s.validation.errors || 0) ? 'warn' : 'ok') + '">' + ((s.validation.errors || 0) ? 'Has errors' : 'Checked') + '</span>';
    var unapproved = ds && ds.state === 'open' ? '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 14px" data-approve-hint><span class="note" style="flex:1;min-width:160px">The deck is not approved yet.</span><button class="btn tall" data-go="review">Approve it on Review</button></div>' : '';
    return '<main class="present"><section><div class="pslide"><div class="kick">' + esc(sl.section) + '</div><h2>' + esc(sl.title) + '</h2>' +
      '<div class="foot"><span>' + esc(agency) + ' · ' + esc(s.deck.meta && s.deck.meta.client) + '</span><div class="spacer"></div><span>' + (i + 1) + ' / ' + ids.length + '</span></div></div>' +
      '<div class="controls"><button class="circ" aria-label="Previous slide" data-pres="-1"' + (i === 0 ? ' disabled' : '') + '>←</button><button class="circ" style="background:var(--ink);color:var(--paper);border:0" aria-label="Next slide" data-pres="1"' + (i === ids.length - 1 ? ' disabled' : '') + '>→</button>' +
      '<span class="mono" style="font-size:13px;padding:0 10px">' + (i + 1) + ' / ' + ids.length + '</span><div class="prog"><span style="width:' + Math.round(((i + 1) / ids.length) * 100) + '%"></span></div></div>' +
      '<div class="card" style="margin-top:14px;padding:18px 22px"><div class="eyebrow" style="margin-bottom:8px">Notes for this slide</div><div style="font-size:18px;line-height:1.5">' + esc(sl.notes || 'No notes for this slide.') + '</div>' +
      (refs ? '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' + refs + '</div>' : '') + '</div></section>' +
      '<aside class="stack"><div class="eyebrow">Next</div>' + (nx ? '<div class="mini"><div class="k">' + esc(nx.section) + '</div><div class="t">' + esc(nx.title) + '</div></div>' : '<div class="note">That is the last presented slide.</div>') +
      '<div class="eyebrow" style="margin-top:6px">Appendix</div><div class="note" style="background:var(--soft);border-radius:12px;padding:12px">' + esc(ax.count) + ' backup slides are hidden. They keep their sources.</div>' +
      (ds ? deckSide(s, ds) : '') + '</aside>' +
      '<aside class="stack">' + confirmPanel(s) + '<div class="frost" style="padding:22px"><div style="display:flex;align-items:center;gap:10px"><span style="font-weight:700;font-size:18px;letter-spacing:-.02em">Export</span><div class="spacer"></div>' + head + '</div>' +
      '<p class="note" style="margin:4px 0 16px">Same deck, three ways, plus a PDF. A file shows here once the engine has written it.</p>' + unapproved +
      L.exportRows(s.exports, { hostPdf: true }).map(function (r) {
        return '<div class="fmt" data-fmt="' + r.key + '"><span class="x" aria-hidden="true">' + r.x + '</span><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">' + r.name + '</div><div class="note" style="font-size:12px;overflow-wrap:anywhere">' + esc(r.note) + '</div></div>' +
          '<button class="btn sm" data-export="' + r.key + '"' + (r.ready ? '' : ' disabled') + ' style="font-weight:600"' + (r.file ? ' aria-label="' + esc(r.action + ' ' + r.file) + '"' : '') + '>' + r.action + '</button></div>';
      }).join('') +
      '<p class="note rep" data-report><span class="mono eyebrow">Report</span>' + esc(rep.line) + '</p>' +
      (supply ? '<div class="callout" data-to-supply>' + supply + (supply > 1 ? ' slides still hold' : ' slide still holds') + ' placeholders. They export as marked text.</div>' : '') +
      (counts.total || counts.supplied ? '<p class="note" style="margin-top:10px;font-size:12px" data-sourced>' + counts.verified + ' of ' + counts.total + ' to confirm verified · ' + counts.supplied + ' supplied by you · ' + counts.sourced + ' counted as sourced</p>' : '') +
      '</div></aside></main>';
  }

  // ── render and events ─────────────────────────────────────────────────

  // ── the status circle, enlarged in place ──
  // Every state change draws the page again, so the card's size before it is remembered and the change is played from there: the
  // circle scales from where it was (it never travels), the card's height follows, the text fades in. 300 ms, ease-out. With
  // reduced motion there is no size animation: the new size is instant, with a cross-fade.
  var GROW_MS = 300, GROW_EASE = 'cubic-bezier(.2,.8,.2,1)', pressed = { at: [], i: -1 };
  function reducedMotion() { try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; } }
  function statusEls() {
    var app = document.getElementById('app');
    if (!app || typeof app.querySelector !== 'function') return null;
    var card = app.querySelector('main.build .card.status'), circle = card && card.querySelector('.nk-ag');
    if (!circle) return null;
    return { card: card, circle: circle, size: +circle.getAttribute('data-nk-size') || 0 };
  }
  function cardBefore() {
    try {
      var e = statusEls(); if (!e) return null;
      var r = e.circle.getBoundingClientRect();
      return { size: e.size, h: e.card.offsetHeight, x: r.left, y: r.top, w: r.width };
    } catch (x) { return null; }
  }
  function growCard(b) {
    try {
      var e = statusEls();
      if (!b || !e || !b.size || !e.size || b.size === e.size || typeof e.card.animate !== 'function') return;
      pressed = { at: [], i: -1 };
      var text = e.card.querySelector('.stext');
      if (reducedMotion()) { // instant size, cross-fade
        e.card.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
        return;
      }
      var r = e.circle.getBoundingClientRect(), h1 = e.card.offsetHeight, k = r.width ? b.w / r.width : 1;
      e.card.style.overflow = 'hidden';
      var anim = e.card.animate([{ height: b.h + 'px' }, { height: h1 + 'px' }], { duration: GROW_MS, easing: GROW_EASE });
      anim.onfinish = anim.oncancel = function () { e.card.style.overflow = ''; };
      e.circle.style.transformOrigin = '0 0';
      var c = e.circle.animate([{ transform: 'translate(' + (b.x - r.left) + 'px,' + (b.y - r.top) + 'px) scale(' + k + ')' }, { transform: 'none' }], { duration: GROW_MS, easing: GROW_EASE });
      c.onfinish = c.oncancel = function () { e.circle.style.transformOrigin = ''; };
      if (text) text.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: 80, easing: 'ease-out', fill: 'backwards' });
    } catch (x) { /* no animation: the new size simply stands */ }
  }

  /** Pressing the enlarged circle: one honest line in turn (who it is, what it does, that it grows and shrinks); pressing too fast gets the shrug. */
  function pressOrb() {
    var app = document.getElementById('app');
    var host = app && typeof app.querySelector === 'function' ? app.querySelector('main.build [data-nk-stage]') || app.querySelector('main.build .card.status') : null;
    var circle = host && host.querySelector('.nk-ag');
    if (!circle) return;
    var who = L.agentState(d().run), lines = L.circleSays(who), now = Date.now();
    pressed.at = pressed.at.filter(function (t) { return now - t < 1100; }).concat(now);
    var say = host.querySelector('[data-say]');
    if (say) {
      if (pressed.at.length >= 4) { say.textContent = "Pressing faster won't start it sooner. Sorry."; pressed.at = []; }
      else { pressed.i = (pressed.i + 1) % lines.length; say.textContent = lines[pressed.i]; }
      say.classList.add('on');
    }
    if (reducedMotion() || typeof circle.animate !== 'function') return;
    circle.animate([{ transform: 'scale(1)' }, { transform: 'scale(.93)', offset: .25 }, { transform: 'scale(1.035)', offset: .65 }, { transform: 'scale(1)' }], { duration: 520, easing: 'ease-out' });
  }
  /** After a render: ease the stage to what it is now (drawn as it was), and remember it for the next render. */
  function askAgain(app) {
    var stage = askWant !== null && app && typeof app.querySelector === 'function' ? app.querySelector('[data-nk-stage]') : null;
    if (!stage) { askedLast = null; return; }
    if (askedLast !== null && askedLast !== askWant) void stage.offsetHeight; // the drawn state is laid out first, so the change eases
    if (Roles) Roles.ask(stage, askWant);
    askedLast = askWant;
  }
  function render() {
    var s = d(), scr = screenOf(s);
    var ae = document.activeElement, focusId = ae && ae.id && /^(qt_|ptext$|client$|project$|agency$)/.test(ae.id) ? ae.id : '';
    var selS = focusId ? ae.selectionStart : null, selE = focusId ? ae.selectionEnd : null;
    var focusSel = focusId ? '' : focusAgain(ae);
    stashDraft();
    var before = cardBefore();
    askWant = null;
    var body = scr === 'start' ? start(s) : scr === 'build' ? build(s) : scr === 'review' ? review(s) : presentScreen(s);
    var app = document.getElementById('app');
    app.innerHTML = bar(s, scr) + body;
    sendBar(s, scr);
    askAgain(app); // the stage's sphere rises to ask, or comes back down, only when that changed
    growCard(before); // the status card's circle grows or shrinks in place when the state changes its size
    document.title = 'Deck Maker';
    restoreDrafts(s);
    if (focusId) {
      var fe = document.getElementById(focusId);
      if (fe && fe.focus) {
        fe.focus();
        try { if (selS != null && fe.setSelectionRange) fe.setSelectionRange(selS, selE); } catch (e) { /* not a text field */ }
      }
    }
    if (focusSel && typeof document.querySelector === 'function') {
      // The control pressed is drawn again: keep the keyboard on it. Gone (the deck just approved): nothing to do.
      try { var fb = document.querySelector(focusSel); if (fb && fb.focus) fb.focus(); } catch (e) { /* a selector the page cannot read */ }
    }
    loadUpstream(s);
    if (scr === 'review') loadPictures(s);
  }

  /**
   * The selector that finds the focused control again after a re-render: a territory (by its id), the appendix
   * toggle (its value flips between show and hide) or Approve the deck. Empty for anything else.
   */
  function focusAgain(ae) {
    if (!ae || typeof ae.getAttribute !== 'function') return '';
    var cssEsc = function (v) { return typeof CSS !== 'undefined' && CSS && CSS.escape ? CSS.escape(v) : String(v).replace(/["\\]/g, '\\$&'); };
    if (ae.id === 'approve-deck') return '#approve-deck';
    var terr = ae.getAttribute('data-territory');
    if (terr != null) return '[data-territory="' + cssEsc(terr) + '"]';
    if (ae.getAttribute('data-appendix') != null) return '[data-appendix]';
    var dp = ae.getAttribute('data-dpick');
    if (dp != null) return '[data-dpick="' + cssEsc(dp) + '"]';
    var fm = ae.getAttribute('data-format');
    if (fm != null) return '[data-format="' + cssEsc(fm) + '"]';
    var zs = ae.getAttribute('data-size');
    if (zs != null) return '[data-size="' + cssEsc(zs) + '"]';

  window.addEventListener('clan:export', function (e) {
    var s = d();
    if (!L.exportRows(s.exports, { hostPdf: true })[0].ready) return;   // no deck built yet: the shell's own export
    e.preventDefault();
    exportDeck(e.detail && e.detail.kind === 'html' ? 'web' : 'pdf', s);
  });
  // ── end Export ──

  document.addEventListener('input', function () { stashDraft(); });

  // Attach files: the host stores each one as an asset; the list is written to inputs.documents.
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || el.id !== 'attach') return;
    var files = Array.prototype.slice.call(el.files || []);
    if (!files.length) return;
    if (!(window.clan && window.clan.uploadAsset && window.clan.patchData)) { toast('Attaching files needs the host.'); return; }
    var have = L.documentsOf(d().raw), added = [], failed = [];
    // Each file is tried on its own: one that fails does not drop the ones that went in.
    files.reduce(function (p, f) {
      return p.then(function () { return f.arrayBuffer(); }).then(function (buf) { return window.clan.uploadAsset(f.name, buf, 'human'); })
        .then(function (res) {
          if (res && (res.ok === false || res.error)) throw new Error('refused');
          added.push({ name: f.name });
        }).catch(function () { failed.push(f.name); });
    }, Promise.resolve()).then(function () {
      var done = added.length ? put({ inputs: { documents: have.map(function (x) { return { name: x.name, pages: x.pages }; }).concat(added) } }, 'attach documents', added.length + ' file(s)') : null;
      // Clear the input so choosing the failed files again does not re-upload the ones that went in.
      try { el.value = ''; } catch (e) { /* read-only in some hosts */ }
      if (failed.length) toast((added.length ? added.length + ' attached. ' : '') + 'Could not attach: ' + failed.join(', ') + '.');
      return done;
    }).catch(function () { toast('The attached files could not be saved.'); });
  });

  document.addEventListener('keydown', function (e) {
    if (screenOf(d()) !== 'present' || /INPUT|TEXTAREA/.test((e.target || {}).tagName || '')) return;
    if (e.key === 'ArrowRight') { view.present += 1; render(); }
    if (e.key === 'ArrowLeft') { view.present -= 1; render(); }
  });

  if (window.addEventListener) {
    // The bridge fires these when the document's data changes or loads, and sets data-color-scheme itself.
    window.addEventListener('clan:dataupdated', render);
    window.addEventListener('napkin:ready', render);
    // The centred circle follows the window's size.
    window.addEventListener('resize', function () {
      var app = document.getElementById('app');
      if (app && typeof app.querySelector === 'function' && app.querySelector('[data-nk-stage]')) render();
    });
    // The OS asks for the bar again on load, and says which tab was pressed. Only the frame's parent may.
    window.addEventListener('message', function (e) {
      var m = e.data;
      if (!inShell || e.source !== window.parent || !m) return;
      if (m.type === 'clan:bar?') { lastBar = null; var s = d(); sendBar(s, screenOf(s)); }
      else if (m.type === 'clan:bar-action' && STEPS.some(function (st) { return st[0] === m.id; })) { view.screen = m.id; render(); }
    });
  }
  // Every circle on the page is the one agent engine's sphere: live where the browser can draw it, its still frame where not.
  if (Roles) Roles.auto();
  render();
  checkMiddleware();
})();
</script>
