<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Territories</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- The two licensed faces only (owner default, features/territories.clan): Newsreader for what is read, Geist ExtraBold for what is pressed or labelled. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Geist:wght@800&display=swap" />
<style>
/* The studio's tokens (design/new-ui/napkin-app-v1.html; the same block Brief Maker carries), tinted by the agency's base
   (--ag-base, from clan:me). Territories' own identity is the teal (--te), the owner's demo. Documents stay on paper. */
:root{
  --ag-base:#515BFF; --ag-acc:#C8CBFF; --ag-base-ink:#FFFFFF; --ag-acc-ink:#141413;
  --ag-act:var(--ag-base); --ag-act-ink:var(--ag-base-ink);
  --desk:color-mix(in srgb,var(--ag-base) 6%,#F6F1E7); --paper:color-mix(in srgb,var(--ag-base) 2.5%,#FFFDF8);
  --paper-2:#F3ECDC; --card:#FFFFFF;
  --ink:#141413; --ink-soft:#2A2620; --muted:#6D655A; --faint:#9A9082;
  --line:color-mix(in srgb,var(--ag-base) 10%,#E2D9C8); --line-strong:#2A2620; --chip-line:#D4CCCD;
  --accent:var(--ag-base); --accent-soft:color-mix(in srgb,var(--ag-base) 9%,#FFFFFF);
  --ok:#1D8A4E; --ok-soft:#E6F6EC; --warn:#B45309; --warn-soft:#FEF3DC; --alert:#C9462A; --alert-soft:#FFF1EE;
  --te:#14947F; --te-ink:#FFFFFF;
  --ask-line:#F08A6E; --ask-glow:rgba(255,79,46,.08);
  --font-ui:"Geist",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --font-serif:"Newsreader",Georgia,"Iowan Old Style",serif;
  --shadow-paper:0 1px 0 rgba(255,255,255,.75) inset,0 8px 24px -8px rgba(50,38,18,.10),0 1px 3px rgba(50,38,18,.08);
  --shadow-card:0 1px 2px rgba(20,20,19,.06),0 4px 12px -4px rgba(20,20,19,.08);
  --booth-dur:460ms; --booth-ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-color-scheme="light"]){
    --ag-act:var(--ag-acc); --ag-act-ink:#141413;
    --desk:color-mix(in srgb,var(--ag-base) 12%,#121110); --paper:color-mix(in srgb,var(--ag-base) 9%,#1B1A18);
    --paper-2:#262320; --card:color-mix(in srgb,var(--ag-base) 7%,#201E1B);
    --ink:#EFE9DE; --ink-soft:#D6CEC0; --muted:#A49B8D; --faint:#7B7367;
    --line:color-mix(in srgb,var(--ag-base) 16%,#34302A); --line-strong:#CFC6B6; --chip-line:#4A443C;
    --accent-soft:color-mix(in srgb,var(--ag-base) 22%,#1B1A18);
    --ok:#5DBB83; --ok-soft:#1C2E23; --warn:#E09A4B; --warn-soft:#3A2A18; --alert:#F08A70; --alert-soft:#33201B;
    --te:#3CC9AE; --te-ink:#0E1A17; --ask-line:#C8664C; --ask-glow:rgba(255,79,46,.10); color-scheme:dark;
  }
}
:root[data-color-scheme="dark"]{
  --ag-act:var(--ag-acc); --ag-act-ink:#141413;
  --desk:color-mix(in srgb,var(--ag-base) 12%,#121110); --paper:color-mix(in srgb,var(--ag-base) 9%,#1B1A18);
  --paper-2:#262320; --card:color-mix(in srgb,var(--ag-base) 7%,#201E1B);
  --ink:#EFE9DE; --ink-soft:#D6CEC0; --muted:#A49B8D; --faint:#7B7367;
  --line:color-mix(in srgb,var(--ag-base) 16%,#34302A); --line-strong:#CFC6B6; --chip-line:#4A443C;
  --accent-soft:color-mix(in srgb,var(--ag-base) 22%,#1B1A18);
  --ok:#5DBB83; --ok-soft:#1C2E23; --warn:#E09A4B; --warn-soft:#3A2A18; --alert:#F08A70; --alert-soft:#33201B;
  --te:#3CC9AE; --te-ink:#0E1A17; --ask-line:#C8664C; --ask-glow:rgba(255,79,46,.10); color-scheme:dark;
}
/* An agency whose accent is a line, never a fill (Catapult): the primary stays the base in dark too. */
@media (prefers-color-scheme:dark){ :root[data-agency-accent="line"]:not([data-color-scheme="light"]){ --ag-act:var(--ag-base); --ag-act-ink:var(--ag-base-ink); } }
:root[data-agency-accent="line"][data-color-scheme="dark"]{ --ag-act:var(--ag-base); --ag-act-ink:var(--ag-base-ink); }

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.5 var(--font-serif);-webkit-font-smoothing:antialiased;padding-bottom:48px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.meta{font-size:13px;color:var(--muted)}
.muted{color:var(--muted);font-size:14px}
/* Geist ExtraBold is the label voice: small caps, tracked. Weight is always 800 (the one licensed weight). */
.lbl{font:800 10.5px/1.4 var(--font-ui);letter-spacing:.1em;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* app head */
.shell{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
.app-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;padding:32px 0 22px;border-bottom:1px solid var(--line);margin-bottom:24px}
@media (max-width:900px){.app-head{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font:800 11.5px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--te);flex:none}
.eyebrow>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-title{margin:0 0 8px;font:800 clamp(34px,4.2vw,50px)/.96 var(--font-ui);letter-spacing:-.04em}
.period-dot{display:inline-block;width:.17em;height:.17em;border-radius:50%;background:var(--te);margin-left:.04em}
.hero-sub{margin:0;font-size:16px;line-height:1.5;color:var(--ink-soft);max-width:62ch}
.flow-steps{list-style:none;display:flex;align-items:center;margin:0;padding:0;flex-wrap:wrap;row-gap:8px}
.flow-steps li{display:flex;align-items:center}
.flow-steps li+li::before{content:"";width:22px;height:1px;background:var(--line-strong);margin:0 4px 18px}
.flow-steps button{display:grid;justify-items:center;gap:6px;background:none;border:0;color:var(--muted);font:800 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;padding:0}
.flow-steps i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink-soft);font:800 12px var(--font-ui)}
.flow-steps button.done i{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.flow-steps button[aria-current="step"]{color:var(--ink)}
.flow-steps button[aria-current="step"] i{background:var(--te);border-color:var(--te);color:var(--te-ink)}
.flow-steps button:disabled{cursor:default;opacity:.75}

/* sheet + Booth column */
.split{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow-paper);min-width:0;overflow:hidden}
.sheet-head{padding:26px 32px 20px;border-bottom:4px solid var(--te)}
.sheet-eyebrow{font:800 11px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sheet-head h2{margin:0 0 6px;font:500 32px/1.1 var(--font-serif);letter-spacing:-.02em}
.sheet-head p{margin:0;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:6px 0;padding:13px 32px;border-bottom:1px solid var(--line);font:800 11.5px var(--font-ui);letter-spacing:.02em;color:var(--ink-soft)}
.stats>*{padding:0 12px;border-right:1px solid var(--line)}.stats>*:first-child{padding-left:0}.stats>*:last-child{border-right:0}
.sheet-body{padding:18px 32px 28px;display:flex;flex-direction:column;gap:14px}
@media (max-width:640px){.sheet-head,.stats,.sheet-body{padding-left:18px;padding-right:18px}}

/* the three sources: a brief (dog-eared sheet, manila tab), research (ink band, lens dots), what Territories found (teal band) */
.srcrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:10px}
.tsrc{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;text-align:left;min-width:0;padding:0}
button.tsrc:hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
.tsrc-band{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--card);padding:6px 14px;font:800 10.5px/1.5 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;border-radius:5px 5px 0 0}
.tsrc-band.te{background:var(--te);color:var(--te-ink)}
.tsrc-lens{display:inline-flex;gap:4px;margin-left:auto}.tsrc-lens i{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}.tsrc-lens i.f{background:currentColor}
.tsrc-brief{margin-top:20px;background:var(--paper)}
.tsrc-tab{position:absolute;top:-19px;left:14px;height:19px;display:inline-flex;align-items:center;padding:0 10px;background:#E7D5AC;border:1px solid #C4AA75;border-bottom:0;border-radius:4px 4px 0 0;font:800 10.5px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:#5A4A2A}
.tsrc-brief::after{content:"";position:absolute;top:-1px;right:-1px;width:16px;height:16px;background:linear-gradient(225deg,var(--desk) 50%,color-mix(in srgb,var(--ink) 14%,var(--paper)) 50%);border-bottom-left-radius:2px}
.tsrc-body{padding:10px 14px 12px;display:flex;flex-direction:column;gap:7px}
.tsrc-t{font:600 18px/1.25 var(--font-serif)}
.tsrc-row{display:flex;flex-wrap:wrap;gap:4px 12px;font:800 11px/1.5 var(--font-ui);color:var(--muted);letter-spacing:.02em}
.tsrc-q{font-family:var(--font-serif);font-size:17px;line-height:1.4;border-left:3px solid var(--line-strong);padding-left:12px}

/* insight cards */
.inslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ins{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s;min-width:0}
.ins.on{border-color:var(--te);box-shadow:0 0 0 1px var(--te)}
.ins input{width:18px;height:18px;margin-top:2px;accent-color:var(--te);flex:none}
.ins-b{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.ins .sbtext{font-size:17px}
.dcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font:800 10.5px/1.4 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sbtext{font-family:var(--font-serif);font-size:19px;line-height:1.3;letter-spacing:-.005em;overflow-wrap:anywhere}
.dots{display:inline-flex;gap:3px;flex:none}.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}.dots i.on{background:var(--ok);border-color:var(--ok)}.dots i.half{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);border-color:var(--warn)}
.ref{border:0;cursor:pointer;font:800 10.5px var(--font-ui);letter-spacing:.02em;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;white-space:nowrap}
.ref:hover{text-decoration:underline}
.ref.derived{color:var(--warn);background:var(--warn-soft)}
.ref.gone{color:var(--muted);background:var(--paper-2)}
.dmark{font:800 10px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 6px;white-space:nowrap}
.ymark{font:800 10px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--te);border:1px solid var(--te);border-radius:4px;padding:1px 6px;white-space:nowrap}

/* add your own */
.addsb{display:flex;flex-direction:column;gap:10px;border:2px solid var(--ink);border-radius:16px;padding:12px 14px;background:var(--paper)}
.addsb input{border:0;background:transparent;font-size:18px;color:var(--ink);padding:4px 2px;outline:0}
.addsb input::placeholder{color:var(--faint)}
.addsb:focus-within{border-color:var(--accent)}
.btn-rect{min-height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--line);background:var(--paper);font:800 13px var(--font-ui);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-rect:hover{border-color:var(--ink)}
.btn-rect.primary{background:var(--ag-act);color:var(--ag-act-ink);border-color:var(--ag-act-line,var(--ag-act))}
.btn-rect:disabled{opacity:.45}
.btn-pill{height:44px;padding:0 24px;border-radius:999px;font:800 15px var(--font-ui);border:1px solid var(--line);background:var(--paper)}
.btn-pill.primary{background:var(--ag-act);color:var(--ag-act-ink);border-color:var(--ag-act-line,var(--ag-act))}
.btn-pill:disabled{opacity:.45}
.linkbtn{background:none;border:0;padding:0;font:800 13px var(--font-ui);text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.runline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.runnote{font-size:14.5px;color:var(--ink-soft);max-width:60ch}
.runnote.bad{color:var(--alert)}

/* everything the crew may quote */
.evd{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--card)}
.evd summary{cursor:pointer;font:800 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.evlist{display:flex;flex-direction:column;margin-top:6px}
.evrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.4}
.evrow:last-child{border-bottom:0}
.evrow.off{opacity:.5}.evrow .grow{flex:1;min-width:0}
.tog{flex:none;width:34px;height:20px;border-radius:999px;border:1px solid var(--line-strong);background:var(--paper-2);position:relative;margin-top:1px;padding:0}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s}
.tog[aria-pressed="true"]{background:var(--te);border-color:var(--te)}.tog[aria-pressed="true"]::after{transform:translateX(14px);background:#fff}
.pill{font:800 10px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
.st-verified{background:var(--ok-soft);color:var(--ok)}.st-derived{background:var(--warn-soft);color:var(--warn)}.st-found{background:color-mix(in srgb,var(--te) 16%,transparent);color:var(--te)}.st-plain{background:var(--paper-2);color:var(--muted)}

/* The Booth: its own column; hiding closes it and the work recentres (features/booth.clan) */
.booth-col{--bw:400px;flex:none;position:relative;align-self:stretch;width:calc(var(--bw) + 24px);transition:width var(--booth-dur) var(--booth-ease);overflow-x:clip}
@media (max-width:1180px){.booth-col{--bw:340px}}
@media (max-width:900px){.booth-col{width:auto}.booth{margin-left:0!important;margin-top:24px}}
.booth-col.booth-off{width:0}
.booth{position:sticky;top:16px;margin-left:24px;width:var(--bw);max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0;
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-card);color:var(--ink);font-size:14.5px;
  transition:transform var(--booth-dur) var(--booth-ease),opacity .3s ease .06s,visibility 0s}
.booth-off .booth{opacity:0;visibility:hidden;pointer-events:none;transform:translateX(28px);transition:transform var(--booth-dur) var(--booth-ease),opacity .22s ease,visibility 0s linear var(--booth-dur)}
.booth-hd{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 18px;border-bottom:1px solid var(--line);flex:none;min-height:49px}
.booth-nm{font:800 10.5px var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.booth-sp{flex:1}
.booth-hide{height:30px;padding:0 10px 0 12px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font:800 12px var(--font-ui);background:var(--card)}
.booth-hide svg{width:14px;height:14px}
.booth-hide:hover{background:color-mix(in srgb,var(--te) 8%,var(--card));color:var(--ink);border-color:color-mix(in srgb,var(--te) 30%,var(--line))}
@media (max-width:1100px){.booth-hide,.booth-edge{display:none}}
.booth-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.booth-body>*{flex-shrink:0}
.bt-agent{display:flex;align-items:center;gap:12px}
.bt-agent .who{font:800 10.5px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.bt-agent .line{font-size:15px;color:var(--ink);line-height:1.4;margin-top:2px}
.bt-crew{display:flex;gap:6px;margin-left:auto;align-self:flex-start}
.bc{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 14px;display:grid;gap:9px;min-width:0}
.bc-hd{display:flex;align-items:center;gap:8px;min-width:0}
.bc-who{font:800 10.5px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.bc-t{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.bc-note{margin:0;font-size:15px;color:var(--ink);line-height:1.45}
.bt-box{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 10px 8px 12px;display:grid;gap:8px}
.bt-box textarea{border:0;outline:none;background:transparent;resize:none;width:100%;min-height:44px;font:inherit;font-size:15px;line-height:1.45;color:var(--ink);padding:0}
.bt-box textarea::placeholder{color:var(--faint)}
.bt-box textarea:disabled{opacity:.7}
.bt-hint{font-size:13.5px;color:var(--ink-soft);line-height:1.4}
.fq{border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
.fq .tsrc-band{padding:5px 12px}
.fq .tsrc-band.warn{background:var(--warn-soft);color:var(--warn)}
.fq .tsrc-body{padding:9px 12px 10px;gap:6px}
.fq .qt{font-family:var(--font-serif);font-size:16.5px;line-height:1.4;border-left:3px solid var(--te);padding-left:10px}
.fq.un .qt{border-color:var(--warn)}
.fq .meta{font:800 11px/1.5 var(--font-ui);color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.fq .meta a,.lqlink{color:var(--accent);text-decoration:underline;word-break:break-all}
.fq .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fq .btn{white-space:nowrap;flex:none}
.fq .pinned{font:800 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.bt-scope.ok{background:var(--ok-soft);color:var(--ok)}
.okc .quote{border-left:3px solid var(--te);padding:2px 0 2px 10px;font-size:15px;line-height:1.4;color:var(--ink-soft)}
.bt-box .row{display:flex;align-items:center;gap:8px}
.bt-scope{white-space:nowrap;display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft);font:800 11px var(--font-ui)}
.btn{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:800 12.5px var(--font-ui);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.45}
.pfoot{border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--muted)}
.pfoot b{color:var(--ink);font-weight:600}
.booth-edge{all:unset;box-sizing:border-box;cursor:pointer;position:fixed;right:0;top:120px;z-index:40;width:38px;padding:14px 0 16px;display:flex;flex-direction:column;align-items:center;gap:10px;
  border:1px solid var(--line);border-right:0;border-radius:9px 0 0 9px;background:var(--card);color:var(--ink-soft);box-shadow:-1px 0 0 color-mix(in srgb,var(--te) 18%,transparent);

<script>
var NapkinSource=(function(){

  return { STEPS: STEPS, CHOICES: CHOICES, view: view, chip: chip, rightsWord: rightsWord, rightsOf: rightsOf, labelOf: labelOf, panel: panel, strip: strip, slotHtml: slotHtml,
    dialog: dialog, makeDialog: makeDialog, framesFrom: framesFrom, heldOf: heldOf, withHeld: withHeld, canMake: canMake, STEPS_MAKE: MAKE, boothCard: boothCard, firstOpen: firstOpen, handles: handles, act: act, reqWords: reqWords };
})();
</script>

<script id="territories-exports-logic">
// Exports (territories-exports): what the Export window offers and how a file reaches the person. The middleware makes the files
// (fetch_territories_file@1: the board and the one-pagers as HTML, the routes as JSON); the host's export prints the HTML to a PDF with
// Chromium and delivers every file through the shell's own download, because this frame is sandboxed without allow-downloads, so no blob link
// would save anything. Nothing here is a rule about content: the middleware's exports.py keeps those (rank only, Rights to supply).
var TerritoriesExports = (function () {
  'use strict';
  function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var TASK = 'fetch_territories_file';

  /** The greenlit routes that are still live, in the judge's order (unranked last): the order the files use. */
  function routes(data) {
    var by = {}; arr(data && data.territories).forEach(function (t) { if (isObj(t) && t.id) by[t.id] = t; });
    var seen = {}, out = [];
    arr(data && data.greenlit).forEach(function (g) { var t = isObj(g) ? by[g.territory_id] : null; if (t && !seen[t.id] && t.status !== 'killed') { seen[t.id] = 1; out.push(t); } });
    return out.map(function (t, i) { return [t, i]; }).sort(function (a, b) {
      var x = typeof a[0].rank === 'number' ? a[0].rank : 1e9, y = typeof b[0].rank === 'number' ? b[0].rank : 1e9; return x - y || a[1] - b[1];
    }).map(function (p) { return p[0]; });
  }
  /** { ok, why }: Export waits for a route to be greenlit, and says so. */
  function can(data) {
    return routes(data).length ? { ok: true, why: '' } : { ok: false, why: 'Greenlight a route first: the files hold the routes you greenlit.' };
  }
  function slug(s, max) { return String(s || '').replace(/[^\w.-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, max || 60); }
  function base(data) { return slug(data && data.title, 60) || 'territories'; }
  /** What the window lists: key, the file the middleware makes, what the host does with it, the name the person gets, and the words. */
  function files(data) {
    var b = base(data), rs = routes(data), out = [
      { key: 'board', file: 'territories-board.html', kind: 'pdf', name: b + '-board', label: 'Territory board', does: 'PDF. Every greenlit route, in the judge’s order, two to a page.' },
      { key: 'board-client', file: 'territories-board-client.html', kind: 'pdf', name: b + '-board-client', label: 'Board for the client', does: 'PDF. The same board without sources or derived marks.' }];
    rs.forEach(function (t) {
      var n = slug(t.name, 40) || 'route';
      out.push({ key: 'route:' + t.id, file: 'territories-route-' + t.id + '.html', kind: 'pdf', name: b + '-' + n, label: t.name, does: 'One-pager, PDF.', group: 'route' });
      out.push({ key: 'route-client:' + t.id, file: 'territories-client-route-' + t.id + '.html', kind: 'pdf', name: b + '-' + n + '-client', label: t.name, does: 'Client copy, PDF.', group: 'route', client: true });
    });
    out.push({ key: 'json', file: 'territories.json', kind: 'json', name: b + '-routes', label: 'Routes as JSON', does: 'The greenlit routes as data, in the document’s own shape.' });
    return out;
  }
  function fileOf(data, key) { return files(data).filter(function (f) { return f.key === key; })[0] || null; }
  /** A short mark of what the files were made from (the greenlit routes and everything a route says), so a file made before a change reads stale. */
  function sign(data) {
    var s = JSON.stringify([arr(data && data.greenlit), routes(data)]), h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return String(h);
  }

  function reply(res) {
    if (!res) return { error: 'The engine sent nothing back.' };
    var b = isObj(res) && 'ok' in res && 'data' in res ? res.data : res, e = res.error || (isObj(b) ? b.error : null);
    if (e) return { error: typeof e === 'string' ? e : (e.message || 'The engine did not accept the request.') };
    if (res.ok === false) return { error: 'The host could not complete the call' + (res.status ? ' (status ' + res.status + ')' : '') + '.' };
    var r = isObj(b) && isObj(b.result) ? b.result : null;
    return r && r.data_b64 ? { result: r } : { error: 'The engine did not hand the file over.' };
  }
  function decode(b64) {
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  /** One file to the person: ask the middleware for it, give it to the host's export, which prints it (PDF) and saves it through the shell.
   *  Resolves { ok: true, name } or { ok: false, why } in words; never throws. */
  function run(data, key, host) {
    var f = fileOf(data, key), c = can(data);
    if (!f) return Promise.resolve({ ok: false, why: 'That file is not on offer for this document.' });
    if (!c.ok) return Promise.resolve({ ok: false, why: c.why });
    if (!(host && host.apiProxy && host.exportDoc)) return Promise.resolve({ ok: false, why: 'Exports go through the Napkin host and the engine, and they are not here.' });
    return Promise.resolve().then(function () { return host.apiProxy('middleware', { task: TASK, input: { name: f.file } }); }).then(function (res) {
      var r = reply(res); if (r.error) return { ok: false, why: r.error };
      return host.exportDoc(f.kind, f.name, decode(r.result.data_b64)).then(function (x) {
        return x && x.ok === false ? { ok: false, why: 'The host could not start the download.' } : { ok: true, name: f.name + '.' + f.kind, sign: sign(data) };
      });
    }).catch(function (e) { return { ok: false, why: 'The export did not finish: ' + ((e && e.message) || e) }; });
  }

  /** The Export window. ui.exp = { made: { key: sign }, busy: key, note, bad } . */
  function dialog(data, ui) {
    var c = can(data), st = (ui && ui.exp) || {}, made = st.made || {}, cur = sign(data);
    if (!c.ok) return { title: 'Export', closeInside: true, sans: true, html: '<p class="meta" style="margin:0">' + esc(c.why) + '</p><div class="row"><button type="button" class="btn-rect" data-close>Close</button></div>' };
    function row(f) {
      var stale = made[f.key] && made[f.key] !== cur, busy = st.busy === f.key;
      return '<button type="button" class="wsrow" data-export="' + esc(f.key) + '"' + (st.busy ? ' disabled aria-disabled="true"' : '') + '><span class="wsdot" style="background:var(--ag-acc)"></span><span><b>' + esc(f.label) + '</b>' +
        (busy ? ' <span class="mark-undone">making it</span>' : stale ? ' <span class="mark-undone">made before your last change</span>' : made[f.key] ? ' <span class="mark-undone">saved</span>' : '') + '<br><span class="meta">' + esc(f.does) + '</span></span></button>';
    }
    function pair(t) {
      var two = files(data).filter(function (f) { return f.group && f.key.slice(-t.id.length) === t.id; });
      return '<div class="wsrow" style="grid-template-columns:minmax(0,1fr) auto auto;align-items:center"><span><b>' + esc(t.name) + '</b><br><span class="meta">' + esc(rank(t)) + '</span></span>' + two.map(function (f) {
        var stale = made[f.key] && made[f.key] !== cur, busy = st.busy === f.key;
        return '<button type="button" class="btn-rect" data-export="' + esc(f.key) + '"' + (st.busy ? ' disabled aria-disabled="true"' : '') + '>' + (busy ? 'Making it' : f.client ? 'Client copy' : 'One-pager') + (stale ? ' (changed since)' : made[f.key] ? ' \u2713' : '') + '</button>'; }).join('') + '</div>';
    }
    function rank(t) { return typeof t.rank === 'number' ? 'Judge #' + t.rank : 'Not ranked'; }
    var all = files(data), top = all.filter(function (f) { return !f.group && f.kind === 'pdf'; }), js = all.filter(function (f) { return f.kind === 'json'; });
    return { title: 'Export', closeInside: true, sans: true, html: '<p class="meta" style="margin:0">PDFs are printed from the page and saved to your downloads. Pictures drawn from a palette are marked Mock-up, and a picture with no rights chosen reads Rights to supply.</p>' +
      top.map(row).join('') + '<span class="psec-t">One-pager per route</span>' + routes(data).map(pair).join('') + '<span class="psec-t">Data</span>' + js.map(row).join('') +
      (st.note ? '<p class="runnote' + (st.bad ? ' bad' : '') + '" role="status">' + esc(st.note) + '</p>' : '') +
      '<div class="row"><button type="button" class="btn-rect" data-close>Close</button></div>' };
  }
  return { TASK: TASK, routes: routes, can: can, files: files, fileOf: fileOf, sign: sign, reply: reply, run: run, dialog: dialog, base: base };
})();
</script>

<script id="territories-lookups-logic">
// Look-ups in the Booth (territories-lookups): the box, the OK card that comes first, the Research note a look-up leaves and its quote cards with
// Pin / Unpin. The page keeps no rule of its own: a question, an OK, a no and a pin are requests to the middleware (run_territories steps
// lookup and pin_quote); engine/territory/lookups.py decides, and the page shows what the document then says.
var TerritoriesLookups = (function () {
  'use strict';
  var L = typeof TerritoriesLogic !== 'undefined' ? TerritoriesLogic : null;
  function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function esc(s) { return L.esc(s); }
  var SHOWN = 3;            // the look-ups whose quotes the Booth lists (the newest)
  var NEEDS_NAME = 'Sign in first: only a named person can look things up or pin a quote.';

  function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
  function lookups(data) { return arr(data && data.lookups).filter(isObj); }
  function finds(data) { return arr(data && data.finds).filter(isObj); }
  function named(ui) { return !!(ui && ui.me && ui.me.name); }
  function by(env) { return (env && env.me && env.me.name) || ''; }
  function busy(ui) { return L.reqBusy(ui && ui.req); }
  function safeUrl(u) { return typeof u === 'string' && /^https?:\/\//i.test(u) ? u : ''; }
  function host(u) { var m = /^https?:\/\/([^\/?#]+)/i.exec(u); return m ? m[1].replace(/^www\./, '') : u; }
  /** The page a quote was read on, as a link; nothing when it has none. */
  function link(u) {
    u = safeUrl(u);
    return u ? '<div class="meta"><a class="lqlink" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(host(u)) + '</a></div>' : '';
  }
  /** A Research note a look-up wrote: the box draws it with its quotes, so the plain notes list leaves it out. */
  function isLookupNote(n, data) {
    var c = arr(n && n.cite);
    return !!n && n.agent === 'research' && c.length > 0 && c.every(function (x) { return /^x_/.test(x); }) &&
      lookups(data).some(function (q) { return arr(q.found).indexOf(c[0]) !== -1; });
  }
  function words(req, key) {      // the engine's own sentence, without the page's framing
    if (!isObj(req) || req.key !== key) return '';
    if (req.state === 'sending') return 'Sending it to the engine…';
    if (req.state === 'queued' || req.state === 'running') return 'Looking it up. The result appears here when it is back.';
    if (req.state === 'failed') return String(req.error || '').replace(/^.*?did not go through\.\s*/, '').replace(/\s*Nothing changed\.?$/, '') || 'That did not go through.';
    return '';
  }
  function btn(label, attrs, dark, dis) { return '<button type="button" class="btn' + (dark ? ' dark' : '') + '" ' + attrs + (dis ? ' disabled' : '') + '>' + esc(label) + '</button>'; }

  /** The box. The question is only asked here: nothing is searched until the card it makes is OK'd. */
  function box(data, ui) {
    var draft = ui && typeof ui.lq === 'string' ? ui.lq : '';
    if (lookups(data).some(function (q) { return norm(q.q).toLowerCase() === norm(draft).toLowerCase(); })) draft = '';     // it became a card
    var w = words(ui && ui.req, 'lq:new'), failed = ui && ui.req && ui.req.key === 'lq:new' && ui.req.state === 'failed';
    return '<div class="bt-box"><textarea rows="2" data-lq-draft maxlength="240" placeholder="Ask the Research agent to look something up…" aria-label="Ask the Research agent to look something up">' + esc(draft) + '</textarea>' +
      '<div class="bt-hint">' + esc(named(ui) ? 'Searches the open web. Only quotes that check against their page can be pinned.' : NEEDS_NAME) + '</div>' +
      (w ? '<div class="runnote' + (failed ? ' bad' : '') + '" role="status">' + esc(w) + '</div>' : '') +
      '<div class="row"><span class="bt-scope">Whole exploration</span><span class="spacer"></span><button type="button" class="btn dark" data-act="lookup"' +
      (!norm(draft) || !named(ui) || busy(ui) ? ' disabled' : '') + '>Look it up</button></div></div>';
  }

  /** The OK card: what will be looked up and who wants it. */
  function okCard(q, ui) {
    var key = 'lq:' + q.id, w = words(ui && ui.req, key), failed = ui && ui.req && ui.req.key === key && ui.req.state === 'failed', dis = busy(ui) || !named(ui);
    var head = function (what, need) { return '<header class="bc-hd">' + L.sphere('research', 20) + '<span class="bc-who">Research · ' + what + '</span>' + (need ? '<span class="need">Needs you</span>' : '') + '</header>'; };
    if (failed) {
      var capped = /number of look-ups/.test(w);
      return '<article class="bc ask off" data-lq-card="' + esc(q.id) + '">' + head('not looked up', false) + '<div class="q">' + esc(w) + '</div>' +
        '<div class="bc-note">' + esc(norm(q.q)) + '</div><div class="acts">' + (capped ? '' : btn('Try again', 'data-lq-ok="' + esc(q.id) + '"', false, dis)) + btn('Not now', 'data-lq-no="' + esc(q.id) + '"', false, dis) + '</div></article>';
    }
    var mine = norm(q.by) === norm(ui && ui.me && ui.me.name) || !/^napkin/i.test(norm(q.by));
    return '<article class="bc ask okc" data-lq-card="' + esc(q.id) + '">' + head('before looking up', true) + '<div class="q">Look this up on the open web?</div>' +
      '<div class="quote">' + esc(norm(q.q)) + '</div><div class="bc-note" style="font-size:14px;color:var(--muted)">' +
      (mine ? 'Asked by ' + esc(norm(q.by)) + '.' : esc(norm(q.by).replace(/^Napkin,?\s*/i, 'Napkin would like this, ').replace(/^Napkin would like this, $/, 'Napkin would like this.')) + '.') +
      ' Nothing is searched until you say OK.</div>' +
      '<div class="acts">' + btn('OK, look it up', 'data-lq-ok="' + esc(q.id) + '"', true, dis) + btn('Not now', 'data-lq-no="' + esc(q.id) + '"', false, dis) + '</div>' +
      (w ? '<div class="runnote" role="status">' + esc(w) + '</div>' : '') + (named(ui) ? '' : '<div class="hint">' + esc(NEEDS_NAME) + '</div>') + '</article>';
  }

  /** The note a look-up wrote, then its quotes. */
  function resultCards(q, data, ui) {
    var ids = arr(q.found), note = arr(data && data.notes).filter(function (n) { return isObj(n) && arr(n.cite)[0] === ids[0]; })[0];
    var out = '';
    if (note) out += '<article class="bc"><header class="bc-hd">' + L.sphere('research', 20) + '<span class="bc-who">Research · looked up</span><span class="bc-t">' + esc(String(note.at || '').slice(0, 10) || 'now') + '</span></header>' +
      '<div class="bc-note">' + arr(note.cite).map(function (c) { return L.refChip(c, data); }).join(' ') + ' ' + esc(L.text(note.text)) + '</div></article>';
    else out += '<article class="bc"><header class="bc-hd">' + L.sphere('research', 20) + '<span class="bc-who">Research · looked up</span></header><div class="bc-note">' + esc(norm(q.q)) + ' Nothing usable came back, so nothing was added.</div></article>';
    return out + ids.map(function (id) { return findCard(finds(data).filter(function (f) { return f.id === id; })[0], ui); }).join('');
  }
  function findCard(f, ui) {
    if (!f) return '';
    var ok = f.quote_checked === true, pinned = f.in_play === true, dis = busy(ui) || !named(ui);
    return '<div class="fq' + (ok ? '' : ' un') + '" data-find-card="' + esc(f.id) + '"><span class="tsrc-band ' + (ok ? 'te' : 'warn') + '">Found by Territories' + (ok ? '' : ' · not checked') + '</span><div class="tsrc-body">' +
      '<div class="qt">' + esc(L.text(f.text)) + '</div><div class="meta"><span>' + esc(L.text(f.source)) + '</span><span>' + esc(L.text(f.date)) + '</span></div>' + link(f.url) +
      '<div class="acts">' + (pinned ? '<span class="pinned">✓ Pinned</span>' + btn('Unpin', 'data-pin="' + esc(f.id) + '" data-on="0"', false, dis) :
        ok ? btn('Pin it', 'data-pin="' + esc(f.id) + '" data-on="1"', true, dis) : btn('Pin it', '', false, true)) +
      (ok ? '<span class="bt-scope ok">Checked against the page</span>' : '<span class="bt-hint">Could not be checked against its page, so it cannot be pinned.</span>') + '</div></div></div>';
  }

  /** What the Booth carries for look-ups: the box, the cards waiting for an OK, and what the newest look-ups found. */
  function section(data, ui) {
    if (!isObj(data && data.run)) {      // nothing for a request to name until the engine has written the document
      return '<div class="bt-box"><textarea rows="2" disabled placeholder="Ask the Research agent to look something up…" aria-label="Ask the Research agent to look something up"></textarea>' +
        '<div class="bt-hint">Look-ups open once the crew has read what arrived: use Find the insights first.</div><div class="row"><span class="bt-scope">Whole exploration</span><span class="spacer"></span><button type="button" class="btn dark" disabled>Look it up</button></div></div>';
    }
    var qs = lookups(data), wait = qs.filter(function (q) { return q.status === 'ask'; });
    var done = qs.filter(function (q) { return q.status === 'done'; }).slice(-SHOWN).reverse();
    return wait.map(function (q) { return okCard(q, ui); }).join('') + done.map(function (q) { return resultCards(q, data, ui); }).join('') + box(data, ui);
  }

  // ── the person's moves: requests, never writes ──
  function handles(a) { return a === 'lookup' || a === 'lq_ok' || a === 'lq_no' || a === 'pin'; }
  function act(data, ui, e, env) {
    var who = by(env);
    if (!who) return { writes: [], toast: NEEDS_NAME };
    if (e.a === 'pin') {
      var f = finds(data).filter(function (x) { return x.id === e.id; })[0];
      if (!f) return null;
      if (e.on && f.quote_checked !== true) return { writes: [], toast: 'That quote could not be checked against its page, so it cannot be pinned.' };
      return { writes: [], move: { what: e.on ? 'Pinning the quote' : 'Unpinning the quote', input: { step: 'pin_quote', find_id: f.id, on: !!e.on, by: who, text: f.text } } };
    }
    if (busy(ui)) return { writes: [], toast: 'The last change is still going through.' };
    if (e.a === 'lookup') {
      var q = norm(ui && ui.lq);
      if (!q) return { writes: [], toast: 'Say what to look up first.' };
      return { writes: [], request: { key: 'lq:new', what: 'The question', input: { step: 'lookup', q: q, by: who } } };
    }
    var lq = lookups(data).filter(function (x) { return x.id === e.id && x.status === 'ask'; })[0];
    if (!lq) return null;
    return { writes: [], request: { key: 'lq:' + lq.id, what: 'The look-up', input: { step: 'lookup', lookup_id: lq.id, ok: e.a === 'lq_ok', by: who } } };
  }

  return { box: box, okCard: okCard, resultCards: resultCards, findCard: findCard, section: section, link: link, isLookupNote: isLookupNote, handles: handles, act: act, words: words };
})();
</script>

<script>
(function () {
  'use strict';
  var L = TerritoriesLogic, R = typeof NapkinRoles !== 'undefined' ? NapkinRoles : null, D = window.__CLAN__.data, esc = L.esc;
  var Q = new URLSearchParams(location.search);
  var shot = Q.has('shot');
  if (shot) document.body.classList.add('shot');
  var theme = Q.get('theme');
  if (theme) document.documentElement.setAttribute('data-color-scheme', theme);

  var CREW = L.crewOf(D), ALL = L.developed(D).slice().sort(L.byRank), BRAND = L.brandOf(D);
  var INS = (D.focus && D.focus.insights || []).slice().sort(function (a, b) { return a.rank - b.rank; });
  var SEEN = L.seen(D);
  var S = { id: Q.get('s') || 'arrived', ticked: {}, green: {}, steerOpen: 'cr_core', pickedSend: null, lqText: '' };
  INS.forEach(function (i) { S.ticked[i.id] = !!i.ticked; });

  function sph(role, size, state) { return R ? R.tag(role, { size: size, state: state || 'idle', decorative: true }) : ''; }
  function nm(r) { return R ? R.name(r).replace(/ agent$/i, '') : r; }
  function job(r) { return R ? R.job(r) : ''; }
  function plural(n, a, b) { return n + ' ' + (n === 1 ? a : (b || a + 's')); }
  function ticked() { return INS.filter(function (i) { return S.ticked[i.id]; }).length; }
  function nGreen() { return Object.keys(S.green).filter(function (k) { return S.green[k]; }).length; }
  function go(id) { return 'data-go="' + id + '"'; }

  // ---------- chrome ----------
  var STEPS = ['Pick', 'Explore', 'Greenlight'];
  function topbar(chip) {
    return '<header class="tb"><div class="brand"><span class="orb">' + sph('orchestrator', 64) + '</span><span class="pill">Napkin Studio</span></div>' +
      '<div class="doc">◎ Lunasa routes <small>saved just now</small></div><button class="tbtn">Continue in ▾</button><button class="tbtn">Share</button><span class="sp"></span>' +
      (chip ? '<span class="work' + (chip.bad ? ' bad' : '') + '"><i></i>' + esc(chip.t) + '</span>' : '') +
      '<span class="circle">☼</span><span class="av">YO</span><span class="dec">Decisions <i>6</i></span></header>';
  }
  function head(at, done) {
    var li = STEPS.map(function (s, i) {
      var cls = i < at ? 'done' : i === at ? 'now' : '';
      var go2 = i === 0 ? 'pick' : i === 1 ? 'routes' : 'greenlight';
      var dis = i > Math.max(at, done == null ? at : done);
      return '<li><button class="' + cls + '"' + (dis ? ' disabled' : ' ' + go(go2)) + (i === at ? ' aria-current="step"' : '') + '><i>' + (i < at ? '✓' : i + 1) + '</i>' + s + '</button></li>';
    }).join('');
    return '<section class="ph"><div><div class="kick">Lunasa routes</div><h1>Territories<i></i></h1></div><ol class="ring3">' + li + '</ol></section>';

    return shell({ at: 2, reached: 2, main: main, booth: booth({ role: 'strategy', line: 'This route as a campaign across one weekend. Move a dial and the words move with it.',
      extra: '<button class="link" ' + go('greenlight') + '>← All routes</button><div class="bsec"><h4>Shape the feel</h4><div style="display:grid;gap:12px;padding:6px 2px">' + dials + '</div><span class="why">The words and the layout change as you move a dial. Nothing is sent.</span></div>' +
        '<details class="fold"><summary>Lines · why · test</summary><div style="padding:0 14px 12px;font:14.5px/1.4 var(--font-serif);color:var(--muted)">' + esc((w.lines || []).slice(0, 3).join(' · ')) + '</div></details>' }) });
  };

  function sendDlg(mode) {
    var sel = mode !== 'choose', busy = mode === 'busy', done = mode === 'done';
    var body = done ? '<div class="why ok">Sent. Production opened with a Territories node on its canvas.</div>' :
      '<button class="opt' + (sel ? ' on' : '') + '"><span class="rd"></span><div><b>Production</b><span>A Territories node on the canvas. Scripts, boards and films start from each route’s world.</span></div></button>' +
      '<button class="opt"><span class="rd"></span><div><b>Deck Maker</b><span>Pitch it: the deck opens with the greenlit route as the recommendation.</span></div></button>';
    var foot = done ? '<button class="b" ' + go('greenlight') + '>Stay here</button><button class="b pri lg">Open Production →</button>' :
      '<span class="why' + (sel ? '' : ' lock') + '">' + (busy ? 'Sending… Production opens when the project is ready.' : sel ? 'The other 9 routes travel as routes not chosen.' : 'Choose where it goes.') + '</span><button class="b" ' + go('greenlight') + '>Cancel</button>' +
      (busy ? '<button class="b pri lg busy"><span class="spin"></span>Sending…</button>' : sel ? '<button class="b pri lg" ' + go('send-busy') + '>Send to Production</button>' : '<button class="b pri lg" disabled>Send</button>');
    return '<div class="veil"><div class="dlg"><h3>' + (done ? 'Sent' : 'Send 1 route onward') + '</h3>' + (done ? '' : '<p>' + esc(ALL[0].name) + ' goes with its world, lines, checks and sources.</p>') + body + '<div class="foot">' + foot + '</div></div></div>';
  }
  function underGreen() { S.green = {}; S.green[ALL[0].id] = true; return shell({ at: 2, reached: 2, main: glMain(false), booth: booth({ role: 'review', line: 'I tested every route.' }) }); }
  V.send = function () { return underGreen() + sendDlg('sel'); };
  V['send-choose'] = function () { return underGreen() + sendDlg('choose'); };
  V['send-busy'] = function () { return underGreen() + sendDlg('busy'); };
  V.sent = function () { return underGreen() + sendDlg('done'); };
  V.export = function () {
    var t = ALL[0];
    var dlg = '<div class="veil"><div class="dlg"><h3>Export</h3><p>PDFs are printed from the page. Pictures drawn from a palette read Mock-up; a picture with no rights chosen reads Rights to supply.</p>' +
      '<div class="exrow"><div><b>Territory board</b><span>PDF. Every greenlit route, in the judge’s order.</span></div><button class="b pri">Download</button></div>' +
      '<div class="exrow"><div><b>Board for the client</b><span>PDF. Same board without sources or derived marks.</span></div><button class="b">Download</button></div>' +
      '<div class="exrow"><div><b>' + esc(t.name) + '</b><span>One-pager · Judge #' + t.rank + '</span></div><span style="display:flex;gap:6px"><button class="b sm">One-pager</button><button class="b sm">Client copy</button></span></div>' +
      '<div class="exrow"><div><b>Routes as JSON</b><span>The greenlit routes as data.</span></div><button class="b">Download</button></div>' +
      '<div class="foot"><span class="why ok">Last saved: Territory board.pdf, to your downloads.</span><button class="b" ' + go('greenlight') + '>Close</button></div></div></div>';
    return underGreen() + dlg;
  };
  V['lookup-empty'] = function () {
    return shell({ at: 1, reached: 2, main: V.routes.main(), booth: booth({ role: 'research', line: 'Ask me to look something up. I search the open web and pin only quotes that check against their page.', lq: 'empty' }) });
  };
  V['lookup-typed'] = function () {
    return shell({ at: 1, reached: 2, main: V.routes.main(), booth: booth({ role: 'research', line: 'Ask me to look something up. I search the open web and pin only quotes that check against their page.', lq: 'typed' }) });
  };
  // routes' main for reuse
  V.routes.main = function () {
    var h = V.routes(); var m = /<div class="split[^>]*"><div>([\s\S]*?)<\/div><aside/.exec(h); return m ? m[1] : '';
  };

  // ---------- mount ----------
  var ORDER = ['arrived', 'arrived-empty', 'finding', 'finding-failed', 'pick', 'pick-none', 'exploring', 'explore-failed', 'routes', 'greenlight', 'greenlight-none', 'greenlight-ask', 'world', 'send-choose', 'send', 'send-busy', 'sent', 'export', 'lookup-empty', 'lookup-typed'];
  function mockbar() {
    return '<nav class="mockbar"><b>Mock</b>' + ORDER.map(function (k) { return '<a data-go="' + k + '" class="' + (k === S.id ? 'on' : '') + '">' + k + '</a>'; }).join('') + '</nav>';
  }
  function render() {
    var f = V[S.id] || V.arrived;
    document.getElementById('app').innerHTML = f() + mockbar();
    document.title = 'Territories redesign · ' + S.id;
    if (R && R.auto) R.auto();
    try { history.replaceState(null, '', '?' + (shot ? 'shot=1&' : '') + (theme ? 'theme=' + theme + '&' : '') + 's=' + S.id); } catch (e) {}
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', function (e) {
    var t = e.target, el;
    if ((el = t.closest('[data-go]')) && !el.disabled) { S.id = el.getAttribute('data-go'); render(); return; }
    if ((el = t.closest('[data-tick]'))) { var id = el.getAttribute('data-tick'); S.ticked[id] = !S.ticked[id]; render(); return; }
    if ((el = t.closest('[data-green]'))) { var g = el.getAttribute('data-green'); S.green[g] = !S.green[g]; render(); return; }
    if ((el = t.closest('[data-steer]'))) { S.steerOpen = el.getAttribute('data-steer'); render(); return; }
  });
  document.addEventListener('DOMContentLoaded', render);
  if (document.readyState !== 'loading') render();
  window.__mock = { states: ORDER, set: function (s) { S.id = s; render(); } };
})();

</script></body>
</html>
