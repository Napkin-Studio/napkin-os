# deck-graphics slice 1 (features/deck-graphics.clan, design.icons): the fixed keyword map. No model chooses an icon.
#
# {icon id: [keyword, ...]}. The ids are the vendored allow-list: scripts/vendor_icons.py vendors exactly these 72 Lucide icons
# (lucide-static 1.75.0) into vendor/icons/icons.json, and a test checks the two lists are equal. A keyword is matched on whole words
# of an item's HEADING only (a kv key, a table row's first cell, a step label, a card title, a bullet's first four words), lower-cased,
# hyphens and punctuation split, plurals folded. A longer keyword wins over a shorter one inside it ('word of mouth' over 'mouth').
# A heading that matches two different icons gets none; a group gets icons only when every item matched a different icon.
# Every new keyword needs a fixture line in tests/test_deck_graphics.py (rework risk: the map must not grow into a guesser).
# Never a brand, a platform, an award or a trophy: the deny list in graphics.ICON_DENY is refused by the vendor script and by a test.
# Never an icon that makes a claim of its own (graphics.ICON_CLAIMS): no direction (an up or down arrow, a rising line), no verdict (a tick,
# a cross, a badge) and no approval (a thumb, a star). A heading that names a result ('Sales falling 12%') gets no icon that says which way.
