# Deck type: credentials deck for a chemistry meeting (not a pitch).
# Source: GUIDE.md 3.1 (process facts: a credentials or chemistry deck is a different artefact from a full pitch;
# WFA/EACA 10.1-10.2: keep credentials very short and show the team that will do the work; a tissue session is a
# separate format), GUIDE.md 1 and 5 (buyers choose on thinking then team; 75% said the winner showed true
# understanding, asking questions and raising new challenges featured in almost 50% of wins; 15% of lost pitches
# never met the day-to-day team; 28.3% of rejections after chemistry calls blamed a senior contact overwhelming
# the call), GUIDE.md 4.5 (show the people who do the day-to-day work; end with an explicit ask), NAPKIN-EDGE.md 3
# (a credentials_deck mode: short credentials, real team, questions for the client, sized for about 90 minutes
# of mostly conversation). No territories, no idea and no price; the team and a real example lead.
# Words stay fixed: the team and credentials slides are labelled placeholders a person fills, and "how we work"
# is one too when no stage d writes a process. 10 to 14 slides is a Napkin default (GUIDE 4.2: no study of count).
id: credentials
label: "Credentials deck"
one_line: "A short deck for a chemistry meeting: team and proof first, how we work, questions for you."
kind: agency
arrange: spine
spine: [title, objective, team, credentials, brief_restated, real_question, insight, audience, process, guardrails, questions, next_step]
appendix: [brief_restated]
stages: [a0, a, b, fit, e]
length:
  min_slides: 10
  max_slides: 14
  minutes: 90   # the meeting slot, mostly conversation (NAPKIN-EDGE 3); the slides are talked through in about 20
  respect_stated_limit: true   # a limit the inputs state for the presentation replaces max_slides (assemble.stated_limit)
rubric_weights:
  basis: "default, not validated"
  source: "rubric.json 2026-10-16, adjusted per GUIDE.md 1, 3.1 and 4.5 (our judgement, not a published split)"
  weights: {compliance_gate: 4, problem_objective: 10, insight: 12, idea_chain: 4, evidence_trace: 16,
            headline_fit_limits: 8, team_proof: 30, commercials_ask: 2, presentability: 14}
  adjustments:
    - {criterion: team_proof, from: 10, to: 30, why: "Buyers choose on thinking then team; 15% of lost pitches never met the day-to-day team (GUIDE 1, 3.1; WFA/EACA 10.2)."}
    - {criterion: idea_chain, from: 14, to: 4, why: "A chemistry meeting shows no idea: a tissue session is a separate format (IPA/ISBA via GUIDE 3.1)."}
    - {criterion: compliance_gate, from: 12, to: 4, why: "There are usually no scored criteria to map (GUIDE 3.1)."}
    - {criterion: commercials_ask, from: 6, to: 2, why: "Price reinforces a case already made; a chemistry meeting makes none (GUIDE 3.1, AAR)."}
    - {criterion: presentability, from: 10, to: 14, why: "Short and talked through, leaving room for conversation; end on questions (GUIDE 4.2, 4.5)."}
    - {criterion: insight, from: 14, to: 12, why: "Show true understanding of the brand, one new challenge raised, not a full insight chain (GUIDE 1)."}
    - {criterion: evidence_trace, from: 14, to: 16, why: "Proof is the point of a credentials deck, and it must be honest (GUIDE 4.4)."}
    - {criterion: problem_objective, from: 12, to: 10, why: "The client's objective is read back briefly, not quantified in depth (GUIDE 4.1)."}
strict:
  requirement_map: warn
  criteria_map: warn
  message_carried: warn
  pitch_length: error
prompt_guidance:
  a0:
    - "Ask who will attend, what the client wants to decide after this meeting, and which real examples of our work are closest to this client's. Never invent either."
  a:
    - "Read what the client asked us to show. There may be no scored criteria: do not make any up."
  b:
    - "This is a chemistry meeting, not a pitch: no creative idea, no territories and no price."
    - "Show that we understand the client's brand and business, and raise one challenge they may not have named."
    - "Keep every text short: the deck is talked through, not read."
  e:
    - "Cut hard: fewer words leave room for conversation."
questions:
  - id: q_attendees
    text: "Who will be in the room, and who on your side does the day-to-day work?"
    options: []
    allow_text: true
    address: brief.reasons_to_believe
  - id: q_decide
    text: "What should the client feel or decide after this meeting?"
    options: []
    allow_text: true
    address: brief.desired_response
  - id: q_show
    text: "Has the client asked to see, or not to see, anything in particular?"
    options: []
    allow_text: true
    address: brief.mandatories
sources: [GUIDE.md 1, GUIDE.md 3.1, GUIDE.md 4.5, NAPKIN-EDGE.md 3]
