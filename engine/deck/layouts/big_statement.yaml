id: big_statement
version: 1
group: content
purpose: statement
description: One statement set large on a light slide, with a line of support.
slot_summary: title, statement, support
for_types:
- real_question
- idea
- proposition
- insight
- problem
- why_now
- solution
- close
when:
  blocks_only:
  - statement
  - text
  - small
priority: 0
alternatives:
- emphasis_bar
- cards
roomier: cards
density: lean
pick: offer
family: statement
renderer: big_statement
slots:
  title:
    kind: text
    role: title
    required: true
    min_chars: 3
    max_lines: 3
  statement:
    kind: text
    role: lead
    from_blocks:
    - statement
    dominant: true
    max_cpl: 48
    max_chars: 163
  support:
    kind: text
    role: body
    from_blocks:
    - text
    - small
    max_cpl: 48
    max_chars: 367
