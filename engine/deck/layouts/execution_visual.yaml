id: execution_visual
version: 1
group: content
purpose: image
description: The channel copy on the left, the key visual on the right half at full content height.
slot_summary: title, role, copy, picture (half the slide)
for_types:
- execution
when:
  test: image_ready
priority: 71
alternatives:
- execution
- execution_stack
without_image: execution
density: standard
pick: rule
family: execution
renderer: execution_visual
slots:
  title:
    kind: text
    role: title
    required: true
    min_chars: 3
    max_lines: 3
  role:
    kind: text
    role: body
    from_blocks:
    - text
    max_chars: 367
  copy:
    kind: copy
    from_blocks:
    - copy
  picture:
    kind: image
    required: true
    dominant: true
    image:
      aspect: '16:9'
