id: cover
version: 1
group: functional
purpose: title
description: 'Dark cover: the title at display size, the lead and a caption under it.'
slot_summary: title (display), lead, sub
for_types:
- title
priority: 100
alternatives:
- cover_image
density: lean
pick: rule
family: cover
renderer: cover
slots:
  title:
    kind: text
    role: display
    required: true
    min_chars: 3
    max_lines: 4
    dominant: true
  lead:
    kind: text
    role: lead
    from_blocks:
    - text
    - statement
    max_chars: 163
  sub:
    kind: text
    role: small
    from_blocks:
    - small
    max_chars: 163
