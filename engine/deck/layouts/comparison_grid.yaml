id: comparison_grid
version: 1
group: content
purpose: compare
description: A three-column comparison table with the buyer's options side by side.
slot_summary: title, grid (table 3 cols)
for_types:
- competition
when:
  test: compare_table
priority: 80
alternatives:
- native_table
roomier: native_table
density: detailed
pick: rule
family: comparison_grid
renderer: comparison_grid
slots:
  title:
    kind: text
    role: title
    required: true
    min_chars: 3
    max_lines: 3
  grid:
    kind: table
    from_blocks:
    - table
    dominant: true
    table:
      max_rows: 6
      max_cols: 3
      cell_max_chars: 140
