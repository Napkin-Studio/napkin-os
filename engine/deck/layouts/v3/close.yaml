id: close
version: 2
group: functional
purpose: title
description: 'The ask: the title as a hero, the budget as a figure in ink, next steps as hairline rows; a placeholder is a dashed To supply row.'
slot_summary: title (hero), statement, budget, next steps (rows)
for_types:
- close
- next_step
- investment
when:
  blocks_only:
  - statement
  - text
  - small
  - bullets
  - kv
  - card
priority: 61
alternatives:
- cards
- placeholder_card
roomier: placeholder_card
density: lean
pick: rule
family: close
renderer: close
human_rows: true
slots:
  title:
    kind: text
    role: display
    required: true
    max_chars: 120
    max_lines: 3
  statement:
    kind: text
    role: lead
    from_blocks:
    - statement
    - text
    - small
    dominant: true
    max_chars: 163
  next:
    kind: list
    role: body
    from_blocks:
    - bullets
    - kv
    - card
    min_items: 1
    max_items: 5
    item:
      body_max_chars: 200
