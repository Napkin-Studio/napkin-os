id: image_text
version: 1
group: content
purpose: image
description: Title and a short paragraph or points on the left, one large picture panel on the right.
slot_summary: title, body, points, picture 4:3
for_types:
- idea
- audience
- solution
- product
when:
  test: image_ready
priority: 96
alternatives:
- image_left
- full_bleed_statement
- cards
without_image: cards_split
density: standard
pick: rule
family: image_text
renderer: image_text
slots:
  title:
    kind: text
    role: title
    required: true
    min_chars: 3
    max_lines: 3
  body:
    kind: text
    role: body
    from_blocks:
    - statement
    - text
    max_cpl: 48
    max_chars: 367
  points:
    kind: list
    role: body
    from_blocks:
    - bullets
    min_items: 2
    max_items: 3
    max_cpl: 48
  picture:
    kind: image
    required: true
    dominant: true
    image:
      aspect: '4:3'
      kinds:
      - photo
      - illustration
      - frame
      fit: cover
