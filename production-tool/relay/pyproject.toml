[project]
name = "production-tool-relay"
version = "0.1.0"
description = "Production Tool relay: sessions, uploads, the job ledger and the fair-share queue (AWS Lambda)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.34",
  "jsonschema>=4.22",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "moto[dynamodb,s3,ssm]>=5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
