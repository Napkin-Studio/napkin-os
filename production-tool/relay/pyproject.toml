[project]
name = "production-tool-relay"
version = "0.1.0"
description = "Production Tool relay (AWS Lambda): sessions, uploads, the job ledger and fair-share queue, the provider adapters, the director and region edit"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.34",
  "jsonschema>=4.22",
  "referencing",
  "httpx>=0.27",
  "pillow>=10.1",
  "anthropic[bedrock]>=1.8",
  "cryptography>=44",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "moto[dynamodb,s3,ssm]>=5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
