[project]
name = "production-tool-stitch"
version = "0.1.0"
description = "Production Tool stitch Lambda: clips + end card with ffmpeg"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
