audience: 'To confirm: lead with 25-40 drinkers who rarely drink cider, women slightly ahead. At a friend''s table, in the pub or at a Friday supper they reach for lager, wine or kombucha. They like to treat themselves to one good bottle rather than a bulk pack. The brief is not led by students, pub landlords or Gen Z. The 55+ rural core is protected, not targeted.'
background: 'Still launches in September and nothing is on shelf before then, so summer work builds anticipation, not sales. Premium is where cider is growing: GB crafted cider value is up 7.6% while retail volume is down 1.7%, and shoppers are trading up to a single good bottle as a treat.'
barrier: 'To confirm: ''Cider without bubbles sounds flat.'' To a rare cider drinker, no fizz reads as a cider that has lost something, and cider already feels sweet and heavy.'
brief_input: |-
  From: Marketing, Hollow Oak Cider
  Subject: RE: RE: brief for the new thing (v3 FINAL final)

  Hi team,

  As discussed on the call, here's the brief. Sorry it's a bit rushed, the board wants to see something by end of month.

  We're launching Hollow Oak "Still" — it's our cider but without the bubbles (and less sugar?? R&D still confirming, don't say that yet). Basically we want people to think of it as the cider for everyone, but also premium, but also not expensive. Think Apple meets Guinness meets a farmers' market.

  OBJECTIVES:
  - Awareness (huge)
  - Sales up 30% (all products, not just Still)
  - Make Hollow Oak cool with Gen Z
  - Don't alienate our core drinkers (55+, rural, they love the current bottle)
  - Win an award ideally

  TARGET: Everyone who drinks. Maybe women 25-40 primarily. Or students. Jim from sales thinks pub landlords are the real audience. Let's keep it broad.

  KEY MESSAGE: Still Hollow Oak. Still Delicious. Still Made Right. Still Here For You. (we love all of these, can we use all four?)

  Also must mention: 140 years of heritage, orchard-grown, the new recyclable can, our sponsorship of the county hurling team, and the competition (win a weekend in the orchards).

  TONE: Fun and irreverent but serious and trustworthy. Nothing that looks like an ad.

  CHANNELS: TV, outdoor, TikTok, the website, radio maybe, in-store, and a 15 second video for social that could also be the TV ad. Possibly a stunt?

  BUDGET: Small. We'll know more after Q1. Production budget is basically what we have left over from last year's Christmas campaign.

  TIMING: Launch ASAP, ideally for summer but the product won't be in stores until September.

  MANDATORIES: Logo big. The orchard. Our founder's portrait (the 1884 painting). The new can AND the old bottle. Legal line about responsible drinking. No apples in the visuals (legal is worried about something, not sure what).

  COMPETITORS: Everyone, but especially the big lager brands and also kombucha.

  Let me know if you need anything else! Can we see 3 routes by Friday?

  Thanks,
  Marketing
budget_and_scope: 'Budget is small: what is left over from last year''s Christmas production, to be known after Q1. No figure was given, so we need the figure, whether it includes VAT and whether media sits inside it. Prioritise the 15-second film for social, which could also serve TV if affordable, plus stills. Three routes by Friday; the board wants to see work by month end. Summer builds anticipation; September drives trial.'
