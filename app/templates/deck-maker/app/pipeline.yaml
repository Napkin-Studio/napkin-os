# Deck Maker pipeline contract. Travels into every instance (CLAN instantiation copies all members), so any
# middleware continuing a Deck Maker .clan knows the pipeline it must speak. This is a DECLARATION (decision M2): each task
# names a handler, name@major, which the middleware resolves against its registry; an unknown handler, task or version is a
# hard error, never a fall-through (M4). Contract: docs/contracts/middleware-api.md §12, docs/contracts/deck-maker.md.
#
# The host applies a middleware reply's change only for request_kind: middleware, so that is what the Deck declares (it said
# `agent` until the server existed). The old approve_gate task is gone: Approve, Edit and Ask Dex are decisions the app writes
# into run.approvals, run.decisions and run.gate_requests, and the next build_deck carries them. ask_change (rewrite one
# slide's words, refs stay) has no handler yet: the app records the request and says it waits for the engine.
pipeline: napkin-deck
version: 2
request_kind: middleware
contract: middleware-api/1#12

tasks:
  build_deck:
    handler: build_deck@1
    job: long
    stages: [build]
    reads:
      - inputs.prompt (client, project, agency, text), inputs.kind and inputs.format
      - run.approvals, which the person wrote: a gate goes on only when its approval is there and the stage output it covers already existed
    never:
      - writes run.approvals, run.decisions or run.gate_requests (the person's)
      - runs a stage after a gate that is not approved
      - shows an engine that failed, did not answer or answered garbage as a success: the job and the run are failed, with the engine's message
      - makes up a time, a percentage or a cost the engine did not give
  attach_production:
    handler: attach_production@1
    job: short
    reads:
      - input.name and input.data_b64, a Production .clan or export zip the person attached to this deck (64 MB at most)
    never:
      - writes to the document (the app records inputs.production itself once the engine holds the file)
      - fetches anything: fetching picked pictures stays the person's opt-in, behind the engine's host allow-list
