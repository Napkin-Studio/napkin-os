# HAND-BUILT FIXTURE, NOT ENGINE OUTPUT. State "review-ready" of the Deck Maker run, on the Ballymaloe Relish sample
# (a hand-built sample: the brief fields are real Brief Maker output, the research is six web findings, the rest
# is written by hand). Every fact to supply is in: one supply card answered (slide 6 rebuilt from it; the card takes
# the timing question's place) and every confirm item verified, as the f19/f22 designs show. Dev and test only: not packed into the app. Territories, the idea and its executions are
# our proposals. `fixture` lists what the engine cannot supply yet (run.agent, cost, file sizes); the cost is a
# placeholder. No time or percentage is shown anywhere.
inputs:
  prompt:
    client: Ballymaloe Relish
    project: Better With Ballymaloe
    agency: ''
    text: 'Client: Ballymaloe Relish (Irish family relish brand). Task: launch a 30s TV and social campaign to get under-35s in Ireland buying it. Budget €150k. Competitors: Heinz, own-label chutneys.'
  documents: []
  kind: agency
  format: pitch
  library:
    enabled: false
upstream:
  doc_brief_better_with_ballymaloe:
    title: Better With Ballymaloe brief
    client: Ballymaloe Relish, an Irish family relish brand.
    background: Ballymaloe Relish is an Irish family relish brand, trusted as a pantry staple but often seen by younger shoppers as their parents' or grandparents' jar. It is launching a 30s TV and social campaign to reach under-35s in Ireland. The aim is to recruit a younger audience beyond its heritage shoppers. Sales, distribution and awareness figures, and the reason for launching now, still need the client's input.
    objectives: Get under-35s in Ireland buying Ballymaloe Relish, with a 30s TV and social campaign launch.
    audience: 'To confirm: a 28-year-old renting in Dublin, Cork or Galway, working full time and cooking for one or two. Quick weeknight meals (sausages, a burger, a cheese toastie) and a weekend sharing board or barbecue. Every habit is an assumption until consumer research confirms it. Not for older loyal buyers or people who never use condiments.'
    competitor_context: 'To confirm: all competitor claims are to be checked and not stated as fact. Heinz is the familiar everywhere choice and risks reading as generic to under-35s. Own-label chutneys are good value and convenient but a safe, cheaper substitute nobody feels proud of. The open space is real flavour made by an Irish family, without farmhouse nostalgia.'
    insight: 'To confirm: "I want to feel I''m looking after myself, not just getting fed, but by Tuesday night all my effort has gone into the main bit and the one small thing that would make it better is the thing I skip."'
    single_minded_proposition: The Irish relish that makes Tuesday's tea taste like you tried.
    reasons_to_believe:
    - 'To confirm: family-made Irish heritage'
    - 'To confirm: the Ballymaloe name and its food credentials'
    - 'To confirm: a distinctive recipe and flavour'
    - 'To confirm: any awards or retail listings the client holds'
    - 'To confirm: claims on ingredients and production, which the client must stand behind'
    desired_response:
      do: Pick up a jar on the next shop, use it on a regular meal, then share the moment on social.
      feel: Warmth, pride in Irish food and appetite, with a sense that this brand is theirs and not just their parents'.
      think: Ballymaloe is a better, properly Irish choice and worth the small premium over Heinz or own-label.
    tone_and_world:
    - Warm, witty and appetising
    - Irish voice without cliché
    - Real kitchens and everyday meals
    - Food shot close and generous
    - Family heritage worn lightly
    budget_and_scope: A launch campaign with a 30s TV spot and social content, on a budget of €150k. Channel split, flighting and timing are still to be agreed. As €150k is tight for TV, social and cut-downs should carry reach, and the TV spot should be targeted.
    mandatories:
    - 'To confirm: pack shot and brand logo'
    - 'To confirm: legal and regulatory claims wording, including Irish broadcast clearance for TV'
    - 'To confirm: any client brand guidelines and things to avoid'
    open_questions:
    - What are current sales, distribution and awareness among under-35s, and what growth target do you want over what period? Is a new product, listing or pricing change driving the launch now?
    - 'What proof points can you stand behind: recipe, ingredients, family story, awards or retail listings?'
    - What are the campaign dates, the TV versus social split and the retailers involved?
    - What brand guidelines, mandatory logos, legal wording and clearance requirements apply?
  doc_research_ballymaloe:
    title: Ballymaloe Relish research
    report:
      headline: Ballymaloe is Ireland's number 1 relish, but growth has slowed and money for blanket marketing is limited.
      findings:
      - id: f_w1
        claim: Ballymaloe Relish was given a rebrand intended to appeal to the 'modern-day consumer'.
        url: https://www.irishpost.com/business/irelands-iconic-ballymaloe-relish-gets-a-rebrand-to-appeal-to-contemporary-consumer-252210
        date: undated in search result
        status: unverified
        caveat: Only the headline and intro were seen; the design details are unverified.
      - id: f_w2
        claim: Bord Bia's Origin Green directory describes Ballymaloe Foods as the number 1 relish brand in Ireland.
        url: https://www.bordbia.ie/industry/origin-green/members-directory/manufacturers/grocery/ballymaloe-foods/
        date: undated in search result
        status: unverified
        caveat: Directory wording, undated, single source.
      - id: f_w3
        claim: Ballymaloe's marketing manager said sales in Ireland have not fallen but growth has slowed, and that exports were about 15% of sales. As a smaller business the company lacks the funds for blanket marketing.
        url: https://www.agriland.co.uk/farming-news/relish-opportunity
        date: undated in search result
        status: unverified
        caveat: Undated, so the current position is not confirmed; single source.
      - id: f_w4
        claim: Ballymaloe Foods won the Love Irish Food Brand Development Award, a funded €85,000 out-of-home campaign (Exterion Media, Owens DDB), aiming to reach a broader audience while highlighting Irish heritage and local ingredients.
        url: https://www.adworld.ie/2019/01/18/ballymaloe-foods-wins-love-irish-food-brand-development-award/
        date: '2019-01-18'
        status: unverified
        caveat: 2019 news item; single source.
      - id: f_w5
        claim: Euromonitor expects Irish sauces, dips and condiments to stay led by Unilever Ireland, HJ Heinz (Ireland) and Mars Ireland. An earlier edition notes private labels gaining ground as price rises continue (2024).
        url: https://www.euromonitor.com/sauces-dips-and-condiments-in-ireland/report
        date: 2025-11 (report edition, per search summary)
        status: unverified
        caveat: Category figures are paywalled and were not seen.
      - id: f_w6
        claim: Heinz Ireland's 2024 pre-tax profit nearly doubled to about €10.19m; it plans to keep growing net sales through pricing and volume.
        url: https://www.rte.ie/news/business/2025/0909/1532595-heinz-ireland-results
        date: '2025-09-09'
        status: unverified
        caveat: The €10.19m figure was not confirmed on the RTÉ page; the Irish Post article on the same results is the other candidate source. Not used on a slide.
    campaign:
      name: Ballymaloe Relish
    selection:
      themes:
      - Number 1 relish, slowing growth
      - Limited money for blanket marketing
      - Heinz and own-label pressure
    materials: {}
