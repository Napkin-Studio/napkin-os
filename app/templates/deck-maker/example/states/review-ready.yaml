    - field: budget_and_scope
      why: €150k is stated; the TV and social split, timing and retailers are not.
    - field: mandatories
      why: Logo, legal wording, clearance and brand guidelines are all to confirm.
    slide_types:
    - type: team
      why: No presenter or team details to put on it.
    - type: investment
      why: Only the €150k total is known; there is no split to base a budget slide on.
