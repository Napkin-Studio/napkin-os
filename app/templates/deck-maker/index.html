    });
    var approvals = {};
    Object.keys(isObj(run.approvals) ? run.approvals : {}).forEach(function (k) { approvals[k] = run.approvals[k]; });
    approvals.deck = { by: by, at: at, decision: 'approve' };
    return { stages: stages, approvals: approvals, agent: null, decisions: decisionsOf(run).concat([{ gate: 'deck', kind: 'approve', by: by, at: at }]) };
  }

  // The four formats, in the order the Export card lists them: key, mark, name, action, what the older `true` shape says.
  var EXPORTS = [
    ['web', 'WEB', 'Web deck', 'Open', 'Ready to open'], ['pptx', 'PPTX', 'PowerPoint', 'Download', 'Notes kept, appendix hidden'],
    ['anim', 'ANIM', 'Animated deck', 'Get project', 'Project ready'], ['pdf', 'PDF', 'PDF', 'Download', 'Presented slides only']
  ];

  /** A file name the engine wrote, as shown: its last path part, at most 120 characters. */
  function fileName(v) {
    var f = str(v).trim().split(/[\\/]/).pop() || '';
    return f.length > 120 ? f.slice(0, 117) + '...' : f;
  }

  /**
   * The Export card's rows: { key, x, name, action, ready, file, note }. A format is ready when exports.<key> is an
   * object with a file, or one of the older shapes: `true`, or the file name as a string. The note is the file name
   * (the web deck says Ready to open), else Not built yet. The animated deck reads like the others: the engine does
   * not build it yet, so it is Not built yet until a runner writes it. Never throws.
   */
  function exportRows(exports) {
    var ex = isObj(exports) ? exports : {};
    return EXPORTS.map(function (f) {
      var v = own(ex, f[0]) ? ex[f[0]] : undefined;
      var file = isObj(v) ? fileName(v.file) : (typeof v === 'string' && v.trim() ? fileName(v) : '');
      var ready = v === true || !!file;
      return {
        key: f[0], x: f[1], name: f[2], action: f[3], ready: ready, file: ready ? file : '',
        note: !ready ? 'Not built yet' : f[0] === 'web' ? 'Ready to open' : file || f[4]
      };
    });
  }

  /**
   * The report line under the exports: the checker's errors (validation.errors), then placeholders. With 0 errors every
   * number traced, since an untraced number is an error (engine/deck/validate.py numbers_trace). { known, errors, line }.
   */
  function reportLine(data) {
    var x = isObj(data) ? data : {}, v = isObj(x.validation) ? x.validation : null, t = toSupply(x).count;
    var ph = 'placeholders ' + (t ? t + ' to supply' : 'none');
    if (!v || !Number.isInteger(v.errors) || v.errors < 0) return { known: false, errors: null, line: 'No check report yet, ' + ph };
    var e = v.errors;
    return { known: true, errors: e, line: e === 0 ? '0 errors, every number traced, ' + ph : e + (e === 1 ? ' error' : ' errors') + ' to fix, see Checks on Review, ' + ph };
  }

  return {
    appendixOf: appendixOf, deckApproval: deckApproval, approveDeck: approveDeck, exportRows: exportRows, reportLine: reportLine,
    AGENTS: AGENTS, ACTIVITY_WORD: ACTIVITY_WORD, circleSvg: circleSvg, agentState: agentState, circleSizeFor: circleSizeFor, circleSays: circleSays, arcPath: arcPath, blend: blend, runView: runView,
    upstreamSummary: upstreamSummary, documentsOf: documentsOf, builtFrom: builtFrom, describeBuiltFrom: describeBuiltFrom,
    canBuild: canBuild, gapView: gapView, questionState: questionState, answerPatch: answerPatch,
    DECK_TYPES: DECK_TYPES, deckTypeOf: deckTypeOf, typeHints: typeHints, kindOfType: kindOfType, typePatch: typePatch,
    researchRequest: researchRequest, upstreamChanged: upstreamChanged,
    supplyCards: supplyCards, toSupply: toSupply, confirmList: confirmList, verifyPatch: verifyPatch, sourcedCounts: sourcedCounts,
    isPlaceholder: isPlaceholder, presented: presented, refsOf: refsOf, evidenceFor: evidenceFor,
    statusOf: statusOf, STATUS: STATUS, checksFor: checksFor, approveGate: approveGate, gateRequest: gateRequest,
    GATES: GATES, gateView: gateView, gateHolds: gateHolds, summaryOf: summaryOf, agencyShown: agencyShown,
    isObj: isObj, own: own
  };
})();
</script>

<script>
(function () {
  'use strict';
  var L = DeckLogic;

  // ── host contract (same as the other apps) ────────────────────────────
  function data() { return (window.__CLAN__ && window.__CLAN__.data) || {}; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('on'); }, 3200); }
  function put(obj, action, rationale) {
    if (!window.clan || !window.clan.patchData) { toast('No host bridge: changes are not being saved.'); return Promise.resolve(); }
    return window.clan.patchData(obj, { actor: 'human', action: action, rationale: rationale || '', pinned: false });
  }

  // View state only. Anything the document should keep is written with put().
  var view = { screen: null, slide: null, tab: 'evidence', present: 0, appendix: false };
  var qdraft = {}; // free-text answers typed but not saved, by question id
  var pending = {}; // inputs picked on the Start screen, written when Build is pressed
  var upChanged = []; // sources the host says changed since this deck; empty when the call fails or is absent
  var upLoaded = false;
  var clanScheme = navigator.userAgent.indexOf('Windows') !== -1 ? 'http://clan.localhost' : 'clan://localhost';

  function d() {
    var x = data();
    return {
      inputs: Object.assign({ prompt: {}, kind: 'agency', format: 'pitch', library: { enabled: false } }, x.inputs || {}),
      raw: x, upstream: x.upstream || {}, intake: x.intake || {}, asked: x.research_request || null,
      run: x.run || { state: 'draft', stages: [], gate: null, approvals: {} },
      deck: x.deck || { order: [], slides: {} },
      evidence: x.evidence || {}, validation: x.validation || {}, report: x.report || {}, exports: x.exports || {},
      changes: x.change_requests || []
    };
  }

  function screenOf(s) {
    if (view.screen) return view.screen;
    if (s.run.state === 'done') return 'review';
    // A failed run is shown where it failed, on Build, with what it was doing and a retry.
    if (s.run.state === 'gate' || s.run.state === 'building' || s.run.state === 'failed') return 'build';
    return 'start';
  }

  // ── pieces ────────────────────────────────────────────────────────────

  function bar(s, scr) {
    var p = s.inputs.prompt;
    var title = (p.client && p.project) ? esc(p.client) + ' · ' + esc(p.project) : 'New deck';
    var steps = [['start', 'Start'], ['build', 'Build'], ['review', 'Review'], ['present', 'Present']];
    var v = s.validation;
    var chip = s.run.state === 'done' || scr === 'review'
      ? '<span class="chip ' + ((v.errors || 0) ? 'warn' : 'ok') + '">' + (v.errors || 0) + ' errors · ' + L.toSupply(s.raw).count + ' to supply</span>' : '';
    var cost = (s.run.cost_usd != null && scr !== 'start') ? '<span class="chip cost">$' + Number(s.run.cost_usd).toFixed(2) + ' so far</span>' : '';
    return '<header class="bar"><span class="crumb">' + title + '</span>' + chip +
      '<div class="spacer"></div>' + cost +
      '<nav class="steps" aria-label="Deck steps">' + steps.map(function (st) {
        return '<button data-go="' + st[0] + '"' + (scr === st[0] ? ' aria-current="step"' : '') + '>' + st[1] + '</button>';
      }).join('') + '</nav></header>';
  }

  function pick(name, id, cur, title, note) {
    return '<button class="pick" data-' + name + '="' + id + '" aria-pressed="' + (cur === id) + '"><b>' + esc(title) + '</b><span>' + esc(note) + '</span></button>';
  }

  // ── 1 · Start ─────────────────────────────────────────────────────────
  /** A draft value typed on Start and not yet written, else the stored one. */
  function draft(key, stored) { return pending[key] != null ? pending[key] : (stored || ''); }

  /** The "Built from: ..." line and what is missing, for a built_from record. */
  function builtLine(bf, hasPrompt) {
    var x = L.describeBuiltFrom(bf, hasPrompt);
    return '<div class="bf" data-built-from>' + esc(x.line) + (x.type ? '<span>Deck type: ' + esc(x.type) + '</span>' : '') + x.missing.map(function (m) { return '<span class="miss">' + esc(m) + '</span>'; }).join('') + '</div>';
  }

  /** The "What kind of deck?" selector: the q_deck_type question as four cards, the inferred one highlighted with its quote, skippable. */
  function typeSelector(s) {
    var t = L.deckTypeOf(s.raw), on = t.source !== 'default';
    var cards = L.DECK_TYPES.map(function (x) {
      var tag = on && x.id === t.id ? '<span class="tag">' + (t.source === 'answered' ? 'Your choice' : 'Suggested') + '</span>' : '';
      return '<button class="pick" data-dtype="' + esc(x.id) + '" aria-pressed="' + (on && x.id === t.id) + '"><b>' + esc(x.label) + '</b><span>' + esc(x.one_line) + '</span>' + tag + '</button>';
    }).join('');
    var looks = L.DECK_TYPES.filter(function (x) { return x.id === t.id; })[0].looks;
    var say = t.source === 'inferred' && t.quote ? 'Looks like ' + looks + ': you wrote "' + t.quote + '"'
      : t.source === 'inferred' ? 'Looks like ' + looks
      : t.source === 'answered' ? 'Building ' + looks.replace(/^an? /, 'a ') + '. You can change this.'
      : 'Defaults to agency pitch';
    var hints = L.typeHints(t.id);
    return '<section class="card sec" id="deck-type"><div class="sec-h"><b>What kind of deck?</b><div class="spacer"></div>' +
      '<span class="pill ' + (t.source === 'answered' ? 'ok' : 'plain') + '">' + (t.source === 'answered' ? 'Chosen' : t.source === 'inferred' ? 'Suggested' : 'Optional') + '</span></div>' +
      '<div class="types">' + cards + '</div>' +
      '<p class="note" style="margin-top:10px" data-type-say>' + esc(say) + '</p>' +
      '<div class="hint" data-type-hints>' + esc(hints.line) + '</div>' +
      (on ? '' : '<div style="margin-top:10px"><button class="btn sm" data-dtskip="1"' + (t.skipped ? ' aria-pressed="true"' : '') + '>' + (t.skipped ? 'Skipped' : 'Skip') + '</button></div>') +
      '</section>';
  }

  /** The Check panel: the gap report, up to 5 questions, each skippable. Nothing here gates Build. */
  function checkPanel(s) {
    var g = L.gapView(s.intake);
    if (!g.hasGaps && !g.questions.length) return '';
    function gapList(title, rows) {
      return rows.length ? '<div style="margin-top:10px"><div class="eyebrow" style="margin-bottom:6px">' + esc(title) + '</div>' + rows.map(function (r) {
        return '<div class="li" style="margin-top:6px"><span class="dot"></span><span><b style="font-weight:600">' + esc(r.name) + '</b>' + (r.why ? ' <span class="note">' + esc(r.why) + '</span>' : '') + '</span></div>';
      }).join('') + '</div>' : '';
    }
    var qs = g.questions.map(function (q) {
      if (q.kind === 'supply') return supplyCard(q);
      var head = '<div class="qt">' + esc(q.text) + '</div>' + (q.address ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">' + esc(q.address) + '</div>' : '');
      if (q.state !== 'open') {
        var said = q.state === 'skipped' ? 'Skipped' : 'Answered: ' + esc(q.answer.text || ((q.options.filter(function (o) { return o.id === q.answer.option_id; })[0] || {}).label) || q.answer.option_id);
        return '<div class="q">' + head + '<div style="margin-top:8px"><span class="pill ' + (q.state === 'skipped' ? 'plain' : 'ok') + '">' + said + '</span></div></div>';
      }
      return '<div class="q">' + head + '<div class="opts">' + q.options.map(function (o) {
        return '<button class="btn sm" data-qopt="' + esc(o.id) + '" data-q="' + esc(q.id) + '">' + esc(o.label) + '</button>';
      }).join('') + '<button class="btn sm" data-qskip="' + esc(q.id) + '">Skip</button></div>' +
        (q.allow_text ? '<div class="free"><input class="inp" style="height:36px" id="qt_' + esc(q.id) + '" placeholder="Or say it in your own words" /><button class="btn sm" data-qtext="' + esc(q.id) + '">Save</button></div>' : '') + '</div>';
    }).join('');
    return '<section class="card sec" id="check"><div class="sec-h"><span class="mono eyebrow">04</span><b>Check</b><div class="spacer"></div>' +
      '<span class="pill ' + (g.hasGaps ? 'warn' : 'ok') + '">' + (g.hasGaps ? 'Gaps found' : 'No gaps') + '</span></div>' +
      '<p class="note">What the deck cannot fill from what you gave it. Answer what you can, skip the rest: Build never waits for these.</p>' +
      gapList('Brief fields nothing supports', g.brief_fields) + gapList('Slide types that would be thin', g.slide_types) +
      (qs ? '<div style="margin-top:12px">' + qs + '</div>' : '') + strengthen(s, g) + '</section>';
  }

  /** One supply card: the question, free text (one item per line) and Skip; once answered, the lines the person gave and a skip or answered pill. */
  function supplyCard(q) {
    var head = '<div class="qt">' + esc(q.text) + '</div><div class="hint-line">Only you know this. Whatever you write goes on the slide as you wrote it.</div>';
    if (q.state !== 'open') {
      var lines = L.supplyCards({ intake: { questions: [{ id: q.id, text: q.text, kind: 'supply', fills: q.fills }], answers: (function () { var a = {}; a[q.id] = q.answer; return a; })() } })[0].lines;
      return '<div class="q sup" data-supply="' + esc(q.id) + '">' + head + '<div style="margin-top:8px"><span class="pill ' + (q.state === 'skipped' ? 'plain' : 'ok') + '">' + (q.state === 'skipped' ? 'Skipped' : 'Supplied by you') + '</span></div>' +
        (lines.length ? '<ul class="note" style="margin:8px 0 0 18px">' + lines.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
    }
    return '<div class="q sup" data-supply="' + esc(q.id) + '">' + head + '<textarea class="inp ta" style="min-height:76px;margin-top:8px" id="qt_' + esc(q.id) + '" placeholder="One per line"></textarea>' +
      '<div class="opts"><button class="btn sm" data-qtext="' + esc(q.id) + '">Save</button><button class="btn sm" data-qskip="' + esc(q.id) + '">Skip</button></div></div>';
  }

  /** The supply cards on Review: what only you know, one card each, while any is open or answered. Empty when the engine asked none. */
  function supplyPanel(s) {
    var cards = L.gapView(s.intake).questions.filter(function (q) { return q.kind === 'supply'; });
    if (!cards.length) return '';
    var t = L.toSupply(s.raw);
    return '<div class="card" style="padding:16px" id="supply"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px;font-weight:600">To supply</b><div class="spacer"></div>' +
      '<span class="pill ' + (t.count ? 'warn' : 'ok') + '" data-to-supply>' + t.count + ' to supply</span></div>' +
      '<p class="note" style="margin-top:4px;font-size:12px">The deck never invents these. Give them here and the slide fills when the deck is built again.</p>' + cards.map(supplyCard).join('') + '</div>';
  }

  /** The Confirm list: every proposal, every figure only your own words support and every slide still needing a person, each with a Verify button. Empty when the deck has none. */
  function confirmPanel(s) {
    var c = L.confirmList(s.raw);
    if (!c.total) return '';
    var kinds = { proposal: 'Proposal', figure: 'Figure', slide: 'Needs you' };
    var rows = c.items.map(function (x) {
      return '<div class="conf' + (x.verified ? ' done' : '') + '" data-confirm="' + esc(x.ref) + '"><span class="pill ' + (x.verified ? 'ok' : x.kind === 'slide' ? 'warn' : 'plain') + '">' + (x.verified ? 'Verified' : kinds[x.kind]) + '</span>' +
        '<span class="what">' + esc(x.text) + '<small>' + esc(x.why) + '</small></span>' +
        (x.verified ? '' : '<button class="btn sm" data-verify="' + esc(x.ref) + '">Verify</button>') + '</div>';
    }).join('');
    return '<div class="card" style="padding:16px" id="confirm"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px;font-weight:600">Confirm list</b><div class="spacer"></div>' +
      '<span class="pill ' + (c.open ? 'warn' : 'ok') + '" data-confirm-count>' + c.verified + ' of ' + c.total + ' verified</span></div>' +
      '<p class="note" style="margin:4px 0 6px;font-size:12px">Only what you verify or supply counts as sourced. Verifying records your decision; it changes no slide.</p>' + rows + '</div>';
  }

  /** The Strengthen offer, shown when there are gaps. Pressing it records a request and launches nothing. */
  function strengthen(s, g) {
    if (!g.hasGaps) return '';
    var asked = s.asked && s.asked.status === 'asked';
    return '<div class="rule"></div><div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b style="font-size:14px;font-weight:600">Strengthen with research</b>' +
      '<p class="note" style="margin-top:4px">The Research Tool can look for facts to fill these gaps. It only runs when you say yes, and nothing from outside your own material reaches a slide without it. A research run takes minutes and counts against your quota.</p></div>' +
      '<button class="btn" id="strengthen"' + (asked ? ' aria-pressed="true"' : '') + '>' + (asked ? 'Asked' : 'Strengthen with research') + '</button></div>';
  }

  /** The Brief and Research cards: derived from data.upstream, never stored, Optional when absent. */
  function upstreamCards(s) {
    var u = L.upstreamSummary({ upstream: s.upstream });
    var attached = '<span class="pill ok">Brought in</span>', opt = '<span class="pill plain">Optional</span>';
    var r = u.research, b = u.brief;
    var changed = upChanged.length ? '<div class="upnote" role="status" data-up-changed><b>' + esc(upChanged.map(function (c) { return c.title; }).join(', ')) + ' changed since this deck.</b> This deck keeps it as it was; it does not take the newer one on its own.</div>' : '';
    return '<div class="eyebrow dark">Bring in a brief or research (optional)</div>' + changed + '<div class="two">' +
      '<section class="card sec"><div class="sec-h"><span class="mono eyebrow">03</span><b>Research</b><div class="spacer"></div>' + (r ? attached : opt) + '</div>' +
        (r ? '<div class="doc"><span class="ico">.clan</span><div><div style="font-size:14px;font-weight:600">' + esc(r.name) + '</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + (r.findings == null ? 'report brought in' : esc(r.findings) + ' findings · ' + esc(r.rejected) + ' rejected') + '</div></div></div>' +
          '<p class="note" style="margin-top:10px">Rejected findings are never used on a slide.' + (r.findings == null ? ' Finding counts show once the Research Tool shares them.' : '') + '</p>' : '<p class="note">No research brought in. Start one from a Research Tool document with Spin off.</p>') + '</section>' +
      '<section class="card sec"><div class="sec-h"><span class="mono eyebrow">03</span><b>Brief</b><div class="spacer"></div>' + (b ? attached : opt) + '</div>' +
        (b ? '<div class="doc"><span class="ico">.clan</span><div><div style="font-size:14px;font-weight:600">' + esc(b.name) + '</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + esc(b.fields_filled) + ' of ' + esc(b.fields_total) + ' fields · ' + esc(b.mandatories) + ' mandatories</div></div></div>' +
          '<p class="note" style="margin-top:10px">Mandatories become requirements the deck must answer.</p>' : '<p class="note">No brief brought in. The deck builds from your prompt and documents.</p>') + '</section></div>';
  }

  function start(s) {
    var inp = s.inputs, p = inp.prompt || {};
    var dt = L.deckTypeOf(s.raw), typed = dt.source === 'answered';
    var kind = typed ? L.kindOfType(dt.id) : (pending.kind || inp.kind), format = pending.format || inp.format;
    var docs = L.documentsOf(s.raw);
    var sum = L.summaryOf({ prompt: p, kind: kind, format: format, type: typed ? dt.id : null }, s.deck);
    var text = draft('text', p.text);
    var bf = L.builtFrom(inp, s.upstream, docs, typed ? dt.id : null);
    function field(id, lab, val, ph) {
      return '<div><label class="lab" for="' + id + '">' + lab + '</label><input class="inp" id="' + id + '" value="' + esc(draft(id, val)) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + ' /></div>';
    }
    var hasText = !!String(text).trim();
    var docList = docs.length ? docs.map(function (x) {
      return '<div class="doc" style="margin-bottom:8px"><span class="ico">DOC</span><div><div style="font-size:14px;font-weight:600">' + esc(x.name) + '</div>' + (x.pages ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + esc(x.pages) + ' pages</div>' : '') + '</div></div>';
    }).join('') : '<p class="note">No documents attached. Attach a client brief, a deck or notes and every figure on a slide can point back to it.</p>';
    return '<main class="start"><div>' +
      '<div class="eyebrow">New deck</div>' +
      '<h1 style="margin:10px 0 6px">What are we pitching?</h1>' +
      '<p class="lede" style="margin-bottom:28px">Tell us in a line or paste everything you have, and attach any documents. A brief or research is optional. Nothing else is used, so every line on a slide traces back to what you gave.</p>' +
      '<div class="stack">' + typeSelector(s) +
      '<section class="card sec"><div class="sec-h"><span class="mono eyebrow">01</span><b>Your prompt</b><div class="spacer"></div>' +
        '<span class="pill ' + (hasText ? 'ok' : 'plain') + '">' + (hasText ? 'Ready' : 'A line is enough') + '</span></div>' +
        '<div class="three">' + field('client', 'Client', p.client) + field('project', 'Project', p.project) + field('agency', 'Agency (optional)', p.agency, 'Shows as [Agency]') + '</div>' +
        '<div style="margin-top:14px"><label class="lab" for="ptext">What are we pitching? (a line is enough; paste everything you have)</label><textarea class="inp ta" id="ptext">' + esc(text) + '</textarea></div></section>' +
      '<section class="card sec"><div class="sec-h"><span class="mono eyebrow">02</span><b>Documents</b><div class="spacer"></div><span class="pill ' + (docs.length ? 'ok' : 'plain') + '">' + (docs.length ? docs.length + ' attached' : 'Optional') + '</span></div>' +
        docList + '<div style="margin-top:10px"><label class="btn sm" style="display:inline-flex;align-items:center" for="attach">Attach files</label><input type="file" id="attach" multiple style="position:absolute;left:-9999px" aria-label="Attach documents" />' +
        '<p class="note" style="margin-top:8px">Attaching needs the host. Files stay in this document.</p></div></section>' +
      upstreamCards(s) +
      checkPanel(s) +
      '<div class="two">' + (typed ? '' : '<div><div class="eyebrow dark" style="margin-bottom:8px">Kind of deck</div><div class="row">' +
        pick('kind', 'agency', kind, 'Agency pitch', 'Territories, one idea, executions') + pick('kind', 'investor', kind, 'Investor deck', 'Problem, market, traction, ask') +
      '</div></div>') + '<div><div class="eyebrow dark" style="margin-bottom:8px">Length</div><div class="row">' +
        pick('format', 'pitch', format, 'Pitch · 18 slides', 'Then an appendix of backup') + pick('format', 'full', format, 'Full story', 'Every slide in story order') +
      '</div></div></div></div></div>' +
      '<aside class="stack">' +
      '<div class="frost summary"><div class="eyebrow">You will get</div><div class="t">' + esc(sum.title) + '</div><div class="note">' + esc(sum.note) + '</div><div class="rule"></div>' +
        builtLine(bf, hasText) + '<div class="rule"></div>' +
        '<div class="li"><span class="dot"></span><span><b style="font-weight:600">Web deck</b> to present in a browser, with a presenter view</span></div>' +
        '<div class="li"><span class="dot"></span><span><b style="font-weight:600">PowerPoint</b> with notes and the appendix hidden</span></div>' +
        '<div class="li"><span class="dot"></span><span><b style="font-weight:600">Animated deck</b> you can present from HyperFrames</span></div>' +
        '<div class="rule"></div><p class="note">You approve the storyline and pick a territory on the way. Then you review the finished deck.</p>' +
        '<button class="btn go big" id="build" style="width:100%;margin-top:18px;height:48px">Build deck</button>' +
        '<p class="mono" style="margin-top:10px;text-align:center;font-size:11px;color:var(--ink3)">' + (s.run.stages.length ? 'Opens the recorded run. Live building needs the engine server.' : 'Live building needs the engine server.') + '</p></div>' +
      library(s) + '</aside></main>';
  }

  // The team-library shelf is off until ADR 0027 (the amendment to the deck input rule, ADR 0023) is approved.
  function library(s) {
    if (!s.inputs.library || !s.inputs.library.enabled) {
      return '<div class="lib off"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:14px;font-weight:600">From the team library</b><span class="pill plain">Off</span></div>' +
        '<p class="note" style="margin-top:8px">A brand kit and pictures from your team library would be optional inputs. That changes the rule that a deck takes only the prompt, the research and the brief, so it stays off until that rule change is approved.</p></div>';
    }
    return '<div class="lib"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:14px;font-weight:600">From the team library</b><span class="note">optional</span></div>' +
      '<p class="note" style="margin-top:10px">Pictures replace the "illustrative" placeholders. Font files are never taken from a PDF.</p></div>';
  }

  /** The built_from the engine recorded on the deck, else what Start would compute from the document. */
  function builtOf(s) {
    var m = s.deck && s.deck.meta && s.deck.meta.built_from;
    return m && m.tier ? m : L.builtFrom(s.inputs, s.upstream, L.documentsOf(s.raw), L.deckTypeOf(s.raw).source !== 'default' ? L.deckTypeOf(s.raw).id : null);
  }

  // ── 2 · Build, with gates ─────────────────────────────────────────────
  // A gate is drawn from the registry (L.gateView): its head, Dex's note, its body (the storyline's beats, gate 2's
  // territories, gate 3's idea) and its actions. Gate 1's markup is the same as before the registry, byte for byte.
  function gateHead(gv) {
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span class="pill warn">Needs you</span><span class="eyebrow">Gate ' + esc(gv.n) + ' of ' + esc(gv.of) + '</span></div>' +
      '<h1 class="sm" style="margin-bottom:6px">' + esc(gv.title) + '</h1>' +
      '<p class="note" style="font-size:15px;max-width:600px;margin-bottom:20px">' + esc(gv.lede) + '</p>';
  }

  /** Dex's note at the top of the gate card, beside the circle of the agent holding the work. Notes written for gates 2 and 3 are marked as proposed. */
  function dexRow(gv, who) {
    return '<div class="dex">' + L.circleSvg({ agent: who.agent, activity: 'human', size: 32 }) + '<span class="mono" style="font-size:12px">Dex · directs</span><span class="note">' + esc(gv.dex) + '</span>' +
      (gv.dex_proposed && gv.dex ? '<span class="pill plain dexp" title="Dex\'s note here is our proposed wording, not yet agreed">Proposed</span>' : '') + '</div>';
  }

  var BASES = { brief: ['From brief', 'ok'], research: ['From research', 'ok'], proposal: ['Our proposal', 'warn'], placeholder: ['Placeholder', 'warn'] };

  function gateBody(gv, gate) {
    if (gv.body === 'beats') {
      return (Array.isArray(gate.beats) ? gate.beats : []).filter(L.isObj).map(function (b) {
        var c = L.own(BASES, b.basis) ? BASES[b.basis] : BASES.brief;
        return '<div class="beat"><span class="n">' + esc(b.n) + '</span><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;line-height:1.35">' + esc(b.title) + '</div><div class="mono eyebrow" style="margin-top:3px;text-transform:none;letter-spacing:0">' + esc(b.src) + '</div></div><span class="pill ' + c[1] + '">' + c[0] + '</span></div>';
      }).join('') +
        (gate.more_beats ? '<div style="padding:11px 20px;font-size:13px;color:var(--ink3)">+ ' + esc(gate.more_beats) + ' more beats, then the appendix</div>' : '');
    }
    if (gv.body === 'territories') {
      // Each territory is a button: pressing it picks it (view state only); Pick this territory writes the pick.
      return '<div role="group" aria-label="Territories">' + gv.territories.map(function (t) {
        var on = t.id === gv.picked;
        return '<button class="beat terr" data-territory="' + esc(t.id) + '" aria-pressed="' + on + '"><span class="n">' + esc(t.n) + '</span><span class="tb">' +
          '<span class="tn"><span>' + esc(t.name) + '</span>' + (t.id === gv.first_pick ? '<span class="pill ok">Blind judge’s first pick</span>' : '') + '</span>' +
          (t.thought ? '<span class="tt">' + esc(t.thought) + '</span>' : '') + (t.why ? '<span class="tw"><b>Why it fits:</b> ' + esc(t.why) + '</span>' : '') +
          '</span><span class="sel" aria-hidden="true"></span></button>';
      }).join('') + '</div>';
    }
    if (gv.body === 'idea' && gv.idea) {
      var x = gv.idea;
      return '<div class="beat iline"><div style="flex:1;min-width:0"><div class="eyebrow" style="margin-bottom:6px">The idea line</div><div class="il">' + esc(x.line) + '</div></div>' +
          (x.basis ? '<span class="pill ' + x.basis_tone + '">' + esc(x.basis) + '</span>' : '') + '</div>' +
        x.executions.map(function (e) {
          return '<div class="beat"><span class="n">' + esc(e.n) + '</span><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;line-height:1.35">' + esc(e.channel) + '</div>' +
            (e.summary ? '<div class="ex">' + esc(e.summary) + '</div>' : '') + '</div>' + (e.tag ? '<span class="pill ' + e.tone + '">' + esc(e.tag) + '</span>' : '') + '</div>';
        }).join('') +
        (x.rests_on.length ? '<div class="rests"><div class="eyebrow">What the idea rests on</div><div class="chips">' + x.rests_on.map(function (r) {
          return '<span class="chip ' + r.tone + '">' + esc(r.label) + '</span>';
        }).join('') + '</div></div>' : '');
    }
    return '<div class="crow pending"><span class="note">Nothing to show for this gate yet.</span></div>';
  }

  /** Approve (or Pick), Edit and Ask Dex. Edit and Ask Dex record a request; once one waits, the gate says so. */
  function gateActions(gv) {
    var none = gv.body === 'territories' && !gv.picked;
    var asked = gv.asked.length ? '<p class="note asked" role="status" data-asked>You asked ' + (gv.asked.indexOf('edit') >= 0 && gv.asked.indexOf('retry') >= 0 ? 'for an edit and a new try'
      : gv.asked.indexOf('edit') >= 0 ? 'for an edit' : 'Dex to try again') + '. It waits for the engine, which is not connected yet; nothing has changed.</p>' : '';
    return '<div style="margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><button class="btn go big" id="approve"' + (none ? ' disabled' : '') + '>' + esc(gv.approve) + '</button>' +
      '<button class="btn big" style="padding:0 20px;font-size:14px" data-edit="' + esc(gv.edit_key) + '">' + esc(gv.edit_label) + '</button><button class="btn big" style="padding:0 20px;font-size:14px" data-retry="' + esc(gv.id) + '">Ask Dex to try again</button></div>' +
      (gv.body === 'beats' ? '' : '<p class="note" style="margin-top:12px;font-size:13px">' + (none ? 'Pick a territory first. ' : '') + 'Every approve, edit or retry is recorded with who did it.</p>') + asked;
  }

  function build(s) {
    var run = s.run, gate = run.gate, who = L.agentState(run); // the circle: who is working and what they are doing
    var stages = run.stages.map(function (st) {
      var glyph = st.status === 'done' ? '✓' : st.status === 'now' ? '•' : st.status === 'failed' ? '!' : '';
      return '<div class="stage ' + st.status + '"><span class="ring ' + st.status + '" aria-hidden="true">' + glyph + '</span><div><b>' + esc(st.name) + '</b><span class="s">' + esc(st.sub) + '</span></div></div>';
    }).join('');
    var main, gv = gate ? L.gateView(run, view.pick) : null; // the gate registry: words and body for the open gate
    if (gate) main = gateHead(gv) + '<div class="card" style="overflow:hidden">' + dexRow(gv, who) + gateBody(gv, gate) + '</div>' + gateActions(gv);
    // With no gate open: running (a live feed), failed, done, or waiting for an engine that is not connected.
    var rv = gate ? null : L.runView(run, s.deck), live = rv && rv.kind !== 'waiting';
    if (rv && !live) {
      main = '<h1 class="sm" style="margin-bottom:6px">' + (rv.title ? esc(rv.title) : 'Waiting') + '</h1>' +
        '<p class="note" style="font-size:15px;max-width:600px">' + (rv.title ? 'Next in line. This step is waiting for the engine, which is not connected to this document yet.' : 'Nothing is running.') + '</p>';
    } else if (live) main = runBody(rv);
    // A gate's own checks when it wrote them (even none), else what the run has checked.
    var gateChecks = !!gate && Array.isArray(gate.checks), list = gateChecks ? gate.checks : run.checks;
    var checks = Array.isArray(list) && (gateChecks || list.length) ? checkedCard(list) : '';
    return '<main class="build"><aside class="frost" style="padding:20px"><div class="eyebrow" style="margin-bottom:14px">How the deck gets built</div>' + stages + '</aside>' +
      '<section>' + main + '</section><aside class="stack">' + (live ? statusCard(who) :
      (gate ? '<div class="card" style="padding:20px"><div style="display:flex;align-items:center;gap:12px">' + L.circleSvg({ agent: who.agent, activity: who.activity, size: 60 }) +
        '<div><div style="font-size:14px;font-weight:600">Waiting for you</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + esc(gv.hold) + '</div></div></div><div class="rule"></div>' +
        '<p class="note">' + esc(gv.next) + '</p></div>' : waitingCard(who))) +
      (live ? checks + builtLine(builtOf(s)) : builtLine(builtOf(s)) + checks) + '<div class="note" style="background:var(--soft);border-radius:18px;padding:16px 20px">Things you must supply, like the presenter or the budget split, show as labelled placeholders. They are never made up.</div></aside></main>';
  }

  /** Checked so far: what the run has checked (a gate's checks, or run.checks), each passed or to look at. */
  function checkedCard(list) {
    return '<div class="card" style="padding:20px"><div class="eyebrow" style="margin-bottom:12px">Checked so far</div><div class="stack" style="gap:10px">' +
      list.filter(function (c) { return c && typeof c === 'object'; }).map(function (c) { return '<div class="check"><span class="tick ' + (c.ok ? 'ok' : 'warn') + '" aria-hidden="true">' + (c.ok ? '✓' : '!') + '</span><span>' + esc(c.text) + '</span></div>'; }).join('') + '</div></div>';
  }

  var HINT = 'Press the circle to ask what is happening.';

  /**
   * The circle in a status card. At 60px it is just the circle (the card says the name and the word, so it is hidden from
   * screen readers). Enlarged (circleSizeFor) it is a real button that says the agent and the state once, and pressing it
   * (data-orb) shows a few honest lines under it.
   */
  function orbHtml(who, name) {
    var size = L.circleSizeFor(who), svg = L.circleSvg({ agent: who.agent, to: who.to, activity: who.activity, word: who.word, size: size, aria: 'hidden' });
    if (size === 60) return '<span class="slot">' + svg + '</span>';
    return '<span class="slot big"><button type="button" class="orbb" data-orb aria-label="' + esc(name + ', ' + who.word + '. Press to ask what is happening.') + '">' + svg + '</button></span>';
  }
  function nameOf(who) {
    var A = L.AGENTS, a = A[who.agent], b = who.handoff ? A[who.to] : null;
    return { name: a ? a.name + (b ? ' → ' + b.name : '') : 'Agent', role: a ? a.role + (b ? ' → ' + b.role : '') : '' };
  }
  function sayHtml(who) { return L.circleSizeFor(who) === 60 ? '' : '<p class="say" data-say aria-live="polite">' + HINT + '</p>'; }

  /** The status card while an agent works: the circle (60px, or enlarged in place while it works), who (a hand-off names both), their role, the state word, the step. */
  function statusCard(who) {
    var n = nameOf(who), name = n.name, role = n.role, big = L.circleSizeFor(who) !== 60;
    var tone = who.activity === 'complete' ? ' ok' : who.activity === 'error' ? ' err' : '';
    return '<div class="card status' + (big ? ' hero' : '') + '" style="padding:20px" data-status="' + esc(who.activity) + '"><div class="srow">' + orbHtml(who, name) +
      '<div class="stext"><div style="font-size:14px;font-weight:600">' + esc(name) + '</div>' + (role ? '<div class="note">' + esc(role) + '</div>' : '') +
      '<div class="sword' + tone + '">' + esc(who.word) + '</div>' +
      (who.step_index ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">Step ' + who.step_index + ' of ' + who.step_total + '</div>' : '') +
      '</div></div>' + sayHtml(who) + '</div>';
  }

  /** The card while the engine is not connected: the same enlarged circle in its place, a short honest prompt, no time and no progress. */
  function waitingCard(who) {
    var n = nameOf(who);
    return '<div class="card status hero" style="padding:20px" data-status="' + esc(who.activity) + '"><div class="srow">' + orbHtml(who, n.name) +
      '<div class="stext"><div style="font-size:16px;font-weight:700">Waiting for the engine</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">Not connected to this document yet</div></div></div>' +
      sayHtml(who) + '<div class="rule"></div><p class="note">Once the engine is connected it runs to the next gate and stops there.</p></div>';
  }

  /** One mark for a content-box row: done, now (a small turning arc), still to come, failed, or to supply. */
  function rowMark(st) {
    if (st === 'now') return '<span class="mk now" aria-hidden="true"><svg width="20" height="20" viewBox="-1.2 -1.2 2.4 2.4"><circle r="1" fill="none" class="mk-track"/><path d="' + L.arcPath(0, 0, 1, -Math.PI / 2, 2.2) + '" fill="none" class="mk-arc"/></svg></span>';
    return '<span class="mk ' + st + '" aria-hidden="true">' + (st === 'done' ? '✓' : st === 'failed' || st === 'supply' ? '!' : '') + '</span>';
  }
  var PILL_TONE = { done: 'ok', now: 'warn', pending: 'wait', failed: 'fail', supply: 'warn' };

  /** The running, failed and done views: title, the line under it, the content box of what is being done, then the action. */
  function runBody(v) {
    var rows = v.grid
      ? '<div class="cgrid">' + v.items.map(function (x) {
          return '<div class="cslide ' + x.status + '"><div style="display:flex;align-items:center;gap:8px"><span class="mono" style="font-size:12px;color:var(--ink3)">' + esc(x.n) + '</span><div class="spacer"></div>' +
            '<span class="pill ' + PILL_TONE[x.status] + '">' + esc(x.pill) + '</span></div><div class="t">' + esc(x.title) + '</div></div>';
        }).join('') + '</div>'
      : v.items.map(function (x) {
          return '<div class="crow ' + x.status + '">' + rowMark(x.status) + '<div style="flex:1;min-width:0"><div class="t">' + (x.n ? '<span class="mono n">' + esc(x.n) + '</span>' : '') + esc(x.title) + '</div>' +
            (x.sub ? '<div class="mono eyebrow" style="margin-top:3px;text-transform:none;letter-spacing:0">' + esc(x.sub) + '</div>' : '') + '</div><span class="pill ' + PILL_TONE[x.status] + '">' + esc(x.pill) + '</span></div>';
        }).join('');
    var tail = v.tail.map(function (t) { return '<div class="ctail">' + esc(t) + '</div>'; }).join('');
    var act = v.kind === 'done' ? '<div style="margin-top:18px"><button class="btn go big" data-go="review">Open the deck</button></div>'
      : v.kind === 'failed' ? '<div style="margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><button class="btn big' + (v.retryable ? '' : ' go') + '" style="padding:0 20px;font-size:14px" data-retry="' + esc(v.stage) + '">' + (v.retryable ? 'Try again now' : 'Try again') + '</button>' +
        '<span class="note">Nothing you approved is lost. The run starts again from this step.</span></div>' : '';
    return '<h1 class="sm" style="margin-bottom:6px">' + esc(v.title) + '</h1>' +
      '<p class="note" style="font-size:15px;max-width:600px;margin-bottom:20px">' + esc(v.lede) + '</p>' +
      '<div class="card cbox' + (v.kind === 'failed' ? ' failed' : '') + '" data-run="' + esc(v.kind) + '"><div class="cbox-h eyebrow">' + esc(v.head) + '</div>' + (rows || '<div class="crow pending"><span class="note">Nothing to show yet.</span></div>') + tail + '</div>' + act;
  }

  // ── the deck's own status, on Review and Present (phase 4): the Approval agent asks for sign-off ──
  /** The circle and its word, inline: in the Review head beside Approve the deck, and in the Export card's head. The word is beside it, so the circle says only the name. */
  function deckStat(ds) {
    var ok = ds.state === 'approved';
    return '<span class="dstat" data-deck="' + ds.state + '">' + L.circleSvg({ agent: ds.agent, activity: ds.activity, word: ds.word, size: 32, aria: 'name' }) +
      '<span class="dword' + (ok ? ' ok' : '') + '">' + esc(ds.word) + '</span></span>';
  }

  /** The status card: the 60px circle, Approval and its role, the word, then the step or who approved. The card says the name and word, so the circle is hidden from screen readers. */
  function deckCard(ds) {
    var ok = ds.state === 'approved';
    var foot = ok && ds.by ? 'Approved by ' + ds.by : ds.step_index ? 'Step ' + ds.step_index + ' of ' + ds.step_total : '';
    return '<div class="card status" style="padding:16px" data-status="' + ds.activity + '" data-deck="' + ds.state + '"><div style="display:flex;align-items:center;gap:14px">' +
      L.circleSvg({ agent: ds.agent, activity: ds.activity, word: ds.word, size: 60, aria: 'hidden' }) +
      '<div style="min-width:0"><div style="font-size:14px;font-weight:600">' + esc(ds.name) + '</div><div class="note">' + esc(ds.role) + '</div>' +
      '<div class="sword' + (ok ? ' ok' : '') + '">' + esc(ds.word) + '</div>' +
      (foot ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">' + esc(foot) + '</div>' : '') + '</div></div></div>';
  }

  /** The status card, then Checked so far when the run wrote it. */
  function deckSide(s, ds) {
    return deckCard(ds) + (Array.isArray(s.run.checks) && s.run.checks.length ? checkedCard(s.run.checks) : '');
  }

  /** What is still open when the deck is approved now. Approving is allowed; this says what stays marked. Empty when nothing is open. */
  function approveNote(ds) {
    if (ds.state !== 'open' || ds.clear) return '';
    var parts = [];
    if (ds.to_supply) parts.push(ds.to_supply + ' to supply');
    if (ds.open) parts.push((ds.total - ds.open) + ' of ' + ds.total + ' to confirm verified');
    return '<p class="note" data-approve-note style="margin:0 0 12px">Still open: ' + esc(parts.join(', ')) + '. You can approve the deck now; what is open stays marked on its slide.</p>';
  }

  // ── 3 · Review ────────────────────────────────────────────────────────
  function slideHtml(id, s, n, total, big) {
    var sl = s.deck.slides[id];
    var items = (sl.blocks || []).map(function (b) {
      if (L.isPlaceholder(b)) return '<li><span class="dot"></span><span class="ph"><i>To supply</i>' + esc(b.text) + '</span></li>';
      var refs = (b.refs || []).map(esc).join(', ');
      return '<li><span class="dot"></span><span>' + esc(b.text) + (refs ? '<sup>' + refs + '</sup>' : '') + '</span></li>';
    }).join('');
    return { items: items, sl: sl };
  }

  function review(s) {
    var ids = L.presented(s.deck);
    if (!ids.length) return '<main class="review" style="display:block;max-width:640px"><h1 class="sm" style="margin-top:40px">No deck yet</h1><p class="lede" style="margin-top:8px">Build a deck first. Nothing to review until the engine has written one.</p></main>';
    // The appendix opens in the rail when the deck names its slides (appendix_ids, or slide.appendix); a count alone stays a count.
    var ax = L.appendixOf(s.deck), ds = L.deckApproval(s.raw);
    if (!view.slide || (ids.indexOf(view.slide) < 0 && ax.ids.indexOf(view.slide) < 0)) view.slide = ids[Math.min(3, ids.length - 1)];
    var id = view.slide, sl = s.deck.slides[id], k = ax.ids.indexOf(id), inAx = k >= 0, n = inAx ? k + 1 : ids.indexOf(id) + 1;
    if (inAx) view.appendix = true;
    var st = L.STATUS[L.statusOf(sl)];
    var agency = L.agencyShown({ prompt: { agency: s.deck.meta && s.deck.meta.agency } });
    // A pitch slide goes by its section; every appendix slide shares the section Appendix, so it goes by its title.
    var thumb = function (sid, label, name) {
      var x = s.deck.slides[sid], t = L.STATUS[L.statusOf(x)];
      return '<button class="thumb" data-slide="' + sid + '"' + (sid === id ? ' aria-current="true"' : '') + '><span class="n">' + label + '</span>' +
        '<span><span class="t">' + esc(name) + '</span><span class="st ' + t.tone + '">' + t.label + '</span></span></button>';
    };
    var rail = ids.map(function (sid, i) { return thumb(sid, String(i + 1).padStart(2, '0'), s.deck.slides[sid].section); }).join('') +
      (ax.selectable && view.appendix ? '<div class="eyebrow rail-div">Appendix</div>' + ax.ids.map(function (sid, i) {
        var x = s.deck.slides[sid];
        return thumb(sid, 'A' + (i + 1), x.title || x.section);
      }).join('') : '');
    var axHead = ax.selectable
      ? '<button class="appx" data-appendix="' + (view.appendix ? 'hide' : 'show') + '" aria-expanded="' + !!view.appendix + '" aria-label="' + (view.appendix ? 'Hide' : 'Show') + ' the ' + ax.count + ' appendix slides">+ ' + ax.count + ' appendix</button>'
      : '<span class="mono eyebrow" style="text-transform:none;letter-spacing:0">+ ' + esc(ax.count) + ' appendix</span>';
    var nav = '<nav class="frost rail" aria-label="Slides"><div style="display:flex;align-items:center;margin-bottom:10px;padding:0 4px"><span class="eyebrow">' + esc(s.inputs.format === 'full' ? 'Full' : 'Pitch') + ' · ' + ids.length + '</span><div class="spacer"></div>' + axHead + '</div>' + rail + '</nav>';
    // Once the deck is finished, the Approval agent holds it: its circle in the head with Approve the deck, its card under the rail.
    var approve = ds ? deckStat(ds) + (ds.state === 'open' ? '<button class="btn go tall" id="approve-deck" data-approve="deck">Approve the deck</button>' : '') : '';
    var tabs = [['evidence', 'Evidence'], ['checks', 'Checks'], ['who', 'History']].map(function (t) {
      return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (view.tab === t[0]) + '">' + t[1] + '</button>';
    }).join('');
    var panel = '';

      var picked = gv.territories.filter(function (x) { return x.id === gv.picked; })[0];
      view.pick = null;
      put({ run: next }, 'approve ' + s.run.gate.id, 'gate ' + s.run.gate.n + ' of ' + s.run.gate.of + ' approved' + (picked ? ': picked ' + picked.name : ''));
      return;
    }
    if (a.retry && !s.run.gate) { toast('Retrying a step needs the engine server, which is not connected yet.'); return; }
    if (a.edit || a.retry) {
      // At the open gate an edit or a retry is recorded (run.decisions, run.gate_requests) and launches nothing.
      var kind = a.edit ? 'edit' : 'retry', req = s.run.gate ? L.gateRequest(s.run, s.run.gate.id, kind, 'You', now()) : null;
      if (req) put({ run: req }, kind + ' ' + s.run.gate.id, 'gate ' + s.run.gate.n + ' of ' + s.run.gate.of + ': asked, launches nothing');
      toast('Recorded. Editing and retrying a gate need the engine server.');
      return;
    }
    if (a.act === 'appendix') { toast('Moving slides to the appendix needs the engine server.'); return; }
    if (a.change) {
      var reqs = (s.changes || []).concat([{ slide: view.slide, change: a.change, at: now(), status: 'waiting' }]);
      put({ change_requests: reqs }, 'ask for a change: ' + a.change, 'slide ' + view.slide);
      toast('Recorded. The words change when the engine is connected; sources stay.');
      return;
    }
    if (a.export) {
      var row = L.exportRows(s.exports).filter(function (r) { return r.key === a.export; })[0];
      toast(row && row.file ? 'Open ' + row.file + ' from the document export.' : 'Open the file from the document export.');
      return;
    }
  });

  document.addEventListener('input', function () { stashDraft(); });

  // Attach files: the host stores each one as an asset; the list is written to inputs.documents.
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || el.id !== 'attach') return;
    var files = Array.prototype.slice.call(el.files || []);
    if (!files.length) return;
    if (!(window.clan && window.clan.uploadAsset && window.clan.patchData)) { toast('Attaching files needs the host.'); return; }
    var have = L.documentsOf(d().raw), added = [], failed = [];
    // Each file is tried on its own: one that fails does not drop the ones that went in.
    files.reduce(function (p, f) {
      return p.then(function () { return f.arrayBuffer(); }).then(function (buf) { return window.clan.uploadAsset(f.name, buf, 'human'); })
        .then(function (res) {
          if (res && (res.ok === false || res.error)) throw new Error('refused');
          added.push({ name: f.name });
        }).catch(function () { failed.push(f.name); });
    }, Promise.resolve()).then(function () {
      var done = added.length ? put({ inputs: { documents: have.map(function (x) { return { name: x.name, pages: x.pages }; }).concat(added) } }, 'attach documents', added.length + ' file(s)') : null;
      // Clear the input so choosing the failed files again does not re-upload the ones that went in.
      try { el.value = ''; } catch (e) { /* read-only in some hosts */ }
      if (failed.length) toast((added.length ? added.length + ' attached. ' : '') + 'Could not attach: ' + failed.join(', ') + '.');
      return done;
    }).catch(function () { toast('The attached files could not be saved.'); });
  });

  document.addEventListener('keydown', function (e) {
    if (screenOf(d()) !== 'present' || /INPUT|TEXTAREA/.test((e.target || {}).tagName || '')) return;
    if (e.key === 'ArrowRight') { view.present += 1; render(); }
    if (e.key === 'ArrowLeft') { view.present -= 1; render(); }
  });

  if (window.addEventListener) {
    // The bridge fires these when the document's data changes or loads, and sets data-color-scheme itself.
    window.addEventListener('clan:dataupdated', render);
    window.addEventListener('napkin:ready', render);
  }
  render();
})();
</script>
</body>
</html>
