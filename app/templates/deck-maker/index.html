<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deck Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" />
<style>
/* The studio palette, copied from app/src/index.css (a template is its own page, so it
   cannot import the shell's sheet). Light is the default; the shell pushes
   data-color-scheme, and with none set we follow the OS. --tool is the Deck tool's identity,
   as in production-tool/web/src/styles.css. --create is the one action colour. */
:root{
  --paper:#FFFFFF; --card:#FFFFFF; --soft:#F5F6F8; --soft-2:#F2F3F6; --frost:rgba(255,255,255,.82);
  --line:#D6DAE2; --line-soft:#E7E9EE; --dots:#D6DAE2; --canvas:#FAFAFB;
  --ink:#14161B; --ink2:#4A4F5C; --ink3:#737987;
  --create:#FF4F2E; --create-fg:#FFFFFF; --on-fill:#FFFFFF;
  --tool:#2F64F5; --tool-ink:color-mix(in oklab,var(--tool) 78%,var(--ink)); --tool-soft:color-mix(in oklab,var(--tool) 10%,transparent);
  --ok-bg:#e7f6ed; --ok-fg:#15803d; --warn-bg:#fdf3e3; --warn-fg:#b45309;
  --shadow-soft:0 10px 30px rgba(20,30,60,.08); --shadow-lift:0 12px 32px rgba(20,30,60,.16),0 2px 6px rgba(20,30,60,.08);
  --f-display:'Geist','Helvetica Neue',Arial,sans-serif; --f-mono:'Geist Mono',ui-monospace,Menlo,monospace;
}
:root[data-color-scheme="dark"]{
  --paper:#0F1114; --card:#161A1F; --soft:#1B1F25; --soft-2:#22262D; --frost:rgba(15,17,20,.8);
  --line:#2A2F38; --line-soft:#22262D; --dots:#22262D; --canvas:#0F1114;
  --ink:#F2F3F5; --ink2:#A6ACB8; --ink3:#7A808C;
  --tool-ink:color-mix(in oklab,var(--tool) 70%,white); --tool-soft:color-mix(in oklab,var(--tool) 22%,transparent);
  --ok-bg:#1e3a2f; --ok-fg:#4ade80; --warn-bg:#3a2a1e; --warn-fg:#f59e0b;
  --shadow-soft:0 10px 30px rgba(0,0,0,.4); --shadow-lift:0 12px 32px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-color-scheme="light"]):not([data-color-scheme="dark"]){
    --paper:#0F1114; --card:#161A1F; --soft:#1B1F25; --soft-2:#22262D; --frost:rgba(15,17,20,.8);
    --line:#2A2F38; --line-soft:#22262D; --dots:#22262D; --canvas:#0F1114;
    --ink:#F2F3F5; --ink2:#A6ACB8; --ink3:#7A808C;
    --tool-ink:color-mix(in oklab,var(--tool) 70%,white); --tool-soft:color-mix(in oklab,var(--tool) 22%,transparent);
    --ok-bg:#1e3a2f; --ok-fg:#4ade80; --warn-bg:#3a2a1e; --warn-fg:#f59e0b;
    --shadow-soft:0 10px 30px rgba(0,0,0,.4); --shadow-lift:0 12px 32px rgba(0,0,0,.5);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--f-display);font-size:14px;line-height:1.5;color:var(--ink);background-color:var(--canvas);
  background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:24px 24px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,input:focus-visible{outline:3px solid var(--create);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.eyebrow.dark{color:var(--ink2)}

/* bar */
:root{--barh:48px}
/* In the OS the chips are in its bar (clan:bar) and the steps stand alone at the top (.shell-steps), same height. */
.shell-steps{position:sticky;top:0;z-index:10;height:48px;display:flex;align-items:center;justify-content:center;padding:0 20px;background:var(--frost);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-soft)}
.bar{position:sticky;top:0;z-index:10;height:48px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--frost);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.brand .tool{color:var(--tool-ink)}
.sep{color:var(--line)}
.crumb{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1}
.chip{font-family:var(--f-mono);font-size:11px;color:var(--ink2);background:var(--soft-2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.ok{color:var(--ok-fg);background:var(--ok-bg)}
.chip.warn{color:var(--warn-fg);background:var(--warn-bg)}
.chip.cost{border:1px solid var(--line-soft);background:var(--soft);padding:5px 12px;font-size:12px}
.steps{display:flex;gap:4px;background:var(--soft-2);border-radius:999px;padding:3px}
.steps button{height:28px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font-size:12px;font-weight:600}
.steps button[aria-current="step"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,22,27,.1)}
.btn{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;color:var(--ink)}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.btn.go{border:0;background:var(--create);color:var(--create-fg);font-weight:600;box-shadow:0 1px 3px rgba(20,22,27,.1)}
.btn.big{height:46px;padding:0 24px;font-size:15px}
.btn.dark{border:0;background:var(--ink);color:var(--paper)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-soft)}
.frost{background:var(--frost);border:1px solid var(--line-soft);border-radius:18px;box-shadow:var(--shadow-soft)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{color:var(--ok-fg);background:var(--ok-bg)} .pill.warn{color:var(--warn-fg);background:var(--warn-bg)} .pill.plain{color:var(--ink2);background:var(--soft-2)}
h1{font-size:44px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
h1.sm{font-size:34px}
.lede{font-size:16px;line-height:1.55;color:var(--ink2);max-width:600px}
.note{font-size:13px;line-height:1.5;color:var(--ink2)}
.rule{height:1px;background:var(--line-soft);margin:16px 0}
.dot{margin-top:7px;width:6px;height:6px;border-radius:999px;background:var(--tool);flex-shrink:0}

/* screen 1 */
.start{max-width:1280px;margin:0 auto;padding:40px 40px 64px;display:grid;grid-template-columns:minmax(0,780px) 380px;gap:40px;justify-content:space-between;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{padding:20px 22px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-h b{font-size:16px;font-weight:700}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label.lab{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px;background:var(--card)}
.inp.ta{height:auto;min-height:120px;padding:10px 12px;line-height:1.5;resize:vertical;font-family:inherit}
.bf{font-size:13px;line-height:1.5;color:var(--ink2);background:var(--soft);border-radius:12px;padding:10px 14px}
.bf>span{display:block}
.bf .miss{display:block;color:var(--warn-fg)}
.q{padding:12px 0;border-top:1px solid var(--line-soft)}
.q .qt{font-size:14px;font-weight:600;line-height:1.4}
.q .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.q .free{display:flex;gap:8px;margin-top:8px}
.upnote{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.doc{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px}
.doc .ico{width:36px;height:44px;border-radius:6px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;color:var(--tool-ink);flex-shrink:0}
.pick{text-align:left;border-radius:14px;padding:12px 14px;border:1.5px solid var(--line);background:var(--card);flex:1}
.pick[aria-pressed="true"]{border-color:var(--tool);background:var(--tool-soft)}
.pick b{display:block;font-size:14px;font-weight:600} .pick span{display:block;font-size:12px;line-height:1.4;color:var(--ink2);margin-top:3px}
.row{display:flex;gap:10px}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.types .pick{position:relative}
.types .tag{display:inline-block;margin-top:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tool-ink)}
.hint{margin-top:12px;font-size:13px;line-height:1.5;color:var(--ink2);background:var(--soft);border-radius:12px;padding:10px 14px}
.hint b{font-weight:600;color:var(--ink)}
@media (max-width:640px){.types{grid-template-columns:minmax(0,1fr)}}
.summary{padding:22px}
.summary .t{margin:12px 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;margin-top:10px}
.lib{padding:18px 22px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.lib.off{border-style:dashed;background:transparent}

/* screen 2 */
.build{max-width:1400px;margin:0 auto;padding:24px 32px 64px;display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:32px;align-items:start}
.stage{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
.ring{width:20px;height:20px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--ink3)}
.ring.done{border-color:var(--ok-fg);background:var(--ok-fg);color:var(--on-fill)}
.ring.now{border-color:var(--tool);background:var(--tool);color:var(--on-fill)}
.ring.failed{border-color:var(--create);background:var(--create);color:var(--on-fill)}
.stage b{display:block;font-size:14px;font-weight:500} .stage.now b{font-weight:700}
.stage span.s{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.dex{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft);background:var(--soft)}
.dex .cir{flex:none}
.beat{display:flex;gap:16px;padding:13px 20px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.beat .n{font-family:var(--f-mono);font-size:12px;color:var(--ink3);width:22px;padding-top:2px}
.dex .dexp{margin-left:auto;flex:none}
/* gate 2: each territory is a button that picks it; gate 3: the idea line, its work, what it rests on */
.terr{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-soft);border-radius:0;background:transparent;color:var(--ink);align-items:center;min-height:44px}
.terr:last-child{border-bottom:0}
.terr:focus-visible{outline-offset:-3px}
.terr[aria-pressed="true"]{background:var(--tool-soft);box-shadow:inset 3px 0 0 var(--tool)}
.terr .n{padding-top:0}
.terr .tb{display:block;flex:1;min-width:0}
.terr .tn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;font-weight:600;line-height:1.35}
.terr .tt{display:block;margin-top:5px;font-size:14px;line-height:1.45}
.terr .tw{display:block;margin-top:5px;font-size:13px;line-height:1.45;color:var(--ink2)}
.terr .tw b{font-weight:600;color:var(--ink)}
.terr .sel{width:22px;height:22px;border-radius:999px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.terr[aria-pressed="true"] .sel{border-color:var(--tool)}
.terr[aria-pressed="true"] .sel::after{content:"";width:12px;height:12px;border-radius:999px;background:var(--tool)}
.iline{align-items:center}
.iline .il{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.beat .ex{margin-top:4px;font-size:14px;line-height:1.45;color:var(--ink)}
.rests{padding:16px 20px}
.rests .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.asked{margin-top:8px;font-size:13px;color:var(--warn-fg)}
.check{display:flex;gap:10px;align-items:center;font-size:13px}
.tick{width:16px;height:16px;border-radius:999px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tick.ok{background:var(--ok-bg);color:var(--ok-fg)} .tick.warn{background:var(--warn-bg);color:var(--warn-fg)}
/* the agent circle is the one agent engine's sphere (NapkinRoles.tag): its still frame, live once hydrated. The row mark's arc turns only while motion is allowed */
.cir{flex:none}
@keyframes cir-turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){
  .mk.now svg{animation:cir-turn 1.6s linear infinite}
}
/* the run's stage: the agent's sphere, centred, and under it what it asks or why it waits. An open gate is the agent
   asking: nk-asking eases the sphere up and shrinks it (to about 45%) and the gate card shows under it, in view without
   scrolling. render() turns nk-asking on or off only on a change (NapkinRoles.ask); reduced motion: no transition */
.dkstage{display:flex;flex-direction:column}
.dkstage .aglbox{height:var(--dk-sph,184px);display:flex;justify-content:center;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.dkstage.nk-asking .aglbox{height:calc(var(--dk-sph,184px) * .45)}
.dkstage .orbb{appearance:none;display:block;height:100%;aspect-ratio:1;max-width:100%;border:0;background:none;padding:0;margin:0;border-radius:999px;line-height:0;cursor:pointer;touch-action:none}
.dkstage .orbb>.nk-ag{width:100%;height:100%}
.dkstage .say{margin:4px auto 0;min-height:40px;max-width:420px;text-align:center;font-size:13px;line-height:1.5;color:var(--ink3)}
.dkstage .say.on{color:var(--ink)}
.dkstage.nk-asking .say{display:none}
.dkstage .dkask.enter{animation:dk-in .45s ease-out both}
@keyframes dk-in{from{opacity:0;transform:translateY(14px)}}
.dkstage.nk-asking .dkask h1.sm{font-size:26px}
.dkstage.nk-asking .dkask>p.note{margin-bottom:12px!important}
.dkstage.nk-asking .dex{padding:10px 20px}
.dkstage.nk-asking .beat{padding:9px 20px}
.dkstage .dex .mono{white-space:nowrap}
.dkstage.nk-asking .gacts{gap:8px!important;margin-top:14px!important}
.dkstage.nk-asking .gacts .btn.big{height:40px;padding:0 14px!important;font-size:13px!important}
main.build:has(.dkstage.nk-asking){padding-bottom:16px}
.dkstage.nk-asking .gbody{max-height:max(132px,calc(100vh - var(--barh) - var(--dk-sph,184px) * .45 - 330px));overflow:auto}
/* the status card's circle: 60px in a row, enlarged in place (the page script animates the change) while an agent works or the run waits */
.status .srow{display:flex;align-items:center;gap:14px}
.status .slot{display:block;position:relative;flex:none;width:60px;height:60px}
.status.hero .srow{flex-direction:column;text-align:center;gap:12px;padding-top:4px}
.status.hero .slot{width:130px;height:130px}
.status .orbb{appearance:none;display:block;border:0;background:none;padding:0;margin:0;border-radius:999px;line-height:0;cursor:pointer}
.status .say{margin:10px auto 0;min-height:40px;max-width:260px;text-align:center;font-size:13px;line-height:1.5;color:var(--ink3)}
.status .say.on{color:var(--ink)}
/* the running Build screen: the status card says who and how, the content box what is being done */
.status .sword{margin-top:3px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-fg)}
.status .sword.ok{color:var(--ok-fg)} .status .sword.err{color:var(--ink)}
.cbox{overflow:hidden}
.cbox-h{padding:14px 20px;border-bottom:1px solid var(--line-soft);background:var(--soft)}
.crow{display:flex;gap:14px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid var(--line-soft)}
.crow:last-child{border-bottom:0}
.crow .t{font-size:15px;font-weight:600;line-height:1.35}
.crow .t .n{font-size:12px;font-weight:400;color:var(--ink3);margin-right:10px}
.crow.pending .t{color:var(--ink2);font-weight:500}
.crow.failed{background:var(--soft)}
.mk{width:20px;height:20px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.mk.done{background:var(--ok-fg);color:var(--on-fill)}
.mk.pending{border:1.5px dashed var(--line)}
.mk.failed{background:var(--ink);color:var(--paper)}
.mk.supply{background:var(--warn-bg);color:var(--warn-fg)}
.mk.now svg{display:block}
.mk-track{stroke:var(--line-soft);stroke-width:.24}
.mk-arc{stroke:var(--warn-fg);stroke-width:.24;stroke-linecap:round}
.pill.wait{color:var(--ink2);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.pill.fail{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 20px}
.cslide{border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px;background:var(--soft)}
.cslide .t{margin-top:8px;font-size:14px;font-weight:600;line-height:1.35}
.cslide.now{border:1.5px solid var(--create);background:var(--card)}
.cslide.pending{border-style:dashed;background:transparent;color:var(--ink2)}
.cslide.failed{border:1.5px solid var(--ink);background:var(--card)}
.ctail{padding:0 20px 16px;font-size:13px;color:var(--ink2)}
@media (max-width:640px){.cgrid{grid-template-columns:minmax(0,1fr)}}

/* screen 3 */
.review{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:24px;padding:20px 24px 40px;max-width:1500px;margin:0 auto;align-items:start}
.rail{padding:14px;position:sticky;top:calc(var(--barh) + 20px);max-height:calc(100vh - var(--barh) - 44px);overflow:auto}
.thumb{width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1.5px solid transparent;background:transparent;margin-bottom:8px}
.thumb[aria-current="true"]{border-color:var(--tool);background:var(--tool-soft)}
.thumb .n{font-family:var(--f-mono);font-size:11px;color:var(--ink3);width:16px}
.thumb .t{font-size:12px;font-weight:600;line-height:1.25} .thumb .st{display:block;font-size:10px;font-weight:600}
.st.ok{color:var(--ok-fg)} .st.plain{color:var(--ink2)} .st.warn{color:var(--warn-fg)}
.slide{aspect-ratio:16/9;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lift);padding:5.5% 6.5%;position:relative;overflow:hidden}
.slide .kick{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--create)}
.slide h2{margin:12px 0 0;font-size:clamp(22px,3vw,34px);line-height:1.12;letter-spacing:-.03em;font-weight:800;max-width:70%}
.slide ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:12px;max-width:62%}
.slide li{display:flex;gap:12px;align-items:flex-start;font-size:clamp(14px,1.5vw,17px);line-height:1.45}
.slide li .dot{margin-top:9px;background:var(--ink)}
.slide sup{font-family:var(--f-mono);font-size:10px;color:var(--tool-ink);margin-left:3px}
.slide .foot{position:absolute;left:6.5%;right:6.5%;bottom:4%;display:flex;font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.ph{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.9em;color:var(--warn-fg);background:var(--warn-bg);border-radius:8px;padding:2px 8px}
.ph i{font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--soft-2);border-radius:999px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;height:30px;border:0;border-radius:999px;font-size:12px;font-weight:600;background:transparent;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,22,27,.1)}
.ev{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:12px;margin-bottom:10px}
.ev .id{font-family:var(--f-mono);font-size:11px;color:var(--tool-ink);margin-bottom:4px}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--barh) + 20px)}
/* the deck's own status (Review, Present): the Approval agent's circle and its word; Approve the deck; the appendix */
.lcol{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--barh) + 20px);max-height:calc(100vh - var(--barh) - 44px);overflow:auto}
.lcol .rail{position:static;max-height:none;overflow:visible}
.dstat{display:inline-flex;align-items:center;gap:8px;flex:none}
.dword{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-fg)}
.dword.ok{color:var(--ok-fg)}
.btn.tall{height:44px;padding:0 20px;font-size:14px}
.appx{border:0;border-radius:999px;background:transparent;font-family:var(--f-mono);font-size:11px;color:var(--tool-ink);padding:2px 8px;min-height:44px}
.appx[aria-expanded="true"]{background:var(--tool-soft)}
.rail-div{margin:12px 4px 8px}
.rep{margin-top:14px;font-size:13px;color:var(--ink)}
.rep .eyebrow{margin-right:8px}

/* screen 4 */
.present{display:grid;grid-template-columns:minmax(0,760px) 210px 360px;gap:32px;padding:24px 32px 40px;max-width:1500px;margin:0 auto;align-items:start;justify-content:space-between}
.pslide{aspect-ratio:16/9;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lift);padding:5.5% 6.5%;position:relative;overflow:hidden}
.pslide h2{margin:12px 0 0;font-size:clamp(28px,4.2vw,56px);line-height:1.04;letter-spacing:-.035em;font-weight:800;max-width:75%}
.pslide .kick{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--create)}
.pslide .foot{position:absolute;left:6.5%;right:6.5%;bottom:4%;display:flex;font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.controls{margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--frost);border:1px solid var(--line-soft);border-radius:999px;padding:8px 10px;box-shadow:var(--shadow-soft)}
.circ{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:16px}
.prog{flex:1;height:4px;border-radius:2px;background:var(--line-soft);position:relative}
.prog span{position:absolute;left:0;top:0;height:4px;border-radius:2px;background:var(--tool)}
.mini{width:210px;aspect-ratio:16/9;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:hidden}
.mini .k{font-family:var(--f-mono);font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--create)}
.mini .t{margin-top:6px;font-size:13px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.fmt{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.fmt .x{width:36px;height:36px;border-radius:10px;background:var(--soft-2);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;font-weight:500}
.conf{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-soft)}
.conf:first-of-type{border-top:0}
.conf .what{flex:1;min-width:0;font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.conf .what small{display:block;margin-top:2px;font-size:12px;color:var(--ink3)}
.conf.done .what{color:var(--ink2)}
.sup .hint-line{font-size:12px;color:var(--ink3);margin-top:2px}
.callout{margin-top:16px;background:var(--warn-bg);border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.5;color:var(--warn-fg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media (max-width:1100px){
  .start,.build,.review,.present{grid-template-columns:minmax(0,1fr);padding:20px 16px 48px}
  .rail,.side,.lcol{position:static;max-height:none}
  .bar{flex-wrap:wrap;height:auto;padding:8px 16px}
  h1{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- The one agent engine (app/templates/shared/agent-sphere), inlined here by make_deck_maker.rs: every circle is its sphere. -->
<!-- @napkin:agent-sphere -->

<!-- The pure part: what a screen decides, with no DOM. app/tests/deckMaker.test.ts runs this block alone. -->
<script id="deck-logic">
var DeckLogic = (function () {
  'use strict';

  /** The agent's marks from a block: a placeholder is text only the user can supply. */
  function isPlaceholder(block) {
    return !!(block && (block.human === true || /^\[[^\]]+\]$/.test(String(block.text || '').trim())));
  }

  /** Slide ids in story order. Backup slides (after the divider) are counted, not listed. */
  function presented(deck) {
    return ((deck && deck.order) || []).filter(function (id) { return deck.slides && deck.slides[id]; });
  }

  /** Every ref a slide cites, once, in the order it first appears. */
  function refsOf(slide) {
    var seen = {}, out = [];
    function add(list) {
      (list || []).forEach(function (r) { if (!seen[r]) { seen[r] = 1; out.push(r); } });
    }
    ((slide && slide.blocks) || []).forEach(function (b) { add(b.refs); });
    ((slide && slide.claims) || []).forEach(function (c) { add(c.refs); });
    return out;
  }

  /** What each cited ref says. A ref the run does not hold is shown as missing, never skipped. */
  function evidenceFor(slide, evidence) {
    return refsOf(slide).map(function (ref) {
      var e = evidence && evidence[ref];
      return e ? { ref: ref, kind: e.kind, text: e.text }
               : { ref: ref, kind: 'not found', text: 'This run holds nothing under that name.' };
    });
  }

  /** needs-you when a placeholder is on the slide or the engine says so; drafted; else from source. */
  function statusOf(slide) {
    if (!slide) return 'drafted';
    if (slide.status === 'needs_human') return 'need';
    if (slide.status === 'drafted') return 'draft';
    return 'src';
  }

  var STATUS = {
    src: { label: 'From source', tone: 'ok' },
    draft: { label: 'Drafted', tone: 'plain' },
    need: { label: 'Needs you', tone: 'warn' }
  };

  /** The Checks tab: what the validators found, then what the view can see for itself. */
  function checksFor(id, slide, validation) {
    var out = [];
    var found = (validation && validation.findings && validation.findings[id]) || [];
    found.forEach(function (f) { out.push({ ok: false, text: f.message }); });
    var blocks = (slide && slide.blocks) || [];
    var ph = blocks.filter(isPlaceholder).length;
    if (ph && !found.length) out.push({ ok: false, text: ph + ' placeholder' + (ph > 1 ? 's' : '') + ' to supply' });
    if (!found.length && !ph) {
      out.push({ ok: true, text: 'No problems found on this slide' });
    }
    var bare = ((slide && slide.claims) || []).filter(function (c) { return !(c.refs || []).length; });
    bare.forEach(function (c) { out.push({ ok: true, text: 'Labelled ' + (c.basis || 'opinion') + ', so it carries no source' }); });
    return out;
  }

  /**
   * One gate approved: that stage is done and the next one starts. Anything but the open gate is refused. The approval
   * says what was decided ({by, at, decision: 'approve', picked?, note?}) and is added to run.decisions. At a gate that
   * offers territories, `choice.picked` names the one picked (else the gate's own pick, else the judge's first); a pick
   * that is not one of them is refused. The agent feed is cleared (agent: null), since it described the gate.
   */
  function approveGate(run, gateId, by, at, choice) {
    if (!run || !run.gate || run.gate.id !== gateId) return null;
    // Stages are copied whole, as approveDeck does: the store replaces arrays, so a key left out (items) would be lost.
    var stages = (Array.isArray(run.stages) ? run.stages : []).filter(isObj).map(function (s) {
      var o = {};
      Object.keys(s).forEach(function (k) { o[k] = s[k]; });
      return o;
    });
    var i = stages.findIndex(function (s) { return s.id === gateId; });
    if (i < 0) return null;
    var c = isObj(choice) ? choice : {}, picked = null;
    var ids = territoriesOf(run.gate).map(function (t) { return t.id; });
    if (ids.length) {
      picked = c.picked != null ? String(c.picked) : ids.indexOf(run.gate.picked) >= 0 ? run.gate.picked : run.gate.first_pick;
      if (ids.indexOf(picked) < 0) return null;
    }
    stages[i].status = 'done';
    var next = stages.find(function (s, k) { return k > i && s.status === 'next'; });
    if (next) next.status = 'now';
    var approvals = {};
    Object.keys(run.approvals || {}).forEach(function (k) { approvals[k] = run.approvals[k]; });
    approvals[gateId] = { by: by, at: at, decision: 'approve' };
    if (picked) approvals[gateId].picked = picked;
    if (typeof c.note === 'string' && c.note.trim()) approvals[gateId].note = c.note.trim();
    return {
      state: 'building', stage: next ? next.id : run.stage, cost_usd: run.cost_usd,
      stages: stages, gate: null, approvals: approvals, agent: null,
      decisions: decisionsOf(run).concat([{ gate: gateId, kind: 'approve', by: by, at: at }])
    };
  }

  /** The decisions recorded so far, as a new list (the store replaces arrays, so a write carries the whole list). */
  function decisionsOf(run) { return (isObj(run) && Array.isArray(run.decisions) ? run.decisions : []).filter(isObj); }

  /**
   * An edit or a retry asked at the open gate: recorded in run.decisions and run.gate_requests (status waiting), like
   * change_requests. It launches nothing: the engine acts on it once it is connected. Null for any gate but the open one,
   * or another kind. The patch goes under `run`.
   */
  function gateRequest(run, gateId, kind, by, at) {
    if (!isObj(run) || !isObj(run.gate) || run.gate.id !== gateId || (kind !== 'edit' && kind !== 'retry')) return null;
    var asked = (Array.isArray(run.gate_requests) ? run.gate_requests : []).filter(isObj);
    return {
      decisions: decisionsOf(run).concat([{ gate: gateId, kind: kind, by: by, at: at }]),
      gate_requests: asked.concat([{ gate: gateId, kind: kind, at: at, status: 'waiting' }])
    };
  }

  // ── the gate registry: what each gate asks for and what it shows (phase 3). Gate id = stage id. ──
  var GATES = {
    storyline: {
      body: 'beats', title: 'Approve the storyline', approve: 'Approve and continue', edit: ['beats', 'Edit beats'], hold: 'Nothing runs until you approve',
      lede: 'This is the order the pitch will tell its story in. Change a beat now and every later step follows it. Changing it later costs more.',
      next: 'Next, three territories are written and a second model judges them without seeing who wrote them. You pick one.'
    },
    territories: {
      body: 'territories', title: 'Pick a territory', approve: 'Pick this territory', edit: ['territories', 'Edit a territory'], hold: 'Nothing runs until you pick',
      lede: '', next: 'Next, the idea and its work are developed from the territory you pick.', dexProposed: true
    },
    idea: {
      body: 'idea', title: 'Approve the idea', approve: 'Approve and continue', edit: ['idea', 'Edit the idea'], hold: 'Nothing runs until you approve',
      lede: '', next: 'After this gate the run goes on by itself: Copy, Deck and Review, then you review the deck.', dexProposed: true
    }
  };
  /** A gate this app has no words for: generic words, and whatever body its data carries. */
  var GATE_OTHER = {
    body: '', title: 'A step needs you', approve: 'Approve and continue', edit: ['gate', 'Edit'], hold: 'Nothing runs until you approve',
    lede: 'The run stops here until you approve it.', next: 'Once you approve, the run goes on to its next step.', dexProposed: true
  };
  var NUMWORD = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
  /** Tone of a label the runner wrote: from the brief or research is sourced, anything else is ours or still open. */
  var TONES = { ok: 'ok', warn: 'warn', plain: 'plain' };
  var BASIS = { brief: ['From brief', 'ok'], research: ['From research', 'ok'], proposal: ['Our proposal', 'warn'], placeholder: ['Placeholder', 'warn'] };

  function str(v) { return v == null ? '' : String(v); }

  /** The territories a gate offers, safe to render: { id, n, name, thought, why }. An entry without an id or name is left out. */
  function territoriesOf(gate) {
    var seen = Object.create(null);
    return (isObj(gate) && Array.isArray(gate.territories) ? gate.territories : []).filter(function (t) {
      return isObj(t) && validId(t.id) && str(t.name).trim() && !seen[t.id] && (seen[t.id] = true);
    }).map(function (t, i) {
      var n = /^\d{1,3}$/.test(str(t.n)) ? pad2(t.n) : pad2(i + 1);
      return { id: t.id, n: n, name: str(t.name).trim(), thought: str(t.thought), why: str(t.why) };
    });
  }

  /**
   * What the open gate shows, from the registry and its data: { id, n, of, known, body ('beats' | 'territories' | 'idea' |
   * 'none'), title, lede, approve, edit_key, edit_label, hold, next, dex, dex_proposed, territories, first_pick, picked,
   * idea, asked }. `pick` is the person's unsaved pick (view state); it counts only if it is one of the territories.
   * Null with no gate open. Never throws: a gate this app does not know gets generic words.
   */
  function gateView(run, pick) {
    var g = isObj(run) && isObj(run.gate) ? run.gate : null;
    if (!g) return null;
    var id = str(g.id), known = own(GATES, id), spec = known ? GATES[id] : GATE_OTHER;
    var terr = territoriesOf(g), ids = terr.map(function (t) { return t.id; });
    var body = spec.body || (Array.isArray(g.beats) ? 'beats' : terr.length ? 'territories' : isObj(g.idea) ? 'idea' : 'none');
    var out = {
      id: id, n: g.n, of: g.of, known: known, body: body, title: spec.title, lede: spec.lede, approve: spec.approve,
      edit_key: spec.edit[0], edit_label: spec.edit[1], hold: spec.hold, next: spec.next,
      dex: typeof g.dex === 'string' ? g.dex : '', dex_proposed: !!spec.dexProposed,
      territories: terr, first_pick: ids.indexOf(g.first_pick) >= 0 ? g.first_pick : null, picked: null, idea: null,
      asked: (isObj(run) && Array.isArray(run.gate_requests) ? run.gate_requests : []).filter(function (q) {
        return isObj(q) && q.gate === id && q.status === 'waiting' && (q.kind === 'edit' || q.kind === 'retry');
      }).map(function (q) { return q.kind; })
    };
    if (body === 'territories') {
      out.picked = ids.indexOf(pick) >= 0 ? pick : ids.indexOf(g.picked) >= 0 ? g.picked : out.first_pick;
      var k = terr.length;
      out.lede = (k === 1 ? 'One territory is written.' : (NUMWORD[k] || String(k)) + ' territories are written.') +
        (k ? ' A second model judged them without seeing who wrote them. Pick the one the idea grows from. Picking later costs more.' : '');
    }
    if (body === 'idea' && isObj(g.idea)) {
      var x = g.idea, basis = own(BASIS, x.basis) ? BASIS[x.basis] : null;
      var from = terr.filter(function (t) { return t.id === x.territory_id; })[0];
      var tname = str(x.territory_name).trim();
      out.idea = {
        line: str(x.line), basis: basis ? basis[0] : '', basis_tone: basis ? basis[1] : 'plain',
        territory: from ? 'territory ' + Number(from.n) + ', ' + from.name : tname ? 'the territory you picked: ' + tname : 'the territory you picked',
        executions: (Array.isArray(x.executions) ? x.executions : []).filter(function (e) { return isObj(e) && str(e.channel).trim(); }).map(function (e, i) {
          var tag = str(e.tag).trim();
          return {
            n: /^\d{1,3}$/.test(str(e.n)) ? pad2(e.n) : pad2(i + 1), channel: str(e.channel), summary: str(e.summary), tag: tag,
            tone: /^from (the )?(brief|research)/i.test(tag) ? 'ok' : tag ? 'warn' : 'plain'
          };
        }),
        rests_on: (Array.isArray(x.rests_on) ? x.rests_on : []).filter(function (r) { return isObj(r) && str(r.label).trim(); }).map(function (r) {
          return { label: str(r.label), tone: own(TONES, r.tone) ? r.tone : 'plain' };
        })
      };
      out.lede = (x.basis === 'proposal' ? 'Approve the idea (our proposal). ' : 'Approve the idea. ') + 'One idea and the work that carries it, from ' + out.idea.territory + '.';
    }
    return out;
  }

  /** The rule the gate exists for: with a gate open, no stage after it may be running. */
  function gateHolds(run) {
    if (!run || !run.gate) return true;
    var i = run.stages.findIndex(function (s) { return s.id === run.gate.id; });
    return run.stages.every(function (s, k) { return k <= i || s.status === 'next'; });
  }

  /** The line under "You will get". Numbers come from the run, never from the screen. */
  function summaryOf(inputs, deck) {
    var kind = inputs.kind === 'investor' ? 'An investor deck' : 'An agency pitch';
    var known = inputs.type && typeById(inputs.type);
    if (known) kind = known.article;
    var size = inputs.format === 'full'
      ? 'Every slide in story order'
      : 'At most 18 slides, then a hidden appendix';
    var n = presented(deck).length;
    return {
      title: kind + ' for ' + (inputs.prompt.client || '[Client]'),
      note: size + '. Every number points to what you gave: your prompt, a document, the brief or the research.',
      built: n
    };
  }

  /** The agency name, or the placeholder the deck itself shows. */
  function agencyShown(inputs) {
    return (inputs.prompt.agency || '').trim() || '[Agency]';
  }

  // ── deck types: what kind of deck this is (the engine asks q_deck_type first) ──
  /** The four deck types the engine tailors to. `looks` and `article` are the words the view uses around the label. */
  var DECK_TYPES = [
    { id: 'agency_pitch', label: 'Agency pitch', one_line: 'Territories, one idea, executions for a client brief.', looks: 'an agency pitch', article: 'An agency pitch' },
    { id: 'tender_response', label: 'Tender response', one_line: 'Answers a buyer\'s scored tender, point by point.', looks: 'a tender', article: 'A tender response' },
    { id: 'investor_seed', label: 'Investor seed deck', one_line: 'Problem, market, traction and the ask, for a seed round.', looks: 'an investor deck', article: 'An investor seed deck' },
    { id: 'credentials', label: 'Credentials / chemistry meeting', one_line: 'Who we are and what we have done, for a first meeting.', looks: 'a credentials meeting', article: 'A credentials deck' }
  ];
  var DEFAULT_TYPE = 'agency_pitch';
  var TYPE_QID = 'q_deck_type';

  /** One entry of DECK_TYPES by id, or null for an unknown id. */
  function typeById(id) {
    for (var i = 0; i < DECK_TYPES.length; i++) if (DECK_TYPES[i].id === id) return DECK_TYPES[i];
    return null;
  }

  /** The deck type an option stands for: its value if that names a type, else its id; null when neither does. */
  function optionType(o) {
    if (!isObj(o)) return null;
    var v = typeof o.value === 'string' && typeById(o.value) ? o.value : null;
    var i = typeof o.id === 'string' && typeById(o.id) ? o.id : null;
    return v || i;
  }

  /** The q_deck_type question the engine wrote, or null. */
  function typeQuestion(data) {
    var qs = data && isObj(data.intake) && Array.isArray(data.intake.questions) ? data.intake.questions : [];
    for (var i = 0; i < qs.length; i++) if (isObj(qs[i]) && qs[i].id === TYPE_QID) return qs[i];
    return null;
  }

  /** The words an option quotes as its source, as text: a string, or the quote/text of a source object. */
  function quoteOf(src) {
    if (typeof src === 'string') return src.trim();
    if (isObj(src)) return String(src.quote || src.text || '').trim();
    return '';
  }

  /**
   * The deck type for a document: the person's answer, else the one the engine inferred (an option
   * with origin 'proposed'), else the default. Returns { id, label, one_line, source, quote, skipped,
   * hasQuestion } where source is 'answered', 'inferred' or 'default'. Never throws.
   */
  function deckTypeOf(data) {
    var q = typeQuestion(data), opts = q && Array.isArray(q.options) ? q.options : [];
    var answers = data && data.intake && isObj(data.intake.answers) ? data.intake.answers : {};
    var a = isObj(answers[TYPE_QID]) ? answers[TYPE_QID] : null;
    var out = function (id, source, quote, skipped) {
      var t = typeById(id);
      return { id: t.id, label: t.label, one_line: t.one_line, source: source, quote: quote || '', skipped: !!skipped, hasQuestion: !!q };
    };
    var skipped = !!(a && a.skipped);
    if (!skipped && a && a.option_id != null) {
      var chosen = null;
      for (var i = 0; i < opts.length; i++) if (isObj(opts[i]) && String(opts[i].id) === String(a.option_id)) chosen = opts[i];
      var id = chosen ? optionType(chosen) : (typeById(String(a.option_id)) ? String(a.option_id) : null);
      if (id) return out(id, 'answered', '', false);
    }
    if (!skipped) {
      for (var j = 0; j < opts.length; j++) {
        var o = opts[j], t = optionType(o);
        if (t && isObj(o) && o.origin === 'proposed') return out(t, 'inferred', quoteOf(o.source), false);
      }
    }
    return out(DEFAULT_TYPE, 'default', '', skipped);
  }

  /** The option id to write for a type: the question's own option for it when there is one, else the type id. */
  function typeOptionId(data, typeId) {
    var q = typeQuestion(data), opts = q && Array.isArray(q.options) ? q.options : [];
    for (var i = 0; i < opts.length; i++) if (optionType(opts[i]) === typeId) return String(opts[i].id);
    return typeId;
  }

  /** The legacy inputs.kind a deck type maps to: investor_seed is 'investor', every other type 'agency'. */
  function kindOfType(typeId) { return typeId === 'investor_seed' ? 'investor' : 'agency'; }

  var HINTS = {
    agency_pitch: ['the brief', 'the budget'],
    tender_response: ['the buyer\'s scoring criteria', 'the page limit'],
    investor_seed: ['traction figures', 'the ask'],
    credentials: ['the team', 'two examples of past work']
  };

  /** What to bring to make a deck of this type stronger: { type, items, line }. An unknown type is the default. */
  function typeHints(typeId) {
    var id = typeById(typeId) ? typeId : DEFAULT_TYPE, items = HINTS[id].slice();
    return { type: id, items: items, line: 'To make this one stronger, bring: ' + items.join(' and ') };
  }
