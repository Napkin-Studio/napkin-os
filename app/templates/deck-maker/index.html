<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deck Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" />
<style>
/* The studio palette, copied from app/src/index.css (a template is its own page, so it
   cannot import the shell's sheet). Light is the default; the shell pushes
   data-color-scheme, and with none set we follow the OS. --tool is the Deck tool's identity,
   as in production-tool/web/src/styles.css. --create is the one action colour. */
:root{
  /* The new UI (design/new-ui/napkin-app-v1.html, features/deck-studio-new-ui.clan): the mock's paper, desk and ink, tinted by
     the agency's base and accent (--ag-base, --ag-acc, set from clan.me), so every screen reads as the mock's Deck Studio. */
  --ag-base:#515BFF; --ag-acc:#C8CBFF; --ink-light:#FFFFFF; --ink-dark:#141413; --ag-base-ink:var(--ink-light); --ag-acc-ink:var(--ink-dark);
  --ag-act:var(--ag-base); --ag-act-ink:var(--ag-base-ink);
  --card:#FFFDF8; --canvas:#F6F1E7; --soft:#F3ECDC; --line-base:#E2D9C8; --line-strong:#2A2620; --dots:transparent;
  --ink:#141413; --ink2:#2A2620; --ink3:#9A9082; --muted:#6D655A; --on-ink:rgba(255,253,248,.68);
  --create:#FF4F2E; --create-fg:#FFFFFF; --on-fill:#FFFFFF;
  --tool:#2F64F5; --tool-ink:color-mix(in oklab,var(--tool) 78%,var(--ink)); --tool-soft:color-mix(in oklab,var(--tool) 10%,transparent);
  --ok-bg:#E6F6EC; --ok-fg:#17773F; --warn-bg:#FEF3DC; --warn-fg:#A44A08;
  --shadow-soft:0 1px 0 rgba(255,255,255,.75) inset,0 8px 24px -8px rgba(50,38,18,.10),0 1px 3px rgba(50,38,18,.08); --shadow-lift:0 24px 60px -24px rgba(50,38,18,.28),0 1px 3px rgba(50,38,18,.08);
  --shadow-paper:0 1px 0 rgba(255,255,255,.75) inset,0 8px 24px -8px rgba(50,38,18,.10),0 1px 3px rgba(50,38,18,.08);
  --r-md:8px; --r-sm:4px;
  --manila:#F3E8CC; --manila-edge:#C4AA75; --manila-ink:#5A4A2A;
  --f-display:'Geist',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; --f-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-serif:'Newsreader',Georgia,'Iowan Old Style',serif;
}
:root[data-color-scheme="dark"]{
  --ag-act:var(--ag-acc); --ag-act-ink:var(--ag-acc-ink);
  --card:#1B1A18; --canvas:#121110; --soft:#262320; --line-base:#34302A; --line-strong:#CFC6B6; --dots:transparent;
  --ink:#EFE9DE; --ink2:#D6CEC0; --ink3:#7B7367; --muted:#A49B8D; --on-ink:color-mix(in srgb,var(--paper) 72%,transparent);
  --tool-ink:color-mix(in oklab,var(--tool) 70%,white); --tool-soft:color-mix(in oklab,var(--tool) 22%,transparent);
  --ok-bg:#1C2E23; --ok-fg:#5DBB83; --warn-bg:#3A2A18; --warn-fg:#E09A4B;
  --shadow-lift:0 24px 60px -24px rgba(0,0,0,.7);
}
@media (prefers-color-scheme:dark){
  :root:not([data-color-scheme="light"]):not([data-color-scheme="dark"]){
    --ag-act:var(--ag-acc); --ag-act-ink:var(--ag-acc-ink);
    --card:#1B1A18; --canvas:#121110; --soft:#262320; --line-base:#34302A; --line-strong:#CFC6B6; --dots:transparent;
    --ink:#EFE9DE; --ink2:#D6CEC0; --ink3:#7B7367; --muted:#A49B8D; --on-ink:color-mix(in srgb,var(--paper) 72%,transparent);
    --tool-ink:color-mix(in oklab,var(--tool) 70%,white); --tool-soft:color-mix(in oklab,var(--tool) 22%,transparent);
    --ok-bg:#1C2E23; --ok-fg:#5DBB83; --warn-bg:#3A2A18; --warn-fg:#E09A4B;
    --shadow-lift:0 24px 60px -24px rgba(0,0,0,.7);
  }
}
/* The agency's tint over the paper, the desk and the rules (the mock: 2.5, 6 and 10 in light; 9, 12 and 16 in dark). The plain
   values above are what the contrast checks read; the tint moves them by a few points only. */
:root{
  --paper:color-mix(in srgb,var(--ag-base) 2.5%,var(--card)); --desk:color-mix(in srgb,var(--ag-base) 6%,var(--canvas));
  --line:color-mix(in srgb,var(--ag-base) 10%,var(--line-base)); --line-soft:var(--line); --frost:var(--paper);
  --soft-2:color-mix(in srgb,var(--ink) 5%,var(--paper));
}
:root[data-color-scheme="dark"]{
  --paper:color-mix(in srgb,var(--ag-base) 9%,var(--card)); --desk:color-mix(in srgb,var(--ag-base) 12%,var(--canvas));
  --line:color-mix(in srgb,var(--ag-base) 16%,var(--line-base)); --soft-2:color-mix(in srgb,var(--ink) 6%,var(--paper));
}
@media (prefers-color-scheme:dark){
  :root:not([data-color-scheme="light"]):not([data-color-scheme="dark"]){
    --paper:color-mix(in srgb,var(--ag-base) 9%,var(--card)); --desk:color-mix(in srgb,var(--ag-base) 12%,var(--canvas));
    --line:color-mix(in srgb,var(--ag-base) 16%,var(--line-base)); --soft-2:color-mix(in srgb,var(--ink) 6%,var(--paper));
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--f-display);font-size:14px;line-height:1.5;color:var(--ink);background-color:var(--canvas);
  background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:24px 24px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,input:focus-visible{outline:3px solid var(--create);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.eyebrow.dark{color:var(--ink2)}

/* bar */
:root{--barh:48px}
/* In the OS the chips are in its bar (clan:bar) and the steps stand alone at the top (.shell-steps), same height. */
.shell-steps{position:sticky;top:0;z-index:10;height:48px;display:flex;align-items:center;justify-content:center;padding:0 20px;background:var(--frost);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-soft)}
.bar{position:sticky;top:0;z-index:10;height:48px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--frost);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.brand .tool{color:var(--tool-ink)}
.sep{color:var(--line)}
.crumb{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1}
.chip{font-family:var(--f-mono);font-size:11px;color:var(--ink2);background:var(--soft-2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.ok{color:var(--ok-fg);background:var(--ok-bg)}
.chip.warn{color:var(--warn-fg);background:var(--warn-bg)}
.chip.cost{border:1px solid var(--line-soft);background:var(--soft);padding:5px 12px;font-size:12px}
.steps{display:flex;gap:4px;background:var(--soft-2);border-radius:999px;padding:3px}
.steps button{height:28px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font-size:12px;font-weight:600}
.steps button[aria-current="step"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,22,27,.1)}
.btn{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;color:var(--ink)}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.btn.go{border:0;background:var(--create);color:var(--create-fg);font-weight:600;box-shadow:0 1px 3px rgba(20,22,27,.1)}
.btn.big{height:46px;padding:0 24px;font-size:15px}
.btn.dark{border:0;background:var(--ink);color:var(--paper)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-soft)}
.frost{background:var(--frost);border:1px solid var(--line-soft);border-radius:18px;box-shadow:var(--shadow-soft)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{color:var(--ok-fg);background:var(--ok-bg)} .pill.warn{color:var(--warn-fg);background:var(--warn-bg)} .pill.plain{color:var(--ink2);background:var(--soft-2)}
h1{font-size:44px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
h1.sm{font-size:34px}
.lede{font-size:16px;line-height:1.55;color:var(--ink2);max-width:600px}
.note{font-size:13px;line-height:1.5;color:var(--ink2)}
.rule{height:1px;background:var(--line-soft);margin:16px 0}
.dot{margin-top:7px;width:6px;height:6px;border-radius:999px;background:var(--tool);flex-shrink:0}

/* screen 1 */
.start{max-width:1280px;margin:0 auto;padding:40px 40px 64px;display:grid;grid-template-columns:minmax(0,780px) 380px;gap:40px;justify-content:space-between;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{padding:20px 22px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-h b{font-size:16px;font-weight:700}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label.lab{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px;background:var(--card)}
.inp.ta{height:auto;min-height:120px;padding:10px 12px;line-height:1.5;resize:vertical;font-family:inherit}
.bf{font-size:13px;line-height:1.5;color:var(--ink2);background:var(--soft);border-radius:12px;padding:10px 14px}
.bf>span{display:block}
.bf .miss{display:block;color:var(--warn-fg)}
.q{padding:12px 0;border-top:1px solid var(--line-soft)}
.q .qt{font-size:14px;font-weight:600;line-height:1.4}
.q .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.q .free{display:flex;gap:8px;margin-top:8px}
.upnote{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.doc{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px}
.doc .ico{width:36px;height:44px;border-radius:6px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;color:var(--tool-ink);flex-shrink:0}
.pick{text-align:left;border-radius:14px;padding:12px 14px;border:1.5px solid var(--line);background:var(--card);flex:1}
.pick[aria-pressed="true"]{border-color:var(--tool);background:var(--tool-soft)}
.pick b{display:block;font-size:14px;font-weight:600} .pick span{display:block;font-size:12px;line-height:1.4;color:var(--ink2);margin-top:3px}
.row{display:flex;gap:10px}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.types .pick{position:relative}
.types .tag{display:inline-block;margin-top:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tool-ink)}
.hint{margin-top:12px;font-size:13px;line-height:1.5;color:var(--ink2);background:var(--soft);border-radius:12px;padding:10px 14px}
.hint b{font-weight:600;color:var(--ink)}
@media (max-width:640px){.types{grid-template-columns:minmax(0,1fr)}}
.summary{padding:22px}
.summary .t{margin:12px 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;margin-top:10px}
.lib{padding:18px 22px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.lib.off{border-style:dashed;background:transparent}

/* screen 2 */
.build{max-width:1400px;margin:0 auto;padding:24px 32px 64px;display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:32px;align-items:start}
.stage{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
.ring{width:20px;height:20px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--ink3)}
.ring.done{border-color:var(--ok-fg);background:var(--ok-fg);color:var(--on-fill)}
.ring.now{border-color:var(--tool);background:var(--tool);color:var(--on-fill)}
.ring.failed{border-color:var(--create);background:var(--create);color:var(--on-fill)}
.stage b{display:block;font-size:14px;font-weight:500} .stage.now b{font-weight:700}
.stage span.s{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.dex{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft);background:var(--soft)}
.dex .cir{flex:none}
.beat{display:flex;gap:16px;padding:13px 20px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.beat .n{font-family:var(--f-mono);font-size:12px;color:var(--ink3);width:22px;padding-top:2px}
.dex .dexp{margin-left:auto;flex:none}
/* gate 2: each territory is a button that picks it; gate 3: the idea line, its work, what it rests on */
.terr{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-soft);border-radius:0;background:transparent;color:var(--ink);align-items:center;min-height:44px}
.terr:last-child{border-bottom:0}
.terr:focus-visible{outline-offset:-3px}
.terr[aria-pressed="true"]{background:var(--tool-soft);box-shadow:inset 3px 0 0 var(--tool)}
.terr .n{padding-top:0}
.terr .tb{display:block;flex:1;min-width:0}
.terr .tn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;font-weight:600;line-height:1.35}
.terr .tt{display:block;margin-top:5px;font-size:14px;line-height:1.45}
.terr .tw{display:block;margin-top:5px;font-size:13px;line-height:1.45;color:var(--ink2)}
.terr .tw b{font-weight:600;color:var(--ink)}
.terr .sel{width:22px;height:22px;border-radius:999px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.terr[aria-pressed="true"] .sel{border-color:var(--tool)}
.terr[aria-pressed="true"] .sel::after{content:"";width:12px;height:12px;border-radius:999px;background:var(--tool)}
.iline{align-items:center}
.iline .il{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.beat .ex{margin-top:4px;font-size:14px;line-height:1.45;color:var(--ink)}
.rests{padding:16px 20px}
.rests .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.asked{margin-top:8px;font-size:13px;color:var(--warn-fg)}
.check{display:flex;gap:10px;align-items:center;font-size:13px}
.tick{width:16px;height:16px;border-radius:999px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tick.ok{background:var(--ok-bg);color:var(--ok-fg)} .tick.warn{background:var(--warn-bg);color:var(--warn-fg)}
/* the agent circle is the one agent engine's sphere (NapkinRoles.tag): its still frame, live once hydrated. The row mark's arc turns only while motion is allowed */
.cir{flex:none}
@keyframes cir-turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){
  .mk.now svg{animation:cir-turn 1.6s linear infinite}
}
/* the run's stage: the agent's sphere, centred, and under it what it asks or why it waits. An open gate is the agent
   asking: nk-asking eases the sphere up and shrinks it (to about 45%) and the gate card shows under it, in view without
   scrolling. render() turns nk-asking on or off only on a change (NapkinRoles.ask); reduced motion: no transition */
.dkstage{display:flex;flex-direction:column}
.dkstage .aglbox{height:var(--dk-sph,184px);display:flex;justify-content:center;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.dkstage.nk-asking .aglbox{height:calc(var(--dk-sph,184px) * .45)}
.dkstage .orbb{appearance:none;display:block;height:100%;aspect-ratio:1;max-width:100%;border:0;background:none;padding:0;margin:0;border-radius:999px;line-height:0;cursor:pointer;touch-action:none}
.dkstage .orbb>.nk-ag{width:100%;height:100%}
.dkstage .say{margin:4px auto 0;min-height:40px;max-width:420px;text-align:center;font-size:13px;line-height:1.5;color:var(--ink3)}
.dkstage .say.on{color:var(--ink)}
.dkstage.nk-asking .say{display:none}
.dkstage .dkask.enter{animation:dk-in .45s ease-out both}
@keyframes dk-in{from{opacity:0;transform:translateY(14px)}}
.dkstage.nk-asking .dkask h1.sm{font-size:26px}
.dkstage.nk-asking .dkask>p.note{margin-bottom:12px!important}
.dkstage.nk-asking .dex{padding:10px 20px}
.dkstage.nk-asking .beat{padding:9px 20px}
.dkstage .dex .mono{white-space:nowrap}
.dkstage.nk-asking .gacts{gap:8px!important;margin-top:14px!important}
.dkstage.nk-asking .gacts .btn.big{height:40px;padding:0 14px!important;font-size:13px!important}
main.build:has(.dkstage.nk-asking){padding-bottom:16px}
.dkstage.nk-asking .gbody{max-height:max(132px,calc(100vh - var(--barh) - var(--dk-sph,184px) * .45 - 330px));overflow:auto}
/* the status card's circle: 60px in a row, enlarged in place (the page script animates the change) while an agent works or the run waits */
.status .srow{display:flex;align-items:center;gap:14px}
.status .slot{display:block;position:relative;flex:none;width:60px;height:60px}
.status.hero .srow{flex-direction:column;text-align:center;gap:12px;padding-top:4px}
.status.hero .slot{width:130px;height:130px}
.status.hero.centre{max-width:none;margin:24px auto 0;background:transparent;border-color:transparent;box-shadow:none}
.status.hero.centre .stext,.status.hero.centre .say,.status.hero.centre .note{max-width:420px;margin-left:auto;margin-right:auto}
.status .orbb{appearance:none;display:block;border:0;background:none;padding:0;margin:0;border-radius:999px;line-height:0;cursor:pointer}
.status .say{margin:10px auto 0;min-height:40px;max-width:260px;text-align:center;font-size:13px;line-height:1.5;color:var(--ink3)}
.status .say.on{color:var(--ink)}
/* the running Build screen: the status card says who and how, the content box what is being done */
.status .sword{margin-top:3px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-fg)}
.status .sword.ok{color:var(--ok-fg)} .status .sword.err{color:var(--ink)}
.cbox{overflow:hidden}
.cbox-h{padding:14px 20px;border-bottom:1px solid var(--line-soft);background:var(--soft)}
.crow{display:flex;gap:14px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid var(--line-soft)}
.crow:last-child{border-bottom:0}
.crow .t{font-size:15px;font-weight:600;line-height:1.35}
.crow .t .n{font-size:12px;font-weight:400;color:var(--ink3);margin-right:10px}
.crow.pending .t{color:var(--ink2);font-weight:500}
.crow.failed{background:var(--soft)}
.mk{width:20px;height:20px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.mk.done{background:var(--ok-fg);color:var(--on-fill)}
.mk.pending{border:1.5px dashed var(--line)}
.mk.failed{background:var(--ink);color:var(--paper)}
.mk.supply{background:var(--warn-bg);color:var(--warn-fg)}
.mk.now svg{display:block}
.mk-track{stroke:var(--line-soft);stroke-width:.24}
.mk-arc{stroke:var(--warn-fg);stroke-width:.24;stroke-linecap:round}
.pill.wait{color:var(--ink2);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.pill.fail{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 20px}
.cslide{border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px;background:var(--soft)}
.cslide .t{margin-top:8px;font-size:14px;font-weight:600;line-height:1.35}
.cslide.now{border:1.5px solid var(--create);background:var(--card)}
.cslide.pending{border-style:dashed;background:transparent;color:var(--ink2)}
.cslide.failed{border:1.5px solid var(--ink);background:var(--card)}

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- The one agent engine (app/templates/shared/agent-sphere), inlined here by make_deck_maker.rs: every circle is its sphere. -->
<!-- @napkin:agent-sphere -->

<!-- The pure part: what a screen decides, with no DOM. app/tests/deckMaker.test.ts runs this block alone. -->
<script id="deck-logic">
var DeckLogic = (function () {
  'use strict';

  /** The agent's marks from a block: a placeholder is text only the user can supply. */
  function isPlaceholder(block) {
    return !!(block && (block.human === true || /^\[[^\]]+\]$/.test(String(block.text || '').trim())));
  }

  /** Slide ids in story order. Backup slides (after the divider) are counted, not listed. */
  function presented(deck) {
    return ((deck && deck.order) || []).filter(function (id) { return deck.slides && deck.slides[id]; });
  }

  /** Every ref a slide cites, once, in the order it first appears. */
  function refsOf(slide) {
    var seen = {}, out = [];
    function add(list) {
      (list || []).forEach(function (r) { if (!seen[r]) { seen[r] = 1; out.push(r); } });
    }
    ((slide && slide.blocks) || []).forEach(function (b) { add(b.refs); });
    ((slide && slide.claims) || []).forEach(function (c) { add(c.refs); });
    return out;
  }

  /** What each cited ref says. A ref the run does not hold is shown as missing, never skipped. */
  function evidenceFor(slide, evidence) {
    return refsOf(slide).map(function (ref) {
      var e = evidence && evidence[ref];
      return e ? { ref: ref, kind: e.kind, text: e.text }
               : { ref: ref, kind: 'not found', text: 'This run holds nothing under that name.' };
    });
  }

  /** needs-you when a placeholder is on the slide or the engine says so; drafted; else from source. */
  function statusOf(slide) {
    if (!slide) return 'drafted';
    if (slide.status === 'needs_human') return 'need';
    if (slide.status === 'drafted') return 'draft';
    return 'src';
  }

  var STATUS = {
    src: { label: 'From source', tone: 'ok' },
    draft: { label: 'Drafted', tone: 'plain' },
    need: { label: 'Needs you', tone: 'warn' }
  };

  /** The Checks tab: what the validators found, then what the view can see for itself. */
  function checksFor(id, slide, validation) {
    var out = [];
    var found = (validation && validation.findings && validation.findings[id]) || [];
    found.forEach(function (f) { out.push({ ok: false, text: f.message }); });
    var blocks = (slide && slide.blocks) || [];
    var ph = blocks.filter(isPlaceholder).length;
    if (ph && !found.length) out.push({ ok: false, text: ph + ' placeholder' + (ph > 1 ? 's' : '') + ' to supply' });
    if (!found.length && !ph) {
      out.push({ ok: true, text: 'No problems found on this slide' });
    }
    var bare = ((slide && slide.claims) || []).filter(function (c) { return !(c.refs || []).length; });
    bare.forEach(function (c) { out.push({ ok: true, text: 'Labelled ' + (c.basis || 'opinion') + ', so it carries no source' }); });
    return out;
  }

  /**
   * One gate approved: that stage is done and the next one starts. Anything but the open gate is refused. The approval
   * says what was decided ({by, at, decision: 'approve', picked?, note?}) and is added to run.decisions. At a gate that
   * offers territories, `choice.picked` names the one picked (else the gate's own pick, else the judge's first); a pick
   * that is not one of them is refused. The agent feed is cleared (agent: null), since it described the gate.
   */
  function approveGate(run, gateId, by, at, choice) {
    if (!run || !run.gate || run.gate.id !== gateId) return null;
    // Stages are copied whole, as approveDeck does: the store replaces arrays, so a key left out (items) would be lost.
    var stages = (Array.isArray(run.stages) ? run.stages : []).filter(isObj).map(function (s) {
      var o = {};
      Object.keys(s).forEach(function (k) { o[k] = s[k]; });
      return o;
    });
    var i = stages.findIndex(function (s) { return s.id === gateId; });
    if (i < 0) return null;
    var c = isObj(choice) ? choice : {}, picked = null;
    var ids = territoriesOf(run.gate).map(function (t) { return t.id; });
    if (ids.length) {
      picked = c.picked != null ? String(c.picked) : ids.indexOf(run.gate.picked) >= 0 ? run.gate.picked : run.gate.first_pick;
      if (ids.indexOf(picked) < 0) return null;
    }
    stages[i].status = 'done';
    var next = stages.find(function (s, k) { return k > i && s.status === 'next'; });
    if (next) next.status = 'now';
    var approvals = {};
    Object.keys(run.approvals || {}).forEach(function (k) { approvals[k] = run.approvals[k]; });
    approvals[gateId] = { by: by, at: at, decision: 'approve' };
    if (picked) approvals[gateId].picked = picked;
    if (typeof c.note === 'string' && c.note.trim()) approvals[gateId].note = c.note.trim();
    return {
      state: 'building', stage: next ? next.id : run.stage, cost_usd: run.cost_usd,
      stages: stages, gate: null, approvals: approvals, agent: null,
      decisions: decisionsOf(run).concat([{ gate: gateId, kind: 'approve', by: by, at: at }])
    };
  }

  /**
   * Only the person's half of approving a gate, for a document with an engine behind it: {approvals, decisions}, nothing else. The
   * engine's side (state, stages, agent, gate) is written by the middleware's change, never by the app (middleware-api.md section 12).
   * The same checks as approveGate (the open gate, a territory that exists); null when it would be refused.
   */
  function humanApproval(run, gateId, by, at, choice) {
    var full = approveGate(run, gateId, by, at, choice);
    return full ? { approvals: full.approvals, decisions: full.decisions } : null;
  }

  /** The decisions recorded so far, as a new list (the store replaces arrays, so a write carries the whole list). */
  function decisionsOf(run) { return (isObj(run) && Array.isArray(run.decisions) ? run.decisions : []).filter(isObj); }

  /**
   * An edit or a retry asked at the open gate: recorded in run.decisions and run.gate_requests (status waiting), like
   * change_requests. It launches nothing: the engine acts on it once it is connected. Null for any gate but the open one,
   * or another kind. The patch goes under `run`.
   */
  function gateRequest(run, gateId, kind, by, at) {
    if (!isObj(run) || !isObj(run.gate) || run.gate.id !== gateId || (kind !== 'edit' && kind !== 'retry')) return null;
    var asked = (Array.isArray(run.gate_requests) ? run.gate_requests : []).filter(isObj);
    return {
      decisions: decisionsOf(run).concat([{ gate: gateId, kind: kind, by: by, at: at }]),
      gate_requests: asked.concat([{ gate: gateId, kind: kind, at: at, status: 'waiting' }])
    };

  }

  function screenOf(s) {
    if (view.screen) return view.screen;
    if (s.run.state === 'done') return 'review';

    if (s.run.state === 'gate' || s.run.state === 'building' || s.run.state === 'failed') return 'build';

  }

  // ── pieces ────────────────────────────────────────────────────────────

  var STEPS = [['start', 'Start'], ['build', 'Build'], ['review', 'Review'], ['present', 'Present']];
  // In the OS (this frame has a parent) the OS bar shows the steps and chips, so no bar of our own is drawn.
  var inShell = typeof window !== 'undefined' && !!window.parent && window.parent !== window;
  if (inShell && typeof document !== 'undefined' && document.documentElement) document.documentElement.classList.add('in-shell');

  // The error and cost readouts: the same words in either bar.
  function barChips(s, scr) {
    var v = s.validation, out = [];
    if (s.run.state === 'done' || scr === 'review') {
      out.push({ text: (v.errors || 0) + ' errors · ' + L.toSupply(s.raw).count + ' to supply', tone: (v.errors || 0) ? 'warn' : 'ok', cls: 'chip ' + ((v.errors || 0) ? 'warn' : 'ok') });
    }

    return out;
  }

  // The tool's header (the mock's .app-head, design/new-ui/napkin-app-v1.html): where you are, Deck Studio. and what it does, with
  // the deck's four steps as the mock's flow circles on the right. In the OS this is the page's only header (the OS bar is above it).
  var NUM_WORDS = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen'];
  function headEyebrow(s) {
    var m = (window.__CLAN__ || {}).manifest || {}, mc = m.client && typeof m.client === 'object' ? String(m.client.name || '').trim() : '';
    var p = s.inputs.prompt || {}, meta = s.deck.meta || {};
    var client = mc || String(p.client || meta.client || '').trim();
    // a project the read left as its placeholder ("[Project]") or a document nobody named yet is not a name
    var named = function (v) { v = String(v || '').trim(); return /^\[.*\]$/.test(v) || /^untitled\b/i.test(v) || /^deck (maker|studio)$/i.test(v) ? '' : v; };
    var proj = named(p.project) || named(meta.project) || named(m.title) || 'New deck';
    return [client, proj].filter(Boolean).join(' · ');
  }
  function headSub(s) {
    var n = L.presented(s.deck).length, up = L.upstreamSummary(s.raw);

    var from = up.brief && up.research ? 'your verified creative brief and pinned research facts'

  function flowSteps(scr) {

      return '<li><button data-go="' + st[0] + '"' + (scr === st[0] ? ' aria-current="step"' : i < at ? ' class="done"' : '') + '><i>' + (i + 1) + '</i><span>' + st[1] + '</span></button></li>';
    }).join('') + '</ol>';
  }
  function appHead(s, scr) {
    return '<header class="app-head' + (scr === 'build' ? ' compact' : '') + '"><div class="app-head-text"><div class="eyebrow hd-eye">' + esc(headEyebrow(s)) + '</div>' +
      '<h1 class="hero-title">Deck Studio<span class="period-dot" aria-hidden="true"></span></h1>' +

  function bar(s, scr) {

    var chips = barChips(s, scr);
    function spans(list) { return list.map(function (c) { return '<span class="' + c.cls + '">' + esc(c.text) + '</span>'; }).join(''); }

  // What the OS bar is asked to show (clan:bar): the chips (the steps are the page's own, above). The whole list each

  var lastBar = null;

  /** What the OS bar shows, as the mock's bar per step: the name alone at the prompt (mode ask); the name and the run's step while
   *  the agents work or a gate waits (mode working, no Continue in or Share); the deck's own state once there is a deck. The error,
   *  supply and cost facts are on the page (the storyboard row, the run bar), not chips in the bar. */
  function barItems(s, scr) {
    var run = s.run, all = run.stages || [], at = -1;
    all.forEach(function (st, i) { if (at < 0 && (st.status === 'now' || st.status === 'failed')) at = i; });
    var step = at >= 0 ? ' · Step ' + (at + 1) + '/' + all.length : '';
    if (scr === 'start') return [{ kind: 'mode', mode: 'ask', label: '' }];

  var TITLE = { done: '', last: '' };

  function landing(s) {

    return '<main class="ld isheet"><h2 class="isec ld-h">What are we pitching?</h2><div class="paperc">' +
      (from ? '<div class="fromup">' + esc(from) + '</div>' : '') +
      '<div class="iarea"><div class="plabel"><label for="ptext">The client, the brand and what they want</label><span id="wc" aria-live="off">' + words(text) + '</span></div>' +
      '<textarea id="ptext" class="pta" data-land rows="6" placeholder="Tell us in a line or paste everything you have. Add anything they sent you." aria-label="What are we pitching?">' + esc(text) + '</textarea>' +
      '<div class="iex" role="group" aria-label="Try an example"><span>Try an example</span>' + EXAMPLES.map(function (e, i) { return '<button data-eg="' + i + '" title="' + esc(e) + '">' + esc(EXAMPLE_NAMES[i]) + '</button>'; }).join('') + '</div></div>' +
      (files.length ? '<div class="ifiles"><div class="plabel"><span>Attached files on the desk</span></div><div class="chips">' + files.map(function (f) { return '<span class="chip">' + esc(f.name) + '</span>'; }).join('') + '</div></div>' : '') +
      '<div class="cfoot"><label class="attach" for="attach" title="Got a brief, an email or a deck? Attach it" aria-label="Attach files"><span aria-hidden="true">+</span></label><input type="file" id="attach" multiple hidden>' +
      '<button class="go ld-go" id="land-build">Build deck</button></div></div></main>';
  }
  /** One chip of the read line: what was read, with a pencil to change it. A placeholder is dashed. */
  function rchip(k, label, text, ph, open) {
    return '<button class="ld-rc' + (ph ? ' ph' : '') + (open ? ' open' : '') + '" data-rd="' + k + '"><small>' + label + '</small>' + esc(text) + ' <span aria-hidden="true" style="color:var(--ink3);font-size:11px">✎</span></button>';
  }
  function readLineHtml(r, s) {
    var ty = r.type ? L.DECK_TYPES.filter(function (x) { return x.id === r.type; })[0] : null, files = L.documentsOf(s.raw), ed = r.editing;
    return '<span class="lead">I read this as</span>' + rchip('type', 'Kind', ty ? ty.label : 'Not sure yet', !ty, ed === 'type') +
      '<span class="lead">for</span>' + rchip('client', 'Client', r.client || '[Client]', !r.client, ed === 'client') +
      rchip('project', 'Project', r.project || '[Project]', !r.project, ed === 'project') +
      (r.agency ? '<span class="lead">from</span>' + rchip('agency', 'Agency', r.agency, false, ed === 'agency') : '') +
      '<span class="lead">·</span>' + rchip('length', 'Length', r.length === 'full' ? 'Full story' : 'Up to 18 slides', false, ed === 'length') +
      (files.length ? '<span class="lead">·</span>' + rchip('files', 'Files', files.length + (files.length > 1 ? ' files' : ' file'), false, ed === 'files') : '') +
      (!r.agency && ed !== 'agency' ? '<button class="ld-link" data-rd="agency">add the agency</button>' : '');
  }
  function editorHtml(r, s) {
    var k = r.editing;
    if (!k) return '';
    var h = '<div class="ld-ed">';
    if (k === 'type') h += L.DECK_TYPES.map(function (x) { return '<button class="opt" data-rdset="type:' + x.id + '" aria-pressed="' + (r.type === x.id) + '">' + esc(x.label) + '<span>' + esc(x.one_line) + '</span></button>'; }).join('');
    else if (k === 'length') h += [['pitch', 'Up to 18 slides', 'Pitch, then an appendix of backup'], ['full', 'Full story', 'Every slide in story order']].map(function (x) {
      return '<button class="opt" data-rdset="length:' + x[0] + '" aria-pressed="' + (r.length === x[0]) + '">' + x[1] + '<span>' + x[2] + '</span></button>'; }).join('');
    else if (k === 'files') h += '<p class="note">' + (L.documentsOf(s.raw).length ? L.documentsOf(s.raw).map(function (f) { return esc(f.name); }).join(', ') : 'No files attached.') +
      '</p><div class="row2"><label class="btn sm" style="display:inline-flex;align-items:center" for="attach">Attach files</label><input type="file" id="attach" multiple hidden></div>';
    else h += '<input type="text" id="rd-val" value="' + esc(r[k] || '') + '" placeholder="' + (k === 'agency' ? 'Shows as [Agency] if left empty' : 'Type it here') + '">' +
      '<div class="row2"><button class="btn" data-rdcancel>Cancel</button><button class="btn go" data-rdsave="' + k + '">Save</button></div>';
    return h + (k === 'type' || k === 'length' ? '<div class="row2"><button class="btn" data-rdcancel>Close</button></div>' : k === 'files' ? '<div class="row2"><button class="btn" data-rdcancel>Close</button></div>' : '') + '</div>';
  }
  function questionHtml(r) {
    var q = (r.qs || [])[r.qi];
    if (!q) return '';
    return '<div class="ld-q"><div class="n">Question ' + (r.qi + 1) + ' of ' + r.qs.length + ' · ' + esc(q.n) + '</div><h3>' + esc(q.text) + '</h3><div class="why">' + esc(q.why) + '</div>' +
      (q.opts.length ? '<div class="ld-opts">' + q.opts.map(function (o) { return '<button data-ra="' + esc(o.value) + '">' + esc(o.label) + '</button>'; }).join('') + '</div>' : '') +
      (q.free ? '<div class="ld-qtext"><input type="text" id="rd-q" placeholder="Type it here"><button class="btn go" data-rsend style="height:42px;padding:0 18px">Answer</button></div>' : '') +
      '<div class="ld-qfoot"><span>' + (r.qs.length - r.qi - 1) + ' more · you can skip any</span><button class="ld-link" data-rskip>Skip</button></div></div>';
  }
  /** The read, shown: what was read with a pencil on each part, and the first question the prompt left open. */
  function readScreen(s) {
    var r = view.read;
    return '<main class="ld"><div class="ld-read"><div class="eyebrow" style="margin-bottom:6px">What I read</div><div class="ld-line">' + readLineHtml(r, s) + '</div>' +
      editorHtml(r, s) + '</div>' + questionHtml(r) +
      (!(r.qs || []).length ? '<div style="margin-top:22px"><button class="ld-go" data-rdgo>Build deck again</button></div>' : '') + '</main>';
  }
  /** On the Build screen: what was read, in one line, and a way back to change it (which starts the deck again). */
  function readStrip(scr) {
    if (scr !== 'build' || !view.readLine) return '';
    return '<div class="ld-strip"><span><b>Reading:</b> ' + esc(view.readLine) + '</span><button class="ld-link" data-rdagain>Change this and start again</button></div>';
  }
  /** The read is settled (nothing left to ask, or the person skipped it): save it, go to Build, and let the engine carry on by itself. */
  function commitRead() {
    var s = d(), r = view.read;
    if (!r) return;
    var kind = L.kindOfType(r.type || 'agency_pitch');
    var saved = put({ inputs: { prompt: { client: r.client || '', project: r.project || '', agency: r.agency || '', text: r.text }, kind: kind, format: r.length } },
      'start deck', 'inputs read from the prompt' + (r.typeFrom === 'asked' ? ', deck type answered by the person' : ''));
    var tp = L.typePatch(s.raw, r.type || null, now());
    var typed = tp ? put(tp, r.type ? 'deck type' : 'skip deck type', r.typeFrom === 'asked' ? 'answered by the person' : r.type ? 'read from the prompt' : 'skipped') : null;
    view.readLine = L.readSentence(r);
    view.last = r; view.read = null; view.screen = 'build'; view.landText = null;
    render();
    if (mwOn()) {
      toast('Saved. The engine is starting: it stops at the first gate and waits for you.');
      Promise.all([saved, typed]).then(startBuild);
    } else toast('Saved. Live building needs the engine server.');
  }
  /** Ask the next question, or carry on when none is left. */
  function afterAnswer() {
    var r = view.read;
    if (!r.qs.length || r.qi >= r.qs.length) return commitRead();
    return render();
  }

  function start(s) {
    if (view.read) return readScreen(s);
    if (isFresh(s)) return landing(s);
    return startFull(s);
  }

  function startFull(s) {
    var inp = s.inputs, p = inp.prompt || {};
    var dt = L.deckTypeOf(s.raw), typed = dt.source === 'answered';
    var kind = typed ? L.kindOfType(dt.id) : (pending.kind || inp.kind), format = pending.format || inp.format;
    var docs = L.documentsOf(s.raw);
    var sum = L.summaryOf({ prompt: p, kind: kind, format: format, type: typed ? dt.id : null }, s.deck);
    var text = draft('text', p.text);
    var bf = L.builtFrom(inp, s.upstream, docs, typed ? dt.id : null);
    function field(id, lab, val, ph) {
      return '<div><label class="lab" for="' + id + '">' + lab + '</label><input class="inp" id="' + id + '" value="' + esc(draft(id, val)) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + ' /></div>';
    }
    var hasText = !!String(text).trim();
    var docList = docs.length ? docs.map(function (x) {
      return '<div class="doc" style="margin-bottom:8px"><span class="ico">DOC</span><div><div style="font-size:14px;font-weight:600">' + esc(x.name) + '</div>' + (x.pages ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + esc(x.pages) + ' pages</div>' : '') + '</div></div>';
    }).join('') : '<p class="note">No documents attached. Attach a client brief, a deck or notes and every figure on a slide can point back to it.</p>';
    return '<main class="start"><div>' +
      '<div class="eyebrow">New deck</div>' +
      '<h1 style="margin:10px 0 6px">What are we pitching?</h1>' +
      '<p class="lede" style="margin-bottom:28px">Tell us in a line or paste everything you have, and attach any documents. A brief or research is optional. Nothing else is used, so every line on a slide traces back to what you gave.</p>' +
      '<div class="stack">' + typeSelector(s) +
      '<section class="card sec"><div class="sec-h"><span class="mono eyebrow">01</span><b>Your prompt</b><div class="spacer"></div>' +
        '<span class="pill ' + (hasText ? 'ok' : 'plain') + '">' + (hasText ? 'Ready' : 'A line is enough') + '</span></div>' +
        '<div class="three">' + field('client', 'Client', p.client || docClient()) + field('project', 'Project', p.project) + field('agency', 'Agency (optional)', p.agency || AGENCY.name, 'Shows as [Agency]') + '</div>' +
        '<div style="margin-top:14px"><label class="lab" for="ptext">What are we pitching? (a line is enough; paste everything you have)</label><textarea class="inp ta" id="ptext">' + esc(text) + '</textarea></div></section>' +
      '<section class="card sec"><div class="sec-h"><span class="mono eyebrow">02</span><b>Documents</b><div class="spacer"></div><span class="pill ' + (docs.length ? 'ok' : 'plain') + '">' + (docs.length ? docs.length + ' attached' : 'Optional') + '</span></div>' +
        docList + '<div style="margin-top:10px"><label class="btn sm" style="display:inline-flex;align-items:center" for="attach">Attach files</label><input type="file" id="attach" multiple style="position:absolute;left:-9999px" aria-label="Attach documents" />' +
        '<p class="note" style="margin-top:8px">Attaching needs the host. Files stay in this document.</p></div></section>' +
      upstreamCards(s) +
      checkPanel(s) +
      '<div class="two">' + (typed ? '' : '<div><div class="eyebrow dark" style="margin-bottom:8px">Kind of deck</div><div class="row">' +
        pick('kind', 'agency', kind, 'Agency pitch', 'Territories, one idea, executions') + pick('kind', 'investor', kind, 'Investor deck', 'Problem, market, traction, ask') +
      '</div></div>') + '<div><div class="eyebrow dark" style="margin-bottom:8px">Length</div><div class="row">' +
        pick('format', 'pitch', format, 'Pitch · 18 slides', 'Then an appendix of backup') + pick('format', 'full', format, 'Full story', 'Every slide in story order') +
      '</div></div></div></div></div>' +
      '<aside class="stack">' +
      '<div class="frost summary"><div class="eyebrow">You will get</div><div class="t">' + esc(sum.title) + '</div><div class="note">' + esc(sum.note) + '</div><div class="rule"></div>' +
        builtLine(bf, hasText) + '<div class="rule"></div>' +
        '<div class="li"><span class="dot"></span><span><b style="font-weight:600">Web deck</b> to present in a browser, with a presenter view</span></div>' +
        '<div class="li"><span class="dot"></span><span><b style="font-weight:600">PowerPoint</b> with notes and the appendix hidden</span></div>' +
        '<div class="li"><span class="dot"></span><span><b style="font-weight:600">Animated deck</b> you can present from HyperFrames</span></div>' +
        '<div class="rule"></div><p class="note">You approve the storyline and pick a territory on the way. Then you review the finished deck.</p>' +
        '<button class="btn go big" id="build" style="width:100%;margin-top:18px;height:48px">Build deck</button>' +
        '<p class="mono" style="margin-top:10px;text-align:center;font-size:11px;color:var(--ink3)">' + (mwOn() ? 'Builds with the engine and stops at the first gate. Nothing past a gate runs until you approve it.' : s.run.stages.length ? 'Opens the recorded run. Live building needs the engine server.' : 'Live building needs the engine server.') + '</p></div>' +
      library(s) + '</aside></main>';
  }

  // The team-library shelf is off until ADR 0027 (the amendment to the deck input rule, ADR 0023) is approved.
  function library(s) {
    if (!s.inputs.library || !s.inputs.library.enabled) {
      return '<div class="lib off"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:14px;font-weight:600">From the team library</b><span class="pill plain">Off</span></div>' +
        '<p class="note" style="margin-top:8px">A brand kit and pictures from your team library would be optional inputs. That changes the rule that a deck takes only the prompt, the research and the brief, so it stays off until that rule change is approved.</p></div>';
    }
    return '<div class="lib"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:14px;font-weight:600">From the team library</b><span class="note">optional</span></div>' +
      '<p class="note" style="margin-top:10px">Pictures replace the "illustrative" placeholders. Font files are never taken from a PDF.</p></div>';
  }

  /** The built_from the engine recorded on the deck, else what Start would compute from the document. */
  function builtOf(s) {
    var m = s.deck && s.deck.meta && s.deck.meta.built_from;
    return m && m.tier ? m : L.builtFrom(s.inputs, s.upstream, L.documentsOf(s.raw), L.deckTypeOf(s.raw).source !== 'default' ? L.deckTypeOf(s.raw).id : null);
  }

  // ── 2 · Build, with gates ─────────────────────────────────────────────
  // A gate is drawn from the registry (L.gateView): its head, the Deck agent's note, its body (the storyline's beats, gate 2's
  // territories, gate 3's idea) and its actions. Gate 1's markup is the same as before the registry, byte for byte.
  function gateHead(gv) {
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span class="pill warn">Needs you</span><span class="eyebrow">Gate ' + esc(gv.n) + ' of ' + esc(gv.of) + '</span></div>' +
      '<h1 class="sm" style="margin-bottom:6px">' + esc(gv.title) + '</h1>' +
      '<p class="note" style="font-size:15px;max-width:600px;margin-bottom:20px">' + esc(gv.lede) + '</p>';
  }

  /** The Deck agent's note at the top of the gate card (gate.dex). Notes written for gates 2 and 3 are marked as proposed. */
  function dexRow(gv) {
    return '<div class="dex">' + L.circleSvg({ agent: 'deck', activity: 'waiting', size: 32, aria: 'hidden' }) + '<span class="mono" style="font-size:12px">Deck agent</span><span class="note">' + esc(gv.dex) + '</span>' +
      (gv.dex_proposed && gv.dex ? '<span class="pill plain dexp" title="The Deck agent\'s note here is our proposed wording, not yet agreed">Proposed</span>' : '') + '</div>';
  }

  var BASES = { brief: ['From brief', 'ok'], research: ['From research', 'ok'], proposal: ['Our proposal', 'warn'], placeholder: ['Placeholder', 'warn'] };

  function gateBody(gv, gate) {
    if (gv.body === 'beats') {
      return (Array.isArray(gate.beats) ? gate.beats : []).filter(L.isObj).map(function (b) {
        var c = L.own(BASES, b.basis) ? BASES[b.basis] : BASES.brief;
        return '<div class="beat"><span class="n">' + esc(b.n) + '</span><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;line-height:1.35">' + esc(b.title) + '</div><div class="mono eyebrow" style="margin-top:3px;text-transform:none;letter-spacing:0">' + esc(b.src) + '</div></div><span class="pill ' + c[1] + '">' + c[0] + '</span></div>';
      }).join('') +
        (gate.more_beats ? '<div style="padding:11px 20px;font-size:13px;color:var(--ink3)">+ ' + esc(gate.more_beats) + ' more beats, then the appendix</div>' : '');
    }
    if (gv.body === 'territories') {
      // Each territory is a button: pressing it picks it (view state only); Pick this territory writes the pick.
      return '<div role="group" aria-label="Territories">' + gv.territories.map(function (t) {
        var on = t.id === gv.picked;
        return '<button class="beat terr" data-territory="' + esc(t.id) + '" aria-pressed="' + on + '"><span class="n">' + esc(t.n) + '</span><span class="tb">' +
          '<span class="tn"><span>' + esc(t.name) + '</span>' + (t.id === gv.first_pick ? '<span class="pill ok">Blind judge’s first pick</span>' : '') + '</span>' +
          (t.thought ? '<span class="tt">' + esc(t.thought) + '</span>' : '') + (t.why ? '<span class="tw"><b>Why it fits:</b> ' + esc(t.why) + '</span>' : '') +
          '</span><span class="sel" aria-hidden="true"></span></button>';
      }).join('') + '</div>';
    }
    if (gv.body === 'idea' && gv.idea) {
      var x = gv.idea;
      return '<div class="beat iline"><div style="flex:1;min-width:0"><div class="eyebrow" style="margin-bottom:6px">The idea line</div><div class="il">' + esc(x.line) + '</div></div>' +
          (x.basis ? '<span class="pill ' + x.basis_tone + '">' + esc(x.basis) + '</span>' : '') + '</div>' +
        x.executions.map(function (e) {
          return '<div class="beat"><span class="n">' + esc(e.n) + '</span><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;line-height:1.35">' + esc(e.channel) + '</div>' +
            (e.summary ? '<div class="ex">' + esc(e.summary) + '</div>' : '') + '</div>' + (e.tag ? '<span class="pill ' + e.tone + '">' + esc(e.tag) + '</span>' : '') + '</div>';
        }).join('') +
        (x.rests_on.length ? '<div class="rests"><div class="eyebrow">What the idea rests on</div><div class="chips">' + x.rests_on.map(function (r) {
          return '<span class="chip ' + r.tone + '">' + esc(r.label) + '</span>';
        }).join('') + '</div></div>' : '');
    }
    return '<div class="crow pending"><span class="note">Nothing to show for this gate yet.</span></div>';
  }

  /** Approve (or Pick), Edit and Ask the Deck agent. Edit and the ask record a request; once one waits, the gate says so. */
  function gateActions(gv) {
    var none = gv.body === 'territories' && !gv.picked;
    var asked = gv.asked.length ? '<p class="note asked" role="status" data-asked>You asked ' + (gv.asked.indexOf('edit') >= 0 && gv.asked.indexOf('retry') >= 0 ? 'for an edit and a new try'
      : gv.asked.indexOf('edit') >= 0 ? 'for an edit' : 'the Deck agent to try again') + '. It waits for the engine, which is not connected yet; nothing has changed.</p>' : '';
    return '<div style="margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><button class="btn go big" id="approve"' + (none ? ' disabled' : '') + '>' + esc(gv.approve) + '</button>' +
      '<button class="btn big" style="padding:0 20px;font-size:14px" data-edit="' + esc(gv.edit_key) + '">' + esc(gv.edit_label) + '</button><button class="btn big" style="padding:0 20px;font-size:14px" data-retry="' + esc(gv.id) + '">Ask the Deck agent to try again</button></div>' +
      (gv.body === 'beats' ? '' : '<p class="note" style="margin-top:12px;font-size:13px">' + (none ? 'Pick a territory first. ' : '') + 'Every approve, edit or retry is recorded with who did it.</p>') + asked;
  }

  // The Build screen is the mock's live agent stage (napkin-app-v1 #brief-screen-loading, as the brief's working step): the deck's
  // stages as pills on a strip; the desk with what went in on the left, the agent's circle and its words in the middle (the gate
  // card instead while a gate waits for you) and what it has worked out on the right; then Back, Stop and Skip under it.
  var STAGE_SIZE = 220;
  function stageSize() { return Math.min(STAGE_SIZE, L.circleCentreSize(window.innerWidth, window.innerHeight)); }
  /** One slip on a rail: a mono label, a line of serif text, a mark (done, at work, to look at). */
  function slip(lab, text, mark, wait) {
    return '<div class="wcard"><div class="wlab"><span>' + esc(lab) + '</span></div><div class="wsnip' + (wait ? ' wait' : '') + '">' + esc(text) + '</div>' +
      (mark ? '<span class="wchk' + (mark === 'now' ? ' now' : mark === 'bad' ? ' bad' : '') + '" aria-hidden="true">' + (mark === 'now' ? '…' : mark === 'bad' ? '!' : '✓') + '</span>' : '') + '</div>';
  }
  function wsec(h, cards, empty) {
    return '<div class="wsec"><div class="wsec-h">' + esc(h) + '</div>' + (cards.length ? cards.join('') : slip('Nothing yet', empty || 'It fills as the agents work.', '', true)) + '</div>';
  }
  /** INPUTS ON THE DESK: what the deck is built from (the prompt, the files, the brief and research it was made from). */
  function inputsRail(s) {
    var p = s.inputs.prompt || {}, up = L.upstreamSummary(s.raw), out = [];
    if (String(p.text || '').trim()) out.push(slip('Your words', short(String(p.text).trim(), 110), 'ok'));
    L.documentsOf(s.raw).forEach(function (f) {
      var ext = (/\.([a-z0-9]+)$/i.exec(f.name || '') || [])[1] || 'file';
      out.push(slip('File · ' + String(ext).toUpperCase(), f.name, 'ok'));
    });
    if (up.brief) out.push(slip('Brief · .clan', up.brief.name + (up.brief.fields_total ? ' — ' + up.brief.fields_filled + ' of ' + up.brief.fields_total + ' fields' : ''), 'ok'));
    if (up.research) out.push(slip('Research · .clan', up.research.name + (up.research.findings != null ? ' — ' + up.research.findings + ' findings' : ''), 'ok'));
    if (p.client || p.project) out.push(slip('Client · project', [p.client || '[Client]', p.project || '[Project]'].join(' · '), 'ok'));
    return wsec('Inputs on the desk', out, 'Nothing given yet.');
  }
  function short(t, n) { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : t; }

  function build(s) {
    var run = s.run, gate = run.gate, who = L.agentState(run); // the circle: who is working and what they are doing
    var all = run.stages || [], at = -1;
    all.forEach(function (st, i) { if (at < 0 && (st.status === 'now' || st.status === 'failed')) at = i; });
    var stages = all.map(function (st, i) {
      var glyph = st.status === 'done' ? '✓' : st.status === 'now' ? '•' : st.status === 'failed' ? '!' : '';
      return '<div class="stage ' + st.status + '" role="listitem" title="' + esc(st.sub) + '"' + (i === at ? ' aria-current="step"' : '') + '><span class="ring ' + st.status + '" aria-hidden="true">' + glyph + '</span><div><b>' + esc(st.name) + '</b><span class="s">' + esc(st.sub) + '</span></div></div>';
    }).join('');
    var main, gv = gate ? L.gateView(run, view.pick) : null; // the gate registry: words and body for the open gate
    // An open gate is the agent asking: its sphere eases up and the gate card shows under it, in the stage (askStage).
    if (gate) main = askStage(who, true, gateHead(gv) + '<div class="card gcard" style="overflow:hidden">' + dexRow(gv) + '<div class="gbody">' + gateBody(gv, gate) + '</div></div>' + gateActions(gv));
    // With no gate open: running (a live feed), failed, done, or waiting for an engine that is not connected.
    var rv = gate ? null : L.runView(run, s.deck), live = rv && rv.kind !== 'waiting';
    var step = at >= 0 ? 'Step ' + (at + 1) + ' of ' + all.length : '';
    if (rv && !live) {
      main = askStage(who, false, caption(who, 'Waiting for the engine', 'Not connected to this document yet', false,
        rv.title ? 'Next in line: ' + rv.title + '. Once the engine is connected it runs to the next gate and stops there.' : 'Once the engine is connected it runs to the next gate and stops there.'));
    } else if (live) {
      main = askStage(who, false, caption(who, rv.title, (step && rv.kind === 'running' ? step + ' · ' : '') + rv.lede, rv.kind === 'failed'));
    }
    // A gate's own checks when it wrote them (even none), else what the run has checked.
    var gateChecks = !!gate && Array.isArray(gate.checks), list = gateChecks ? gate.checks : run.checks;
    var checks = Array.isArray(list) && (gateChecks || list.length) ? checkedCard(list) : '';
    var right = live ? runBox(rv) + checks + builtLine(builtOf(s))
      : (gate ? '<div class="card" style="padding:20px"><div style="display:flex;align-items:center;gap:12px">' +
        '<div><div style="font-size:14px;font-weight:600">Waiting for you</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0">' + esc(gv.hold) + '</div></div></div><div class="rule"></div>' +
        '<p class="note">' + esc(gv.next) + '</p></div>' : '') + builtLine(builtOf(s)) + checks;
    return '<div class="pwrap"><div class="ptop"><aside class="apills" role="list" aria-label="How the deck gets built">' + stages + '</aside></div>' +
      '<main class="build sstage' + (gate ? ' at-gate' : '') + '" data-nk-stage><div class="rail rl">' + inputsRail(s) + '</div>' +
      '<section class="score">' + main + '</section><aside class="stack rail">' + right +
      '<div class="note" style="background:var(--soft);border-radius:18px;padding:16px 20px">Things you must supply, like the presenter or the budget split, show as labelled placeholders. They are never made up.</div></aside></main></div>' +
      runbar(s, rv, live);
  }

  /** Back to the prompt and Stop (while a build job runs); Open the deck and Try again where the run is done or failed. No Skip (owner: it breaks things). */
  function runbar(s, rv, live) {
    var busy = !!(JOB && BUSY_JOB[JOB.state] && JOB.id);
    var stop = busy ? (view.stopAsk ? '<span class="stopq">Stop the build? What is written so far stays.</span><button class="sp-btn" data-stop="yes">Yes, stop it</button><button class="sp-btn" data-stop="no">Keep going</button>'
      : '<button class="sp-btn" data-stop="ask">Stop</button>') : '';
    var act = rv && rv.kind === 'done' ? '<button class="btn go big" data-go="review">Open the deck</button>'
      : rv && rv.kind === 'failed' ? '<button class="btn big' + (rv.retryable ? '' : ' go') + '" style="padding:0 20px;font-size:14px" data-retry="' + esc(rv.stage) + '">' + (rv.retryable ? 'Try again now' : 'Try again') + '</button>' +
        '<span class="note">Nothing you approved is lost. The run starts again from this step.</span>'
      : '';
    var cost = s.run.cost_usd != null ? '<span class="sb-facts">$' + Number(s.run.cost_usd).toFixed(2) + ' so far</span>' : '';
    return '<div class="runbar"><button class="side-link" data-go="start">← Back to the prompt</button>' + cost + '<span class="sp"></span><span class="procActs">' + stop + '</span>' + act + '</div>';
  }

  /** Checked so far: what the run has checked (a gate's checks, or run.checks), each passed or to look at. */
  function checkedCard(list) {
    return '<div class="card" style="padding:20px"><div class="eyebrow" style="margin-bottom:12px">Checked so far</div><div class="stack" style="gap:10px">' +
      list.filter(function (c) { return c && typeof c === 'object'; }).map(function (c) { return '<div class="check"><span class="tick ' + (c.ok ? 'ok' : 'warn') + '" aria-hidden="true">' + (c.ok ? '✓' : '!') + '</span><span>' + esc(c.text) + '</span></div>'; }).join('') + '</div></div>';
  }

  var HINT = 'Press the circle to ask what is happening.';

  /**
   * The circle in a status card. At 60px it is just the circle (the card says the name and the word, so it is hidden from
   * screen readers). Enlarged (circleSizeFor) it is a real button that says the agent and the state once, and pressing it
   * (data-orb) shows a few honest lines under it.
   */
  function orbHtml(who, name, bigSize) {
    var size = bigSize || L.circleSizeFor(who), svg = L.circleSvg({ agent: who.agent, to: who.to, activity: who.activity, word: who.word, size: size, aria: 'hidden' });
    if (size === 60) return '<span class="slot">' + svg + '</span>';
    return '<span class="slot big"' + (bigSize ? ' style="width:' + size + 'px;height:' + size + 'px"' : '') + '><button type="button" class="orbb" data-orb aria-label="' + esc(name + ', ' + who.word + '. Press to ask what is happening.') + '">' + svg + '</button></span>';
  }
  function nameOf(who) {
    var A = L.AGENTS, a = A[who.agent], b = who.handoff ? A[who.to] : null;
    return { name: a ? a.name + (b ? ' → ' + b.name : '') : 'Agent', role: a ? a.role + (b ? ' → ' + b.role : '') : '' };
  }
  /** The stage's caption under the sphere: the role and its sphere (roles.js), what it is doing, the step and the line, and the state in words. */
  function caption(who, l1, l2, err, more) {
    var cap = Roles && who.agent ? Roles.caption(who.agent) : (L.AGENTS[who.agent] ? L.AGENTS[who.agent].name.toUpperCase() : 'AGENT');
    if (who.handoff && who.to && Roles) cap = Roles.name(who.agent).toUpperCase() + ' → ' + Roles.name(who.to).toUpperCase();
    var tone = who.activity === 'complete' ? ' ok' : who.activity === 'error' ? ' err' : '';
    return '<div class="scap"><span class="abadge">' + esc(cap) + '</span><span class="l1">' + esc(l1) + '</span><span class="l2' + (err ? ' err' : '') + '">' + esc(l2) + '</span>' + (more ? '<span class="l2">' + esc(more) + '</span>' : '') +
      '<span class="sword' + tone + '">' + esc(who.word) + '</span></div>';
  }
  function stepsDone(who) { return who.step_index && who.step_total ? (who.step_index - 1) / who.step_total : undefined; }

  // ── the run's stage: the agent's sphere, centred, and under it what it asks (an open gate) or why it waits ──
  // The page is drawn again on every change, so the stage is drawn as it was at the last render and render() eases it
  // to what it is now (NapkinRoles.ask toggles nk-asking): the sphere rises and shrinks when a gate opens and comes back
  // down once it is approved. A render that changes nothing replays nothing.
  var askedLast = null, askWant = null; // nk-asking at the last render (null: no stage drawn) and now
  function askStage(who, asking, inner) {
    var n = nameOf(who), px = stageSize();
    var on = askedLast === null ? asking : askedLast, change = askedLast !== null && askedLast !== asking;
    askWant = asking;
    return '<div class="dkstage' + (on ? ' nk-asking' : '') + '" data-nk-stage style="--dk-sph:' + px + 'px">' +
      '<div class="aglbox"><button type="button" class="orbb" data-orb aria-label="' + esc(n.name + ', ' + who.word + '. Press to ask what is happening.') + '">' +
      L.circleSvg({ agent: who.agent, to: who.to, activity: who.activity, word: who.word, size: 'fill', aria: 'hidden', progress: stepsDone(who) }) + '</button></div>' +
      '<p class="say" data-say aria-live="polite">' + HINT + '</p><div class="dkask' + (change ? ' enter' : '') + '">' + inner + '</div></div>';
  }
  function sayHtml(who) { return L.circleSizeFor(who) === 60 ? '' : '<p class="say" data-say aria-live="polite">' + HINT + '</p>'; }

  /** The status card while an agent works: the circle (60px, or enlarged in place while it works), who (a hand-off names both), their role, the state word, the step. */
  function statusCard(who, size) {
    var n = nameOf(who), name = n.name, role = n.role, big = !!size || L.circleSizeFor(who) !== 60;
    var tone = who.activity === 'complete' ? ' ok' : who.activity === 'error' ? ' err' : '';
    return '<div class="card status' + (big ? ' hero' : '') + '" style="padding:20px" data-status="' + esc(who.activity) + '"><div class="srow">' + orbHtml(who, name, size) +
      '<div class="stext"><div style="font-size:14px;font-weight:600">' + esc(name) + '</div>' + (role ? '<div class="note">' + esc(role) + '</div>' : '') +
      '<div class="sword' + tone + '">' + esc(who.word) + '</div>' +
      (who.step_index ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">Step ' + who.step_index + ' of ' + who.step_total + '</div>' : '') +
      '</div></div>' + sayHtml(who) + '</div>';
  }

  /** The card while the engine is not connected: the same enlarged circle in its place, a short honest prompt, no time and no progress. */
  function waitingCard(who, centre) {
    var n = nameOf(who);
    return '<div class="card status hero' + (centre ? ' centre' : '') + '" style="padding:20px" data-status="' + esc(who.activity) + '"><div class="srow">' + orbHtml(who, n.name, centre ? stageSize() : 0) +
      '<div class="stext"><div style="font-size:16px;font-weight:700">Waiting for the engine</div><div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">Not connected to this document yet</div></div></div>' +
      sayHtml(who) + '<div class="rule"></div><p class="note">Once the engine is connected it runs to the next gate and stops there.</p></div>';
  }

  /** One mark for a content-box row: done, now (a small turning arc), still to come, failed, or to supply. */
  function rowMark(st) {
    if (st === 'now') return '<span class="mk now" aria-hidden="true"><svg width="20" height="20" viewBox="-1.2 -1.2 2.4 2.4"><circle r="1" fill="none" class="mk-track"/><path d="' + L.arcPath(0, 0, 1, -Math.PI / 2, 2.2) + '" fill="none" class="mk-arc"/></svg></span>';
    return '<span class="mk ' + st + '" aria-hidden="true">' + (st === 'done' ? '✓' : st === 'failed' || st === 'supply' ? '!' : '') + '</span>';
  }
  var PILL_TONE = { done: 'ok', now: 'warn', pending: 'wait', failed: 'fail', supply: 'warn' };

  /** What the run has worked out, for the right rail: the content box of what is being done (each row done, at work, to come, failed or to supply). */
  function runBox(v) {
    var rows = v.grid
      ? '<div class="cgrid">' + v.items.map(function (x) {
          return '<div class="cslide ' + x.status + '"><div style="display:flex;align-items:center;gap:8px"><span class="mono" style="font-size:12px;color:var(--ink3)">' + esc(x.n) + '</span><div class="spacer"></div>' +
            '<span class="pill ' + PILL_TONE[x.status] + '">' + esc(x.pill) + '</span></div><div class="t">' + esc(x.title) + '</div></div>';
        }).join('') + '</div>'
      : v.items.map(function (x) {
          return '<div class="crow ' + x.status + '">' + rowMark(x.status) + '<div style="flex:1;min-width:0"><div class="t">' + (x.n ? '<span class="mono n">' + esc(x.n) + '</span>' : '') + esc(x.title) + '</div>' +
            (x.sub ? '<div class="mono eyebrow" style="margin-top:3px;text-transform:none;letter-spacing:0">' + esc(x.sub) + '</div>' : '') + '</div><span class="pill ' + PILL_TONE[x.status] + '">' + esc(x.pill) + '</span></div>';
        }).join('');
    var tail = v.tail.map(function (t) { return '<div class="ctail">' + esc(t) + '</div>'; }).join('');
    return '<div class="card cbox' + (v.kind === 'failed' ? ' failed' : '') + '" data-run="' + esc(v.kind) + '"><div class="cbox-h eyebrow">' + esc(v.head) + '</div>' + (rows || '<div class="crow pending"><span class="note">Nothing to show yet.</span></div>') + tail + '</div>';
  }

  // ── the deck's own status, on Review and Present (phase 4): the Approval agent asks for sign-off ──
  /** The circle and its word, inline: in the Review head beside Approve the deck, and in the Export card's head. The word is beside it, so the circle says only the name. */
  function deckStat(ds) {
    var ok = ds.state === 'approved';
    return '<span class="dstat" data-deck="' + ds.state + '">' + L.circleSvg({ agent: ds.agent, activity: ds.activity, word: ds.word, size: 32, aria: 'name' }) +
      '<span class="dword' + (ok ? ' ok' : '') + '">' + esc(ds.word) + '</span></span>';
  }

  /** The status card: the 60px circle, Approval and its role, the word, then the step or who approved. The card says the name and word, so the circle is hidden from screen readers. */
  function deckCard(ds) {
    var ok = ds.state === 'approved';
    var foot = ok && ds.by ? 'Approved by ' + ds.by : ds.step_index ? 'Step ' + ds.step_index + ' of ' + ds.step_total : '';
    return '<div class="card status" style="padding:16px" data-status="' + ds.activity + '" data-deck="' + ds.state + '"><div style="display:flex;align-items:center;gap:14px">' +
      L.circleSvg({ agent: ds.agent, activity: ds.activity, word: ds.word, size: 60, aria: 'hidden' }) +
      '<div style="min-width:0"><div style="font-size:14px;font-weight:600">' + esc(ds.name) + '</div><div class="note">' + esc(ds.role) + '</div>' +
      '<div class="sword' + (ok ? ' ok' : '') + '">' + esc(ds.word) + '</div>' +
      (foot ? '<div class="mono eyebrow" style="text-transform:none;letter-spacing:0;margin-top:2px">' + esc(foot) + '</div>' : '') + '</div></div></div>';
  }

  /** The status card, then Checked so far when the run wrote it. */
  function deckSide(s, ds) {
    return deckCard(ds) + (Array.isArray(s.run.checks) && s.run.checks.length ? checkedCard(s.run.checks) : '');
  }

  /** What is still open when the deck is approved now. Approving is allowed; this says what stays marked. Empty when nothing is open. */
  function approveNote(ds) {
    if (ds.state !== 'open' || ds.clear) return '';
    var parts = [];
    if (ds.to_supply) parts.push(ds.to_supply + ' to supply');
    if (ds.open) parts.push((ds.total - ds.open) + ' of ' + ds.total + ' to confirm verified');
    return '<p class="note" data-approve-note style="margin:0 0 12px">Still open: ' + esc(parts.join(', ')) + '. You can approve the deck now; what is open stays marked on its slide.</p>';
  }

  // ── 3 · Review ────────────────────────────────────────────────────────
  function slideHtml(id, s, n, total, big) {
    var sl = s.deck.slides[id];
    var items = (sl.blocks || []).map(function (b) {
      if (L.isPlaceholder(b)) return '<li><span class="dot"></span><span class="ph"><i>To supply</i>' + esc(b.text) + '</span></li>';
      var refs = (b.refs || []).map(esc).join(', ');
      return '<li><span class="dot"></span><span>' + esc(b.text) + (refs ? '<sup>' + refs + '</sup>' : '') + '</span></li>';
    }).join('');
    return { items: items, sl: sl };
  }

  function review(s) {
    var ids = L.presented(s.deck);
    if (!ids.length) return '<main class="review" style="display:block;max-width:640px"><h1 class="sm" style="margin-top:40px">No deck yet</h1><p class="lede" style="margin-top:8px">Build a deck first. Nothing to review until the engine has written one.</p></main>';
    // The appendix opens in the rail when the deck names its slides (appendix_ids, or slide.appendix); a count alone stays a count.
    var ax = L.appendixOf(s.deck), ds = L.deckApproval(s.raw);
    if (!view.slide || (ids.indexOf(view.slide) < 0 && ax.ids.indexOf(view.slide) < 0)) view.slide = ids[Math.min(3, ids.length - 1)];
    var id = view.slide, sl = s.deck.slides[id], k = ax.ids.indexOf(id), inAx = k >= 0, n = inAx ? k + 1 : ids.indexOf(id) + 1;
    if (inAx) view.appendix = true;
    var st = L.STATUS[L.statusOf(sl)];
    var agency = L.agencyShown({ prompt: { agency: s.deck.meta && s.deck.meta.agency } });
    // A pitch slide goes by its section; every appendix slide shares the section Appendix, so it goes by its title.
    var thumb = function (sid, label, name) {
      var x = s.deck.slides[sid], t = L.STATUS[L.statusOf(x)];
      return '<button class="thumb" data-slide="' + sid + '"' + (sid === id ? ' aria-current="true"' : '') + '><span class="n">' + label + '</span>' +
        '<span><span class="t">' + esc(name) + '</span><span class="st ' + t.tone + '">' + t.label + '</span></span></button>';
    };
    var rail = ids.map(function (sid, i) { return thumb(sid, String(i + 1).padStart(2, '0'), s.deck.slides[sid].section); }).join('') +
      (ax.selectable && view.appendix ? '<div class="eyebrow rail-div">Appendix</div>' + ax.ids.map(function (sid, i) {
        var x = s.deck.slides[sid];
        return thumb(sid, 'A' + (i + 1), x.title || x.section);
      }).join('') : '');
    var axHead = ax.selectable
      ? '<button class="appx" data-appendix="' + (view.appendix ? 'hide' : 'show') + '" aria-expanded="' + !!view.appendix + '" aria-label="' + (view.appendix ? 'Hide' : 'Show') + ' the ' + ax.count + ' appendix slides">+ ' + ax.count + ' appendix</button>'
      : '<span class="mono eyebrow" style="text-transform:none;letter-spacing:0">+ ' + esc(ax.count) + ' appendix</span>';
    var nav = '<nav class="frost rail" aria-label="Slides"><div style="display:flex;align-items:center;margin-bottom:10px;padding:0 4px"><span class="eyebrow">' + esc(s.inputs.format === 'full' ? 'Full' : 'Pitch') + ' · ' + ids.length + '</span><div class="spacer"></div>' + axHead + '</div>' + rail + '</nav>';
    // Once the deck is finished, the Approval agent holds it: its circle in the head with Approve the deck, its card under the rail.
    var approve = ds ? deckStat(ds) + (ds.state === 'open' ? '<button class="btn go tall" id="approve-deck" data-approve="deck">Approve the deck</button>' : '') : '';
    var tabs = [['evidence', 'Evidence'], ['checks', 'Checks'], ['who', 'History']].map(function (t) {
      return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (view.tab === t[0]) + '">' + t[1] + '</button>';
    }).join('');
    var panel = '';
    if (view.tab === 'evidence') {
      var ev = L.evidenceFor(sl, s.evidence);
      panel = ev.length ? ev.map(function (e) { return '<div class="ev"><div class="id">' + esc(e.ref) + ' · ' + esc(e.kind) + '</div><div style="font-size:13px;line-height:1.45">' + esc(e.text) + '</div></div>'; }).join('')
        : '<p class="note">This slide cites nothing: its lines are labelled creative, opinion or proposal.</p>';
    } else if (view.tab === 'checks') {
      panel = '<div class="stack" style="gap:10px">' + L.checksFor(id, sl, s.validation).map(function (c) {
        return '<div class="check" style="align-items:flex-start"><span class="tick ' + (c.ok ? 'ok' : 'warn') + '" aria-hidden="true">' + (c.ok ? '✓' : '!') + '</span><span style="font-size:13px;line-height:1.45">' + esc(c.text) + '</span></div>';
      }).join('') + '</div>';
    } else {
      var ap = s.run.approvals || {}, keys = Object.keys(ap);
      panel = '<p class="note" style="margin-bottom:10px">What a person did to this deck, from its record.</p>' +
        (keys.length ? keys.map(function (k) { return '<div class="check" style="margin-bottom:8px"><span class="tick ok" aria-hidden="true">✓</span><span style="font-size:13px">' + esc(ap[k].by) + ' approved the ' + esc(k) + '</span></div>'; }).join('') : '<p class="note">No gate has been approved in this document yet.</p>') +
        '<div class="mono eyebrow" style="margin-top:10px;text-transform:none;letter-spacing:0">Answers ' + (sl.requirements && sl.requirements.length ? esc(sl.requirements.join(', ')) : 'no requirement') + '</div>';
    }
    var s1 = slideHtml(id, s, n, ids.length);
    return storyboard(s, ids, ds) +
      '<div class="action-strip sb-strip" id="slide-view"><div class="action-left"><span class="sec-num">02 / ' + (inAx ? 'Appendix A' + n : 'Slide ' + String(n).padStart(2, '0')) + ' · ' + esc(inAx ? (sl.title || sl.section) : sl.section) + '</span></div>' +
        '<div class="action-right"><button class="btn-rect" data-go-board>↑ Storyboard</button></div></div>' +
      '<main class="review">' + (ds ? '<div class="lcol">' + nav + deckSide(s, ds) + '</div>' : nav) +
      '<section><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><span class="mono" style="font-size:12px;color:var(--ink3)">' + (inAx ? 'Appendix ' : 'Slide ') + String(n).padStart(2, '0') + '</span><span class="pill ' + st.tone + '">' + st.label + '</span><div class="spacer"></div>' +
        (inAx ? '' : '<button class="btn sm" data-act="appendix">Move to appendix</button>') + '<button class="btn sm" data-tab="evidence">Why this slide</button>' + approve + '</div>' +
      (ds ? approveNote(ds) : '') +
      '<div style="margin-bottom:12px">' + builtLine(builtOf(s)) + '</div>' +
      '<div class="slide"><div class="kick">' + esc(sl.section) + '</div><h2>' + esc(sl.title) + '</h2><ul>' + s1.items + '</ul>' +
        '<div class="foot"><span>' + esc(agency) + ' · ' + esc(s.deck.meta && s.deck.meta.client) + '</span><div class="spacer"></div><span>' + (inAx ? 'A' + n : String(n).padStart(2, '0')) + '</span></div></div>' +
      '<div class="card" style="margin-top:14px;padding:14px 18px;border-radius:16px;box-shadow:none"><div class="eyebrow" style="margin-bottom:6px">Speaker notes</div><div style="font-size:14px;line-height:1.5;color:var(--ink2)">' + esc(sl.notes || 'No notes for this slide.') + '</div></div></section>' +
      '<aside class="side"><div class="frost" style="padding:16px"><div class="tabs" role="tablist">' + tabs + '</div>' + panel + '</div>' + supplyPanel(s) + confirmPanel(s) +
      '<div class="card" style="padding:16px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">Ask for a change</div><div style="display:flex;gap:8px;flex-wrap:wrap">' +
        [['shorter', 'Shorter'], ['add_figure', 'Add the figure'], ['rephrase', 'Say it another way']].map(function (c) { return '<button class="btn sm" data-change="' + c[0] + '">' + c[1] + '</button>'; }).join('') +
      '</div><p class="note" style="margin-top:10px;font-size:12px;color:var(--ink3)">Only the words on this slide change. Its sources stay.</p></div></aside></main>';
  }

  // ── the storyboard (the mock's Deck Studio: design/new-ui/napkin-app-v1.html #view-deck) ──
  /** What a ref is, in words, for a card's source line: "Brief · insight", "Requirement R4", "Your prompt". */
  function sourceWords(ref, ev) {
    var k = String(ref || ''), c = k.indexOf(':'), kind = c > 0 ? k.slice(0, c) : '', id = c > 0 ? k.slice(c + 1) : k;
    if (kind === 'brief') return 'Brief · ' + id.replace(/_/g, ' ');
    if (kind === 'req') return 'Requirement ' + id;
    if (kind === 'prompt') return 'Your prompt';
    var e = ev && ev[ref], what = e && e.kind ? String(e.kind) : kind || 'Source';
    return what.charAt(0).toUpperCase() + what.slice(1) + (id && id !== k ? ' · ' + id : '');
  }
