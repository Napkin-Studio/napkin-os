      var prompt = { client: draft('client', ''), project: draft('project', ''), agency: draft('agency', ''), text: draft('text', '') };
      Object.keys(prompt).forEach(function (k) { prompt[k] = String(prompt[k]).trim(); });
      var guard = L.canBuild({ prompt: prompt }, s.upstream, L.documentsOf(s.raw));
      if (!guard.ok) { toast(guard.message); return; }
      // Only the person's own inputs are written. The brief and research are read from upstream, never stored.
      var dtb = L.deckTypeOf(s.raw), kindOut = dtb.source === 'answered' ? L.kindOfType(dtb.id) : (pending.kind || s.inputs.kind);
      var saved = put({ inputs: { prompt: prompt, kind: kindOut, format: pending.format || s.inputs.format } }, 'start deck', 'inputs: prompt and documents');
      view.screen = 'build'; render();
      if (mwOn()) {
        // The inputs are in the document before the engine reads it; the engine is started once they are.
        toast('Saved. The engine is starting: it stops at the first gate and waits for you.');
        Promise.resolve(saved).then(startBuild);
        return;
      }
      toast(s.run.stages.length ? 'Showing the recorded run. Live building needs the engine server.' : 'Saved. Live building needs the engine server.');
      return;
    }
    if (a.verify) {
      var vp = L.verifyPatch(a.verify, now());
      if (!vp) return;
      put(vp, 'verify ' + a.verify, 'confirm list');
      return;
    }
    if (a.qopt || a.qskip || a.qtext) {
      var qid = a.qopt ? a.q : (a.qskip || a.qtext), ans;
      if (a.qskip) ans = { skipped: true };
      else if (a.qopt) ans = { option_id: a.qopt };
      else { var qi = document.getElementById('qt_' + qid); ans = { text: qi ? qi.value : '' }; }
      var patch = L.answerPatch(qid, ans, now());
      if (!patch) { toast('Write an answer first, or skip.'); return; }
      delete qdraft[qid];
      put(patch, (a.qskip ? 'skip' : (qid.indexOf('q_supply_') === 0 ? 'supply' : 'answer')) + ' question ' + qid, qid.indexOf('q_supply_') === 0 ? 'supplied by the person' : 'intake');
      return;
    }
    if (t.id === 'strengthen') {
      // A request only: launching research needs the server feature, so nothing is called here.
      put(L.researchRequest(now()), 'ask to strengthen with research', 'recorded, not launched');
      toast('Recorded. Launching research needs the server, which is not connected yet.');
      return;
    }
    if (a.territory) {
      // Picking is view state only: Pick this territory writes it, with the approval.
      if (s.run.gate) view.pick = a.territory;
      return render();
    }
    if (a.approve === 'deck') {
      // Approve the deck: recorded like a gate approval (run.approvals.deck, run.decisions), with what was still open said.
      var ds = L.deckApproval(s.raw), nd = ds && ds.state === 'open' ? L.approveDeck(s.run, 'You', now()) : null;
      if (!nd) return;
      put({ run: nd }, 'approve deck', 'deck approved: ' + (ds.clear ? 'nothing open' : ds.to_supply + ' to supply, ' + (ds.total - ds.open) + ' of ' + ds.total + ' to confirm verified'));
      toast('Deck approved. Its files are on Present.');
      return;
    }
    if (t.id === 'approve') {
      var gv = L.gateView(s.run, view.pick);
      if (!gv) return;
      if (gv.body === 'territories' && !gv.picked) { toast('Pick a territory first.'); return; }
      var choice = gv.picked ? { picked: gv.picked } : null;
      var picked = gv.territories.filter(function (x) { return x.id === gv.picked; })[0];
      var why = 'gate ' + s.run.gate.n + ' of ' + s.run.gate.of + ' approved' + (picked ? ': picked ' + picked.name : '');
      if (mwOn()) {
        // With an engine behind the document, approving writes only the person's decision. The engine's next stage is then asked for, and
        // what it reports lands as the middleware's change: the page never writes run.state, stages, gate or agent itself.
        if (JOB && BUSY_JOB[JOB.state]) { toast('The engine is still working on this step.'); return; }
        var human = L.humanApproval(s.run, gv.id, 'You', now(), choice);
        if (!human) return;
        view.pick = null;
        var wrote = put({ run: human }, 'approve ' + s.run.gate.id, why);
        toast('Approved. The engine is working on the next step.');
        Promise.resolve(wrote).then(startBuild);
        return;
      }
      var next = L.approveGate(s.run, gv.id, 'You', now(), choice);
      if (!next) return;
      view.pick = null;
      put({ run: next }, 'approve ' + s.run.gate.id, why);
      return;
    }
    if (a.retry && !s.run.gate) { toast('Retrying a step needs the engine server, which is not connected yet.'); return; }
    if (a.edit || a.retry) {
      // At the open gate an edit or a retry is recorded (run.decisions, run.gate_requests) and launches nothing.
      var kind = a.edit ? 'edit' : 'retry', req = s.run.gate ? L.gateRequest(s.run, s.run.gate.id, kind, 'You', now()) : null;
      if (req) put({ run: req }, kind + ' ' + s.run.gate.id, 'gate ' + s.run.gate.n + ' of ' + s.run.gate.of + ': asked, launches nothing');
      toast('Recorded. Editing and retrying a gate need the engine server.');
      return;
    }
    if (a.act === 'appendix') { toast('Moving slides to the appendix needs the engine server.'); return; }
    if (a.change) {
      var reqs = (s.changes || []).concat([{ slide: view.slide, change: a.change, at: now(), status: 'waiting' }]);
      put({ change_requests: reqs }, 'ask for a change: ' + a.change, 'slide ' + view.slide);
      toast('Recorded. The words change when the engine is connected; sources stay.');
      return;
    }
    if (a.export) {
      var row = L.exportRows(s.exports).filter(function (r) { return r.key === a.export; })[0];
      toast(row && row.file ? 'Open ' + row.file + ' from the document export.' : 'Open the file from the document export.');
      return;
    }
  });

  /** The landing page's prompt box grows with what is typed, to a limit. */
  function grow(el) {
    if (el && el.hasAttribute && el.hasAttribute('data-land') && el.style) { el.style.height = 'auto'; el.style.height = Math.max(190, Math.min(el.scrollHeight || 0, 360)) + 'px'; }
    var wc = document.getElementById('wc'); if (wc && el && el.id === 'ptext') wc.textContent = words(el.value);
  }
  document.addEventListener('input', function (e) { stashDraft(); grow(e.target); });
  // Enter sends on the landing page and in the read's answers; Shift+Enter is a new line in the prompt.
  document.addEventListener('keydown', function (e) {
    var el = e.target;
    if (e.key !== 'Enter' || e.shiftKey || !el || !el.id) return;
    var go = el.id === 'ptext' && el.hasAttribute && el.hasAttribute('data-land') ? 'land-build' : el.id === 'rd-q' ? 'rsend' : el.id === 'rd-val' ? 'rdsave' : '';
    if (!go) return;
    var btn = go === 'land-build' ? document.getElementById('land-build') : document.querySelector && document.querySelector('[data-' + go + ']');
    if (btn && typeof btn.click === 'function') { e.preventDefault(); btn.click(); }
  });

  // Attach files: the host stores each one as an asset; the list is written to inputs.documents.
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || el.id !== 'attach') return;
    var files = Array.prototype.slice.call(el.files || []);
    if (!files.length) return;
    if (!(window.clan && window.clan.uploadAsset && window.clan.patchData)) { toast('Attaching files needs the host.'); return; }
    var have = L.documentsOf(d().raw), added = [], failed = [];
    // Each file is tried on its own: one that fails does not drop the ones that went in.
    files.reduce(function (p, f) {
      return p.then(function () { return f.arrayBuffer(); }).then(function (buf) { return window.clan.uploadAsset(f.name, buf, 'human'); })
        .then(function (res) {
          if (res && (res.ok === false || res.error)) throw new Error('refused');
          added.push({ name: f.name });
        }).catch(function () { failed.push(f.name); });
    }, Promise.resolve()).then(function () {
      var done = added.length ? put({ inputs: { documents: have.map(function (x) { return { name: x.name, pages: x.pages }; }).concat(added) } }, 'attach documents', added.length + ' file(s)') : null;
      // Clear the input so choosing the failed files again does not re-upload the ones that went in.
      try { el.value = ''; } catch (e) { /* read-only in some hosts */ }
      if (failed.length) toast((added.length ? added.length + ' attached. ' : '') + 'Could not attach: ' + failed.join(', ') + '.');
      return done;
    }).catch(function () { toast('The attached files could not be saved.'); });
  });

  document.addEventListener('keydown', function (e) {
    if (screenOf(d()) !== 'present' || /INPUT|TEXTAREA/.test((e.target || {}).tagName || '')) return;
    if (e.key === 'ArrowRight') { view.present += 1; render(); }
    if (e.key === 'ArrowLeft') { view.present -= 1; render(); }
  });

  if (window.addEventListener) {
    // The bridge fires these when the document's data changes or loads, and sets data-color-scheme itself.
    window.addEventListener('clan:dataupdated', render);
    window.addEventListener('napkin:ready', render);
    // The agency's colours (the shell answers clan.me with its admin-set base and accent): they tint the paper, the desk and the
    // primary actions, as in the brief and research (features/brief-new-ui.clan). Without a host the default tint stays.
    window.addEventListener('load', function () {
      if (!(window.clan && typeof window.clan.me === 'function')) return;
      Promise.resolve(window.clan.me()).then(function (m) {
        var c = m && m.agency, HEX = /^#[0-9a-f]{6}$/i, r = document.documentElement;
        if (c && typeof c.name === 'string' && c.name.trim()) AGENCY.name = c.name.trim();
        if (!c || !HEX.test(c.base || '') || !HEX.test(c.accent || '') || !r || !r.style) return;
        var inkOn = function (h) {
          var n = parseInt(h.slice(1), 16), l = [n >> 16, (n >> 8) & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
          return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2] > 0.3 ? 'var(--ink-dark)' : 'var(--ink-light)';
        };
        r.style.setProperty('--ag-base', c.base); r.style.setProperty('--ag-acc', c.accent);
        r.style.setProperty('--ag-base-ink', inkOn(c.base)); r.style.setProperty('--ag-acc-ink', inkOn(c.accent));
      }, function () { /* no agency: the default tint */ }).catch(function () {});
    });
    // The centred circle follows the window's size.
    window.addEventListener('resize', function () {
      var app = document.getElementById('app');
      if (app && typeof app.querySelector === 'function' && app.querySelector('.status.centre')) render();
    });
    // The OS asks for the bar again on load, and says which tab was pressed. Only the frame's parent may.
    window.addEventListener('message', function (e) {
      var m = e.data;
      if (!inShell || e.source !== window.parent || !m) return;
      if (m.type === 'clan:bar?') { lastBar = null; var s = d(); sendBar(s, screenOf(s)); }
      else if (m.type === 'clan:bar-action' && STEPS.some(function (st) { return st[0] === m.id; })) { view.screen = m.id; render(); }
    });
  }
  // Every circle on the page is the one agent engine's sphere: live where the browser can draw it, its still frame where not.
  if (Roles) { Roles.auto(); if (typeof document.createElement === 'function') Roles.thread(); } // and a rail card's thread to the sphere on hover
  render();
  checkMiddleware();
})();
</script>
</body>
</html>
