# Idea room pipeline contract. Travels into every instance.
# Slice 1 declares no writing task, and one scoring task, judge_work (features/judge.clan): the room is written by people, routes are forks merged by the host,
# and the pick is a verdict by the creative director. The humans-first rule is read by the host from
# `humans_first`: no model task of this room is proxied until the chain holds that many cards, each
# first written by a person, or the creative director has opened the room early (crates/napkin-host/
# src/ops/ideas.rs). The later slices add ban_default, swap_test and fame_test here, behind the spend
# guard (server/napkin/spend.py) and the NAPKIN_IDEA_ROOM_AI switch.
pipeline: napkin-idea-room
version: 1
request_kind: middleware

humans_first:
  cards: 5

tasks:
  judge_work:
    handler: judge_work@1
    job: short
    kind: idea_route
    sends:
      - "the chosen route (its name, its bet and its cards' words), never who wrote a card"
      - "the brief's approved fields, by name (never a drafter's prompt, a proposal, an author or another client's material)"
    reads: "Judge (features/judge.clan): thirty yes or no tests, the host adds up the passes and routes; a person sends it, the creative director decides"

errors: non-2xx status; a 200 body must never contain an `error` key.
