<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Script editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
<style>
  /* The Script editor, in the Napkin Studio OS design language: the tokens, the warm paper and the pill buttons
     are Brief Maker's and the Visual brief's, so the three read as one family. A writer's page first. */
  :root{
    --ag-base:#515BFF; --ag-acc:#C8CBFF; --ag-base-ink:#FFFFFF; --ag-acc-ink:#141413;
    --ag-act:var(--ag-base); --ag-act-ink:var(--ag-base-ink);
    --desk:color-mix(in srgb,var(--ag-base) 6%,#F6F1E7);
    --paper:color-mix(in srgb,var(--ag-base) 2.5%,#FFFDF8);
    --paper-2:#F3ECDC; --card:#FFFFFF;
    --ink:#141413; --ink-soft:#2A2620; --muted:#6D655A; --faint:#9A9082;
    --line:color-mix(in srgb,var(--ag-base) 10%,#E2D9C8); --line-strong:#2A2620;
    --warn:#B45309; --warn-soft:#FEF3DC; --ok:#14633A; --ok-soft:#E6F6EC; --alert:#B53A20;
    --ins:#14633A; --ins-soft:#E6F6EC; --del:#B53A20;
    --font-ui:"Geist",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --font-serif:"Newsreader",Georgia,"Iowan Old Style",serif;
    --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --shadow-paper:0 1px 0 rgba(255,255,255,.75) inset,0 8px 24px -8px rgba(50,38,18,.10),0 1px 3px rgba(50,38,18,.08);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-color-scheme="light"]){
      --ag-act:var(--ag-acc); --ag-act-ink:#141413;
      --desk:color-mix(in srgb,var(--ag-base) 12%,#121110);
      --paper:color-mix(in srgb,var(--ag-base) 9%,#1B1A18);
      --paper-2:#262320; --card:color-mix(in srgb,var(--ag-base) 7%,#201E1B);
      --ink:#EFE9DE; --ink-soft:#D6CEC0; --muted:#A49B8D; --faint:#7B7367;
      --line:color-mix(in srgb,var(--ag-base) 16%,#34302A); --line-strong:#CFC6B6;
      --warn:#E09A4B; --warn-soft:#3A2A18; --ok:#5DBB83; --ok-soft:#1C2E23; --alert:#F0876B;
      --ins:#5DBB83; --ins-soft:#1C2E23; --del:#F0876B;
    }
  }
  :root[data-color-scheme="dark"]{
    --ag-act:var(--ag-acc); --ag-act-ink:#141413;
    --desk:color-mix(in srgb,var(--ag-base) 12%,#121110);
    --paper:color-mix(in srgb,var(--ag-base) 9%,#1B1A18);
    --paper-2:#262320; --card:color-mix(in srgb,var(--ag-base) 7%,#201E1B);
    --ink:#EFE9DE; --ink-soft:#D6CEC0; --muted:#A49B8D; --faint:#7B7367;
    --line:color-mix(in srgb,var(--ag-base) 16%,#34302A); --line-strong:#CFC6B6;
    --warn:#E09A4B; --warn-soft:#3A2A18; --ok:#5DBB83; --ok-soft:#1C2E23; --alert:#F0876B;
    --ins:#5DBB83; --ins-soft:#1C2E23; --del:#F0876B;
  }
  @media (prefers-color-scheme:dark){ :root[data-agency-accent="line"]:not([data-color-scheme="light"]){ --ag-act:var(--ag-base); --ag-act-ink:var(--ag-base-ink); } }
  :root[data-agency-accent="line"][data-color-scheme="dark"]{ --ag-act:var(--ag-base); --ag-act-ink:var(--ag-base-ink); }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--desk);color:var(--ink);font:15px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
  h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
  ul,ol{list-style:none}
  button,textarea,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ag-act);outline-offset:2px}

  .desk{display:grid;grid-template-columns:minmax(0,760px) minmax(300px,360px);gap:32px;justify-content:center;align-items:start;padding:28px 16px 56px}
  @media (max-width:1100px){ .desk{grid-template-columns:minmax(0,760px)} }

  /* the sheet */
  .sheet{background:var(--paper);border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow-paper);padding:44px 56px 40px;display:grid;gap:28px}
  :root[data-color-scheme="dark"] .sheet{border-color:transparent}
  @media (prefers-color-scheme:dark){ :root:not([data-color-scheme="light"]) .sheet{border-color:transparent} }
  .eyebrow{font:500 11px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .head{display:grid;gap:10px}
  .title{font:400 clamp(30px,4.6vw,44px)/1.06 var(--font-serif);letter-spacing:-.012em;color:var(--ink)}
  .sub{font:400 17px/1.45 var(--font-serif);font-style:italic;color:var(--ink-soft);max-width:58ch}
  .setup{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
  .seg{display:inline-flex;flex-wrap:wrap;gap:6px}
  .seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .lab{font:500 11px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

  /* read time */
  .time{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line)}
  .time b{font:400 28px/1 var(--font-serif)}
  .time .of{color:var(--muted);font-size:14px}
  .time .over{color:var(--warn);font-size:14px;font-weight:500}

  /* the lines: the page you type into */
  .beats{display:grid;gap:0}
  .beat{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .beat .gut{display:grid;gap:6px;align-content:start;justify-items:start}
  .beat .num{font:500 11px/1.9 var(--font-mono);color:var(--muted)}
  .beat select{min-height:28px;border:1px solid var(--line-strong);border-radius:999px;background:transparent;padding:0 8px;font:600 11px/1 var(--font-mono);letter-spacing:.04em}
  .beat .cols{display:grid;gap:8px;min-width:0}
  .beat.tv .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .field{display:grid;gap:2px;min-width:0}
  .field .lab{display:none}
  .beat.tv .field .lab{display:block}
  .beat textarea{width:100%;resize:none;overflow:hidden;border:0;border-radius:4px;background:transparent;padding:4px 6px;margin:0 -6px;line-height:1.55;font-size:17px;font-family:var(--font-serif)}
  .beat textarea.pic{font-family:var(--font-ui);font-size:15px;color:var(--ink-soft)}
  .beat textarea:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
  .beat textarea:focus{background:var(--card);outline:2px solid color-mix(in srgb,var(--ag-act) 55%,transparent);outline-offset:0}
  .beat[data-kind="sfx"] textarea.line,.beat[data-kind="music"] textarea.line{font-family:var(--font-ui);font-size:15px;font-style:italic;color:var(--muted)}
  .beat .tools{grid-column:2;display:flex;flex-wrap:wrap;gap:0;margin-left:-10px}
  .beat .tools .btn.quiet{padding:0 8px}
  .hints{grid-column:2;display:grid;gap:2px}
  .hint{font-size:13px;color:var(--warn)}
  .hint::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:8px;vertical-align:middle}
  @media (max-width:640px){
    .sheet{padding:26px 18px 26px;gap:22px}
    .beat{grid-template-columns:minmax(0,1fr)}
    .beat .gut{grid-auto-flow:column;justify-content:start;align-items:center}
    .beat .tools,.hints,.marks{grid-column:1}
    .beat.tv .cols{grid-template-columns:minmax(0,1fr)}
  }

  /* tracked changes */
  .marks{grid-column:2;display:grid;gap:8px}
  .mark{display:grid;gap:6px;border-left:3px solid var(--ag-act);padding:8px 0 8px 12px;background:color-mix(in srgb,var(--ag-act) 6%,transparent)}
  .mark[data-status="accepted"],.mark[data-status="rejected"]{border-left-color:var(--line-strong);background:transparent;opacity:.85}
  .mark .who{font:500 12px/1.4 var(--font-ui);color:var(--muted)}
  .mark .who b{color:var(--ink);font-weight:600}
  .mark .diff{font:400 16px/1.5 var(--font-serif)}
  .mark del{color:var(--del);text-decoration-thickness:1px}
  .mark ins{color:var(--ins);text-decoration:none;background:var(--ins-soft);padding:0 3px;border-radius:3px}
  .mark .note{font-size:13px;color:var(--ink-soft)}
  .mark .acts{display:flex;gap:8px;flex-wrap:wrap}
  .mark .stale{font-size:13px;color:var(--alert)}
  .markup{grid-column:2;display:grid;gap:8px;border:1px solid var(--line-strong);border-radius:10px;padding:12px;background:var(--card)}
  .markup textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0;font-size:16px}
  .markup input{min-height:36px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:transparent}
  @media (max-width:640px){ .markup{grid-column:1} }

  /* the empty page */
  .empty{display:grid;gap:14px;justify-items:start;padding:8px 0}
  .empty p{max-width:52ch;color:var(--ink-soft)}
  .ex{border:1px dashed var(--line-strong);border-radius:10px;padding:12px 14px;font:italic 400 16px/1.5 var(--font-serif);color:var(--muted)}

  /* buttons: the shell's pills. A primary on a phone is at least 44 px tall. */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font:500 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
  .btn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .btn.primary{background:var(--ag-act);color:var(--ag-act-ink);border-color:var(--ag-act)}
  .btn.primary:hover{background:color-mix(in srgb,var(--ag-act) 88%,#000)}
  .btn.primary[aria-disabled="true"]{background:transparent;color:var(--muted);border:1px dashed var(--muted);cursor:not-allowed}
  .btn.quiet{border-color:transparent;color:var(--muted);min-height:28px;padding:0 10px}
  .btn.quiet:hover{color:var(--ink)}
  .btn.big{min-height:44px;padding:0 22px;font-size:14px}
  @media (max-width:640px){ .btn{min-height:44px} .btn.quiet{min-height:44px} .btn.primary{width:100%} .seg .btn{flex:1 1 auto} .beat select{min-height:44px} }

  /* the side cards */
  .side{display:grid;gap:14px;position:sticky;top:12px}
  @media (max-width:1100px){ .side{position:static} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:10px}
  .card h2{font:500 11px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .vnum{font:400 40px/1 var(--font-serif)}
  .card p{color:var(--ink-soft)}
  .card .small{font-size:13px;color:var(--muted)}
  .card ul.found{display:grid;gap:8px}
  .card ul.found li{font-size:14px;color:var(--ink-soft)}
  .card ul.found li b{font-weight:600;color:var(--ink)}
  .card ul.found .jump{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit}
  .card .good{color:var(--ok);font-weight:500;font-size:14px}
  .linkbtn{color:var(--ink);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;font:inherit;text-align:left}
  .stamp{display:inline-flex;align-items:center;gap:8px;width:max-content;max-width:100%;padding:6px 12px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font:600 12px/1 var(--font-ui)}
  .stamp i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .stamp.off{background:var(--paper-2);color:var(--muted)}
  .sends{display:grid;gap:8px}
  .sendnote{font-size:13px;color:var(--ink-soft);border-left:3px solid var(--line-strong);padding-left:10px}
  .listed{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-strong);border-radius:999px;padding:0 4px 0 10px;min-height:28px;font-size:13px}
  .chip button{background:none;border:0;cursor:pointer;color:var(--muted);min-width:28px;min-height:28px;border-radius:50%}
  .add{display:flex;gap:6px}
  .add input{flex:1;min-width:0;min-height:36px;border:1px solid var(--line-strong);border-radius:999px;padding:0 12px;background:transparent}
  @media (max-width:640px){ .add input{min-height:44px} .chip button{min-width:44px;min-height:44px} }
  .err{color:var(--alert);font-size:13px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:5}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="desk" data-where="script-editor">
  <main>
    <article class="sheet" id="sheet" aria-label="Script">
      <header class="head">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 class="title" id="title">Script</h1>
        <p class="sub" id="sub"></p>
      </header>
      <div id="setup"></div>
      <div id="time"></div>
      <div id="body"></div>
    </article>
  </main>
  <aside class="side" id="side" aria-label="Check, version and hand-offs"></aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="application/json" id="house-style">@napkin:house-style</script>

<!-- @napkin:clan-fields -->
<script>
(function(){
  'use strict';
  var clanScheme = navigator.userAgent.indexOf('Windows') >= 0 ? 'http://clan.localhost' : 'clan://localhost';
  var RULES = JSON.parse(document.getElementById('house-style').textContent);

  // ── the core: pure functions over plain data (the tests run them through window.__script) ───────────
  var R = RULES;
  var FORMATS = {
    headline: { label: 'Headline', unit: 'option', copy: 'line', timed: false },
    body:     { label: 'Body copy', unit: 'paragraph', copy: 'line', timed: false },
    social:   { label: 'Social', unit: 'post', copy: 'line', timed: false },
    radio:    { label: 'Radio script', unit: 'line', copy: 'voice', timed: true },
    tv:       { label: 'TV script', unit: 'row', copy: 'voice', timed: true }
  };
  var ORDER = ['headline', 'body', 'social', 'radio', 'tv'];
  function arr(v){ return Array.isArray(v) ? v : []; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function words(t){ return String(t == null ? '' : t).split(/\s+/).filter(Boolean); }
  function plain(t){ return String(t == null ? '' : t).replace(/[‘’]/g, "'").replace(/[“”]/g, '"'); }
  function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // The radio notation, as typed. A tag only counts when it names a known voice or cue, so a sentence that
  // happens to hold a colon stays copy.
  var TAGS = {};
  Object.keys(R.tags).forEach(function(k){
    var meaning = k.indexOf('voice:') === 0 ? { kind: 'voice', role: k.slice(6) } : { kind: k };
    R.tags[k].forEach(function(a){ TAGS[a] = meaning; });
  });
  function tagKey(raw){ return String(raw).toUpperCase().replace(/[._\/]/g, ' ').replace(/\d+/g, ' ').replace(/\s+/g, ' ').trim(); }
  function classify(label){
    var n = tagKey(label); if(!n) return null;
    if(TAGS[n]) return TAGS[n];
    var tight = n.replace(/ /g, '');
    if(TAGS[tight]) return TAGS[tight];
    if(R.legacy_speakers[n]) return { kind: 'voice', role: R.legacy_speakers[n] };
    var sp = n.match(/^SPEAKER ([A-Z])$/);
    if(sp) return { kind: 'voice', role: R.legacy_speakers[sp[1]] || 'VO' };
    return null;
  }
  // One line into {tag, rest}: a tag and its text, or no tag and the line as it is.
  function splitTag(line){
    var m = String(line).match(/^\s*([A-Za-z][A-Za-z0-9 .\/]{0,23}?)\s*[:\-\u2013\u2014.)]\s+(.*)$/);
    if(m){ var t = classify(m[1]); if(t) return { tag: t, rest: m[2].replace(/^[:\-\u2013\u2014.)]\s+/, '').trim() }; }
    var bare = String(line).match(/^\s*([A-Za-z][A-Za-z0-9 .\/]{0,23}?)\s*[:\-\u2013\u2014]\s*$/);
    if(bare){ var b = classify(bare[1]); if(b) return { tag: b, rest: '' }; }
    return { tag: null, rest: String(line).trim() };
  }
  // A pasted or typed script into lines. Never throws: what it cannot class is spoken copy, and an untagged
  // line carries on the voice line before it.
  function parseScript(text){
    var out = [];
    String(text == null ? '' : text).split(/\r?\n/).map(function(l){ return l.trim(); }).forEach(function(raw){
      if(!raw) return;
      var s = splitTag(raw);
      if(s.tag){
        if(s.tag.kind === 'voice') out.push({ kind: 'voice', role: s.tag.role, text: s.rest });
        else out.push({ kind: s.tag.kind, text: s.rest });
        return;
      }
      var prev = out[out.length - 1];
      if(prev && prev.kind === 'voice') prev.text = (prev.text + ' ' + s.rest).trim();
      else out.push({ kind: 'voice', role: 'VO', text: s.rest });
    });
    return out;
  }

  function isCopy(b, format){ return FORMATS[format] && FORMATS[format].copy === 'voice' ? b.kind === 'voice' : b.kind !== 'sfx' && b.kind !== 'music'; }
  function spokenWords(beats, format){ return arr(beats).filter(function(b){ return isCopy(b, format); }).reduce(function(n, b){ return n + words(b.text).length; }, 0); }
  function readSeconds(beats, format){ return spokenWords(beats, format) / R.words_per_second; }
  function targetWords(slot){ return Math.round(slot * R.words_per_second); }

  // The live check. It lists findings; it never returns a changed string, and it never blocks typing.
  function findTerm(text, term){
    var t = plain(term).toLowerCase().trim(); if(!t) return false;
    return new RegExp('(^|[^a-z0-9])' + reEsc(t) + '($|[^a-z0-9])', 'i').test(plain(text).toLowerCase());
  }
  function listOf(v){ return arr(v).map(function(x){ return typeof x === 'string' ? x : (x && x.text) || ''; }).map(function(s){ return s.trim(); }).filter(Boolean); }
  function repetitionOf(beats, format){
    var voice = arr(beats).filter(function(b){ return isCopy(b, format); });
    var w = words(voice.map(function(b){ return String(b.text).toLowerCase(); }).join(' '));
    if(w.length < R.repetition_min_words) return 0;
    var seen = {}, repeated = 0;
    for(var i = 0; i < w.length - 2; i++){ var g = w[i] + ' ' + w[i + 1] + ' ' + w[i + 2]; seen[g] = (seen[g] || 0) + 1; }
    Object.keys(seen).forEach(function(k){ if(seen[k] > 1) repeated += seen[k] - 1; });
    var tri = repeated / Math.max(1, w.length - 2);
    var lines = {}, dup = 0;
    voice.forEach(function(b){ var k = String(b.text).trim().toLowerCase(); if(lines[k]) dup++; lines[k] = 1; });
    return Math.max(tri, dup / Math.max(1, voice.length));
  }
  // doc: {format, slot_s, cast, beats, mandatory: [text], banned: [text]}
  function findingsOf(doc){
    var format = doc.format, beats = arr(doc.beats), out = [];
    var stage = new RegExp(R.stage_direction, 'i');
    var say = function(rule, beat, extra){ var f = { rule: rule, beat: beat || null, advice: R.advice[rule] || '' }; Object.keys(extra || {}).forEach(function(k){ f[k] = extra[k]; }); out.push(f); };
    var whole = beats.map(function(b){ return [b.visual_action, b.text].filter(Boolean).join(' \n '); }).join(' \n ');
    listOf(doc.mandatory).forEach(function(m){ if(!findTerm(whole, m)) say('mandatory_missing', null, { text: m }); });
    beats.forEach(function(b){
      var all = [b.visual_action, b.text].filter(Boolean).join(' \n ');
      listOf(doc.banned).forEach(function(w){ if(findTerm(all, w)) say('banned_word', b.id, { text: w }); });
      R.house_phrases.forEach(function(p){ if(findTerm(all, p)) say('house_phrase', b.id, { text: p }); });
      if(R.dashes.some(function(d){ return all.indexOf(d) >= 0; })) say('dash', b.id);
      if(isCopy(b, format)){
        var low = plain(b.text).toLowerCase();
        R.meta_phrases.forEach(function(p){ if(low.indexOf(p) >= 0) say('meta_phrase', b.id, { text: p }); });
        if(stage.test(b.text || '')) say('stage_direction', b.id);
      }
    });
    var rep = repetitionOf(beats, format);
    if(rep > R.repetition_flag) say('repetition', null, { ratio: Math.round(rep * 100) });
    if(FORMATS[format] && FORMATS[format].timed && doc.slot_s){
      var n = spokenWords(beats, format), target = targetWords(doc.slot_s);
      if(n > 0 && Math.abs(n - target) / Math.max(1, target) > R.length_tolerance){ var over = n > target; say('length_off', null, { words: n, target: target, over: over, advice: R.advice[over ? 'length_long' : 'length_short'] }); }
