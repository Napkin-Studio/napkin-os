# Brief Maker pipeline contract.
# Travels verbatim into every instance (CLAN instantiation copies all members),
# so any middleware continuing a Brief Maker .clan knows the pipeline it must
# speak. This is a DECLARATION (decision M2): each task names a handler,
# name@major, which the middleware resolves against its registry. An unknown
# handler, task or version is a hard error, never a fall-through (M4).
# Contract: docs/contracts/middleware-api.md §10. A brief spun off from a
# Research Tool document carries it whole (os-layer.md §5): its data frozen at
# upstream.<research id>, its pins and findings in shared/facts.yaml and
# shared/findings.yaml, its chain. Which of that reaches which loop is §10.13.
pipeline: napkin-briefing
version: 2
request_kind: middleware
contract: middleware-api/1#10

tasks:
  draft_brief:
    handler: draft_brief@1
    job: long
    stages: [extract, context, draft, judge]
    reads:
      - materials, with host-extracted text (the client's words, the only thing capture reads)
      - the retrieval port, per drafter, for the packs of its loop
      - shared/facts.yaml and shared/findings.yaml, per drafter, the selection of §10.13 only
      - "the context stage (Sam): the brief's pins and findings, a research spin-off's audience and headline,
        and the library, to plan the whole brief part by part; then the research the plan asks for, pinned
        with its sources, and facts outside the measure list kept as document pins (kept_in_document), never
        written to the layers"
      - "the draft stage (Dara): every part at once, from the plan, the client's words, the facts and the
        library, each part saying what it rests on (the client, the research, the library or an assumption)"
      - "after every draft and rewrite, the provenance cleaner: each part's claims tied to the facts, capture
        items and passages that support them, worked-out figures recomputed, the basis derived from the claims
        (§10.3, §10.7)"
      - "the judge stage (Jude): jev flags the parts that need rewriting, Jude says why, Dara rewrites them"
    never:
      - feeds a pin, finding, contest, report or upstream value to capture
      - "labels a part the client's words without a capture item mapped to it, or cites a pin, finding or
        passage from a captured field in the field-by-field engine (the planned engine may, §10.12)"
      - edits, drops or rewords a value to make it fit its provenance (an unsupported claim is kept, to confirm)
      - sends a part to rewrite only because a claim is worked out or to confirm
      - sends an item whose newest classify mark has model false to any model call (§10.13 item 6)
      - writes upstream or projection (host-written, read-only)
  regenerate_field:
    handler: regenerate_field@1
    job: long
    stages: [draft, judge]
    reads: "as draft_brief's draft stage, for the one field; on a brief the planned engine drafted, as a
      one-part fix_parts, through the provenance cleaner (§10.10)"
  fix_parts:
    handler: fix_parts@1
    job: long
    stages: [context, draft, judge]
    reads:
      - "a bad verdict still standing on the brief (input.verdict): the parts it names, its words, and the
        words of people's bad verdicts on the same parts"
      - "the context stage (Sam): the brief as it stands, every fact it holds, and the research the fix
        lacks, as draft_brief's (capped at two runs), pinned with its sources"
      - "the draft stage (Dara): the named parts together, from the problem and Sam's instructions, each part's
        prior claims, then the provenance cleaner, with the client's words from data.capture.items"
      - "the judge stage (Jude): draft_brief's check, on the named parts only"
    never:
      - writes a part the verdict does not name (the open questions only gain the client's new ones)
      - writes a part a person wrote last (it proposes), or uses a fact a person marked wrong
      - edits, drops or rewords a value to make it fit its provenance
      - writes upstream or projection (host-written, read-only)

fields:                      # app key -> how it is filled; the handler reads this map
  project_name:              { class: captured }
  client:                    { class: captured }
  job:                       { class: drafted, rubric: job, loop: loop3_problem }
  background:                { class: captured, rubric: background }
  barrier:                   { class: drafted, rubric: barrier, loop: loop3_problem }
  objectives.commercial:     { class: captured, rubric: objectives }
  objectives.behavioural:    { class: captured, rubric: objectives }
  objectives.attitudinal:    { class: captured, rubric: objectives }
  audience:                  { class: captured, rubric: audience }
  competitor_context:        { class: captured, rubric: competitor_context }
  budget_and_scope:          { class: captured, rubric: budget_scope }
  mandatories:               { class: captured, rubric: mandatories }
  tone_and_world:            { class: captured, rubric: tone_world_assets }
  insight:                   { class: drafted, rubric: insight, loop: loop4_insight }
  single_minded_proposition: { class: drafted, rubric: smp, loop: loop5_proposition }
  objection:                 { class: drafted, rubric: objection, loop: loop5_objection }
  reasons_to_believe:        { class: drafted, rubric: reasons_to_believe, loop: loop6_substantiation }
  desired_response.think:    { class: drafted, rubric: desired_response, loop: loop5_proposition, drafter: desired_response }
  desired_response.feel:     { class: drafted, rubric: desired_response, loop: loop5_proposition, drafter: desired_response }
  desired_response.do:       { class: drafted, rubric: desired_response, loop: loop5_proposition, drafter: desired_response }
  open_questions:            { class: composed }

merge_policies:
  materials: append
  passages: append
  capture: last-write
  review: last-write
  "*": ask
  # `projection` and `upstream` are deliberately absent: neither is merged. The
  # host rebuilds projection from the members after a merge commits, and
  # upstream is the frozen copy a spin-off wrote, which nothing changes.

# R1 (Contract 4 §3): which middleware decisions must carry reasoning. The host
# requires it on every pin, contest, finding and verdict, and every proposal,
# whatever an app says; this adds every edit that writes a brief field, the
# capture or the review (middleware-api.md §10.7: each one writes an agent
# field). Indexing a material alone may omit it.
reasoning:
  edits: [project_name, client, job, background, barrier, objectives, audience, competitor_context,
          budget_and_scope, mandatories, tone_and_world, insight, single_minded_proposition, objection,
          reasons_to_believe, desired_response, open_questions, capture, review]
