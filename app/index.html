<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable: the manifest names the app and the .clan files it opens. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Geist + Geist Mono: the studio's one typeface family. Falls back to
         Helvetica Neue / Arial offline; the CSP already allows Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..700&family=Newsreader:opsz,wght@6..72,400..700&display=swap" />
    <title>Napkin Studio OS</title>
    <!-- Boot screen: Deep O working, until React mounts and replaces #root.
         The mark and its stylesheet are not written here: vite.config.ts
         (deepOBoot) puts in src/brand/deepOSvg.ts's bootMarkSvg and DEEP_O_CSS
         where the deep-o comments stand, in Napkin's own colours, never an
         agency's. The page colours are the studio tokens' values, since
         index.css is not loaded yet. -->
    <script>
      try { var t = localStorage.getItem('napkin.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
    <style>
      .napkin-boot{--paper:#FFFFFF;--ink2:#4A4F5C;
        position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
        background:var(--paper);color:var(--ink2);font:500 13px/1 'Geist','Helvetica Neue',Arial,sans-serif;letter-spacing:-.01em}
      @media (prefers-color-scheme:dark){:root:not([data-theme='light']) .napkin-boot{--paper:#0F1114;--ink2:#A6ACB8}}
      :root[data-theme='dark'] .napkin-boot{--paper:#0F1114;--ink2:#A6ACB8}
      /* deep-o:css */
    </style>
  </head>
  <body>
    <div id="root"><div class="napkin-boot" role="status" aria-live="polite">
      <!-- deep-o:boot -->
      <span>Opening the studio…</span>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
