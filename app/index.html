<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable: the manifest names the app and the .clan files it opens. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Geist + Geist Mono: the studio's one typeface family. Falls back to
         Helvetica Neue / Arial offline; the CSP already allows Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..700&family=Newsreader:opsz,wght@6..72,400..700&display=swap" />
    <title>Napkin Studio OS</title>
    <!-- Boot screen, until React mounts and replaces #root, in the person's own
         look: the desk and the mark of the agency this browser last signed in
         to, light or dark, neutral when none is known; the mark and its words
         appear only on a slow load. Nothing is written here by hand:
         vite.config.ts (deepOBoot) puts in src/brand/bootLook.ts's stylesheet
         and head script where boot:look stands, and the mark where deep-o:boot
         stands, generated from src/shell/agency/palette.ts and
         src/brand/deepOSvg.ts. -->
    <!-- boot:look -->
  </head>
  <body>
    <div id="root"><div class="napkin-boot" role="status" aria-live="polite">
      <!-- deep-o:boot -->
      <span>Opening the studio…</span>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
