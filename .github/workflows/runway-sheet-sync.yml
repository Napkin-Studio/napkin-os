name: Runway sheet sync

# Has Runway changed anything production-tool/contracts/capabilities/runway.json relies on?
# (features/runway-sheet-sync.clan). Weekly and on demand: re-fetches Runway's public openapi.json
# and guides/pricing.md (no key, no credits) and compares the catalogue's models with the committed
# snapshots. Drift opens one issue labelled `runway-sheet`, or comments on the open one. It never
# commits: a person refreshes the snapshots and edits the sheet, because prices reach agencies.
# Not a required check, and not run on PRs: tests/test_runway_sheet.py checks the sheet offline there.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: runway-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Compare the Runway sheet with Runway's docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Make sure the label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create runway-sheet --color c5def5 --description "Runway changed what the capability sheet relies on" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
      - name: Check for drift (opens or updates the issue)
        working-directory: production-tool/relay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --frozen --python 3.12 python scripts/runway_sheet_sync.py
