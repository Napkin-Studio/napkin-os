name: Deploy production tool

# The Production Tool's relay and stitch (infra/envs/hackathon), deployed by
# hand from any branch (normally develop): Actions → Deploy production tool →
# Run workflow. Never runs on push, and never touches staging.
#
# The web app is not deployed here: it is built into napkin-web's image and
# served at /production on the studio's own origin (Dockerfile, production
# stage; features/os-sign-in.clan), so the Deploy workflow ships it.
#
#   relay   package production-tool/relay (+ the contracts), update the code,
#           publish a version, move the `live` alias
#   stitch  the same for production-tool/stitch; builds and attaches the
#           ffmpeg layer when the function has none (or when asked)
#
# config.json is never written here: it is uploaded by hand (aws s3 cp).
# Rollback: aws lambda update-alias --function-name <fn> --name live
#           --function-version <previous> (printed in the run summary).
#
# Repository variables (terraform output in infra/envs/hackathon):
#   AWS_DEPLOY_ROLE_ARN_HACKATHON   deploy_role_arn
#   HACKATHON_BUCKET                bucket

on:
  workflow_dispatch:
    inputs:
      parts:
        description: What to deploy
        type: choice
        options: [ all, relay, stitch ]
        default: all
      rebuild_ffmpeg_layer:
        description: Rebuild and attach the ffmpeg layer even if stitch has one
        type: boolean
        default: false

concurrency:
  group: deploy-production-tool
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN_HACKATHON }}
  BUCKET: ${{ vars.HACKATHON_BUCKET }}
  RELAY_FN: napkin-hackathon-relay
  STITCH_FN: napkin-hackathon-stitch
  LAYER: napkin-hackathon-ffmpeg
  PARTS: ${{ inputs.parts }}

jobs:
  deploy:
    name: Deploy (${{ inputs.parts }}) from ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository variables are set
        run: |
          for v in ROLE BUCKET; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty: set the repository variables from terraform output (infra/envs/hackathon)"; exit 1; fi
          done

      - uses: astral-sh/setup-uv@v6

      - name: Test the relay and stitch
        run: |
          (cd production-tool/relay && uv run --python 3.12 pytest -q)
          (cd production-tool/stitch && uv run --python 3.12 pytest -q)
          uv run --no-project --with jsonschema --with rfc3339-validator python production-tool/contracts/check.py

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy the relay
        if: env.PARTS == 'all' || env.PARTS == 'relay'
        run: |
          set -euo pipefail
          build=$(mktemp -d)
          # boto3 and its dependencies come with the Lambda runtime
          (cd production-tool/relay && uv export --frozen --no-dev --no-hashes --no-emit-project \
            --no-emit-package boto3 --no-emit-package botocore --no-emit-package s3transfer \
            --no-emit-package jmespath --no-emit-package urllib3 --no-emit-package python-dateutil \
            --no-emit-package six -o "$build/requirements.txt")
          # Lambda python3.12 is Amazon Linux 2023 (glibc 2.34), x86_64 (infra/envs/hackathon/lambda.tf).
          # manylinux_2_28: Pillow 12 ships no manylinux2014 wheels.
          uv pip install --target "$build/pkg" --python-platform x86_64-manylinux_2_28 --python-version 3.12 \
            --only-binary :all: -r "$build/requirements.txt"
          rsync -a --exclude tests --exclude .venv --exclude .local-data --exclude '__pycache__' \
            --exclude results --exclude scripts \
            --exclude '*.zip' --exclude uv.lock --exclude pyproject.toml --exclude README.md \
            production-tool/relay/ "$build/pkg/"
          mkdir -p "$build/pkg/contracts"
          cp production-tool/contracts/*.schema.json "$build/pkg/contracts/"
          cp -r production-tool/contracts/capabilities "$build/pkg/contracts/"
          (cd "$build/pkg" && zip -qr9 "$build/relay.zip" .)
          ls -lh "$build/relay.zip"
          prev=$(aws lambda get-alias --function-name "$RELAY_FN" --name live --query FunctionVersion --output text)
          aws lambda update-function-code --function-name "$RELAY_FN" --zip-file "fileb://$build/relay.zip" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$RELAY_FN"
          ver=$(aws lambda publish-version --function-name "$RELAY_FN" \
            --description "${GITHUB_REF_NAME}@${GITHUB_SHA::7}" --query Version --output text)
          aws lambda update-alias --function-name "$RELAY_FN" --name live --function-version "$ver" >/dev/null
          echo "relay: live → $ver (was $prev; roll back with update-alias --function-version $prev)" >> "$GITHUB_STEP_SUMMARY"

      - name: Package and deploy stitch
        if: env.PARTS == 'all' || env.PARTS == 'stitch'
        run: |
          set -euo pipefail
          build=$(mktemp -d)
          (cd production-tool/stitch && zip -q9 "$build/stitch.zip" stitch.py endcard/*/*.png)
          layers=$(aws lambda get-function-configuration --function-name "$STITCH_FN" --query 'length(Layers || `[]`)' --output text)
          if [ "$layers" = "0" ] || [ "${{ inputs.rebuild_ffmpeg_layer }}" = "true" ]; then
            production-tool/stitch/build-layer.sh "$build/ffmpeg-layer.zip"
            aws s3 cp "$build/ffmpeg-layer.zip" "s3://$BUCKET/build/ffmpeg-layer.zip"
            arn=$(aws lambda publish-layer-version --layer-name "$LAYER" \
              --content "S3Bucket=$BUCKET,S3Key=build/ffmpeg-layer.zip" \
              --compatible-runtimes python3.12 --compatible-architectures x86_64 \
              --query LayerVersionArn --output text)
            aws lambda update-function-configuration --function-name "$STITCH_FN" --layers "$arn" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$STITCH_FN"
            echo "stitch: layer $arn" >> "$GITHUB_STEP_SUMMARY"
          fi
          prev=$(aws lambda get-alias --function-name "$STITCH_FN" --name live --query FunctionVersion --output text)
          aws lambda update-function-code --function-name "$STITCH_FN" --zip-file "fileb://$build/stitch.zip" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$STITCH_FN"
          ver=$(aws lambda publish-version --function-name "$STITCH_FN" \
            --description "${GITHUB_REF_NAME}@${GITHUB_SHA::7}" --query Version --output text)
          aws lambda update-alias --function-name "$STITCH_FN" --name live --function-version "$ver" >/dev/null
          echo "stitch: live → $ver (was $prev)" >> "$GITHUB_STEP_SUMMARY"
